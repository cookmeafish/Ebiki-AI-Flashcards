<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ebiki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #F2F5F8;
        color: #16242C;
        overflow: hidden;
      }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
      html[data-theme="dark"] body { background: #0E1419; color: #E8EEF2; }
    </style>
  </head>
  <body>
    <script>
      // Apply saved theme before paint to avoid a flash of the wrong theme.
      try { document.documentElement.setAttribute('data-theme', localStorage.getItem('ebiki-theme') || 'light'); } catch (e) {}
      // The page language (fonts pick CJK glyph forms by lang; screen readers pick a voice).
      try { var l = localStorage.getItem('ebiki-app-language'); if (l) document.documentElement.lang = l; } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
