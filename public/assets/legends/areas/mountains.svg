<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <!-- Colossus Pass: a rope bridge sways over a burning chasm, and the whole massif behind it IS the Stone Colossus: crystal spires on its back, snowy shoulder peaks with pines, a V brow of rock over burning eyes, a grinding jaw on a lava throat, magma veins, boulder fists gripping both rims. Idle: it breathes, eyes pulse, the jaw grinds, pebbles fall, embers rise, the bridge sways, a torch flickers, a hawk circles, clouds drift. -->
  <rect width="400" height="140" fill="var(--lg-sky, #dfe6ee)"/>
  <!-- storm clouds over the pass -->
  <g fill="var(--lg-light, #ffffff)" opacity="0.7">
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;26 0;0 0" dur="30s" repeatCount="indefinite"/>
    <ellipse cx="60" cy="22" rx="46" ry="9"/><ellipse cx="96" cy="16" rx="28" ry="8"/><ellipse cx="340" cy="18" rx="50" ry="9"/><ellipse cx="300" cy="24" rx="30" ry="6"/>
  </g>
  <!-- far range with snow -->
  <path d="M0 74 L26 52 L44 60 L70 34 L96 58 L120 46 L150 66 L180 54 L230 70 L270 50 L300 62 L330 38 L356 56 L380 44 L400 54 V100 H0Z" fill="var(--lg-far, #a9b8c8)" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
  <g fill="#eef3f7" opacity="0.9"><path d="M60 43 L70 34 L80 45 L74 43 L70 47 L65 42Z"/><path d="M322 46 L330 38 L338 48 L332 46 L329 50 L326 45Z"/><path d="M114 51 L120 46 L127 52 L121 51Z"/><path d="M374 49 L380 44 L386 48 L380 49Z"/></g>
  <!-- the crystal spires on the Colossus's back -->
