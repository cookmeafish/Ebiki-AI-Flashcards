    <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 2.6;0 0.4;0 2.6;0 0" dur="3.2s" repeatCount="indefinite"/>
      <path d="M196 96 L206 94 L230 100 L254 94 L264 96 L258 110 L230 118 L202 110Z" fill="var(--lg-near, #6f8499)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
