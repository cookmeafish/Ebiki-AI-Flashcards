    <circle cx="300" cy="130" r="1.4" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;4 -60" dur="3.6s" repeatCount="indefinite" begin="0.6s"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;0.2" dur="3.6s" repeatCount="indefinite" additive="sum" begin="0.6s"/></circle>
