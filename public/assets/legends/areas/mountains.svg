    <g><path d="M206 38 L200 6 L208 -2 L214 6 L218 36Z" fill="#f29a2a"/><path d="M208 -2 L214 6 L218 36 L212 37Z" fill="#ffd27a" opacity="0.6" stroke="none"/></g>
    <g><path d="M224 34 L226 2 L234 -4 L240 4 L238 34Z" fill="#e88a1e"/><path d="M234 -4 L240 4 L238 34 L232 34Z" fill="#ffd27a" opacity="0.6" stroke="none"/></g>
    <g><path d="M246 36 L254 6 L262 0 L266 8 L258 40Z" fill="#f29a2a"/><path d="M262 0 L266 8 L258 40 L254 38Z" fill="#ffd27a" opacity="0.6" stroke="none"/></g>
    <g><path d="M262 44 L276 14 L284 10 L286 18 L272 48Z" fill="#e88a1e"/><path d="M284 10 L286 18 L272 48 L268 46Z" fill="#ffd27a" opacity="0.6" stroke="none"/></g>
  </g>
  <path d="M208 6.92 L208.77 9.23 L211.08 10 L208.77 10.77 L208 13.08 L207.23 10.77 L204.92 10 L207.23 9.23Z" fill="#fff" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;0.15;1" dur="2.2s" repeatCount="indefinite"/></path><path d="M262 9.36 L262.66 11.34 L264.64 12 L262.66 12.66 L262 14.64 L261.34 12.66 L259.36 12 L261.34 11.34Z" fill="#fff" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;0.15;1" dur="2.9s" repeatCount="indefinite" begin="1s"/></path><path d="M181 13.8 L181.55 15.45 L183.20 16 L181.55 16.55 L181 18.20 L180.45 16.55 L178.80 16 L180.45 15.45Z" fill="#fff" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;0.15;1" dur="3.4s" repeatCount="indefinite"/></path>
