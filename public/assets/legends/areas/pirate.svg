  <!-- far cliffs of the cove -->
  <path d="M0 98 L0 60 L14 52 L30 58 L46 70 L60 96Z" fill="#9cc3df" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M326 100 L340 70 L358 62 L380 66 L400 58 V100Z" fill="#9cc3df" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round"/>
  <!-- CAPTAIN DREADTIDE rising out of the fog behind the cove -->
