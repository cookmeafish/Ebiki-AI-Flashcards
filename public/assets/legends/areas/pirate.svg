<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <!-- Wreckers' Cove: a moonlit cove where Captain Dreadtide rises out of a fog bank, as big as the cliffs: a barnacled tricorn, a skull with a ghost flame pouring from one socket and a chattering jaw, gold epaulettes, a ghost-flame heart in his ribs, a raised hook, his parrot on his shoulder. His ghost ship rocks in front with torn sails, green portholes and a jolly roger; a skull rock with glowing sockets, wisps, treasure and a rusted anchor on a chain on the beach, waves and low fog. -->
  <rect width="400" height="140" fill="#d9e8f2"/>
  <!-- moon and stars -->
  <circle cx="74" cy="26" r="17" fill="#f4f0dc" opacity="0.35"/>
  <circle cx="74" cy="26" r="13" fill="#f4f0dc" stroke="#c9bf94" stroke-width="1.2"/>
  <circle cx="70" cy="22" r="3" fill="#ddd3ad"/><circle cx="79" cy="30" r="2.2" fill="#ddd3ad"/>
