<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <!-- The Sakura Shrine: cherry trees in full bloom, falling petals, a shrine with red gates, stone lanterns, foxfire
       drifting, the Kitsune's nine tails fanned behind the shrine. -->
  <rect width="400" height="140" fill="var(--lg-sky, #ffe6ee)"/>
  <circle cx="330" cy="30" r="14" fill="#fff" opacity="0.7"/>
  <!-- far mountain -->
  <path d="M100 100 L200 30 L300 100Z" fill="var(--lg-far, #e0b8d0)"/>
  <path d="M180 44 L200 30 L220 44 L212 46 L206 42 L200 48 L194 42 L188 46Z" fill="#fff"/>
  <!-- the Kitsune's nine tails fanned behind the shrine -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round">
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="-2 200 90;2 200 90;-2 200 90" dur="4s" repeatCount="indefinite"/>
    <g fill="#fff2e6">
      <path d="M200 90 C184 76 160 66 150 50 C158 54 164 52 164 48 C172 60 186 72 200 84Z"/>
      <path d="M200 88 C188 70 172 54 170 36 C176 42 182 42 182 36 C186 54 194 70 202 82Z"/>
      <path d="M200 88 C194 68 188 46 192 26 C196 32 200 32 200 26 C200 46 202 66 204 84Z"/>
      <path d="M200 88 C206 68 212 46 208 26 C204 32 200 32 200 26 C200 46 198 66 196 84Z"/>
      <path d="M200 88 C212 70 228 54 230 36 C224 42 218 42 218 36 C214 54 206 70 198 82Z"/>
      <path d="M200 90 C216 76 240 66 250 50 C242 54 236 52 236 48 C228 60 214 72 200 84Z"/>
    </g>
    <g fill="#6ff3ff"><path d="M150 50 C156 54 162 52 164 48 C158 46 154 46 150 50Z M170 36 C174 42 180 42 182 36 C178 32 174 32 170 36Z M192 26 C196 30 200 30 200 26 C198 22 194 22 192 26Z M208 26 C204 30 200 30 200 26 C202 22 206 22 208 26Z M230 36 C226 42 220 42 218 36 C222 32 226 32 230 36Z M250 50 C244 54 238 52 236 48 C242 46 246 46 250 50Z"/></g>
  </g>
  <!-- slit eyes above the roof -->
  <g fill="#ffd23f" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"><path d="M186 56 C190 53 196 53 198 55 C194 58 190 58 186 56Z M214 56 C210 53 204 53 202 55 C206 58 210 58 214 56Z"/></g>
  <g fill="#1a0508"><ellipse cx="192" cy="55.6" rx="0.6" ry="1.6"/><ellipse cx="208" cy="55.6" rx="0.6" ry="1.6"/></g>
  <!-- the shrine -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round">
    <path d="M170 112 V78 H230 V112Z" fill="#f2e6c8"/>
    <path d="M156 80 C176 72 188 60 200 58 C212 60 224 72 244 80 C226 78 174 78 156 80Z" fill="#8a1a2a"/>
    <g fill="#c0392b"><rect x="170" y="78" width="5" height="34"/><rect x="225" y="78" width="5" height="34"/><rect x="196" y="78" width="8" height="34"/></g>
    <path d="M180 88 H192 V104 H180Z M208 88 H220 V104 H208Z" fill="#fff6d6"/>
  </g>
  <!-- the rope with paper streamers across the shrine -->
  <path d="M170 84 C186 90 214 90 230 84" fill="none" stroke="#c9a441" stroke-width="2.4"/>
  <g fill="#fff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5"><path d="M186 88 L184 94 L188 94 L186 98"/><path d="M214 88 L216 94 L212 94 L214 98"/></g>
  <!-- red torii gates, a row receding on the left -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round" fill="#c0392b">
    <path d="M40 54 C58 50 86 50 104 54 L102 59 H42Z"/><rect x="48" y="64" width="48" height="4"/><rect x="52" y="58" width="5" height="54"/><rect x="88" y="58" width="5" height="54"/>
    <path d="M112 66 C124 64 140 64 152 66 L151 70 H113Z"/><rect x="118" y="70" width="3.4" height="42"/><rect x="143" y="70" width="3.4" height="42"/>
  </g>
  <!-- cherry trees in full bloom -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.2">
    <path d="M300 112 C302 96 298 84 306 74 L296 66 M306 80 L318 70" fill="none" stroke="#4a3020" stroke-width="4" stroke-linecap="round"/>
    <path d="M14 112 C16 98 12 86 20 76 M18 84 L30 74" fill="none" stroke="#4a3020" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g fill="#ffb7cf" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8">
    <path d="M270 70 C266 52 286 44 300 50 C310 40 332 42 336 56 C352 56 356 76 342 82 C338 94 314 94 306 86 C294 94 272 90 270 80 C262 78 262 70 270 70Z"/>
    <path d="M-6 76 C-8 58 10 50 22 56 C32 48 50 52 52 64 C62 66 62 82 50 86 C44 94 26 94 20 88 C10 94 -4 88 -6 76Z"/>
  </g>
  <g fill="#fff" opacity="0.6"><circle cx="290" cy="58" r="3"/><circle cx="320" cy="54" r="2.4"/><circle cx="12" cy="64" r="3"/><circle cx="36" cy="60" r="2.4"/></g>
  <!-- the ground and path -->
  <path d="M0 112 H400 V140 H0Z" fill="var(--lg-near, #c8a0b0)"/>
  <path d="M180 112 L220 112 L240 140 H160Z" fill="#e0d0c0" opacity="0.8"/>
  <!-- stone lanterns -->
  <g fill="#8a8f9c" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9"><path d="M140 112 V100 H136 V96 L144 90 L152 96 V100 H148 V112Z"/><path d="M252 112 V100 H248 V96 L256 90 L264 96 V100 H260 V112Z"/></g>
  <g fill="#ffd23f"><rect x="141" y="96" width="6" height="4"/><rect x="253" y="96" width="6" height="4"/></g>
  <!-- foxfire drifting -->
  <g fill="#6ff3ff">
    <circle cx="110" cy="84" r="3"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;8 -10;-4 -18;0 0" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="100" r="2.6"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-8 -8;4 -16;0 0" dur="5.6s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#6ff3ff" opacity="0.3"><circle cx="110" cy="84" r="7"/><circle cx="280" cy="100" r="6"/></g>
  <!-- falling petals -->
  <g fill="#ffb7cf">
    <ellipse style="transform-box:fill-box;transform-origin:center" cx="80" cy="20" rx="2.4" ry="1.4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;20 90" dur="6s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="6s" repeatCount="indefinite" additive="sum"/></ellipse>
    <ellipse style="transform-box:fill-box;transform-origin:center" cx="260" cy="10" rx="2.4" ry="1.4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-16 100" dur="7s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="7s" repeatCount="indefinite" additive="sum"/></ellipse>
    <ellipse style="transform-box:fill-box;transform-origin:center" cx="360" cy="30" rx="2" ry="1.2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;14 80" dur="5.4s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="5.4s" repeatCount="indefinite" additive="sum"/></ellipse>
    <ellipse style="transform-box:fill-box;transform-origin:center" cx="160" cy="30" rx="2" ry="1.2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;10 80" dur="6.4s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="6.4s" repeatCount="indefinite" additive="sum"/></ellipse>
  </g>
</svg>
