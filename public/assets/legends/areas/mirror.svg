<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <!-- The Hall of Mirrors: a gilded hall running away on a checkered floor, velvet drapes, flickering sconces, side mirrors each holding a different grinning reflection that blinks, and in the middle the great gilded mirror the SHATTERED DOPPEL broke out of: a shard body with a crack of light through its chest, a crown of glass spikes, a V brow over cyan eyes, a grin of glass fangs, jagged glass claws reaching out. Shards orbit it and glint on the floor. -->
