<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <!-- The Overgrown Greenhouse: shattered glass panes, vines everywhere, hungry pitcher plants, the Flytrap Queen's bed
       at the center. -->
  <rect width="400" height="140" fill="var(--lg-sky, #e0f2e0)"/>
  <!-- the greenhouse frame: an arched glass roof -->
  <path d="M10 112 V50 C10 20 80 8 200 8 C320 8 390 20 390 50 V112" fill="#dff4ff" opacity="0.4"/>
  <g fill="none" stroke="#5a6a6a" stroke-width="2">
    <path d="M10 112 V50 C10 20 80 8 200 8 C320 8 390 20 390 50 V112"/>
    <path d="M70 112 V30 M130 112 V14 M200 112 V8 M270 112 V14 M330 112 V30 M10 70 H390 M18 40 C80 24 320 24 382 40"/>
  </g>
  <!-- shattered panes: jagged holes -->
  <g fill="var(--lg-sky, #e0f2e0)" stroke="#5a6a6a" stroke-width="0.8">
    <path d="M140 16 L150 26 L144 32 L160 40 L150 50 L136 42 L132 28Z"/>
    <path d="M280 30 L292 36 L286 44 L298 52 L282 60 L276 44Z"/>
  </g>
  <g fill="#dff4ff" stroke="#5a6a6a" stroke-width="0.5">
    <polygon points="100,118 106,112 108,122"/><polygon points="300,120 308,116 306,124"/>
  </g>
  <!-- vines crawling over the frame -->
  <g fill="none" stroke="var(--lg-deep, #2e8b57)" stroke-width="3" stroke-linecap="round">
    <path d="M10 112 C14 90 8 70 20 56 C30 44 20 30 36 22 C50 16 60 26 72 20"/>
    <path d="M390 112 C386 92 394 74 380 60 C370 50 382 34 366 26 C352 20 340 30 328 22"/>
    <path d="M130 14 C140 30 124 40 134 56 C140 66 130 76 136 90"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 130 14;2 130 14;0 130 14" dur="4s" repeatCount="indefinite"/></path>
  </g>
  <g fill="var(--lg-near, #5fb57a)" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5">
    <path d="M18 60 C10 56 8 50 14 48 C18 50 20 54 18 60Z M34 24 C30 16 36 12 40 16 C40 20 38 22 34 24Z M382 62 C390 58 392 52 386 50 C382 52 380 56 382 62Z M364 28 C368 20 362 16 358 20 C358 24 360 26 364 28Z M134 56 C126 54 124 48 130 46 C134 48 136 52 134 56Z"/>
  </g>
  <!-- pitcher plants, hungry -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round">
    <path d="M60 112 C52 100 52 82 60 74 C66 82 68 100 64 112Z" fill="#8ac43a"/><path d="M56 76 C58 70 66 70 66 76 C62 74 58 74 56 76Z" fill="#b3122e"/>
    <path d="M52 72 C58 66 68 68 70 72 C66 70 58 70 52 72Z" fill="#8ac43a"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 60 72;-10 60 72;0 60 72" dur="2.4s" repeatCount="indefinite"/></path>
    <path d="M340 112 C334 102 334 88 340 80 C346 88 348 102 344 112Z" fill="#b3122e"/><path d="M336 82 C338 76 346 76 346 82 C342 80 338 80 336 82Z" fill="#5a0c12"/>
    <path d="M100 112 C96 104 96 94 100 88 C104 94 106 104 104 112Z" fill="#b3122e"/>
  </g>
  <!-- the Flytrap Queen's bed at the center: thorny trap maws -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round">
    <!-- side snapping heads -->
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 166 96;-8 166 96;0 166 96" dur="1.8s" repeatCount="indefinite"/>
      <path d="M166 96 C150 86 146 70 152 64 L166 78Z" fill="#5fb57a"/><path d="M166 96 C172 82 172 70 162 62 L160 78Z" fill="#5fb57a"/>
      <g fill="#fff" stroke-width="0.5"><polygon points="154,66 158,68 155,70"/><polygon points="162,64 160,68 164,67"/></g></g>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 234 96;8 234 96;0 234 96" dur="2s" repeatCount="indefinite"/>
      <path d="M234 96 C250 86 254 70 248 64 L234 78Z" fill="#5fb57a"/><path d="M234 96 C228 82 228 70 238 62 L240 78Z" fill="#5fb57a"/>
      <g fill="#fff" stroke-width="0.5"><polygon points="246,66 242,68 245,70"/><polygon points="238,64 240,68 236,67"/></g></g>
    <!-- the great trap, gaping -->
    <path d="M176 76 C176 52 188 40 200 40 C212 40 224 52 224 76 C214 80 186 80 176 76Z" fill="#5fb57a"/>
    <path d="M176 76 C186 80 214 80 224 76 C226 88 222 96 218 100 C208 104 192 104 182 100 C178 96 174 88 176 76Z" fill="#6b0c1e"/>
    <path d="M178 100 C188 110 212 110 222 100 C212 104 188 104 178 100Z" fill="#5fb57a"/>
    <g fill="#f4efe0" stroke-width="0.5"><polygon points="180,78 182,86 185,79"/><polygon points="188,79 190,88 193,79"/><polygon points="197,80 200,90 203,80"/><polygon points="207,79 210,88 212,79"/><polygon points="215,79 218,86 220,78"/><polygon points="184,102 187,94 190,103"/><polygon points="196,104 200,94 204,104"/><polygon points="210,103 213,94 216,102"/></g>
    <g fill="#e8d7b0" stroke-width="0.6"><polygon points="190,44 188,34 194,42"/><polygon points="200,40 200,28 204,40"/><polygon points="210,44 214,34 208,42"/></g>
  </g>
  <g fill="#ffd23f"><ellipse cx="194" cy="90" rx="1.8" ry="1"/><ellipse style="transform-box:fill-box;transform-origin:center" cx="206" cy="90" rx="1.8" ry="1"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.3;1" dur="1.4s" repeatCount="indefinite" additive="sum"/></ellipse></g>
  <!-- poison petals around the bed -->
  <g fill="#b3122e" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"><path d="M200 110 C180 116 164 112 160 104 C174 102 188 104 200 108Z"/><path d="M200 110 C220 116 236 112 240 104 C226 102 212 104 200 108Z"/></g>
  <!-- the floor: soil and broken pots -->
  <path d="M0 112 H400 V140 H0Z" fill="var(--lg-near, #6b4a2a)"/>
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" fill="#c0603a"><path d="M30 118 H46 L44 130 H32Z"/><path d="M360 120 L376 118 L374 130 L362 132Z"/><path d="M260 122 L270 118 L272 126Z"/></g>
  <!-- pollen drifting and a doomed fly -->
  <g fill="#ff3fd2" opacity="0.6">
    <circle style="transform-box:fill-box;transform-origin:center" cx="150" cy="100" r="1.4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;10 -30" dur="3s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="3s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="260" cy="96" r="1.4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-10 -30" dur="3.6s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="3.6s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
  <circle cx="200" cy="30" r="1.6" fill="#1d2230"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;10 6;-8 10;0 0" dur="1.4s" repeatCount="indefinite"/></circle>
</svg>
