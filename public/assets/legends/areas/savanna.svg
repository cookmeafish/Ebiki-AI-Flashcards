<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <!-- The Sunscorched Plains: a blazing low sun with turning rays, heat-hazed hills, a fleeing herd, vultures circling, acacias, the bones of the last challenger and grass bending in the wind, and the PRIDE TYRANT crouched on Pride Rock before the sun: a mane of burning spikes that flares, ivory horns, a scarred gold face, one dark V brow over glowing eyes, saber fangs around a roaring maw, claws gripping the rock edge, a lashing tail, embers off the mane. -->
  <rect width="400" height="140" fill="var(--lg-sky, #fbe6d8)"/>
  <!-- the blazing low sun behind Pride Rock -->
  <g transform="translate(288 64)">
    <g fill="#ffb347" opacity="0.6"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="40s" repeatCount="indefinite"/><path d="M-4 -44 L0 -62 L4 -44Z" transform="rotate(0)"/><path d="M-4 -44 L0 -62 L4 -44Z" transform="rotate(30)"/><path d="M-4 -44 L0 -62 L4 -44Z" transform="rotate(60)"/><path d="M-4 -44 L0 -62 L4 -44Z" transform="rotate(90)"/><path d="M-4 -44 L0 -62 L4 -44Z" transform="rotate(120)"/><path d="M-4 -44 L0 -62 L4 -44Z" transform="rotate(150)"/><path d="M-4 -44 L0 -62 L4 -44Z" transform="rotate(180)"/><path d="M-4 -44 L0 -62 L4 -44Z" transform="rotate(210)"/><path d="M-4 -44 L0 -62 L4 -44Z" transform="rotate(240)"/><path d="M-4 -44 L0 -62 L4 -44Z" transform="rotate(270)"/><path d="M-4 -44 L0 -62 L4 -44Z" transform="rotate(300)"/><path d="M-4 -44 L0 -62 L4 -44Z" transform="rotate(330)"/></g>
    <circle r="46" fill="#ffb347" opacity="0.35"/>
    <circle r="40" fill="#ffc94a" stroke="#e08a1e" stroke-width="1.4"/>
    <path d="M-40 6 H40 M-38 14 H38 M-34 22 H34" stroke="#ff9a2a" stroke-width="2.2"/>
  </g>
  <!-- heat-hazed far hills and a herd fleeing -->
