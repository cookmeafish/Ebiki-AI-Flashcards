 d="M286.3 71.9 L275.0 85.4 L276.5 67.9Z" fill="#ff7a1a" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/><circle cx="277.7" cy="78.9" r="1.6" fill="#ffd24a"/><path d="M279.6 69.9 L258.3 83.7 L272.1 62.4Z" fill="#c8281e" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/><circle cx="263.3" cy="78.7" r="1.6" fill="#ffd24a"/><path d="M274.1 65.5 L256.6 67.0 L270.1 55.7Z" fill="#ff7a1a" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/><circle cx="263.1" cy="64.3" r="1.6" fill="#ffd24a"/><path d="M270.8 59.3 L246.0 54.0 L270.8 48.7Z" fill="#c8281e" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/><circle cx="253.0" cy="54.0" r="1.6" fill="#ffd24a"/><path d="M270.1 52.3 L256.6 41.0 L274.1 42.5Z" fill="#ff7a1a" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/><circle cx="263.1" cy="43.7" r="1.6" fill="#ffd24a"/><path d="M272.1 45.6 L258.3 24.3 L279.6 38.1Z" fill="#c8281e" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/><circle cx="263.3" cy="29.3" r="1.6" fill="#ffd24a"/><path d="M276.5 40.1 L275.0 22.6 L286.3 36.1Z" fill="#ff7a1a" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/><circle cx="277.7" cy="29.1" r="1.6" fill="#ffd24a"/></g>
