<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <!-- The Sunscorched Plains: a blazing low sun with turning soft rays, heat-hazed hills, a fleeing herd, vultures circling, acacias, the bones of the last challenger and grass bending in the wind, and the PRIDE TYRANT crouched on the rounded crown of Pride Rock before the sun: a huge fluffy mane of sunset curls that breathes, round ears, a round gold face with a scar, two heavy fur brows over glowing almond eyes, a round roaring maw with two round-tipped fangs, big soft paws on the rock edge, a lashing tail with a fluffy tuft, warm motes off the mane. -->
