  <path d="M0 0 L8 -1 L11 -5 L13 -4 L11 0 L10 4 L12 9 L10 9 L8 4 L2 4 L-1 9 L-3 9 L0 4 L-2 1Z M11 -5 L10 -10 M12 -5 L13 -10" fill="#3a1e14" stroke="#3a1e14" stroke-width="0.6" style="transform-box:fill-box;transform-origin:center" transform="translate(220 84)"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="220 84;150 80;80 84" dur="7s" repeatCount="indefinite" begin="0s"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" dur="7s" repeatCount="indefinite" keyTimes="0;.1;.85;1" additive="sum" begin="0s"/></path><path d="M0 0 L8 -1 L11 -5 L13 -4 L11 0 L10 4 L12 9 L10 9 L8 4 L2 4 L-1 9 L-3 9 L0 4 L-2 1Z M11 -5 L10 -10 M12 -5 L13 -10" fill="#3a1e14" stroke="#3a1e14" stroke-width="0.6" style="transform-box:fill-box;transform-origin:center" transform="translate(236 86)"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="236 86;166 82;96 86" dur="7s" repeatCount="indefinite" begin="0.6s"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" dur="7s" repeatCount="indefinite" keyTimes="0;.1;.85;1" additive="sum" begin="0.6s"/></path><path d="M0 0 L8 -1 L11 -5 L13 -4 L11 0 L10 4 L12 9 L10 9 L8 4 L2 4 L-1 9 L-3 9 L0 4 L-2 1Z M11 -5 L10 -10 M12 -5 L13 -10" fill="#3a1e14" stroke="#3a1e14" stroke-width="0.6" style="transform-box:fill-box;transform-origin:center" transform="translate(212 88)"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="212 88;142 84;72 88" dur="7s" repeatCount="indefinite" begin="1.2s"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" dur="7s" repeatCount="indefinite" keyTimes="0;.1;.85;1" additive="sum" begin="1.2s"/></path>
