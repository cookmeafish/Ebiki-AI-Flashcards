<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <!-- Pyrewyrm Caldera: an erupting volcano, rivers of lava, and the dragon perched on the crater rim. -->
  <rect width="400" height="140" fill="var(--lg-sky, #fbe3dc)"/>
  <!-- ash clouds -->
  <g fill="#3a3340" opacity="0.35">
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;16 -2;0 0" dur="10s" repeatCount="indefinite"/>
    <ellipse cx="200" cy="12" rx="90" ry="16"/><ellipse cx="130" cy="20" rx="50" ry="12"/><ellipse cx="280" cy="18" rx="60" ry="12"/>
  </g>
  <!-- far peaks -->
  <path d="M0 92 L40 64 L70 84 L100 60 L130 88 H0Z M290 88 L320 58 L350 80 L380 62 L400 76 V92 H290Z" fill="var(--lg-far, #e0a79a)" opacity="0.8"/>
  <!-- the volcano -->
  <path d="M110 120 L176 44 H224 L290 120Z" fill="#2a2230" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M176 44 H196 L160 120 H110Z" fill="var(--lg-deep, #c0392b)" opacity="0.55"/>
  <path d="M224 44 L290 120 H250Z" fill="#000" opacity="0.25"/>
  <!-- lava rivers -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M190 46 L184 62 L192 76 L180 94 L186 120 M214 46 L220 60 L212 74 L228 96 L222 120" stroke="#ff5a1f" stroke-width="5"/>
    <path d="M190 46 L184 62 L192 76 L180 94 L186 120 M214 46 L220 60 L212 74 L228 96 L222 120" stroke="#ffd166" stroke-width="1.8"/>
  </g>
  <!-- the eruption fountain -->
  <g transform="translate(200 44)"><g>
    <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1.1 1.2;0.95 0.9;1 1" dur="1.2s" repeatCount="indefinite"/>
    <path d="M-20 0 C-22 -12 -10 -18 -6 -30 C-2 -20 4 -34 8 -40 C10 -28 18 -24 20 0Z" fill="#ff5a1f" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M-12 0 C-12 -10 -4 -14 -2 -22 C2 -14 6 -24 8 -28 C10 -18 14 -12 12 0Z" fill="#ffb347"/>
    <path d="M-5 0 C-4 -6 0 -8 2 -12 C4 -6 6 -4 5 0Z" fill="#fff1b8"/>
  </g></g>
  <!-- lava bombs arcing -->
  <g fill="#ff7a1a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6">
    <circle style="transform-box:fill-box;transform-origin:center" cx="200" cy="20" r="2.6"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 10;-30 -14;-60 40" dur="2.2s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.2s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="200" cy="20" r="2.2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 10;34 -10;66 46" dur="2.6s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.6s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
  <!-- the dragon perched on the rim -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round">
    <path d="M232 46 L250 20 L262 34 L276 14 L276 40 Z" fill="#2a2230">
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 240 46;-8 240 46;0 240 46" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M226 48 C226 38 234 32 244 34 L256 30 L262 34 L252 38 C250 44 244 48 236 50Z" fill="#2a2230"/>
    <path d="M250 30 L246 22 L252 28 M244 32 L240 24 L246 30" fill="#e8d7b0"/>
  </g>
  <circle cx="250" cy="34" r="1.4" fill="#ffe066"/>
  <path d="M262 34 C270 32 278 36 282 32" fill="none" stroke="#ff7a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- obsidian foreground -->
  <path d="M0 140 V112 L30 104 L52 112 L76 102 L96 116 L110 140Z" fill="#1a1216" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M290 140 L304 110 L330 102 L350 114 L372 100 L400 108 V140Z" fill="#1a1216" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
  <g fill="none" stroke="#ff7a1a" stroke-width="1.4" stroke-linecap="round"><path d="M30 112 L36 122 L32 132 M340 110 L346 120 L342 130"/></g>
  <!-- lava lake -->
  <path d="M106 140 L114 122 H286 L294 140Z" fill="#ff5a1f"/>
  <path d="M120 132 C160 126 240 126 280 132" fill="none" stroke="#ffd166" stroke-width="2"/>
  <g fill="#fff1b8">
    <circle style="transform-box:fill-box;transform-origin:center" cx="160" cy="130" r="2"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0.2;1.2;0.2" dur="1.4s" repeatCount="indefinite" additive="sum"/></circle>
    <circle cx="250" cy="128" r="2.4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="1.1s" repeatCount="indefinite"/></circle>
  </g>
  <!-- embers -->
  <g fill="#ffb347">
    <circle style="transform-box:fill-box;transform-origin:center" cx="60" cy="110" r="1.4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;6 -60" dur="3s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="3s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="150" cy="120" r="1.2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-4 -70" dur="3.4s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="3.4s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="300" cy="118" r="1.4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;4 -64" dur="2.8s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.8s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="360" cy="104" r="1.1"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-6 -60" dur="3.2s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="3.2s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
</svg>
