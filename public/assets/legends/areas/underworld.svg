<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <!-- The Ashen Gate: a skull-arched gate, a river of souls, chains, fire pits, three pairs of eyes in the dark. -->
  <rect width="400" height="140" fill="var(--lg-sky, #f7e0da)"/>
  <rect width="400" height="140" fill="#3a0d0d" opacity="0.35"/>
  <!-- ash falling -->
  <g fill="#8a7f94">
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 -40;-10 60;0 -40" dur="14s" repeatCount="indefinite" keyTimes="0;.5;1"/>
    <circle cx="30" cy="30" r="1.2"/><circle cx="120" cy="10" r="1"/><circle cx="210" cy="40" r="1.2"/><circle cx="300" cy="20" r="1"/><circle cx="380" cy="36" r="1.2"/><circle cx="80" cy="70" r="1"/><circle cx="260" cy="76" r="1"/>
  </g>
  <!-- jagged cliffs -->
  <path d="M0 110 V40 L20 30 L36 48 L56 26 L76 50 L96 44 L110 110Z" fill="#2a2230" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M400 110 V44 L380 32 L362 50 L344 28 L324 52 L304 46 L290 110Z" fill="#2a2230" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
  <g fill="none" stroke="#ff7a1a" stroke-width="1.2" stroke-linecap="round"><path d="M40 60 L46 72 L42 84 M360 64 L354 76 L358 88"/></g>
  <!-- the gate -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round">
    <path d="M136 112 V46 C136 20 264 20 264 46 V112 H240 V56 C240 40 160 40 160 56 V112Z" fill="#3a3340"/>
    <path d="M136 112 V46 C136 26 160 22 176 22 C156 30 150 40 150 56 V112Z" fill="#fff" opacity="0.08"/>
    <path d="M160 112 V56 C160 40 240 40 240 56 V112Z" fill="#0b0708"/>
  </g>
  <!-- skulls on the arch -->
  <g fill="#d9d3bf" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8">
    <path d="M194 22 C194 16 206 16 206 22 C206 26 204 27 203 27 V29 H197 V27 C196 27 194 26 194 22Z"/>
    <path d="M150 34 C150 29 160 29 160 34 C160 37 158 38 157 38 V40 H153 V38 C152 38 150 37 150 34Z"/>
    <path d="M240 34 C240 29 250 29 250 34 C250 37 248 38 247 38 V40 H243 V38 C242 38 240 37 240 34Z"/>
  </g>
  <g fill="#ff5a1f"><circle cx="198" cy="22" r="1.4"/><circle cx="202" cy="22" r="1.4"/><circle cx="153.5" cy="34" r="1"/><circle cx="156.5" cy="34" r="1"/><circle cx="243.5" cy="34" r="1"/><circle cx="246.5" cy="34" r="1"/></g>
  <!-- three pairs of eyes in the dark -->
  <g fill="#ffe066">
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2s" repeatCount="indefinite"/>
    <ellipse cx="178" cy="74" rx="3" ry="1.6"/><ellipse cx="190" cy="74" rx="3" ry="1.6"/>
    <ellipse cx="196" cy="62" rx="3.6" ry="2"/><ellipse cx="210" cy="62" rx="3.6" ry="2"/>
    <ellipse cx="216" cy="74" rx="3" ry="1.6"/><ellipse cx="228" cy="74" rx="3" ry="1.6"/>
  </g>
  <g fill="#ff5a1f" opacity="0.35"><circle cx="184" cy="74" r="10"/><circle cx="203" cy="62" r="12"/><circle cx="222" cy="74" r="10"/></g>
  <!-- chains across the gate -->
  <g fill="none" stroke="#8a8f9c" stroke-width="2" stroke-dasharray="3 1.5">
    <path d="M160 70 C180 86 220 86 240 70"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 2;0 0" dur="3s" repeatCount="indefinite"/></path>
    <path d="M160 92 C180 104 220 104 240 92"/>
  </g>
  <!-- fire pits -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.2">
    <path d="M112 112 L116 102 H132 L136 112Z" fill="#3a3340"/><path d="M264 112 L268 102 H284 L288 112Z" fill="#3a3340"/>
  </g>
  <g fill="#ff5a1f">
    <path d="M114 102 C112 90 120 86 118 76 C126 84 124 92 126 96 C128 88 132 86 132 80 C136 90 136 98 134 102Z" style="transform-box:fill-box;transform-origin:center bottom"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1.12;1 1" dur="0.6s" repeatCount="indefinite" additive="sum"/></path>
    <path d="M266 102 C264 90 272 86 270 76 C278 84 276 92 278 96 C280 88 284 86 284 80 C288 90 288 98 286 102Z" style="transform-box:fill-box;transform-origin:center bottom"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1.1;1 1;1 1.1" dur="0.7s" repeatCount="indefinite" additive="sum"/></path>
  </g>
  <g fill="#ffd166"><path d="M118 102 C118 96 122 94 122 90 C126 96 126 100 126 102Z"/><path d="M272 102 C272 96 276 94 276 90 C280 96 280 100 280 102Z"/></g>
  <!-- the ground and the river of souls -->
  <path d="M0 110 H400 V140 H0Z" fill="#2a2230"/>
  <path d="M0 120 C80 114 160 124 240 118 C300 114 360 122 400 118 V132 C360 136 300 128 240 132 C160 138 80 128 0 134Z" fill="#2ef2ff" opacity="0.3"/>
  <g fill="#b8fbff" opacity="0.8">
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;60 0;0 0" dur="10s" repeatCount="indefinite" keyTimes="0;.5;1"/>
    <path d="M20 124 C24 120 30 120 32 124 C28 128 24 128 20 124Z"/><path d="M120 126 C124 122 130 122 132 126 C128 130 124 130 120 126Z"/><path d="M220 124 C224 120 230 120 232 124 C228 128 224 128 220 124Z"/><path d="M320 126 C324 122 330 122 332 126 C328 130 324 130 320 126Z"/>
  </g>
  <!-- embers -->
  <g fill="#ffb347">
    <circle style="transform-box:fill-box;transform-origin:center" cx="124" cy="80" r="1.2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-4 -50" dur="2.4s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.4s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="276" cy="80" r="1.2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;4 -50" dur="2.7s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.7s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
</svg>
