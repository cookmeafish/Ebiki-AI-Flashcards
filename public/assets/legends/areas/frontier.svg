<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <!-- Deadrock Gulch: red canyon walls with strata frame a ghost town: a saloon with swinging batwing doors and cyan eyes in a dark window, a barrel, a gallows with its noose swaying, cacti, a cow skull, a wagon wheel, a tumbleweed rolling through. On a red butte against a blood-red sun striped by the dusk (a ring of heat rays turning, vultures circling) the Revenant Rider rears: a bony black nightmare horse with a horse skull, a red eye, fire pouring from its jaws, a flaming mane and tail; on its back a skeleton outlaw in a tattered duster and flat hat, cyan eyes, one revolver raised. -->

