<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <!-- The Phantom Opera: a grand theatre, spotlights hunting the stage, the Maestro's mask floating above it. -->
  <rect width="400" height="140" fill="var(--lg-sky, #efe4f7)"/>
  <!-- the back wall and boxes -->
  <path d="M40 20 H360 V104 H40Z" fill="var(--lg-far, #c9b3ec)"/>
  <g fill="var(--lg-deep, #7c4def)" stroke="var(--lg-ink, #1d2230)" stroke-width="1">
    <path d="M60 50 H96 V64 Q78 72 60 64Z"/><path d="M304 50 H340 V64 Q322 72 304 64Z"/><path d="M60 78 H96 V92 Q78 100 60 92Z"/><path d="M304 78 H340 V92 Q322 100 304 92Z"/>
  </g>
  <g fill="#ffd966"><circle cx="66" cy="58" r="1.4"/><circle cx="90" cy="58" r="1.4"/><circle cx="310" cy="58" r="1.4"/><circle cx="334" cy="58" r="1.4"/></g>
  <!-- chandelier swinging -->
  <g>
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="-6 200 0;6 200 0;-6 200 0" dur="4s" repeatCount="indefinite"/>
    <path d="M200 0 V18" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"/>
    <path d="M180 22 Q200 34 220 22 L214 20 Q200 28 186 20Z" fill="#ffd966" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
    <g fill="#fff4c2"><circle cx="182" cy="18" r="2"/><circle cx="192" cy="22" r="2"/><circle cx="200" cy="24" r="2"/><circle cx="208" cy="22" r="2"/><circle cx="218" cy="18" r="2"/></g>
    <g fill="#9ff3ff" opacity="0.8"><polygon points="190,28 192,34 194,28"/><polygon points="206,28 208,34 210,28"/><polygon points="198,30 200,38 202,30"/></g>
  </g>
  <!-- spotlights hunting -->
  <path d="M120 0 L170 104 H214Z" fill="var(--lg-light, #ffffff)" opacity="0.3">
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="-8 120 0;10 120 0;-8 120 0" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M280 0 L186 104 H230Z" fill="var(--lg-accent, #f2b441)" opacity="0.25">
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="8 280 0;-10 280 0;8 280 0" dur="6s" repeatCount="indefinite"/>
  </path>
  <!-- the floating mask -->
  <g>
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M188 46 C186 42 184 38 186 34 C188 38 190 40 192 42Z M212 46 C214 42 216 38 214 34 C212 38 210 40 208 42Z" fill="#e8d7b0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
    <path d="M186 46 H214 C216 56 214 64 208 70 C204 72 196 72 192 70 C186 64 184 56 186 46Z" fill="#f4efe6" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4"/>
    <path d="M189 53 L197 56 L196 58 L190 56Z M211 53 L203 56 L204 58 L210 56Z" fill="#12101b"/>
    <g fill="#ff3fd2"><circle cx="194" cy="56" r="1.4"/><circle cx="206" cy="56" r="1.4"/></g>
    <path d="M191 62 C196 66 204 66 209 62 C206 68 194 68 191 62Z" fill="#12101b"/>
    <path d="M205 46 L203 52 L206 55" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/>
  </g>
  <!-- stage floor -->
  <path d="M30 104 H370 L390 122 H10Z" fill="#8a5a2b" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
  <g stroke="#5a3a1e" stroke-width="0.8"><path d="M24 110 H376 M16 116 H384"/></g>
  <ellipse cx="200" cy="108" rx="40" ry="4" fill="var(--lg-light, #ffffff)" opacity="0.3"/>
  <!-- curtains, swaying -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round">
    <path d="M0 0 H70 C66 30 56 60 64 104 C50 110 30 108 0 110Z" fill="#b3122e">
      <animateTransform class="lg-loop" attributeName="transform" type="skewX" values="0;-2;0" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M400 0 H330 C334 30 344 60 336 104 C350 110 370 108 400 110Z" fill="#b3122e">
      <animateTransform class="lg-loop" attributeName="transform" type="skewX" values="0;2;0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="none" stroke="#7a0c20" stroke-width="2" opacity="0.8"><path d="M20 0 C18 40 14 70 18 108 M44 0 C42 40 36 70 42 106 M380 0 C382 40 386 70 382 108 M356 0 C358 40 364 70 358 106"/></g>
  <g fill="#ffd966" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"><circle cx="62" cy="66" r="3"/><circle cx="338" cy="66" r="3"/></g>
  <path d="M0 0 H400 V12 Q380 20 360 12 Q340 20 320 12 Q300 20 280 12 Q260 20 240 12 Q220 20 200 12 Q180 20 160 12 Q140 20 120 12 Q100 20 80 12 Q60 20 40 12 Q20 20 0 12Z" fill="#7a0c20" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
  <g fill="#ffd966"><circle cx="20" cy="16" r="1.4"/><circle cx="60" cy="16" r="1.4"/><circle cx="100" cy="16" r="1.4"/><circle cx="140" cy="16" r="1.4"/><circle cx="180" cy="16" r="1.4"/><circle cx="220" cy="16" r="1.4"/><circle cx="260" cy="16" r="1.4"/><circle cx="300" cy="16" r="1.4"/><circle cx="340" cy="16" r="1.4"/><circle cx="380" cy="16" r="1.4"/></g>
  <!-- the audience, heads in the dark -->
  <path d="M0 122 H400 V140 H0Z" fill="var(--lg-deep, #7c4def)"/>
  <g fill="#161421">
    <circle cx="20" cy="130" r="8"/><circle cx="46" cy="132" r="8"/><circle cx="72" cy="130" r="8"/><circle cx="98" cy="133" r="8"/><circle cx="124" cy="130" r="8"/><circle cx="150" cy="132" r="8"/><circle cx="176" cy="130" r="8"/><circle cx="224" cy="131" r="8"/><circle cx="250" cy="130" r="8"/><circle cx="276" cy="133" r="8"/><circle cx="302" cy="130" r="8"/><circle cx="328" cy="132" r="8"/><circle cx="354" cy="130" r="8"/><circle cx="380" cy="132" r="8"/>
    <path d="M196 140 V128 L200 120 L204 128 V140Z"/><rect x="194" y="120" width="12" height="2"/>
  </g>
  <!-- floating music notes -->
  <g fill="var(--lg-accent, #f2b441)">
    <path style="transform-box:fill-box;transform-origin:center" d="M140 60 v-10 l6 -2 v10 a2 2 0 1 1 -1 -1.6 v-6 l-4 1.4 v8 a2 2 0 1 1 -1 -1.8Z"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 10;-6 -20" dur="3s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="3s" repeatCount="indefinite" additive="sum"/></path>
    <path d="M262 64 v-10 a2 2 0 1 1 -1 -1.8 v-2 l5 2 v2 l-4 -1.4 v11 a2 2 0 1 1 -1 -1.8Z"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 10;6 -20;0 10" dur="6.8s" repeatCount="indefinite" keyTimes="0;.5;1"/></path>
  </g>
</svg>
