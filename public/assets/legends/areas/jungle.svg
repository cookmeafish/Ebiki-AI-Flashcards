<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <!-- The Sunken Temple: an overgrown step pyramid, a waterfall, vines and parrots, Vinecoil coiled on top. -->
  <rect width="400" height="140" fill="var(--lg-sky, #e2f3e2)"/>
  <!-- far canopy -->
  <g fill="var(--lg-far, #9fd4ad)"><circle cx="20" cy="70" r="30"/><circle cx="70" cy="62" r="28"/><circle cx="120" cy="72" r="24"/><circle cx="290" cy="70" r="26"/><circle cx="340" cy="60" r="30"/><circle cx="390" cy="70" r="26"/></g>
  <!-- waterfall on the left cliff -->
  <path d="M40 140 V60 L58 44 H90 L96 140Z" fill="var(--lg-deep, #2e8b57)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="66" y="46" width="14" height="94" fill="#9ff3ff" opacity="0.85"/>
  <g stroke="#fff" stroke-width="1.4" opacity="0.8">
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 -20;0 0;0 -20" dur="1.6s" repeatCount="indefinite" keyTimes="0;.5;1"/>
    <path d="M69 50 V60 M75 62 V72 M70 78 V88 M76 94 V104 M69 108 V118 M74 122 V132 M71 136 V146"/>
  </g>
  <ellipse cx="73" cy="128" rx="16" ry="4" fill="#fff" opacity="0.6"/>
  <g transform="translate(0 14)">
  <!-- the step pyramid -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round" fill="#9aa08a">
    <path d="M140 120 H300 V106 H140Z"/><path d="M152 106 H288 V92 H152Z"/><path d="M166 92 H274 V78 H166Z"/><path d="M180 78 H260 V64 H180Z"/>
    <path d="M196 64 H244 V44 H196Z"/>
  </g>
  <path d="M288 92 H300 V120 H288Z M274 78 H288 V92 H274Z M260 64 H274 V78 H260Z" fill="#000" opacity="0.2"/>
  <path d="M212 120 V78 H228 V120Z" fill="#6f7563" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
  <path d="M208 64 V52 C208 46 232 46 232 52 V64Z" fill="#1a2014" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"/>
  <g fill="#ffd966"><circle cx="216" cy="56" r="1.6"/><circle cx="224" cy="56" r="1.6"/></g>
  <!-- glyph bands -->
  <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" opacity="0.6"><path d="M160 113 h8 v-4 h4 v4 M184 113 h8 v-4 h4 v4 M244 113 h8 v-4 h4 v4 M268 113 h8 v-4 h4 v4 M176 99 h6 v-3 h3 v3 M256 99 h6 v-3 h3 v3"/></g>
  <!-- vines draped over the temple -->
  <g fill="none" stroke="var(--lg-deep, #2e8b57)" stroke-width="2.4" stroke-linecap="round"><path d="M180 64 C176 80 184 90 178 106 M260 64 C264 78 256 90 262 104 M166 92 C164 102 168 110 164 120"/></g>
  <g fill="var(--lg-near, #5fb57a)"><ellipse cx="178" cy="80" rx="4" ry="2"/><ellipse cx="182" cy="96" rx="4" ry="2"/><ellipse cx="262" cy="78" rx="4" ry="2"/><ellipse cx="258" cy="94" rx="4" ry="2"/></g>
  <!-- Vinecoil coiled on the summit, hood flared -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round">
    <path d="M198 46 C204 38 236 38 242 46 C236 52 204 52 198 46Z" fill="var(--lg-deep, #2e8b57)"/>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 220 44;-3 220 44;0 220 44;3 220 44;0 220 44" dur="4s" repeatCount="indefinite"/>
      <path d="M214 44 C212 34 214 28 218 24 H222 C226 28 228 34 226 44Z" fill="var(--lg-deep, #2e8b57)"/>
      <path d="M220 4 C234 5 242 16 242 26 C242 34 234 38 228 34 L220 30 L212 34 C206 38 198 34 198 26 C198 16 206 5 220 4Z" fill="var(--lg-near, #5fb57a)"/>
      <g fill="#ff3b1f" stroke="none"><circle cx="210" cy="18" r="1.8"/><circle cx="230" cy="18" r="1.8"/></g>
      <path d="M214 22 C214 16 217 14 220 14 C223 14 226 16 226 22 C226 26 223 30 220 30 C217 30 214 26 214 22Z" fill="var(--lg-deep, #2e8b57)"/>
      <g fill="#ffd966" stroke="none"><ellipse cx="217.6" cy="21" rx="1.4" ry="1"/><ellipse cx="222.4" cy="21" rx="1.4" ry="1"/></g>
      <path d="M216 15 L218 11 L220 14 L222 11 L224 15Z" fill="#ffd966" stroke-width="0.6"/>
      <path d="M220 28 V34 L218 36 M220 34 L222 36" fill="none" stroke="#d4342c" stroke-width="0.8"/>
    </g>
  </g>
  </g>
  <!-- near foliage and ground -->
  <path d="M0 120 H400 V140 H0Z" fill="var(--lg-near, #5fb57a)"/>
  <g fill="var(--lg-deep, #2e8b57)" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round">
    <path d="M104 140 C98 124 104 110 118 104 C114 116 118 126 124 140Z"/><path d="M124 140 C128 122 140 114 154 116 C144 124 140 132 140 140Z"/>
    <path d="M300 140 C304 122 316 112 330 114 C320 122 316 132 316 140Z"/><path d="M330 140 C334 126 346 118 358 120 C350 128 346 134 346 140Z"/>
  </g>
  <!-- parrots flying -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="0.6">
    <path d="M120 30 l8 -4 l4 4 l6 -2 l-4 6 l-8 2Z" fill="#d4342c"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;60 -8;120 2;60 -8;0 0" dur="12s" repeatCount="indefinite" keyTimes="0;.25;.5;.75;1"/></path>
    <path d="M320 36 l-8 -4 l-4 4 l-6 -2 l4 6 l8 2Z" fill="#2d86c9"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-50 -6;-100 4;-50 -6;0 0" dur="14s" repeatCount="indefinite" keyTimes="0;.25;.5;.75;1"/></path>
  </g>
  <!-- hanging vines from the top -->
  <g fill="none" stroke="var(--lg-deep, #2e8b57)" stroke-width="2" stroke-linecap="round">
    <path d="M120 0 C118 14 124 22 120 36"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 120 0;4 120 0;0 120 0" dur="3s" repeatCount="indefinite"/></path>
    <path d="M330 0 C332 12 326 20 330 32"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 330 0;-4 330 0;0 330 0" dur="3.4s" repeatCount="indefinite"/></path>
  </g>
</svg>
