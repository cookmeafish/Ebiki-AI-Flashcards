      <path d="M258 94 L261 89 L264 94Z M266.4 94 L269.4 87 L272.4 94Z M274.79999999999995 94 L277.79999999999995 88 L280.79999999999995 94Z M283.19999999999993 94 L286.19999999999993 86 L289.19999999999993 94Z M291.5999999999999 94 L294.5999999999999 88 L297.5999999999999 94Z M299.9999999999999 94 L302.9999999999999 87 L305.9999999999999 94Z M308.39999999999986 94 L311.39999999999986 89 L314.39999999999986 94Z M316.79999999999984 94 L319.79999999999984 88 L322.79999999999984 94Z " fill="#f1ece0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M268 104 L284 106 M298 106 L310 104" fill="none" stroke="var(--lg-tint-hi,#ff8a2a)" stroke-width="1.6" stroke-linecap="round"/>
    </g></g></g>
