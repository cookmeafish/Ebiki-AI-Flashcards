    <path d="M244 71 L300 70 L332 74 L352 84 L362 80 L334 68 L298 64 L250 66Z" fill="#000" opacity="0.25"/>
    <path d="M302 40 C280 42 262 48 248 54 L252 56 C266 50 284 46 304 44Z" fill="#fff" opacity="0.22"/>
    <!-- crest plates down the back -->
    <path d="M336 35 L342 22 L348 32 L356 18 L362 29 L372 14 L376 25 L388 10 L390 22 L400 12 V18 C380 22 360 28 336 35Z" fill="#3b2d1f" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
    <!-- scales and war markings -->
    <g fill="none" stroke="#3b2d1f" stroke-width="0.9" stroke-linecap="round" opacity="0.8"><path d="M360 44 l4 3 M370 40 l4 3 M380 38 l4 3 M366 54 l4 3 M378 50 l4 3 M388 46 l4 3"/></g>
    <g fill="none" stroke="var(--lg-tint-hi,#ff8a2a)" stroke-width="2" stroke-linecap="round"><path d="M342 52 L352 46 L364 50 M346 62 L360 58 L372 62 M382 30 L390 36"/><path d="M264 56 L272 54 M280 52 L290 50" stroke-width="1.6"/></g>
