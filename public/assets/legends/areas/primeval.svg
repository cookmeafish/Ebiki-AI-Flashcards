    <circle cx="206" cy="122" r="1.2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 0;0 -3;0 0;0 0" dur="1.6s" repeatCount="indefinite" keyTimes="0;.45;.55;.65;1"/></circle>
