    <g style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0.5;1.2" dur="1.6s" repeatCount="indefinite"/><path d="M40.1 0.0 L27.2 5.0 L36.1 13.9 L21.8 13.9 L25.0 25.1 L12.1 20.1 L8.9 31.3 L0.0 22.3 L-8.9 31.3 L-12.1 20.1 L-25.0 25.1 L-21.8 13.9 L-36.1 13.9 L-27.2 5.0 L-40.1 0.0 L-27.2 -5.0 L-36.1 -13.9 L-21.8 -13.9 L-25.0 -25.1 L-12.1 -20.1 L-8.9 -31.3 L-0.0 -22.3 L8.9 -31.3 L12.1 -20.1 L25.0 -25.1 L21.8 -13.9 L36.1 -13.9 L27.2 -5.0Z" stroke="#ff8a2a" stroke-width="2.2"/></g>
