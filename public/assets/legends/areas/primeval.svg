      <path d="M250 90 C252 98 264 104 282 104 L330 98 L350 94 L360 98 C350 108 330 112 300 112 C276 114 256 108 248 98Z" fill="#5b4630" stroke="var(--lg-ink, #1d2230)" stroke-width="1.5" stroke-linejoin="round"/>
