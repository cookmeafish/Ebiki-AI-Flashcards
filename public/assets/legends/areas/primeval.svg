    <path d="M78 102 C74 92 76 84 84 80 L86 82 C80 86 80 94 82 101Z"/>
    <path d="M90 99 C88 88 90 80 98 76 L100 78 C94 82 93 90 94 98Z"/>
    <path d="M102 97 C102 86 104 80 112 76 L114 78 C108 82 106 88 106 96Z"/>
    <path d="M114 96 C116 88 118 84 124 82 L125 84 C120 86 119 90 118 96Z"/>
    <path d="M132 96 C136 90 144 88 148 92 C150 96 146 100 140 100 L132 99Z"/>
    <circle cx="142" cy="94" r="1.4" fill="#2a1e14" stroke="none"/>
  </g>
  <!-- footprints full of water, leading to it -->
  <g transform="translate(52 126) rotate(0) scale(1.2 0.72)"><g fill="#3b2d1f" opacity="0.6" transform="scale(1.25)"><ellipse cx="0" cy="-6" rx="1.8" ry="5"/><ellipse cx="0" cy="-6" rx="1.8" ry="5" transform="rotate(-34)"/><ellipse cx="0" cy="-6" rx="1.8" ry="5" transform="rotate(34)"/><ellipse cx="0" cy="0.5" rx="3" ry="2.4"/></g><g fill="#e6f1e6"><ellipse cx="0" cy="-6" rx="1.8" ry="5"/><ellipse cx="0" cy="-6" rx="1.8" ry="5" transform="rotate(-34)"/><ellipse cx="0" cy="-6" rx="1.8" ry="5" transform="rotate(34)"/><ellipse cx="0" cy="0.5" rx="3" ry="2.4"/></g></g><g transform="translate(108 116) rotate(0) scale(1.25 0.75)"><g fill="#3b2d1f" opacity="0.6" transform="scale(1.25)"><ellipse cx="0" cy="-6" rx="1.8" ry="5"/><ellipse cx="0" cy="-6" rx="1.8" ry="5" transform="rotate(-34)"/><ellipse cx="0" cy="-6" rx="1.8" ry="5" transform="rotate(34)"/><ellipse cx="0" cy="0.5" rx="3" ry="2.4"/></g><g fill="#e6f1e6"><ellipse cx="0" cy="-6" rx="1.8" ry="5"/><ellipse cx="0" cy="-6" rx="1.8" ry="5" transform="rotate(-34)"/><ellipse cx="0" cy="-6" rx="1.8" ry="5" transform="rotate(34)"/><ellipse cx="0" cy="0.5" rx="3" ry="2.4"/></g></g><g transform="translate(162 128) rotate(0) scale(1.3 0.78)"><g fill="#3b2d1f" opacity="0.6" transform="scale(1.25)"><ellipse cx="0" cy="-6" rx="1.8" ry="5"/><ellipse cx="0" cy="-6" rx="1.8" ry="5" transform="rotate(-34)"/><ellipse cx="0" cy="-6" rx="1.8" ry="5" transform="rotate(34)"/><ellipse cx="0" cy="0.5" rx="3" ry="2.4"/></g><g fill="#e6f1e6"><ellipse cx="0" cy="-6" rx="1.8" ry="5"/><ellipse cx="0" cy="-6" rx="1.8" ry="5" transform="rotate(-34)"/><ellipse cx="0" cy="-6" rx="1.8" ry="5" transform="rotate(34)"/><ellipse cx="0" cy="0.5" rx="3" ry="2.4"/></g></g><g transform="translate(204 108) rotate(0) scale(1.2 0.72)"><g fill="#3b2d1f" opacity="0.6" transform="scale(1.25)"><ellipse cx="0" cy="-6" rx="1.8" ry="5"/><ellipse cx="0" cy="-6" rx="1.8" ry="5" transform="rotate(-34)"/><ellipse cx="0" cy="-6" rx="1.8" ry="5" transform="rotate(34)"/><ellipse cx="0" cy="0.5" rx="3" ry="2.4"/></g><g fill="#e6f1e6"><ellipse cx="0" cy="-6" rx="1.8" ry="5"/><ellipse cx="0" cy="-6" rx="1.8" ry="5" transform="rotate(-34)"/><ellipse cx="0" cy="-6" rx="1.8" ry="5" transform="rotate(34)"/><ellipse cx="0" cy="0.5" rx="3" ry="2.4"/></g></g>
  <!-- TYRANT REX leaning into the valley, roaring -->
