<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <!-- The Primeval Valley: a dry valley floor under a smoking volcano and mesas, pterosaurs crossing, the ribs of something eaten, water-filled footprints leading to the TYRANT REX: a brown head leaning in from the right in profile, crest plates, ember war markings, old claw scars, one heavy brow over a burning slit eye, a dropped jaw full of teeth with a broken fang, a tiny furious arm, its roar bursting out in jagged shock rings. Giant ferns and a cycad sway; pebbles hop as the ground shakes. -->
  <rect width="400" height="140" fill="#e6f1e6"/>
  <!-- the smoking volcano far off -->
  <path d="M60 92 L112 40 L124 38 L134 44 L196 92Z" fill="#a8cfae" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
  <path d="M112 40 L124 38 L134 44 L126 46 L120 44 L116 46Z" fill="#ff6a1a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/>
  <path d="M118 46 L112 60 L116 62 L110 76" fill="none" stroke="#ff6a1a" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M60 92 L112 40 L118 44 L84 92Z" fill="#000" opacity="0.15"/>
  <g fill="#a8cfae" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7">
    <circle cx="122" cy="32" r="5" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-10 -26" dur="5s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0.6;1.8;0.05" dur="5s" repeatCount="indefinite" additive="sum"/></circle>
    <circle cx="126" cy="32" r="4" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-6 -24" dur="5s" repeatCount="indefinite" begin="1.7s"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0.6;1.8;0.05" dur="5s" repeatCount="indefinite" additive="sum" begin="1.7s"/></circle>
    <circle cx="120" cy="34" r="4.4" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-14 -22" dur="5s" repeatCount="indefinite" begin="3.3s"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0.6;1.8;0.05" dur="5s" repeatCount="indefinite" additive="sum" begin="3.3s"/></circle>
  </g>
  <!-- mesas with strata -->
  <path d="M0 96 L0 62 L18 58 L34 60 L40 74 L56 76 L62 96Z" fill="#a8cfae" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
  <path d="M4 68 L30 66 M4 76 L36 76 M6 86 L52 86" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" opacity="0.45"/>
  <path d="M176 96 L184 70 L206 66 L222 68 L232 96Z" fill="#a8cfae" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
  <path d="M186 76 L216 74 M184 86 L224 86" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" opacity="0.45"/>
  <!-- pterosaurs crossing -->
  <g fill="#86694a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round">
    <path d="M0 0 L-10 -4 L-4 0 L-12 4 L-2 2 L4 -1 L8 0 L4 1Z" style="transform-box:fill-box;transform-origin:center" transform="translate(20 26)"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="20 26;140 14;260 24" dur="12s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" dur="12s" repeatCount="indefinite" keyTimes="0;.08;.9;1" additive="sum"/></path>
    <path d="M0 0 L-8 -3 L-3 0 L-9 3 L-2 1.6 L3 -0.8 L6 0 L3 0.8Z" style="transform-box:fill-box;transform-origin:center" transform="translate(40 40)"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="40 40;150 30;240 40" dur="10s" repeatCount="indefinite" begin="4s"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" dur="10s" repeatCount="indefinite" keyTimes="0;.08;.9;1" additive="sum" begin="4s"/></path>
  </g>
  <!-- the valley floor -->
  <path d="M0 96 C60 92 120 96 180 94 C220 92 250 96 280 96 C320 96 360 94 400 96 V140 H0Z" fill="#5fa86c" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M0 96 C60 92 120 96 180 94 L180 98 C120 100 60 96 0 100Z" fill="#fff" opacity="0.2"/>
