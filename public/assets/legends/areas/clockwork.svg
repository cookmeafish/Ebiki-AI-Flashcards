<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <!-- Gearworks Foundry: giant wall gears, a molten crucible, pipes and steam, chains, a conveyor, the Juggernaut's eyes in the smoke. -->
  <rect width="400" height="140" fill="var(--lg-sky, #f5ead8)"/>
  <!-- back wall rivet panels -->
  <g fill="var(--lg-far, #ddc39a)" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" opacity="0.7">
    <rect x="0" y="10" width="100" height="100"/><rect x="100" y="10" width="100" height="100"/><rect x="200" y="10" width="100" height="100"/><rect x="300" y="10" width="100" height="100"/>
  </g>
  <!-- giant wall gears -->
  <g transform="translate(60 56)">
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="14s" repeatCount="indefinite"/>
      <circle r="36" fill="none" stroke="#8a5a2b" stroke-width="12" stroke-dasharray="9 6"/>
      <circle r="31" fill="#c28a3b" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4"/><circle r="8" fill="#5a3a1e"/>
      <g stroke="#5a3a1e" stroke-width="4"><path d="M0 -28 V28 M-28 0 H28 M-20 -20 L20 20 M-20 20 L20 -20"/></g>
    </g>
  </g>
  <g transform="translate(124 34)">
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="360;0" dur="7s" repeatCount="indefinite"/>
      <circle r="18" fill="none" stroke="#8a5a2b" stroke-width="8" stroke-dasharray="6 4.4"/>
      <circle r="14" fill="#d6a45a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"/><circle r="4" fill="#5a3a1e"/>
      <g stroke="#5a3a1e" stroke-width="2.4"><path d="M0 -12 V12 M-12 0 H12"/></g>
    </g>
  </g>
  <g transform="translate(350 50)">
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="10s" repeatCount="indefinite"/>
      <circle r="28" fill="none" stroke="#8a5a2b" stroke-width="10" stroke-dasharray="8 5"/>
      <circle r="24" fill="#c28a3b" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"/><circle r="6" fill="#5a3a1e"/>
      <g stroke="#5a3a1e" stroke-width="3"><path d="M-17 -17 L17 17 M-17 17 L17 -17"/></g>
    </g>
  </g>
  <!-- smoke and the Juggernaut's eyes in it -->
  <g fill="#6b6f7a" opacity="0.55">
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;6 -3;0 0" dur="5s" repeatCount="indefinite"/>
    <ellipse cx="236" cy="42" rx="46" ry="20"/><ellipse cx="206" cy="30" rx="26" ry="14"/><ellipse cx="270" cy="30" rx="24" ry="12"/>
  </g>
  <g fill="#1a1216" stroke="var(--lg-ink, #1d2230)" stroke-width="1"><circle cx="226" cy="42" r="6"/><circle cx="246" cy="42" r="6"/></g>
  <g stroke="#ffd166" stroke-width="1.4" stroke-linecap="round"><path d="M226 42 L230 38 M246 42 L250 38"/></g>
  <g fill="#ff5a1f" opacity="0.4"><circle cx="226" cy="42" r="9"/><circle cx="246" cy="42" r="9"/></g>
  <path d="M214 34 L200 24 M258 34 L272 24" stroke="#6b6f7a" stroke-width="4" stroke-linecap="round"/>
  <!-- pipes along the wall, venting steam -->
  <g fill="none" stroke-linecap="round">
    <path d="M0 96 H180 V70 H300 V96 H400" stroke="var(--lg-ink, #1d2230)" stroke-width="7"/>
    <path d="M0 96 H180 V70 H300 V96 H400" stroke="#9aa7bd" stroke-width="4.4"/>
  </g>
  <g fill="#f4efe0" opacity="0.8">
    <circle style="transform-box:fill-box;transform-origin:center" cx="180" cy="66" r="4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-6 -24" dur="1.8s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1.8s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="300" cy="66" r="4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;6 -24" dur="2.1s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.1s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
  <!-- the crucible on chains, pouring -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.2">
    <path d="M160 0 V40 M184 0 V40" stroke="#6b6f7a" stroke-width="1.6" stroke-dasharray="3 1.5"/>
    <path d="M154 40 H190 L184 62 H160Z" fill="#3a3340" stroke-linejoin="round"/>
    <ellipse cx="172" cy="40" rx="18" ry="3" fill="#ff5a1f"/>
    <path d="M186 58 C190 60 192 64 190 68" fill="none" stroke="#ff5a1f" stroke-width="3"/>
  </g>
  <rect style="transform-box:fill-box;transform-origin:center" x="188" y="68" width="4" height="40" fill="#ffb347">
    <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1.4 1;1 1" dur="0.4s" repeatCount="indefinite" additive="sum"/>
  </rect>
  <!-- the conveyor with castings -->
  <path d="M0 110 H400 V140 H0Z" fill="var(--lg-deep, #b0702a)"/>
  <rect x="0" y="108" width="400" height="8" fill="#3a3340" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
  <g fill="#6b6f7a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8">
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;40 0;0 0" dur="6s" repeatCount="indefinite" keyTimes="0;.5;1"/>
    <rect x="-20" y="98" width="16" height="10"/><rect x="60" y="98" width="16" height="10"/><rect x="140" y="98" width="16" height="10"/><rect x="220" y="98" width="16" height="10"/><rect x="300" y="98" width="16" height="10"/><rect x="380" y="98" width="16" height="10"/>
  </g>
  <g fill="#1d2230"><circle cx="20" cy="112" r="2"/><circle cx="100" cy="112" r="2"/><circle cx="180" cy="112" r="2"/><circle cx="260" cy="112" r="2"/><circle cx="340" cy="112" r="2"/></g>
  <!-- furnace glow -->
  <path d="M190 140 C190 124 210 118 230 124 L236 140Z" fill="#ff5a1f" opacity="0.4"/>
  <!-- sparks -->
  <g fill="#ffd166">
    <circle style="transform-box:fill-box;transform-origin:center" cx="190" cy="108" r="1.2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-10 -12;-16 4" dur="1s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="192" cy="108" r="1"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;10 -14;14 2" dur="1.2s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1.2s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
</svg>
