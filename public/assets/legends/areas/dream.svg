<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <!-- The Dreamscape: floating islands of a bedroom, a staircase to nowhere, melting clocks, a spiral sky with the
       Nightmare Weaver's grin. -->
  <rect width="400" height="140" fill="var(--lg-sky, #e6dcff)"/>
  <!-- spiral sky -->
  <g fill="none" stroke="#b58cff" stroke-width="2" opacity="0.4">
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 200 50;360 200 50" dur="30s" repeatCount="indefinite"/>
    <path d="M200 50 C210 50 212 38 202 36 C186 34 180 56 194 64 C214 74 232 50 222 32 C208 12 172 18 168 48 C164 82 206 96 232 78 C262 58 256 14 222 4"/>
  </g>
  <!-- the Weaver's crescent grin and slit eyes in the sky -->
  <g>
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" repeatCount="indefinite"/>
    <g fill="#ffe36b" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8">
      <path d="M180 38 C184 34 192 34 196 36 C192 40 184 40 180 38Z"/><path d="M220 38 C216 34 208 34 204 36 C208 40 216 40 220 38Z"/>
    </g>
    <g fill="#1a0508"><ellipse cx="188" cy="37" rx="0.7" ry="2"/><ellipse cx="212" cy="37" rx="0.7" ry="2"/></g>
    <path d="M170 48 C182 64 218 64 230 48 C218 56 182 56 170 48Z" fill="#fff6c2" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
    <g stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"><path d="M180 53 L182 57 M188 55 L189 59 M196 56 V60 M204 56 V60 M212 55 L211 59 M220 53 L218 57"/></g>
  </g>
  <!-- stars -->
  <g fill="#fff6c2"><circle cx="40" cy="20" r="1.4"/><circle cx="120" cy="12" r="1.2"/><circle cx="300" cy="16" r="1.4"/><circle cx="370" cy="30" r="1.2"/><circle cx="80" cy="50" r="1"/></g>
  <!-- floating island 1: a bed -->
  <g>
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="5s" repeatCount="indefinite"/>
    <path d="M30 88 H110 L96 104 L70 110 L44 104Z" fill="#8a6a44" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"/>
    <path d="M30 88 H110 V84 H30Z" fill="var(--lg-near, #9a86d6)" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
    <g stroke="var(--lg-ink, #1d2230)" stroke-width="1"><rect x="42" y="72" width="54" height="12" fill="#6b4a8a"/><rect x="40" y="62" width="4" height="22" fill="#4a3020"/><rect x="94" y="66" width="4" height="18" fill="#4a3020"/><rect x="46" y="68" width="14" height="6" rx="2" fill="#fff"/></g>
    <path d="M58 72 C66 76 80 76 94 72 V84 H58Z" fill="#b58cff" opacity="0.7"/>
  </g>
  <!-- floating island 2: the staircase to nowhere -->
  <g>
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 -4;0 2;0 -4" dur="6s" repeatCount="indefinite"/>
    <path d="M270 96 H350 L338 110 L310 116 L282 110Z" fill="#8a6a44" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"/>
    <path d="M270 96 H350 V92 H270Z" fill="var(--lg-near, #9a86d6)" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
    <g fill="#c8b8e8" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8">
      <rect x="280" y="84" width="16" height="8"/><rect x="290" y="76" width="16" height="8"/><rect x="300" y="68" width="16" height="8"/><rect x="310" y="60" width="16" height="8"/><rect x="320" y="52" width="16" height="8"/><rect x="330" y="44" width="16" height="8"/>
    </g>
    <!-- a door at the top that opens onto nothing -->
    <path d="M336 44 V26 H350 V44Z" fill="#1c1540" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
    <g fill="#ff2e4c"><circle cx="341" cy="34" r="0.9"/><circle cx="345" cy="34" r="0.9"/></g>
  </g>
  <!-- melting clocks -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1">
    <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4.4s" repeatCount="indefinite"/>
      <path d="M130 60 C130 48 152 48 152 60 C152 66 150 72 146 80 C144 72 136 70 130 60Z" fill="#ffe36b"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 141 58;360 141 58" dur="6s" repeatCount="indefinite"/><path d="M141 58 V52" stroke-width="1.2"/></g>
      <path d="M141 58 H146" stroke-width="1.2"/></g>
    <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 -3;0 3;0 -3" dur="5.4s" repeatCount="indefinite"/>
      <path d="M240 80 C240 70 258 70 258 80 C258 86 256 92 252 98 C250 92 244 88 240 80Z" fill="#ffe36b"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 249 78;-360 249 78" dur="4s" repeatCount="indefinite"/><path d="M249 78 V73" stroke-width="1.2"/></g></g>
  </g>
  <!-- the web threads the Weaver spins, holding up the islands -->
  <g fill="none" stroke="#e8dcff" stroke-width="0.8" opacity="0.8"><path d="M200 60 L70 84 M200 60 L310 92 M200 60 L141 48 M200 60 L249 70"/></g>
  <!-- the dream sea of clouds below -->
  <path d="M0 118 C20 110 40 116 60 112 C80 106 100 116 120 112 C140 106 160 116 180 112 C200 106 220 116 240 112 C260 106 280 116 300 112 C320 106 340 116 360 112 C380 106 392 114 400 112 V140 H0Z" fill="var(--lg-deep, #7c4def)" opacity="0.8"/>
  <path d="M0 126 C40 120 80 130 120 124 C160 118 200 130 240 124 C280 118 320 130 360 124 C380 120 392 124 400 124 V140 H0Z" fill="var(--lg-far, #c8b8e8)" opacity="0.8">
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="-10 0;10 0;-10 0" dur="10s" repeatCount="indefinite"/>
  </path>
  <!-- zzz and a nightmare dangling -->
  <g fill="none" stroke="#b58cff" stroke-width="1.4" stroke-linejoin="round"><path style="transform-box:fill-box;transform-origin:center" d="M100 60 h5 l-5 5 h5"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 6;-4 -10" dur="3s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="3s" repeatCount="indefinite" additive="sum"/></path></g>
  <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="-8 380 20;8 380 20;-8 380 20" dur="2.6s" repeatCount="indefinite"/>
    <path d="M380 20 V56" stroke="#e8dcff" stroke-width="0.7"/>
    <circle cx="380" cy="60" r="5" fill="#3a2a70" stroke="#e8dcff" stroke-width="0.7"/><path d="M377 59 h1.4 M381.6 59 h1.4 M377 62 C379 61 381 61 383 62" stroke="#ff2e4c" stroke-width="0.8" fill="none"/>
  </g>
</svg>
