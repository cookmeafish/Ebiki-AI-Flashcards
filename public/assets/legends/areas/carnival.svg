<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <!-- Midnight Carnival: a turning ferris wheel, a torn circus tent, string lights, a broken carousel, the Box King on stage. -->
  <rect width="400" height="140" fill="var(--lg-sky, #f1e4f7)"/>
  <!-- the ferris wheel, turning -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.2">
    <path d="M60 110 L80 60 L100 110" fill="none" stroke-width="2.4"/>
    <g transform="translate(80 60)">
      <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
        <circle r="44" fill="none" stroke="var(--lg-deep, #7c4def)" stroke-width="2.4"/>
        <circle r="36" fill="none" stroke="var(--lg-deep, #7c4def)" stroke-width="1"/>
        <g stroke="var(--lg-deep, #7c4def)" stroke-width="1"><path d="M0 -44 V44 M-44 0 H44 M-31 -31 L31 31 M-31 31 L31 -31"/></g>
        <g fill="#ffd23f"><circle cx="0" cy="-44" r="5"/><circle cx="44" cy="0" r="5"/><circle cx="0" cy="44" r="5"/><circle cx="-44" cy="0" r="5"/></g>
        <g fill="#ff3fd2"><circle cx="31" cy="-31" r="5"/><circle cx="31" cy="31" r="5"/><circle cx="-31" cy="31" r="5"/><circle cx="-31" cy="-31" r="5"/></g>
      </g>
      <circle r="4" fill="#ffd23f"/>
    </g>
  </g>
  <!-- torn circus tent -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round">
    <path d="M150 110 L170 60 L210 40 L250 60 L270 110Z" fill="#f4efe6"/>
    <g fill="#b3122e"><path d="M170 60 L182 54 L178 110 H164Z"/><path d="M196 46 L210 40 L208 110 H194Z"/><path d="M226 48 L238 54 L246 110 H232Z"/></g>
    <path d="M250 60 L270 110 H254 L246 70Z" fill="#000" opacity="0.18"/>
    <path d="M210 40 V26" stroke-width="1.6"/><path d="M210 26 H222 L218 30 L222 34 H210Z" fill="#ffd23f"/>
    <path d="M196 110 V84 C196 76 224 76 224 84 V110Z" fill="#1c0f24"/>
    <path d="M236 70 L244 76 L240 84 L248 90" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
  </g>
  <!-- eyes in the tent door -->
  <g fill="#fff"><circle cx="205" cy="92" r="2.4"/><circle cx="215" cy="92" r="2.4"/></g>
  <g fill="#b3122e"><circle cx="205" cy="92" r="1"/><circle cx="215" cy="92" r="1"/></g>
  <path d="M200 98 C205 104 215 104 220 98 C216 108 204 108 200 98Z" fill="#2a0f14" stroke="#fff" stroke-width="0.8"/><path d="M202 99 L204 103 L206 100 L208 104 L210 100 L212 104 L214 100 L216 103 L218 99" fill="none" stroke="#fff" stroke-width="0.9"/>
  <!-- string lights -->
  <path d="M100 30 Q150 50 210 40 Q270 30 330 48" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
  <g>
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="1.2s" repeatCount="indefinite"/>
    <circle cx="120" cy="38" r="2.4" fill="#ffd23f"/><circle cx="140" cy="43" r="2.4" fill="#ff3fd2"/><circle cx="160" cy="45" r="2.4" fill="#2ef2ff"/><circle cx="180" cy="44" r="2.4" fill="#ffd23f"/><circle cx="240" cy="36" r="2.4" fill="#ff3fd2"/><circle cx="260" cy="36" r="2.4" fill="#2ef2ff"/><circle cx="280" cy="38" r="2.4" fill="#ffd23f"/><circle cx="300" cy="41" r="2.4" fill="#ff3fd2"/>
  </g>
  <!-- the broken carousel -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round">
    <path d="M300 70 L340 54 L380 70Z" fill="var(--lg-deep, #7c4def)"/>
    <path d="M300 70 H380 V74 H300Z" fill="#ffd23f"/>
    <path d="M310 74 V104 M340 74 V96 M370 74 V104" stroke-width="1.6"/>
    <path d="M296 104 H384 L378 110 H302Z" fill="var(--lg-near, #a585f5)"/>
    <g fill="#f4efe6"><path d="M304 90 C304 84 316 84 318 88 L316 96 H306Z"/><path d="M362 94 C362 88 374 88 376 92 L374 100 H364Z" transform="rotate(20 369 94)"/></g>
  </g>
  <!-- the stage with the Box King's box -->
  <path d="M110 110 H146 V100 H110Z" fill="#8a5a2b" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1">
    <rect x="118" y="84" width="20" height="16" fill="var(--lg-deep, #7c4def)"/><path d="M122 84 H126 L124 100 H120Z M130 84 H134 L132 100 H128Z" fill="#ffd23f"/>
    <path d="M128 84 L130 78 L126 74 L130 70" fill="none" stroke="#c9ccd6" stroke-width="1.6"/>
    <circle cx="130" cy="64" r="6" fill="#f4efe6"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="1.4s" repeatCount="indefinite"/></circle>
  </g>
  <!-- ground -->
  <path d="M0 110 H400 V140 H0Z" fill="var(--lg-near, #a585f5)"/>
  <path d="M0 122 H400 V140 H0Z" fill="#000" opacity="0.18"/>
  <!-- balloons floating up -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="0.6">
    <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 20;6 -40;0 20" dur="16s" repeatCount="indefinite" keyTimes="0;.5;1"/>
      <ellipse cx="160" cy="90" rx="5" ry="6" fill="#ff3fd2"/><path d="M160 96 C158 100 162 104 160 108" fill="none"/></g>
    <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 20;-6 -40;0 20" dur="18s" repeatCount="indefinite" keyTimes="0;.5;1"/>
      <ellipse cx="290" cy="94" rx="5" ry="6" fill="#2ef2ff"/><path d="M290 100 C288 104 292 108 290 112" fill="none"/></g>
  </g>
  <!-- confetti on the ground -->
  <g><rect x="40" y="124" width="3" height="2" fill="#ffd23f"/><rect x="180" y="128" width="3" height="2" fill="#ff3fd2"/><rect x="260" y="124" width="3" height="2" fill="#2ef2ff"/><rect x="340" y="130" width="3" height="2" fill="#ffd23f"/></g>
</svg>
