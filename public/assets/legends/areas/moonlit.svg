    <path d="M338 80 L352 68 L362 76 L358 80 L352 74 L340 84Z" fill="#000" opacity="0.2" stroke="none"/>
    <path d="M334 82 L352 64 L364 74" fill="none" stroke="#3e2f22" stroke-width="2.6"/>
    <path d="M366 74 L370 60 L375 60 L374 78Z" fill="#6b5c54"/>
    <rect x="346" y="88" width="8" height="14" fill="#140e0c"/>
    <rect x="360" y="86" width="7" height="7" fill="#ffb347"/>
    <rect x="360" y="86" width="7" height="7" fill="#ffe08a" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;0.6;1;0.8;1" dur="1.4s" repeatCount="indefinite"/></rect>
    <path d="M360 89.5 H367 M363.5 86 V93" stroke="#3e2f22" stroke-width="0.8"/>
    <path d="M342 92 L350 86 M370 96 L374 90" fill="none" stroke-width="0.6" opacity="0.6"/>
