<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <!-- The Howling Moor: a huge moon with clouds and bats sliding across it, and MOONFANG on the hill against it: bristling fur, a torn red plaid shirt, hooked claws raised, a V brow over burning eyes that blink, a snarling muzzle. Standing stones gouged by claws, a ruined cottage with a candle and smoke, a path and broken fence, a dead tree with the pack's eyes in the brush, ground mist. -->
  <rect width="400" height="140" fill="var(--lg-sky, #e2def0)"/>
  <!-- stars -->
  <g fill="var(--lg-accent, #e8b84a)">
    <circle cx="30" cy="20" r="1"/><circle cx="96" cy="12" r="0.8"/><circle cx="150" cy="30" r="0.9"/><circle cx="370" cy="16" r="1"/><circle cx="388" cy="40" r="0.7"/><circle cx="196" cy="8" r="0.7"/>
    <path d="M60 33.36 L60.66 35.34 L62.64 36 L60.66 36.66 L60 38.64 L59.34 36.66 L57.36 36 L59.34 35.34Z" fill="var(--lg-accent, #e8b84a)" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;0.15;1" dur="2.6s" repeatCount="indefinite"/></path><path d="M348 27.58 L348.61 29.39 L350.42 30 L348.61 30.61 L348 32.42 L347.39 30.61 L345.58 30 L347.39 29.39Z" fill="var(--lg-accent, #e8b84a)" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;0.15;1" dur="3.1s" repeatCount="indefinite" begin="1s"/></path><path d="M176 15.8 L176.55 17.45 L178.20 18 L176.55 18.55 L176 20.20 L175.45 18.55 L173.80 18 L175.45 17.45Z" fill="var(--lg-accent, #e8b84a)" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;0.15;1" dur="2.2s" repeatCount="indefinite" begin="0.5s"/></path>
  </g>
  <!-- the huge moon -->
  <circle cx="272" cy="58" r="50" fill="#f6f1da" stroke="#c9bf94" stroke-width="2"/>
  <path d="M246 20 A50 50 0 0 0 272 108 A44 44 0 0 1 246 20Z" fill="#d9cfa6" opacity="0.6"/>
  <g fill="#ddd3ad"><circle cx="300" cy="34" r="7"/><circle cx="312" cy="70" r="9"/><circle cx="292" cy="92" r="5"/><circle cx="238" cy="80" r="6"/></g>
  <g fill="#c9bf94" opacity="0.6"><circle cx="301" cy="35" r="4"/><circle cx="313" cy="71" r="5"/></g>
  <!-- clouds sliding across the moon -->
  <g fill="var(--lg-far, #b4abd6)" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8">
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="-40 0;40 0;-40 0" dur="26s" repeatCount="indefinite"/>
    <path d="M196 48 C200 42 212 42 216 46 C222 40 236 42 238 48 C246 48 248 54 240 56 H198 C190 56 190 50 196 48Z"/>
    <path d="M318 88 C322 82 334 82 338 86 C344 80 358 84 358 90 C364 92 362 96 356 96 H320 C312 96 312 90 318 88Z"/>
  </g>
  <!-- far hills -->
  <path d="M0 84 C40 74 80 80 120 76 C160 72 200 82 240 80 C290 78 340 72 400 80 V112 H0Z" fill="var(--lg-far, #b4abd6)" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9"/>
  <!-- the ruined cottage, a candle still burning -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.1" stroke-linejoin="round">
