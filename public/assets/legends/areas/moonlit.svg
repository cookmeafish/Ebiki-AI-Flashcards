  <path d="M0 140 V60 C4 56 8 56 10 60 L12 80 C16 70 20 64 26 60 L28 62 C22 70 18 78 16 92 L18 140Z" fill="#1d1828" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
