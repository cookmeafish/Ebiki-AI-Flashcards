      <path d="M284 24 L288 32 L298 30 L294 38 L300 40 L292 46 L296 58 L288 48 L292 40 L288 36Z" fill="#d9d3f0" opacity="0.3"/>
      <path d="M256 40 L270 47 L284 40 L284 45 L270 52 L256 45Z" fill="#17121f" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round"/>
      <g style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.2;1" dur="2s" repeatCount="indefinite"/><path d="M256 44 L268 49 L266 53 L257 50Z M284 44 L272 49 L274 53 L283 50Z" fill="#ffb347" opacity="0.45"/></g>
      <g style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1;1 0.1;1 1;1 1" dur="5s" repeatCount="indefinite" keyTimes="0;.9;.93;.96;1"/>
        <path d="M258 45.5 L267 49 L265.4 51.4 L258.6 49Z M282 45.5 L273 49 L274.6 51.4 L281.4 49Z" fill="#ff8a1f" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5"/>
      </g>
      <circle cx="260" cy="47.3" r="0.6" fill="#fff"/><circle cx="280" cy="47.3" r="0.6" fill="#fff"/>
