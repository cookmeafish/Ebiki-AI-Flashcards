    <circle cx="372" cy="56" r="3.4" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;6 -20" dur="4s" repeatCount="indefinite" begin="2s"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0.6;1.6;0.05" dur="4s" repeatCount="indefinite" additive="sum" begin="2s"/></circle>
  </g>
