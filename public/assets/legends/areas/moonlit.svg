    <path d="M96 104 L96 72 L110 70 L112 104Z" fill="var(--lg-far, #b4abd6)"/>
    <path d="M62 70 L116 64 L116 73 L62 79Z" fill="var(--lg-far, #b4abd6)"/>
    <path d="M128 106 L130 84 L140 82 L142 106Z" fill="var(--lg-far, #b4abd6)"/>
    <path d="M40 104 L44 88 L52 90 L52 104Z" fill="var(--lg-far, #b4abd6)"/>
    <path d="M68 104 L70 70 L75 69 L74 104Z M96 104 L96 72 L100 71 L100 104Z M128 106 L130 84 L133 84 L132 106Z" fill="#000" opacity="0.22" stroke="none"/>
