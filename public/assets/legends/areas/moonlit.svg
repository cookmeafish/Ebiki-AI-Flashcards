    <path d="M238 74 L252 66 L270 72 L288 66 L302 74 L306 100 L234 100Z" fill="#9b2230" stroke="var(--lg-ink, #1d2230)" stroke-width="1.1" stroke-linejoin="round"/>
    <g fill="none" stroke="#2a0a10" stroke-width="1.4" opacity="0.7"><path d="M246 72 V98 M258 70 V98 M282 70 V98 M294 72 V98"/><path d="M240 80 H300 M238 90 H302"/></g>
    <g fill="none" stroke="#e6c46a" stroke-width="0.6" opacity="0.7"><path d="M252 70 V98 M288 70 V98 M239 85 H301"/></g>
    <path d="M258 70 L270 92 L282 70 L276 74 L270 84 L264 74Z" fill="#43385e" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M263 74 L270 88 L277 74 L270 80Z" fill="#cfc4a4"/>
    <path d="M238 74 L232 82 L240 80 L236 90 L244 84Z M302 74 L308 82 L300 80 L304 90 L296 84Z" fill="#2c2440" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7" stroke-linejoin="round"/>
    <path d="M304 76 L310 80 L312 98 L306 98Z" fill="#d9d3f0" opacity="0.35"/>
    <!-- the head -->
    <g transform="translate(270 46)"><g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;-3;2;0" dur="4.2s" repeatCount="indefinite"/><g transform="translate(-270 -46)">
      <path d="M248 46 L240 40 L246 38 L242 30 L252 32 L256 24 L264 28 L270 22 L276 28 L284 24 L288 32 L298 30 L294 38 L300 40 L292 46 L296 58 L284 60 L270 68 L256 60 L244 58Z" fill="#2c2440" stroke="var(--lg-ink, #1d2230)" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M252 32 L246 12 L262 28Z" fill="#2c2440" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M288 32 L294 12 L278 28Z" fill="#2c2440" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
