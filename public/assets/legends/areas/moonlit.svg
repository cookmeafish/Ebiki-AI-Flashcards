      <path d="M232 62 L226 66 L230 58 Z M224 52 L218 54 L222 46Z" fill="#2c2440" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round"/>
      <path d="M246 64 L236 60 L240 70Z" fill="#9b2230" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round"/>
