      <path d="M262 52 L278 52 L280 60 L270 68 L260 60Z" fill="#43385e" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round"/>
      <path d="M264 54 L268 55 M272 55 L276 54 M263 57 L267 57.6" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/>
      <path d="M266 52 L274 52 L272 55 L268 55Z" fill="#0d0a12"/>
      <path d="M260 60 L264 58 L270 60 L276 58 L280 60 L276 70 L270 72 L264 70Z" fill="#5a0f1a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round"/>
      <path d="M262 64 Q270 60 278 64 L276 70 L264 70Z" fill="#c4384a"/>
      <path d="M261 60 L263 66 L265 59.4 M279 60 L277 66 L275 59.4 M266 59.2 L267 62 L268 59.6 M272 59.6 L273 62 L274 59.2" fill="#f1ece0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.4" stroke-linejoin="round"/>
      <path d="M264 70 L265.6 66 L267 70 M273 70 L274.4 66 L276 70" fill="#f1ece0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.4" stroke-linejoin="round"/>
    </g></g></g>
  </g></g>
  <!-- the moor in front, a path winding up -->
  <path d="M0 98 C40 92 90 96 130 102 C160 106 190 108 220 112 V140 H0Z" fill="var(--lg-near, #7e70a8)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
