<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <!-- The Event Horizon: a starfield and nebula, a black hole with its glowing disc, a wrecked station, the Devourer's eye. -->
  <rect width="400" height="140" fill="#0e0b1c"/>
  <!-- nebula -->
  <g opacity="0.55">
    <ellipse cx="120" cy="60" rx="110" ry="36" fill="var(--lg-deep, #7c4def)" opacity="0.5"/>
    <ellipse cx="300" cy="80" rx="100" ry="30" fill="#2ef2ff" opacity="0.2"/>
    <ellipse cx="160" cy="70" rx="60" ry="18" fill="#ff3fd2" opacity="0.25"/>
  </g>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="20" cy="20" r="1"/><circle cx="60" cy="40" r="0.8"/><circle cx="90" cy="14" r="1.2"/><circle cx="150" cy="30" r="0.8"/><circle cx="210" cy="16" r="1"/><circle cx="250" cy="44" r="0.8"/><circle cx="320" cy="20" r="1.2"/><circle cx="370" cy="36" r="0.9"/><circle cx="36" cy="100" r="0.8"/><circle cx="130" cy="112" r="1"/><circle cx="240" cy="120" r="0.8"/><circle cx="350" cy="110" r="1"/><circle cx="390" cy="80" r="0.8"/>
  </g>
  <g fill="#fff">
    <path style="transform-box:fill-box;transform-origin:center" d="M280 60 l1 3 l3 1 l-3 1 l-1 3 l-1 -3 l-3 -1 l3 -1Z"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.4;1" dur="1.6s" repeatCount="indefinite" additive="sum"/></path>
  </g>
  <!-- the Devourer's eye in the nebula -->
  <g>
    <ellipse cx="110" cy="62" rx="26" ry="14" fill="var(--lg-deep, #7c4def)" opacity="0.6"/>
    <ellipse cx="110" cy="62" rx="18" ry="9" fill="#f4eefc" opacity="0.9"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="-4 0;4 0;-4 0" dur="5s" repeatCount="indefinite"/>
      <circle cx="110" cy="62" r="7" fill="#b44bff"/><ellipse cx="110" cy="62" rx="1.6" ry="6" fill="#0f0a1c"/></g>
  </g>
  <!-- ringed planet -->
  <circle cx="350" cy="44" r="16" fill="var(--lg-accent, #f2b441)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"/>
  <path d="M338 38 C346 34 358 36 364 42" fill="none" stroke="#000" stroke-width="2" opacity="0.2"/>
  <ellipse cx="350" cy="46" rx="28" ry="6" fill="none" stroke="var(--lg-light, #ffffff)" stroke-width="2" opacity="0.7" transform="rotate(-12 350 46)"/>
  <!-- the black hole with its turning disc -->
  <g transform="translate(230 74)">
    <g transform="scale(1 0.34)">
      <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/>
        <circle r="48" fill="none" stroke="#ff9f1a" stroke-width="10" stroke-dasharray="30 8" opacity="0.8"/>
        <circle r="38" fill="none" stroke="#ffe066" stroke-width="6" stroke-dasharray="18 6"/>
      </g>
    </g>
    <circle r="20" fill="#000" stroke="#ff9f1a" stroke-width="2"/>
    <circle r="24" fill="none" stroke="#ffe066" stroke-width="1" opacity="0.5"/>
  </g>
  <!-- the wrecked station, tumbling -->
  <g>
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 320 104;8 320 104;0 320 104" dur="6s" repeatCount="indefinite"/>
    <g stroke="var(--lg-ink, #1d2230)" stroke-width="1" fill="#8d929e">
      <rect x="302" y="98" width="36" height="12" rx="2"/><rect x="286" y="92" width="14" height="24" fill="#2d86c9"/><rect x="340" y="92" width="10" height="24" fill="#2d86c9"/>
    </g>
    <g stroke="#1d2230" stroke-width="0.5"><path d="M286 100 H300 M286 108 H300 M340 100 H350 M340 108 H350"/></g>
    <path d="M338 98 L346 90 L344 98Z" fill="#ff7a1a"/>
  </g>
  <!-- asteroids drifting -->
  <g fill="var(--lg-far, #b4b8c2)" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8">
    <polygon points="40,70 48,66 54,72 50,80 42,78"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;30 10;0 0" dur="12s" repeatCount="indefinite"/></polygon>
    <polygon points="170,110 176,106 182,110 178,116"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-20 -6;0 0" dur="10s" repeatCount="indefinite"/></polygon>
  </g>
  <!-- stardust tendrils reaching from the eye -->
  <g fill="none" stroke="#c9a2ff" stroke-width="1.4" stroke-dasharray="1 4" stroke-linecap="round" opacity="0.8">
    <path d="M130 70 C150 90 170 96 200 90"/><path d="M92 70 C80 90 60 100 30 104"/>
  </g>
</svg>
