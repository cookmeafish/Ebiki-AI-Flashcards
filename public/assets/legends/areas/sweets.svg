<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <!-- The Candy Wastes: melting candy mountains, a chocolate river, lollipop trees, a gingerbread fortress with broken
       walls, the Colossus glaring over them. -->
  <rect width="400" height="140" fill="var(--lg-sky, #ffe0ef)"/>
  <!-- melting candy mountains -->
  <path d="M0 96 L30 50 L50 64 L80 34 L110 70 L130 96Z" fill="#ff9ec8"/>
  <path d="M30 50 L40 58 L38 66 L46 62 L50 64 L80 34 L92 48 L88 56 L96 54 L100 58 L86 44Z" fill="#fff" opacity="0.8"/>
  <path d="M280 96 L310 56 L330 70 L360 40 L400 76 V96Z" fill="#b8a0ff"/>
  <path d="M310 56 L318 64 L316 72 L324 66 L330 70 L360 40 L372 52 L370 60 L378 58 L364 44Z" fill="#fff" opacity="0.8"/>
  <!-- the gingerbread fortress -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round">
    <path d="M140 112 V56 H152 V48 H160 V56 H172 V48 H180 V56 H220 V48 H228 V56 H240 V48 H248 V56 H260 V112Z" fill="#b5652b"/>
    <!-- broken wall chunk -->
    <path d="M240 56 L248 48 H260 V74 L250 70 L246 60Z" fill="var(--lg-sky, #ffe0ef)"/>
    <path d="M140 60 H260" fill="none" stroke="#fff" stroke-width="2.4" stroke-dasharray="5 2"/>
    <g fill="#ff3fd2"><circle cx="152" cy="70" r="3"/><circle cx="248" cy="80" r="3" fill="#2ec4b6"/><circle cx="160" cy="96" r="3" fill="#ffd23f"/></g>
  </g>
  <!-- the Colossus rising behind the gate: candy-cane horns, red gumdrop eyes, cookie teeth -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round">
    <path d="M172 60 C172 40 184 30 200 30 C216 30 228 40 228 60Z" fill="#b5652b"/>
    <path d="M176 44 C180 34 192 30 200 30 C208 30 220 34 224 44" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 2"/>
  </g>
  <g stroke-linecap="round" fill="none">
    <path d="M180 36 C172 28 172 18 180 18 C185 18 185 24 182 24" stroke="#fff" stroke-width="4"/>
    <path d="M180 36 C172 28 172 18 180 18 C185 18 185 24 182 24" stroke="#e0233e" stroke-width="4" stroke-dasharray="3 3"/>
    <path d="M220 36 C228 28 228 18 220 18 C215 18 215 24 218 24" stroke="#fff" stroke-width="4"/>
    <path d="M220 36 C228 28 228 18 220 18 C215 18 215 24 218 24" stroke="#e0233e" stroke-width="4" stroke-dasharray="3 3"/>
  </g>
  <path d="M180 42 L194 47 M220 42 L206 47" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <g fill="#e0233e" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"><path d="M184 52 C184 45 194 45 194 52Z"/><path d="M206 52 C206 45 216 45 216 52Z"/></g>
  <g fill="#ffe36b"><circle style="transform-box:fill-box;transform-origin:center" cx="189" cy="50" r="1.4"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.4;1" dur="1.2s" repeatCount="indefinite" additive="sum"/></circle><circle cx="211" cy="50" r="1.4"/></g>
  <!-- the gate with a cookie-tooth arch -->
  <path d="M184 112 V80 C184 66 216 66 216 80 V112Z" fill="#3a1206" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4"/>
  <g fill="#f4e6c8" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"><polygon points="188,76 191,84 194,74"/><polygon points="197,70 200,80 203,70"/><polygon points="206,74 209,84 212,76"/></g>
  <!-- lollipop trees -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1">
    <rect x="44" y="76" width="3" height="36" fill="#fff"/><circle cx="45.5" cy="72" r="12" fill="#ff5a8a"/>
    <path d="M45.5 72 m-8 0 a8 8 0 1 1 8 8 a5 5 0 1 1 -5 -5" fill="none" stroke="#fff" stroke-width="2"/>
    <rect x="344" y="80" width="3" height="32" fill="#fff"/><circle cx="345.5" cy="76" r="11" fill="#6ff3ff"/>
    <path d="M345.5 76 m-7 0 a7 7 0 1 1 7 7 a4 4 0 1 1 -4 -4" fill="none" stroke="#fff" stroke-width="2"/>
    <rect x="110" y="88" width="2.4" height="24" fill="#fff"/><circle cx="111" cy="85" r="8" fill="#ffd23f"/>
  </g>
  <!-- the chocolate river -->
  <path d="M0 112 H400 V140 H0Z" fill="var(--lg-near, #ffb7d5)"/>
  <path d="M0 120 C60 114 120 126 200 120 C280 114 340 126 400 120 V132 C340 138 280 126 200 132 C120 138 60 126 0 132Z" fill="#6b3a1a"/>
  <g fill="none" stroke="#a8683a" stroke-width="1.4" stroke-linecap="round">
    <path d="M30 124 C40 122 50 126 60 124 M170 126 C180 124 190 128 200 126 M320 124 C330 122 340 126 350 124"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;16 0;0 0" dur="6s" repeatCount="indefinite" keyTimes="0;.5;1"/></path>
  </g>
  <!-- melting drips off the mountains -->
  <g fill="#ff9ec8"><path d="M20 96 C20 104 24 106 24 100 V96Z" style="transform-box:fill-box;transform-origin:center top"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1.3;1 1" dur="2.6s" repeatCount="indefinite"/></path></g>
  <g fill="#b8a0ff"><path d="M380 96 C380 104 384 106 384 100 V96Z" style="transform-box:fill-box;transform-origin:center top"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1.3;1 1" dur="3s" repeatCount="indefinite"/></path></g>
  <!-- gumdrops and a candy wrapper on the ground -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="0.7"><path d="M76 116 C76 110 86 110 86 116Z" fill="#2ec4b6"/><path d="M290 116 C290 110 300 110 300 116Z" fill="#ff3fd2"/><path d="M130 116 C130 110 138 110 138 116Z" fill="#ffd23f"/></g>
  <!-- sprinkles falling -->
  <g stroke-width="2" stroke-linecap="round">
    <path style="transform-box:fill-box;transform-origin:center" d="M150 10 l3 3" stroke="#ff3fd2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 50" dur="3s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="3s" repeatCount="indefinite" additive="sum"/></path>
    <path style="transform-box:fill-box;transform-origin:center" d="M270 14 l-3 3" stroke="#2ec4b6"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 50" dur="3.4s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="3.4s" repeatCount="indefinite" additive="sum"/></path>
    <path style="transform-box:fill-box;transform-origin:center" d="M60 20 l2 3" stroke="#ffd23f"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 50" dur="2.8s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.8s" repeatCount="indefinite" additive="sum"/></path>
  </g>
</svg>
