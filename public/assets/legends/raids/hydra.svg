<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Tide Hydra. Phase 1: one head rises from the swell. Phase 2: two more heads burst up. Phase 3: every head
       burns with sea-fire and the body cracks open. Rises out of a whirlpool on the entrance. -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="translate" values="0 70;0 70;0 -6;0 0" keyTimes="0;.3;.8;1" dur="1.6s" fill="freeze"/>
    <!-- whirlpool -->
    <g fill="none" stroke="var(--lg-light, #bfe8ff)" stroke-width="1.4" stroke-linecap="round" opacity="0.7" style="transform-box:fill-box;transform-origin:center">
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
      <path d="M30 104 C40 96 80 96 90 104"/><path d="M38 110 C50 104 72 104 84 110"/><path d="M24 98 C44 90 78 90 98 98"/>
    </g>
    <path d="M8 112 C24 100 44 106 60 100 C76 106 96 100 112 112 V120 H8Z" fill="var(--lg-deep, #1d4e89)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M8 112 C24 104 44 110 60 104 C76 110 96 104 112 112" fill="none" stroke="#dff6ff" stroke-width="1" opacity="0.6"/>
    <!-- body -->
    <path d="M34 110 C30 88 38 72 60 70 C82 72 90 88 86 110Z" fill="var(--lg-near, #2f7fb3)" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M34 110 C32 94 36 82 46 76 C42 90 44 102 48 110Z" fill="#000" opacity="0.25"/>
    <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7" opacity="0.55">
      <path d="M46 84 q4 3 8 0 q4 3 8 0 q4 3 8 0"/><path d="M42 94 q4 3 8 0 q4 3 8 0 q4 3 8 0 q4 3 8 0"/><path d="M44 104 q4 3 8 0 q4 3 8 0 q4 3 8 0 q4 3 8 0"/>
    </g>
    <path d="M54 76 L60 70 L66 76 L60 82Z" fill="#7ef7ff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
    <!-- phase 3: the body cracks, sea-fire inside -->
    <g class="lg-p3" style="display:none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round">
      <path d="M50 108 L54 96 L50 88 L56 80" fill="none" stroke="#39f0ff" stroke-width="2.2"/>
      <path d="M70 108 L66 98 L72 90 L66 82" fill="none" stroke="#39f0ff" stroke-width="2.2"/>
      <path d="M50 108 L54 96 L50 88 L56 80" fill="none" stroke="#fff" stroke-width="0.8"/>
      <path d="M70 108 L66 98 L72 90 L66 82" fill="none" stroke="#fff" stroke-width="0.8"/>
    </g>

    <!-- side heads: phase 2 -->
    <g class="lg-p2" style="display:none">
      <g>
        <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 40 80;-6 40 80;0 40 80" dur="2.2s" repeatCount="indefinite"/>
        <path d="M44 82 C34 70 24 58 20 44 C18 36 26 32 30 38 C34 50 42 64 50 76Z" fill="var(--lg-near, #2f7fb3)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M12 38 C12 28 22 24 30 28 L34 38 C28 44 18 46 12 38Z" fill="var(--lg-near, #2f7fb3)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12 38 L14 42 L17 38 L20 43 L23 39 L26 44 L30 40" fill="#fff4e0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round"/>
        <path d="M20 30 L26 32" stroke="#ff3b3b" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M22 26 L16 16 L26 24Z M30 28 L32 16 L34 28Z" fill="#e6f3ff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round"/>
      </g>
      <g>
        <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 80 80;6 80 80;0 80 80" dur="2.5s" repeatCount="indefinite"/>
        <path d="M76 82 C86 70 96 58 100 44 C102 36 94 32 90 38 C86 50 78 64 70 76Z" fill="var(--lg-near, #2f7fb3)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M108 38 C108 28 98 24 90 28 L86 38 C92 44 102 46 108 38Z" fill="var(--lg-near, #2f7fb3)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M108 38 L106 42 L103 38 L100 43 L97 39 L94 44 L90 40" fill="#fff4e0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round"/>
        <path d="M100 30 L94 32" stroke="#ff3b3b" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M98 26 L104 16 L94 24Z M90 28 L88 16 L86 28Z" fill="#e6f3ff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round"/>
      </g>
    </g>
    <!-- phase 3: sea-fire on every head -->
    <g class="lg-p3" style="display:none" fill="#39f0ff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round" opacity="0.9">
      <path d="M16 18 C14 10 20 6 22 2 C24 8 28 10 26 18Z" style="transform-box:fill-box;transform-origin:center bottom"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1.25;1 1" dur="0.5s" repeatCount="indefinite"/></path>
      <path d="M94 18 C92 10 98 6 100 2 C102 8 106 10 104 18Z" style="transform-box:fill-box;transform-origin:center bottom"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1.3;1 1" dur="0.6s" repeatCount="indefinite"/></path>
      <path d="M54 12 C52 4 58 0 60 -4 C62 2 66 4 64 12Z" style="transform-box:fill-box;transform-origin:center bottom"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1.3;1 1" dur="0.45s" repeatCount="indefinite"/></path>
    </g>

    <!-- main head -->
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="2.8s" repeatCount="indefinite"/>
      <path d="M52 74 C50 58 52 44 56 34 L64 34 C68 44 70 58 68 74Z" fill="var(--lg-near, #2f7fb3)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M52 74 C51 60 52 48 55 38 L58 38 C56 50 56 62 57 74Z" fill="#000" opacity="0.22"/>
      <path d="M40 30 C40 18 50 12 60 12 C70 12 80 18 80 30 C80 38 72 42 60 42 C48 42 40 38 40 30Z" fill="var(--lg-near, #2f7fb3)" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
      <path d="M44 22 C48 16 56 14 62 14 C54 18 48 22 46 28Z" fill="#fff" opacity="0.25"/>
      <!-- crest fins -->
      <path d="M46 16 L40 4 L52 12Z M56 12 L58 0 L62 12Z M68 12 L78 2 L74 16Z" fill="#e6f3ff" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
      <!-- eyes -->
      <path d="M46 24 L54 26 L46 29Z" fill="#ff3b3b" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
      <path d="M74 24 L66 26 L74 29Z" fill="#ff3b3b" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
      <g style="transform-box:fill-box;transform-origin:center">
        <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.1;1 0.1;1 1" keyTimes="0;.75;1" dur="1.6s" fill="freeze"/>
        <circle cx="49" cy="26.5" r="0.9" fill="#fff04a"/><circle cx="71" cy="26.5" r="0.9" fill="#fff04a"/>
      </g>
      <!-- jaw -->
      <g transform="rotate(10 60 34)"><g>
        <animateTransform class="lg-in" attributeName="transform" type="rotate" values="-10 60 34;-10 60 34;6 60 34;0 60 34" keyTimes="0;.7;.85;1" dur="1.6s" fill="freeze"/>
        <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 60 34;5 60 34;0 60 34" dur="1.4s" begin="1.6s" repeatCount="indefinite" additive="sum"/>
        <path d="M44 34 C48 44 72 44 76 34 C70 38 50 38 44 34Z" fill="#3a0d1d" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M46 35 L49 40 L52 36 L55 41 L58 37 L61 41 L64 37 L67 41 L70 36 L73 39 L75 35" fill="#fff4e0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round"/>
      </g></g>
      <path d="M44 32 L47 36 L50 33 L53 37 L56 34 L60 37 L64 34 L67 37 L70 33 L73 36 L76 32" fill="#fff4e0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round"/>
    </g>
    <!-- spray -->
    <g fill="#dff6ff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.4">
      <circle cx="30" cy="102" r="1.6" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-4 -14;0 0" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="92" cy="100" r="1.4" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;5 -12;0 0" dur="2.1s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
