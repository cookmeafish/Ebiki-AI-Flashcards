<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Forge Titan. Phase 1: a walking furnace in riveted plate, one visor slit. Phase 2: the plate cracks and
       magma shows through. Phase 3: the chest plate is gone, the molten core beats, the visor splits into a maw.
       Stamps down from above on the entrance, fists first. -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="translate" values="0 -130;0 -130;0 6;0 -3;0 0" keyTimes="0;.25;.6;.8;1" dur="1.5s" fill="freeze"/>
    <!-- anvil shadow -->
    <ellipse cx="60" cy="114" rx="40" ry="5" fill="#000" opacity="0.3"/>
    <!-- legs -->
    <path d="M40 92 L38 114 H52 L54 92Z M66 92 L68 114 H82 L80 92Z" fill="var(--lg-deep, #3b3f4a)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- torso -->
    <path d="M28 44 L36 32 H84 L92 44 L88 94 H32Z" fill="var(--lg-near, #6b7280)" stroke="var(--lg-ink, #1d2230)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M28 44 L36 32 H44 L40 94 H32Z" fill="#000" opacity="0.25"/>
    <path d="M78 34 H84 L90 44 L86 90 H82Z" fill="#fff" opacity="0.15"/>
    <g fill="#c9ced8" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5">
      <circle cx="38" cy="40" r="1.4"/><circle cx="82" cy="40" r="1.4"/><circle cx="36" cy="88" r="1.4"/><circle cx="84" cy="88" r="1.4"/><circle cx="60" cy="90" r="1.4"/>
    </g>
    <!-- chest plate (phase 1 and 2) -->
    <g class="lg-p12">
      <path d="M44 48 H76 L72 78 H48Z" fill="var(--lg-far, #9aa3b2)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M52 54 H68 M50 62 H70 M52 70 H68" stroke="var(--lg-ink, #1d2230)" stroke-width="1" opacity="0.5"/>
      <circle cx="60" cy="62" r="4" fill="#ff7a1a" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
    </g>
    <!-- phase 2: magma cracks -->
    <g class="lg-p2" style="display:none" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M36 50 L44 58 L40 66 L46 74" stroke="#ff5a1f" stroke-width="2.4"/>
      <path d="M84 52 L78 60 L82 70 L76 80" stroke="#ff5a1f" stroke-width="2.4"/>
      <path d="M36 50 L44 58 L40 66 L46 74 M84 52 L78 60 L82 70 L76 80" stroke="#ffe066" stroke-width="0.8"/>
    </g>
    <!-- phase 3: the molten core -->
    <g class="lg-p3" style="display:none">
      <path d="M44 48 H76 L72 78 H48Z" fill="#2a0f07" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="60" cy="63" r="15" fill="#ff5a1f" opacity="0.35" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.2;1" dur="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="63" r="9" fill="#ff7a1a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.12;1" dur="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="63" r="4.5" fill="#ffe066"/>
      <path d="M48 50 L54 56 M72 50 L66 56 M48 76 L54 70 M72 76 L66 70" stroke="#ffb627" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <!-- shoulders with vents -->
    <path d="M18 40 C18 30 30 26 38 32 L36 50 C28 52 18 50 18 40Z M102 40 C102 30 90 26 82 32 L84 50 C92 52 102 50 102 40Z" fill="var(--lg-deep, #3b3f4a)" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
    <g fill="#2a0f07"><rect x="22" y="36" width="10" height="2"/><rect x="22" y="41" width="10" height="2"/><rect x="88" y="36" width="10" height="2"/><rect x="88" y="41" width="10" height="2"/></g>
    <!-- smoke from the vents -->
    <g fill="#8a8f99" stroke="var(--lg-ink, #1d2230)" stroke-width="0.4" opacity="0.8">
      <circle cx="26" cy="28" r="3.5" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-6 -18" dur="2.2s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.2s" repeatCount="indefinite" additive="sum"/></circle>
      <circle cx="94" cy="28" r="3.5" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;6 -18" dur="2.6s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.6s" repeatCount="indefinite" additive="sum"/></circle>
    </g>
    <!-- arms and hammer fists -->
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 24 46;-5 24 46;0 24 46" dur="1.9s" repeatCount="indefinite"/>
      <path d="M18 48 L12 76 L22 78 L28 50Z" fill="var(--lg-near, #6b7280)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
      <rect x="6" y="76" width="22" height="16" rx="3" fill="var(--lg-deep, #3b3f4a)" stroke="var(--lg-ink, #1d2230)" stroke-width="2"/>
      <path d="M10 80 H24 M10 86 H24" stroke="#c9ced8" stroke-width="0.8"/>
    </g>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 96 46;5 96 46;0 96 46" dur="2.1s" repeatCount="indefinite"/>
      <path d="M102 48 L108 76 L98 78 L92 50Z" fill="var(--lg-near, #6b7280)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
      <rect x="92" y="76" width="22" height="16" rx="3" fill="var(--lg-deep, #3b3f4a)" stroke="var(--lg-ink, #1d2230)" stroke-width="2"/>
      <path d="M96 80 H110 M96 86 H110" stroke="#c9ced8" stroke-width="0.8"/>
    </g>
    <!-- helm -->
    <path d="M42 30 C42 14 50 8 60 8 C70 8 78 14 78 30 L74 36 H46Z" fill="var(--lg-deep, #3b3f4a)" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M46 14 L40 4 L50 10Z M74 14 L80 4 L70 10Z" fill="#c9ced8" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
    <path d="M48 12 C52 10 56 9 60 9 C54 12 50 16 49 22Z" fill="#fff" opacity="0.2"/>
    <!-- visor: phase 1-2 one slit, phase 3 a burning maw -->
    <g class="lg-p12">
      <rect x="47" y="21" width="26" height="4" rx="1" fill="#1a0a05" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
      <rect x="49" y="22" width="22" height="2" fill="#ff7a1a" style="transform-box:fill-box;transform-origin:center">
        <animateTransform class="lg-in" attributeName="transform" type="scale" values="0 1;0 1;1 1" keyTimes="0;.7;1" dur="1.5s" fill="freeze"/>
        <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1;1 0.2;1 1" keyTimes="0;.85;.9;1" dur="3.4s" begin="1.5s" repeatCount="indefinite" additive="sum"/>
      </rect>
    </g>
    <g class="lg-p3" style="display:none">
      <path d="M46 20 L74 20 L70 32 L50 32Z" fill="#1a0a05" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
      <path d="M48 21 L51 25 L54 21 L57 25 L60 21 L63 25 L66 21 L69 25 L72 21" fill="none" stroke="#fff4e0" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M51 31 L54 27 L57 31 L60 27 L63 31 L66 27 L69 31" fill="none" stroke="#fff4e0" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="53" cy="17" r="2" fill="#ffe066"/><circle cx="67" cy="17" r="2" fill="#ffe066"/>
    </g>
    <!-- sparks -->
    <g fill="#ffd166">
      <circle cx="30" cy="96" r="1.2" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-8 -10" dur="1.1s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1.1s" repeatCount="indefinite" additive="sum"/></circle>
      <circle cx="90" cy="96" r="1.2" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;8 -12" dur="1.3s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1.3s" repeatCount="indefinite" additive="sum"/></circle>
    </g>
  </g>
</svg>
