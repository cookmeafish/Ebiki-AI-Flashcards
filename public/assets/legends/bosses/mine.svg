<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Deep Delver: a giant mole-worm miner. A spinning drill snout ringed with teeth, lantern eyes on a miner's
       helmet, rock-crusher claws, a hide studded with glowing gems. -->
  <!-- the hole it burst out of -->
  <ellipse cx="60" cy="114" rx="54" ry="10" fill="#1a1208" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6"/>
  <g fill="#8a6a44" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round">
    <polygon points="4,112 10,100 18,108"/><polygon points="102,108 110,98 116,112"/><polygon points="20,118 26,108 32,116"/><polygon points="88,116 94,106 100,118"/>
  </g>
  <!-- the body, segmented, rising from the hole -->
  <path d="M30 116 C26 90 30 64 40 48 H80 C90 64 94 90 90 116Z" fill="#6b5040" stroke="var(--lg-ink, #1d2230)" stroke-width="2"/>
  <path d="M34 110 C32 90 34 70 42 56 C40 74 40 92 42 112Z" fill="#fff" opacity="0.14"/>
  <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" opacity="0.7"><path d="M34 70 C46 76 74 76 86 70 M31 90 C46 96 74 96 89 90"/></g>
  <!-- gems studded in the hide, glinting -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="0.7">
    <polygon points="40,80 44,76 48,80 44,86" fill="#6ff3ff"/><polygon points="74,100 78,96 82,100 78,106" fill="#ff3fd2"/><polygon points="80,78 83,75 86,78 83,82" fill="#9cff57"/><polygon points="38,100 41,97 44,100 41,104" fill="#ffd23f"/>
  </g>
  <g fill="#fff"><circle style="transform-box:fill-box;transform-origin:center" cx="43" cy="79" r="0.9"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;2;1" dur="1.4s" repeatCount="indefinite" additive="sum"/></circle></g>
  <!-- rock-crusher claws -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round">
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 32 84;-8 32 84;0 32 84" dur="1.8s" repeatCount="indefinite"/>
      <path d="M34 80 C22 80 12 86 8 96 L20 94 L14 104 L24 98 L22 108 L34 94Z" fill="#8a7060"/>
      <path d="M8 96 L4 100 M14 104 L12 110 M22 108 L22 114" stroke="#e8dcc0" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 88 84;8 88 84;0 88 84" dur="1.8s" repeatCount="indefinite"/>
      <path d="M86 80 C98 80 108 86 112 96 L100 94 L106 104 L96 98 L98 108 L86 94Z" fill="#8a7060"/>
      <path d="M112 96 L116 100 M106 104 L108 110 M98 108 L98 114" stroke="#e8dcc0" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </g>
  <!-- the head with a battered miner's helmet -->
  <path d="M36 50 C36 34 46 26 60 26 C74 26 84 34 84 50 C84 58 74 62 60 62 C46 62 36 58 36 50Z" fill="#6b5040" stroke="var(--lg-ink, #1d2230)" stroke-width="2"/>
  <path d="M36 36 C36 20 46 12 60 12 C74 12 84 20 84 36 C74 32 46 32 36 36Z" fill="#e0a13a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8"/>
  <path d="M40 32 C42 22 50 16 58 15 C50 20 46 26 46 32Z" fill="#fff" opacity="0.3"/>
  <path d="M32 36 C40 32 80 32 88 36 L86 40 C78 36 42 36 34 40Z" fill="#c07a1a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"/>
  <path d="M68 16 L72 24 M70 14 L66 20" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9"/>
  <!-- the helmet lamp -->
  <rect x="54" y="16" width="12" height="10" rx="2" fill="#5a5f6a" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
  <g transform="translate(60 21)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="0;0;1.8;1" keyTimes="0;.72;.85;1" dur="1.5s" fill="freeze"/>
    <circle r="9" fill="#fff6a8" opacity="0.35"/><circle r="3.6" fill="#fff6a8"/><circle r="1.6" fill="#fff"/>
  </g></g>
  <!-- tiny lantern eyes under the brim, lighting up -->
  <g transform="translate(46 44)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="0;0;1.6;1" keyTimes="0;.76;.88;1" dur="1.5s" fill="freeze"/>
    <circle r="3.4" fill="#ff7a1a" opacity="0.5"/><circle r="1.8" fill="#ffd23f"/></g></g>
  <g transform="translate(74 44)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="0;0;1.6;1" keyTimes="0;.78;.9;1" dur="1.5s" fill="freeze"/>
    <circle r="3.4" fill="#ff7a1a" opacity="0.5"/><circle r="1.8" fill="#ffd23f"/></g></g>
  <path d="M40 40 L52 44 M80 40 L68 44" stroke="var(--lg-ink, #1d2230)" stroke-width="2.4" stroke-linecap="round"/>
  <!-- the drill snout: a ring of teeth around a spinning bit -->
  <g transform="translate(60 56)">
    <circle r="13" fill="#3a2418" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6"/>
    <g fill="#f4efe0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round">
      <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;-360" dur="3s" repeatCount="indefinite"/>
        <polygon points="0,-13 2,-8 -2,-8"/><polygon points="9,-9 5,-5 7,-4"/><polygon points="13,0 8,2 8,-2"/><polygon points="9,9 4,7 5,5"/><polygon points="0,13 -2,8 2,8"/><polygon points="-9,9 -5,5 -7,4"/><polygon points="-13,0 -8,-2 -8,2"/><polygon points="-9,-9 -4,-7 -5,-5"/>
      </g>
    </g>
    <!-- the bit: spins up on the entrance, then keeps spinning -->
    <g>
      <animateTransform class="lg-in" attributeName="transform" type="rotate" values="0;1080" dur="1.5s" fill="freeze"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="0.5s" begin="1.5s" repeatCount="indefinite"/>
        <path d="M0 -8 L6 4 L-6 4Z" fill="#c9ccd6" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round"/>
        <path d="M0 -8 L2 0 L-4 2 Z" fill="#fff" opacity="0.5"/>
        <path d="M-4 -2 L4 -2 M-5 1 L5 1" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7"/>
      </g>
    </g>
  </g>
  <!-- rubble spraying out of the hole on the entrance -->
  <g fill="#8a6a44" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6">
    <g transform="translate(-26 -10)"><g><animateTransform class="lg-in" attributeName="transform" type="translate" values="26 10;26 10;6 -30;0 0" keyTimes="0;.3;.6;1" dur="1.5s" fill="freeze"/><rect x="44" y="106" width="4" height="4"/></g></g>
    <g transform="translate(30 -14)"><g><animateTransform class="lg-in" attributeName="transform" type="translate" values="-30 14;-30 14;-8 -30;0 0" keyTimes="0;.3;.6;1" dur="1.5s" fill="freeze"/><rect x="72" y="106" width="5" height="4"/></g></g>
    <g transform="translate(6 -20)"><g><animateTransform class="lg-in" attributeName="transform" type="translate" values="-6 20;-6 20;-2 -36;0 0" keyTimes="0;.3;.6;1" dur="1.5s" fill="freeze"/><polygon points="58,108 62,106 64,110"/></g></g>
  </g>
  <!-- dust drifting from the ceiling -->
  <g fill="#c8a878" opacity="0.7">
    <circle style="transform-box:fill-box;transform-origin:center" cx="18" cy="6" r="1.2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 30" dur="2.2s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.2s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="100" cy="4" r="1.2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 30" dur="2.6s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.6s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
</svg>
