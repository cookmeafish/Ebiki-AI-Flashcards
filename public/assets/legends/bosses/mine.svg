  <path d="M41 94 C52 91 68 91 79 94 M40.6 104 C52 101 68 101 79.4 104 M40.3 114 C52 111 68 111 79.7 114" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9"/>
