  <path d="M33 38 C33 18 46 6 60 6 C74 6 87 18 87 38 Z" fill="#e0a13a" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M38 34 C39 22 48 12 58 10 C50 16 45 24 44 34Z" fill="#fff" opacity="0.35"/>
  <path d="M74 12 C82 18 86 26 86 36 L80 36 C80 26 78 18 74 12Z" fill="#000" opacity="0.2"/>
  <path d="M70 12 L74 20 L70 22 M44 18 L48 22" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9"/>
  <path d="M60 6 V14" stroke="#c07a1a" stroke-width="3"/>
