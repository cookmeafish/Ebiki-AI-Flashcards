      </g>
      <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="15;375" dur="2.2s" repeatCount="indefinite"/>
        <path d="M-1.4 -9 L0 -5 L1.4 -9Z"/><path d="M-1.4 -9 L0 -5 L1.4 -9Z" transform="rotate(45)"/><path d="M-1.4 -9 L0 -5 L1.4 -9Z" transform="rotate(90)"/><path d="M-1.4 -9 L0 -5 L1.4 -9Z" transform="rotate(135)"/><path d="M-1.4 -9 L0 -5 L1.4 -9Z" transform="rotate(180)"/><path d="M-1.4 -9 L0 -5 L1.4 -9Z" transform="rotate(225)"/><path d="M-1.4 -9 L0 -5 L1.4 -9Z" transform="rotate(270)"/><path d="M-1.4 -9 L0 -5 L1.4 -9Z" transform="rotate(315)"/>
      </g>
    </g>
