  <path d="M33 50 C33 40 38 32 46 28 C40 36 38 46 40 62Z" fill="#fff" opacity="0.18"/>
  <path d="M80 30 C88 36 90 44 90 52 C90 62 84 70 76 74 C82 66 84 56 84 48 C84 40 82 34 80 30Z" fill="#000" opacity="0.24"/>
  <path d="M30 56 l-5 1 l4 3 l-4 3 l6 0 M90 56 l5 1 l-4 3 l4 3 l-6 0" fill="var(--lg-deep, #6b5040)" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
