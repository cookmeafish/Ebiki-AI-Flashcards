<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Deep Delver: a giant mole-worm miner bursting through the rock face, seen from below. The shattered wall it
       drilled through rings it like a crown of shards, ore veins glowing; snapped mine timbers behind; gem crystals
       grow out of its shoulders; a battered miner's helmet whose brim bends into one V over caged lantern eyes; a
       round maw of rotating fangs around a spinning drill bit; rock-crusher claws in riveted plates with huge talons.
       Entrance: rubble sprays out of the hole, the drill spins up, the lamp and the lantern eyes ignite. -->
  <!-- snapped mine timbers behind -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round">
    <path d="M-6 30 L44 4 L47 10 L-3 37Z" fill="#8a5a2b"/>
    <path d="M126 30 L76 4 L73 10 L123 37Z" fill="#8a5a2b"/>
    <path d="M-4 32.4 L44 7.6 M124 32.4 L76 7.6" stroke="#c48d58" stroke-width="0.8"/>
    <path d="M44 4 L49 2 L46 6 L50 7 L47 10Z M76 4 L71 2 L74 6 L70 7 L73 10Z" fill="#f4dcb0" stroke-width="0.8"/>
  </g>
  <!-- the rock face it burst through: a ring of shards, ore veins pulsing -->
  <g transform="translate(60 56)">
    <path d="M0 -62 L10 -50 L22 -60 L26 -44 L42 -48 L38 -34 L56 -32 L46 -18 L62 -10 L48 0 L60 14 L44 16 L50 32 L34 28 L30 44 L18 34 L8 50 L0 36 L-8 50 L-18 34 L-30 44 L-34 28 L-50 32 L-44 16 L-60 14 L-48 0 L-62 -10 L-46 -18 L-56 -32 L-38 -34 L-42 -48 L-26 -44 L-22 -60 L-10 -50Z" fill="var(--lg-far, #b08a5a)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M0 -62 L10 -50 L22 -60 L26 -44 L42 -48 L38 -34 L56 -32 L46 -18 L62 -10 L48 0 L34 -6 L36 -24 L20 -36 L0 -40 L-20 -36 L-36 -24 L-34 -6 L-48 0 L-62 -10 L-46 -18 L-56 -32 L-38 -34 L-42 -48 L-26 -44 L-22 -60 L-10 -50Z" fill="#fff" opacity="0.2"/>
    <path d="M-48 0 L-34 -6 L-30 20 L-44 16Z M48 0 L34 -6 L30 20 L44 16Z" fill="#000" opacity="0.25"/>
    <path d="M10 -50 L6 -40 M26 -44 L20 -36 M38 -34 L32 -26 M-10 -50 L-6 -40 M-26 -44 L-20 -36 M-38 -34 L-32 -26 M46 -18 L38 -14 M-46 -18 L-38 -14" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.02;1" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-52 -26 L-44 -22 L-46 -14 L-40 -10 M50 -24 L42 -20 L44 -12 M-12 -48 L-11 -44 L-14 -41 M30 -50 L28 -42 M-52 20 L-46 22 L-42 28 M52 22 L46 24" fill="none" stroke="#ffb627" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
      <path d="M-52 -26 L-44 -22 L-46 -14 L-40 -10 M50 -24 L42 -20 L44 -12 M-12 -48 L-11 -44 L-14 -41 M30 -50 L28 -42 M-52 20 L-46 22 L-42 28 M52 22 L46 24" fill="none" stroke="#ffe08a" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
