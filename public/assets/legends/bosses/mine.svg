    <path d="M34 76 C24 74 14 80 8 90 L4 102 L16 104 L28 96 C34 90 36 82 34 76Z" fill="var(--lg-deep, #6b5040)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
