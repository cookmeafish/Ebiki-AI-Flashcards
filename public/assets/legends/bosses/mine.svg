    <g transform="translate(30 66) rotate(-34) scale(1.45)"><path d="M-4 0 V-16 L0 -23 L4 -16 V0Z" fill="#6ff3ff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round"/><path d="M0 -23 L4 -16 V0 H0Z" fill="#000" opacity="0.22"/><path d="M-4 -16 L0 -23 L0 -16Z" fill="#fff" opacity="0.5"/><path d="M-2 -2 V-15" stroke="#fff" stroke-width="0.8" opacity="0.9"/></g>
    <g transform="translate(37 62) rotate(-12) scale(1.05)"><path d="M-4 0 V-16 L0 -23 L4 -16 V0Z" fill="#3fc8e0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round"/><path d="M0 -23 L4 -16 V0 H0Z" fill="#000" opacity="0.22"/><path d="M-4 -16 L0 -23 L0 -16Z" fill="#fff" opacity="0.5"/><path d="M-2 -2 V-15" stroke="#fff" stroke-width="0.8" opacity="0.9"/></g>
    <g transform="translate(96 70) rotate(62) scale(1.0)"><path d="M-4 0 V-16 L0 -23 L4 -16 V0Z" fill="#9cff57" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round"/><path d="M0 -23 L4 -16 V0 H0Z" fill="#000" opacity="0.22"/><path d="M-4 -16 L0 -23 L0 -16Z" fill="#fff" opacity="0.5"/><path d="M-2 -2 V-15" stroke="#fff" stroke-width="0.8" opacity="0.9"/></g>
