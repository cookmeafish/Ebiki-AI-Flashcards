<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Tyrant Rex: a scarred giant tyrannosaur leaning in head first. A huge roaring jaw, tiny angry arms, an armored
       brow, a battle-scarred hide, a broken tooth. The roar shakes the ground. -->
  <!-- ferns behind -->
  <g fill="var(--lg-near, #5fb57a)" opacity="0.55">
    <path d="M0 120 C4 96 12 80 24 70 C20 86 18 100 20 120Z"/><path d="M120 120 C116 96 108 80 96 70 C100 86 102 100 100 120Z"/>
  </g>
  <!-- the body and a thick leg -->
  <path d="M60 120 C62 100 74 84 92 80 C108 78 118 88 120 100 V120Z" fill="#4f7a3a" stroke="var(--lg-ink, #1d2230)" stroke-width="2"/>
  <path d="M84 120 L86 104 C90 98 100 98 104 104 L108 120Z" fill="#3f6630" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6"/>
  <g fill="#f4efe0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"><path d="M86 120 L84 116 L88 118Z M94 120 L93 115 L97 118Z M102 120 L103 115 L106 119Z"/></g>
  <!-- back osteoderms -->
  <g fill="#2f5226" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"><polygon points="96,80 100,72 104,80"/><polygon points="106,84 111,77 114,86"/></g>
  <!-- the head, leaning in (loops a heavy breathing lean) -->
  <g>
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 90 90;-2 90 90;0 90 90" dur="2.6s" repeatCount="indefinite"/>
    <!-- neck -->
    <path d="M62 96 C64 78 74 64 86 60 L98 76 C90 82 80 92 76 104Z" fill="#4f7a3a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8"/>
    <!-- tiny angry arm -->
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 68 92;-18 68 92;0 68 92" dur="0.5s" repeatCount="indefinite"/>
      <path d="M68 92 L58 96 L56 102" fill="none" stroke="#3f6630" stroke-width="4" stroke-linecap="round"/>
      <path d="M56 102 L52 104 M56 102 L54 106" stroke="#f4efe0" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <!-- upper skull -->
    <path d="M100 58 C98 36 84 24 62 24 C40 24 18 30 8 40 C4 44 6 50 10 52 L20 56 C40 54 60 56 78 64 L98 76Z" fill="#5f8c46" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M14 42 C26 32 46 28 64 28 C48 32 34 38 24 48Z" fill="#fff" opacity="0.2"/>
    <!-- scars across the snout -->
    <path d="M30 32 L44 48 M36 30 L50 44 M40 36 L38 38 M46 40 L44 42" stroke="#8a2a1a" stroke-width="1.4" stroke-linecap="round"/>
    <!-- nostril -->
    <path d="M12 42 C14 40 18 40 18 42" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linecap="round"/>
    <!-- armored brow ridge -->
    <path d="M58 30 C66 24 80 24 88 32 L84 38 C78 32 68 32 60 36Z" fill="#3f6630" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4"/>
    <g fill="#2f5226" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7"><polygon points="66,28 68,22 71,27"/><polygon points="76,27 79,21 81,28"/></g>
    <!-- the eye: narrows on the lean-in -->
    <g transform="translate(72 38)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.1;1 0.1;1.3 1.4;1 1" keyTimes="0;.5;.7;1" dur="1.5s" fill="freeze"/>
      <path d="M-7 0 C-4 -4 4 -4 7 -1 C4 3 -4 4 -7 0Z" fill="#ffd23f" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
      <ellipse rx="0.9" ry="2.8" fill="#1a0508"/>
      <circle cx="-2" cy="-1" r="0.7" fill="#fff"/>
    </g></g>
    <!-- the gaping mouth -->
    <path d="M10 52 L20 56 C40 54 60 56 78 64 L84 72 C66 70 44 72 24 80 C16 74 12 64 10 52Z" fill="#5a0c12" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4"/>
    <path d="M30 72 C44 66 62 66 74 68 C60 70 44 72 30 76Z" fill="#c43a4a"/>
    <!-- upper teeth (one broken) -->
    <g fill="#f4efe0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7" stroke-linejoin="round">
      <polygon points="14,53 16,62 19,55"/><polygon points="21,56 24,66 27,56"/><polygon points="30,55 32,62 35,55"/><polygon points="38,55 41,66 44,55"/><polygon points="47,56 49,61 52,56.5"/><polygon points="55,57 58,66 61,58"/><polygon points="64,59 66,65 69,60.5"/>
    </g>
    <!-- lower jaw: drops open on the roar -->
    <g>
      <animateTransform class="lg-in" attributeName="transform" type="rotate" values="-14 84 72;-14 84 72;8 84 72;0 84 72" keyTimes="0;.62;.8;1" dur="1.5s" fill="freeze"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 84 72;4 84 72;0 84 72" dur="1.3s" begin="1.5s" repeatCount="indefinite"/>
        <path d="M24 80 C44 72 66 70 84 72 L94 82 C82 90 58 94 34 92 C26 90 22 86 24 80Z" fill="#5f8c46" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8"/>
        <path d="M34 90 C50 92 70 88 84 84" fill="none" stroke="#e8dcc0" stroke-width="1.2" opacity="0.7"/>
        <g fill="#f4efe0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7" stroke-linejoin="round">
          <polygon points="28,80 31,72 34,79"/><polygon points="38,78 41,69 44,77"/><polygon points="49,76 52,68 55,75"/><polygon points="60,74 63,67 66,74"/><polygon points="71,73 73,67 76,73"/>
        </g>
      </g>
    </g>
    <!-- drool strand -->
    <path style="transform-box:fill-box;transform-origin:center top" d="M44 66 C44 72 46 74 46 70" fill="none" stroke="#dff1ff" stroke-width="1" opacity="0.8"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1.3;1 1" dur="1.3s" repeatCount="indefinite"/></path>
  </g>
  <!-- the roar: shock rings out of the mouth -->
  <g fill="none" stroke="#fff6c2" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <g transform="translate(-8 0)"><g><animateTransform class="lg-in" attributeName="transform" type="translate" values="38 0;38 0;8 0;0 0" keyTimes="0;.7;.85;1" dur="1.5s" fill="freeze"/>
      <path d="M6 58 C2 62 2 70 6 74 M0 54 C-4 62 -4 72 0 78"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="4 0;-4 0;4 0" dur="1.2s" repeatCount="indefinite" keyTimes="0;.5;1"/></path>
    </g></g>
  </g>
  <!-- ground cracks and bouncing pebbles -->
  <path d="M40 120 L46 112 L44 106 M52 120 L56 114" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"/>
  <g fill="#8a6a44" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5">
    <rect x="30" y="112" width="3" height="3"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 -4;0 0;0 0" keyTimes="0;.2;.4;1" dur="1s" repeatCount="indefinite"/></rect>
    <rect x="48" y="114" width="2.4" height="2.4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 0;0 -5;0 0" keyTimes="0;.3;.5;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
</svg>
