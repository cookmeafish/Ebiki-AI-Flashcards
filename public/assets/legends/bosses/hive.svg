<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Hive Queen: a colossal wasp queen. Compound eyes, mandibles dripping honey, a jeweled carapace crown, four
       buzzing wings, a huge stinger. -->
  <!-- honeycomb behind -->
  <g fill="none" stroke="var(--lg-accent, #f2b441)" stroke-width="1.4" opacity="0.45">
    <path d="M10 20 l8 -5 l8 5 v9 l-8 5 l-8 -5Z M26 20 l8 -5 l8 5 v9 l-8 5 l-8 -5Z M18 34 l8 -5 l8 5 v9 l-8 5 l-8 -5Z M78 20 l8 -5 l8 5 v9 l-8 5 l-8 -5Z M94 20 l8 -5 l8 5 v9 l-8 5 l-8 -5Z M86 34 l8 -5 l8 5 v9 l-8 5 l-8 -5Z"/>
  </g>
  <!-- four wings, buzzing -->
  <g fill="#dff1ff" stroke="var(--lg-ink, #1d2230)" stroke-width="1" opacity="0.7">
    <path d="M44 56 C24 30 4 30 2 42 C2 54 24 60 44 60Z"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 44 58;-14 44 58;0 44 58" dur="0.12s" repeatCount="indefinite"/></path>
    <path d="M76 56 C96 30 116 30 118 42 C118 54 96 60 76 60Z"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 76 58;14 76 58;0 76 58" dur="0.12s" repeatCount="indefinite"/></path>
    <path d="M44 64 C28 70 12 80 14 90 C18 96 34 84 46 70Z"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 44 66;10 44 66;0 44 66" dur="0.14s" repeatCount="indefinite"/></path>
    <path d="M76 64 C92 70 108 80 106 90 C102 96 86 84 74 70Z"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 76 66;-10 76 66;0 76 66" dur="0.14s" repeatCount="indefinite"/></path>
  </g>
  <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" opacity="0.5"><path d="M40 58 C28 46 16 40 8 42 M80 58 C92 46 104 40 112 42"/></g>
  <!-- abdomen with the huge stinger, curling forward -->
  <g>
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 60 86;4 60 86;0 60 86;-4 60 86;0 60 86" dur="1.6s" repeatCount="indefinite"/>
    <path d="M42 86 C40 100 48 112 60 116 C72 112 80 100 78 86Z" fill="#ffd23f" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8"/>
    <g fill="#1d1b28"><path d="M42 92 C48 94 72 94 78 92 L77 98 C70 100 50 100 43 98Z"/><path d="M46 106 C52 108 68 108 74 106 L70 111 C64 113 56 113 50 111Z"/></g>
    <path d="M56 116 L60 120 L64 116" fill="#1d1b28" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
    <path d="M48 90 C46 98 48 106 54 112" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.4"/>
  </g>
  <!-- thorax -->
  <path d="M40 66 C40 58 50 54 60 54 C70 54 80 58 80 66 C80 78 70 86 60 86 C50 86 40 78 40 66Z" fill="#1d1b28" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8"/>
  <path d="M44 64 C46 58 52 56 58 56 C52 60 48 66 48 76Z" fill="#fff" opacity="0.18"/>
  <g fill="#ffd23f"><path d="M50 64 L60 60 L70 64 L66 70 H54Z"/></g>
  <!-- spiked legs -->
  <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 74 L28 80 L22 94 M76 74 L92 80 L98 94 M46 80 L36 92 L34 106 M74 80 L84 92 L86 106"/>
  </g>
  <g fill="none" stroke="#3a3340" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 74 L28 80 L22 94 M76 74 L92 80 L98 94 M46 80 L36 92 L34 106 M74 80 L84 92 L86 106"/>
  </g>
  <!-- head -->
  <path d="M42 38 C42 26 50 20 60 20 C70 20 78 26 78 38 C78 48 70 56 60 56 C50 56 42 48 42 38Z" fill="#ffd23f" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8"/>
  <path d="M46 34 C48 26 54 22 60 22 C54 28 50 34 50 44Z" fill="#fff" opacity="0.3"/>
  <!-- jeweled carapace crown -->
  <path d="M44 28 L46 16 L52 22 L56 10 L60 18 L64 10 L68 22 L74 16 L76 28 C70 24 50 24 44 28Z" fill="#c9a441" stroke="var(--lg-ink, #1d2230)" stroke-width="1.1" stroke-linejoin="round"/>
  <g fill="#ff3fd2" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5"><circle cx="56" cy="16" r="1.4"/><circle cx="64" cy="16" r="1.4"/><circle cx="60" cy="22" r="1.8" fill="#2ec4b6"/></g>
  <!-- antennae -->
  <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linecap="round">
    <path d="M50 22 C44 12 38 8 32 8"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 50 22;-6 50 22;0 50 22" dur="1.4s" repeatCount="indefinite"/></path>
    <path d="M70 22 C76 12 82 8 88 8"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 70 22;6 70 22;0 70 22" dur="1.4s" repeatCount="indefinite"/></path>
  </g>
  <!-- compound eyes: glint on the entrance -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.2">
    <path d="M42 36 C42 28 50 26 54 32 C56 38 52 46 46 46 C42 44 42 40 42 36Z" fill="#b3122e"/>
    <path d="M78 36 C78 28 70 26 66 32 C64 38 68 46 74 46 C78 44 78 40 78 36Z" fill="#b3122e"/>
  </g>
  <g fill="none" stroke="#ff6b6b" stroke-width="0.6"><path d="M44 34 H52 M44 38 H53 M45 42 H51 M47 30 V45 M50 30 V45 M76 34 H68 M76 38 H67 M75 42 H69 M73 30 V45 M70 30 V45"/></g>
  <g transform="translate(47 34)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="0;0;2;1" keyTimes="0;.6;.78;1" dur="1.5s" fill="freeze"/>
    <circle r="1.8" fill="#fff"/></g></g>
  <g transform="translate(73 34)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="0;0;2;1" keyTimes="0;.64;.82;1" dur="1.5s" fill="freeze"/>
    <circle r="1.8" fill="#fff"/></g></g>
  <!-- mandibles: snap on the entrance, dripping honey -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round">
    <path d="M52 48 C46 50 44 56 48 60 L54 54Z" fill="#1d1b28"><animateTransform class="lg-in" attributeName="transform" type="rotate" values="0 54 50;0 54 50;-24 54 50;6 54 50;0 54 50" keyTimes="0;.6;.72;.86;1" dur="1.5s" fill="freeze"/>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 54 50;-10 54 50;0 54 50" dur="0.7s" begin="1.5s" repeatCount="indefinite" additive="sum"/></path>
    <path d="M68 48 C74 50 76 56 72 60 L66 54Z" fill="#1d1b28"><animateTransform class="lg-in" attributeName="transform" type="rotate" values="0 66 50;0 66 50;24 66 50;-6 66 50;0 66 50" keyTimes="0;.6;.72;.86;1" dur="1.5s" fill="freeze"/>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 66 50;10 66 50;0 66 50" dur="0.7s" begin="1.5s" repeatCount="indefinite" additive="sum"/></path>
  </g>
  <path style="transform-box:fill-box;transform-origin:center top" d="M56 54 C56 60 58 62 58 58" fill="#ffb627" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5">
    <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1.4;1 1" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <!-- drones buzzing around -->
  <g fill="#ffd23f" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6">
    <ellipse cx="14" cy="60" rx="3" ry="2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;4 -6;-2 -10;0 0" dur="1.2s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="106" cy="104" rx="3" ry="2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-4 -6;2 -10;0 0" dur="1.4s" repeatCount="indefinite"/></ellipse>
  </g>
</svg>
