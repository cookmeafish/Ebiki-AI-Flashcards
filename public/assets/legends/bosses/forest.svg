        <path d="M-12 46 L-24 30 L-8 42Z"/><path d="M-9 44 L-15 22 L-4 41Z"/><path d="M-5 43 L-2 23 L0 44Z"/><path d="M-2 45 L10 35 L1 49Z"/>
