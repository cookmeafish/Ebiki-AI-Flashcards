      <path d="M52 102 L56 96 L54 92 L60 86 L66 92 L64 96 L68 102 L64 112 L60 124 L56 112Z" fill="#160804" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
      <g transform="translate(60 104)"><g style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.18;1" dur="1.3s" repeatCount="indefinite"/>
        <path d="M-6 -2 L-3 -8 L0 -14 L3 -8 L6 -2 L3 8 L0 16 L-3 8Z" fill="#ff6a00" opacity="0.5"/>
        <path d="M-3 -2 L-1 -7 L0 -11 L1 -7 L3 -2 L1.6 6 L0 12 L-1.6 6Z" fill="#ffb627"/>
        <path d="M-1 -2 L0 -6 L1 -2 L0 4Z" fill="#fff4c2"/>
      </g></g>
      <path d="M54 98 L46 94 L42 98 M66 98 L74 94 L78 98 M57 110 L50 114 M63 110 L70 114" fill="none" stroke="#ff8a1a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- moss on the shoulders -->
      <path d="M2 86 C8 76 20 70 32 72 C26 76 22 80 20 86 C14 84 8 86 2 90Z" fill="var(--lg-near, #5fb57a)" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
      <path d="M118 86 C112 76 100 70 88 72 C94 76 98 80 100 86 C106 84 112 86 118 90Z" fill="var(--lg-near, #5fb57a)" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
      <path d="M6 84 C12 78 20 74 28 74" fill="none" stroke="var(--lg-far, #9fd4ad)" stroke-width="1" stroke-linecap="round"/>
