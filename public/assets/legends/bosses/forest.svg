          <path d="M-4 -2 C-6 -14 -4 -24 -8 -34 M4 -2 C6 -14 4 -24 8 -34" stroke="#5a3a1e" stroke-width="3"/>
          <path d="M-13 -2 C-18 -14 -25 -24 -38 -34 M-31 -30 C-33 -38 -31 -45 -34 -50" stroke="#a8743c" stroke-width="1.1"/>
          <path d="M-5 -4 C-7 -14 -5 -24 -8 -32" stroke="#a8743c" stroke-width="0.9"/>
        </g>
        <g fill="#6b4423" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7" stroke-linejoin="round">
          <path d="M-18 -11 L-15 -18 L-14 -11Z"/><path d="M-26 -22 L-28 -29 L-23 -24Z"/><path d="M-38 -14 L-40 -20 L-36 -15Z"/><path d="M-41 -36 L-48 -38 L-42 -33Z"/><path d="M-34 -52 L-36 -59 L-31 -53Z"/>
          <path d="M18 -11 L15 -18 L14 -11Z"/><path d="M26 -22 L28 -29 L23 -24Z"/><path d="M38 -14 L40 -20 L36 -15Z"/><path d="M41 -36 L48 -38 L42 -33Z"/><path d="M34 -52 L36 -59 L31 -53Z"/>
          <path d="M-8 -34 L-9 -41 L-5 -35Z"/><path d="M8 -34 L9 -41 L5 -35Z"/><path d="M-6 -20 L-11 -22 L-6 -17Z"/><path d="M6 -20 L11 -22 L6 -17Z"/>
        </g>
        <!-- moss hanging from the tines -->
        <g fill="var(--lg-near, #5fb57a)" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6">
          <path d="M-24 -18 C-25 -12 -22 -8 -24 -4 C-21 -8 -20 -12 -20 -17Z"/><path d="M28 -26 C28 -20 31 -16 29 -12 C33 -16 33 -21 32 -26Z"/><path d="M-40 -15 C-40 -10 -38 -8 -39 -5 C-36 -8 -36 -12 -37 -15Z"/>
        </g>
