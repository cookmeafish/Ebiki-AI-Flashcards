      <path d="M8 74 C6 78 8 82 6 86 C10 82 11 78 12 75Z" fill="var(--lg-near, #5fb57a)" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/>
    </g>
  </g>
  <!-- right arm -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="95 104 78;95 104 78;-8 104 78;0 104 78" keyTimes="0;.45;.72;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 104 78;5 104 78;0 104 78" dur="3.1s" repeatCount="indefinite"/>
      <path d="M98 84 C110 82 120 74 126 62 L132 46 L123 43 L118 56 C114 64 106 70 96 72Z" fill="#4a2f1a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M98 84 C110 82 120 74 126 62 L129 54 C122 64 112 72 98 76Z" fill="#000" opacity="0.3"/>
      <g fill="#4a2f1a" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round">
        <path d="M132 46 L144 30 L128 42Z"/><path d="M129 44 L135 22 L124 41Z"/><path d="M125 43 L122 23 L120 44Z"/><path d="M122 45 L110 35 L119 49Z"/>
