<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Elder Thornmaw: an ancient treant with a thorn crown, ember eyes and a splintered maw. -->
  <g transform="translate(60 64)"><g>
    <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.07;1" dur="2.8s" repeatCount="indefinite"/>
    <circle r="56" fill="var(--lg-accent, #f2b441)" opacity="0.1"/>
    <circle r="46" fill="var(--lg-accent, #f2b441)" opacity="0.12"/>
  </g></g>
  <!-- crown of foliage and thorned antlers -->
  <g>
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 60 44;-2 60 44;0 60 44;2 60 44;0 60 44" dur="5s" repeatCount="indefinite"/>
    <g fill="var(--lg-far, #9fd4ad)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.5">
      <circle cx="30" cy="30" r="14"/><circle cx="90" cy="28" r="14"/><circle cx="46" cy="16" r="13"/><circle cx="74" cy="15" r="13"/><circle cx="60" cy="24" r="15"/>
    </g>
    <g fill="var(--lg-deep, #2e8b57)" opacity="0.55">
      <circle cx="33" cy="35" r="9"/><circle cx="87" cy="33" r="9"/><circle cx="60" cy="31" r="10"/><circle cx="48" cy="22" r="7"/><circle cx="72" cy="21" r="7"/>
    </g>
    <g fill="none" stroke="#4a2f1a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M44 40 L34 20 L22 12 M34 20 L30 6 M38 28 L24 26"/>
      <path d="M76 40 L86 20 L98 12 M86 20 L90 6 M82 28 L96 26"/>
      <path d="M56 36 L52 14 M64 36 L68 12"/>
    </g>
    <g fill="#6b4423" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8">
      <polygon points="26,16 22,9 30,13"/><polygon points="31,11 30,4 34,9"/><polygon points="27,24 22,21 27,20"/>
      <polygon points="94,16 98,9 90,13"/><polygon points="89,11 90,4 86,9"/><polygon points="93,24 98,21 93,20"/>
      <polygon points="52,18 48,13 54,15"/><polygon points="68,16 72,11 66,13"/>
    </g>
    <g fill="#f25c54"><circle cx="38" cy="12" r="2"/><circle cx="84" cy="10" r="2"/><circle cx="60" cy="8" r="1.8"/></g>
  </g>
  <!-- left branch arm with twig claws -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="50 36 64;50 36 64;-10 36 64;0 36 64" keyTimes="0;.55;.82;1" dur="1.5s" fill="freeze"/>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 36 64;-5 36 64;0 36 64" dur="3.4s" begin="1.6s" repeatCount="indefinite"/>
      <path d="M38 66 C26 70 16 66 10 56" fill="none" stroke="#4a2f1a" stroke-width="9" stroke-linecap="round"/>
      <path d="M38 66 C26 70 16 66 10 56" fill="none" stroke="#6b4423" stroke-width="5" stroke-linecap="round"/>
      <path d="M11 57 L3 50 M11 57 L4 60 M12 55 L8 45" stroke="#4a2f1a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <g fill="var(--lg-near, #5fb57a)"><ellipse cx="24" cy="68" rx="6" ry="3"/><ellipse cx="17" cy="64" rx="4" ry="2.5"/></g>
    </g>
  </g>
  <!-- right branch arm -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="-50 84 64;-50 84 64;10 84 64;0 84 64" keyTimes="0;.55;.82;1" dur="1.5s" fill="freeze"/>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 84 64;5 84 64;0 84 64" dur="3.1s" begin="1.6s" repeatCount="indefinite"/>
      <path d="M82 66 C94 70 104 66 110 56" fill="none" stroke="#4a2f1a" stroke-width="9" stroke-linecap="round"/>
      <path d="M82 66 C94 70 104 66 110 56" fill="none" stroke="#6b4423" stroke-width="5" stroke-linecap="round"/>
      <path d="M109 57 L117 50 M109 57 L116 60 M108 55 L112 45" stroke="#4a2f1a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <g fill="var(--lg-near, #5fb57a)"><ellipse cx="96" cy="68" rx="6" ry="3"/><ellipse cx="103" cy="64" rx="4" ry="2.5"/></g>
    </g>
  </g>
  <!-- trunk body, breathing -->
  <g transform="translate(60 118)"><g>
    <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1.02 1.03;1 1" dur="2.8s" repeatCount="indefinite"/>
    <g transform="translate(-60 -118)">
      <path d="M30 120 C34 100 28 80 35 60 C40 44 48 36 60 36 C72 36 80 44 85 60 C92 80 86 100 90 120 Z" fill="#5a3a1e" stroke="var(--lg-ink, #1d2230)" stroke-width="2"/>
      <path d="M35 60 C40 46 48 40 56 39 C48 48 44 62 42 80 C40 94 40 108 38 120 H31 C34 100 28 80 35 60Z" fill="#8a5a2b" opacity="0.55"/>
      <path d="M85 60 C80 46 72 40 66 39 C74 50 78 66 80 84 C82 98 84 110 86 120 H90 C86 100 92 80 85 60Z" fill="#000" opacity="0.25"/>
      <g fill="none" stroke="#3b2412" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
        <path d="M40 108 C42 96 40 88 44 80"/><path d="M80 110 C78 98 80 90 76 82"/><path d="M50 118 C50 110 48 106 50 100"/><path d="M70 118 C70 110 72 106 70 100"/>
        <path d="M46 50 C50 46 54 45 58 46"/><path d="M62 46 C66 45 70 46 74 50"/>
      </g>
      <!-- moss and a toadstool colony on the shoulders -->
      <path d="M34 62 C38 54 46 52 50 56 C46 58 42 62 40 68 Z" fill="var(--lg-near, #5fb57a)" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
      <path d="M86 62 C82 54 74 52 70 56 C74 58 78 62 80 68 Z" fill="var(--lg-near, #5fb57a)" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
      <g stroke="var(--lg-ink, #1d2230)" stroke-width="0.8">
        <rect x="79.5" y="52" width="2" height="5" fill="#f4e6c8"/><path d="M76 53 Q80.5 46 85 53Z" fill="#d8342c"/>
        <rect x="85.5" y="56" width="1.6" height="4" fill="#f4e6c8"/><path d="M83 57 Q86.3 52 89.6 57Z" fill="#d8342c"/>
      </g>
      <g fill="#fff"><circle cx="79" cy="51" r="0.8"/><circle cx="82" cy="50" r="0.7"/><circle cx="86" cy="55" r="0.6"/></g>
      <!-- roots clawing the ground -->
      <g fill="none" stroke="#4a2f1a" stroke-width="5" stroke-linecap="round">
        <path d="M34 116 C26 112 18 116 12 120"/><path d="M86 116 C94 112 102 116 108 120"/><path d="M44 118 C40 114 34 114 30 120"/><path d="M76 118 C80 114 86 114 90 120"/>
      </g>
    </g>
  </g></g>
  <!-- heavy brow and eye hollows -->
  <path d="M38 60 L56 66 L60 62 L64 66 L82 60 L80 54 L64 58 L60 56 L56 58 L40 54Z" fill="#3b2412" stroke="var(--lg-ink, #1d2230)" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="48" cy="67" rx="8" ry="5.5" fill="#140804" transform="rotate(14 48 67)"/>
  <ellipse cx="72" cy="67" rx="8" ry="5.5" fill="#140804" transform="rotate(-14 72 67)"/>
  <!-- ember eyes: open on the entrance, blink after -->
  <g transform="translate(48 67) rotate(14)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.2 1.4;1 1" keyTimes="0;.62;.8;1" dur="1.5s" fill="freeze"/>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1;1 0.1;1 1" keyTimes="0;.9;.95;1" dur="4.6s" begin="2s" repeatCount="indefinite"/>
      <circle r="7" fill="#ffb627" opacity="0.35"/><ellipse rx="5" ry="3.4" fill="#ffd966"/><ellipse rx="1.4" ry="3.2" fill="#ff5a00"/>
    </g>
  </g></g>
  <g transform="translate(72 67) rotate(-14)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.2 1.4;1 1" keyTimes="0;.62;.8;1" dur="1.5s" fill="freeze"/>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1;1 0.1;1 1" keyTimes="0;.9;.95;1" dur="4.6s" begin="2s" repeatCount="indefinite"/>
      <circle r="7" fill="#ffb627" opacity="0.35"/><ellipse rx="5" ry="3.4" fill="#ffd966"/><ellipse rx="1.4" ry="3.2" fill="#ff5a00"/>
    </g>
  </g></g>
  <!-- splintered maw: roars open on the entrance -->
  <g transform="translate(60 80)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.2;1 0.2;1.08 1.25;1 1" keyTimes="0;.66;.84;1" dur="1.6s" fill="freeze"/>
    <g transform="translate(-60 -80)">
      <path d="M42 80 C48 78 54 80 60 79 C66 80 72 78 78 80 C76 92 70 104 60 106 C50 104 44 92 42 80Z" fill="#140804" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8"/>
      <ellipse cx="60" cy="94" rx="9" ry="7" fill="#ff8a1a" opacity="0.35"/>
      <g fill="#e8d7b0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round">
        <polygon points="44,81 47,90 50,80"/><polygon points="50,80 53,93 56,80"/><polygon points="56,80 60,95 64,80"/><polygon points="64,80 67,93 70,80"/><polygon points="70,80 73,90 76,81"/>
        <polygon points="49,100 52,93 55,102"/><polygon points="56,104 60,96 64,104"/><polygon points="65,102 68,93 71,100"/>
      </g>
    </g>
  </g></g>
  <!-- hanging vines -->
  <g fill="none" stroke="var(--lg-deep, #2e8b57)" stroke-width="1.6" stroke-linecap="round">
    <path d="M40 46 C38 56 42 60 40 70"/><path d="M80 46 C82 56 78 62 80 72"/>
  </g>
  <g fill="var(--lg-near, #5fb57a)"><ellipse cx="40" cy="58" rx="2" ry="1.2"/><ellipse cx="41" cy="66" rx="2" ry="1.2"/><ellipse cx="81" cy="58" rx="2" ry="1.2"/><ellipse cx="79" cy="68" rx="2" ry="1.2"/></g>
  <!-- fireflies drifting -->
  <g fill="var(--lg-accent, #f2b441)">
    <circle cx="16" cy="36" r="1.6"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;4 -6;-2 -10;0 0" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="104" cy="40" r="1.4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-5 -4;-1 -9;0 0" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="92" r="1.3"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-3 -7;3 -4;0 0" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="94" r="1.5"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;4 -5;1 -10;0 0" dur="3.9s" repeatCount="indefinite"/></circle>
  </g>
</svg>
