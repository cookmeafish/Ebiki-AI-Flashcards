    </g>
  </g>
  <!-- shoulders and trunk: seen from below, wider than the frame -->
  <g transform="translate(60 120)"><g>
    <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1.015 1.025;1 1" dur="3s" repeatCount="indefinite"/>
    <g transform="translate(-60 -120)">
      <path d="M-6 126 L-2 116 L-2 92 L6 78 L22 70 L40 72 L60 80 L80 72 L98 70 L114 78 L122 92 L122 116 L128 126 L114 120 L106 128 L98 120 L86 126 L76 120 L64 128 L56 120 L44 128 L34 120 L22 126 L14 118Z" fill="#5a3a1e" stroke="var(--lg-ink, #1d2230)" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M-2 92 L6 78 L22 70 L40 72 L30 82 L16 90 L12 120 L-2 116Z" fill="#a8743c" opacity="0.5"/>
      <path d="M114 78 L122 92 L122 116 L128 126 L114 120 L106 128 L104 96 L96 80 L98 70Z" fill="#000" opacity="0.3"/>
      <g fill="none" stroke="#2e1a0c" stroke-width="1.2" stroke-linecap="round">
        <path d="M14 94 C16 104 14 112 16 120"/><path d="M24 88 C26 98 24 106 26 116"/><path d="M98 92 C96 102 98 110 96 118"/><path d="M106 96 C104 106 106 112 104 120"/>
        <path d="M36 104 C40 108 38 114 42 118"/><path d="M84 104 C80 108 82 114 78 118"/>
      </g>
