<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Elder Thornmaw: an ancient treant seen from below. A crown of thorned antlers, ember slit eyes under one
       bark brow, a splintered maw burning inside, a heartwood crack glowing in its chest, twig-clawed arms raised
       past the frame, toadstools and moss on its shoulders. Behind it a ring of brambles turns slowly.
       Entrance: the antlers grow, the arms swing up, the eyes ignite, the maw roars open. -->
  <!-- the bramble crown behind it, turning on its own slow rhythm -->
  <g transform="translate(60 50) rotate(12)">
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="60s" repeatCount="indefinite"/>
      <g fill="none" stroke-linecap="round">
        <path d="M0 -52 C22 -56 44 -40 50 -18 C56 6 44 34 22 46 C0 58 -30 52 -44 30 C-58 8 -52 -24 -32 -42 C-22 -50 -10 -54 0 -52" stroke="var(--lg-ink, #1d2230)" stroke-width="5.4"/>
        <path d="M0 -52 C22 -56 44 -40 50 -18 C56 6 44 34 22 46 C0 58 -30 52 -44 30 C-58 8 -52 -24 -32 -42 C-22 -50 -10 -54 0 -52" stroke="var(--lg-deep, #2e8b57)" stroke-width="3.2"/>
        <path d="M-4 -47 C18 -52 40 -38 46 -16 C52 6 40 30 18 42 C-4 52 -26 46 -40 26 C-52 6 -46 -22 -28 -38" stroke="var(--lg-ink, #1d2230)" stroke-width="4"/>
        <path d="M-4 -47 C18 -52 40 -38 46 -16 C52 6 40 30 18 42 C-4 52 -26 46 -40 26 C-52 6 -46 -22 -28 -38" stroke="var(--lg-far, #9fd4ad)" stroke-width="2"/>
      </g>
      <g fill="var(--lg-deep, #2e8b57)" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round">
        <path d="M0 -52 L2 -60 L4 -52Z" transform="rotate(0)"/><path d="M0 -52 L2 -60 L4 -52Z" transform="rotate(30)"/><path d="M0 -52 L2 -60 L4 -52Z" transform="rotate(60)"/><path d="M0 -52 L2 -60 L4 -52Z" transform="rotate(90)"/><path d="M0 -52 L2 -60 L4 -52Z" transform="rotate(120)"/><path d="M0 -52 L2 -60 L4 -52Z" transform="rotate(150)"/><path d="M0 -52 L2 -60 L4 -52Z" transform="rotate(180)"/><path d="M0 -52 L2 -60 L4 -52Z" transform="rotate(210)"/><path d="M0 -52 L2 -60 L4 -52Z" transform="rotate(240)"/><path d="M0 -52 L2 -60 L4 -52Z" transform="rotate(270)"/><path d="M0 -52 L2 -60 L4 -52Z" transform="rotate(300)"/><path d="M0 -52 L2 -60 L4 -52Z" transform="rotate(330)"/>
        <path d="M-2 -46 L-6 -40 L0 -42Z" transform="rotate(15)"/><path d="M-2 -46 L-6 -40 L0 -42Z" transform="rotate(75)"/><path d="M-2 -46 L-6 -40 L0 -42Z" transform="rotate(135)"/><path d="M-2 -46 L-6 -40 L0 -42Z" transform="rotate(195)"/><path d="M-2 -46 L-6 -40 L0 -42Z" transform="rotate(255)"/><path d="M-2 -46 L-6 -40 L0 -42Z" transform="rotate(315)"/>
      </g>
      <g fill="#d8342c" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5"><circle cx="38" cy="-36" r="1.8"/><circle cx="-48" cy="12" r="1.8"/><circle cx="26" cy="44" r="1.6"/><circle cx="-20" cy="-50" r="1.5"/></g>
    </g>
  </g>
  <!-- antlers: a crown of thorned branches, grow on the entrance, sway after -->
  <g transform="translate(60 34)">
    <g><animateTransform class="lg-in" attributeName="transform" type="scale" values="0.2;0.2;1.12;1" keyTimes="0;.35;.6;1" dur="1.5s" fill="freeze"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;-2;0;2;0" dur="5s" repeatCount="indefinite"/>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-12 0 C-18 -14 -26 -26 -40 -36 M-21 -16 C-30 -16 -38 -12 -46 -16 M-30 -28 C-32 -38 -30 -46 -34 -52 M-26 -9 L-34 -4" stroke="var(--lg-ink, #1d2230)" stroke-width="7"/>
          <path d="M12 0 C18 -14 26 -26 40 -36 M21 -16 C30 -16 38 -12 46 -16 M30 -28 C32 -38 30 -46 34 -52 M26 -9 L34 -4" stroke="var(--lg-ink, #1d2230)" stroke-width="7"/>
          <path d="M-4 -2 C-6 -14 -4 -24 -8 -34 M4 -2 C6 -14 4 -24 8 -34" stroke="var(--lg-ink, #1d2230)" stroke-width="5.6"/>
