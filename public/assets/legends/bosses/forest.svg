    <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-5 -4;-1 -9;0 0" dur="3.6s" repeatCount="indefinite"/><circle cx="102" cy="34" r="2.8" opacity="0.35"/><circle cx="102" cy="34" r="1.3"/></g>
    <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-3 -7;3 -4;0 0" dur="4.4s" repeatCount="indefinite"/><circle cx="108" cy="100" r="2.6" opacity="0.35"/><circle cx="108" cy="100" r="1.2"/></g>
    <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;4 -5;1 -10;0 0" dur="3.9s" repeatCount="indefinite"/><circle cx="12" cy="104" r="2.8" opacity="0.35"/><circle cx="12" cy="104" r="1.3"/></g>
