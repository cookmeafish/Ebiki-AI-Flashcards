    <path d="M38 62 L24 56 L27 61 L37 68Z"/><path d="M82 62 L96 56 L93 61 L83 68Z"/>
    <path d="M42 80 L32 82 L42 86Z"/><path d="M78 80 L88 82 L78 86Z"/>
  </g>
  <!-- the eye hollows -->
  <path d="M38 52 L56 60 L55 68 L42 66 L37 58Z" fill="#140804"/>
  <path d="M82 52 L64 60 L65 68 L78 66 L83 58Z" fill="#140804"/>
  <!-- ember slit eyes: ignite on the entrance, blink after -->
  <g transform="translate(48 61) rotate(20)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.25 1.4;1 1" keyTimes="0;.6;.78;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1;1 0.1;1 1" keyTimes="0;.9;.95;1" dur="4.6s" repeatCount="indefinite"/>
      <ellipse rx="9" ry="5" fill="#ff8a1a" opacity="0.45"/><ellipse rx="6.4" ry="3" fill="#ffd23f" stroke="#7a2a00" stroke-width="0.6"/><ellipse rx="1" ry="2.8" fill="#c21800"/><circle cx="1.8" cy="-1" r="0.8" fill="#fff"/>
    </g>
  </g></g>
  <g transform="translate(72 61) rotate(-20)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.25 1.4;1 1" keyTimes="0;.6;.78;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1;1 0.1;1 1" keyTimes="0;.9;.95;1" dur="4.6s" repeatCount="indefinite"/>
      <ellipse rx="9" ry="5" fill="#ff8a1a" opacity="0.45"/><ellipse rx="6.4" ry="3" fill="#ffd23f" stroke="#7a2a00" stroke-width="0.6"/><ellipse rx="1" ry="2.8" fill="#c21800"/><circle cx="-1.8" cy="-1" r="0.8" fill="#fff"/>
    </g>
  </g></g>
  <!-- ONE heavy bark brow ridge in a V, angled down to the middle -->
  <path d="M33 44 L48 50 L60 58 L72 50 L87 44 L86 52 L72 57 L60 64 L48 57 L34 52Z" fill="#3b2412" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M34 45 L48 51 L60 59 L72 51 L86 45" fill="none" stroke="#a8743c" stroke-width="1" stroke-linejoin="round"/>
  <!-- knot nostrils -->
  <path d="M55 70 L57 74 L58 70Z M65 70 L63 74 L62 70Z" fill="#140804"/>
  <!-- the splintered maw: roars open on the entrance, the jaw grinds after -->
  <g transform="translate(60 78)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.2;1 0.2;1.08 1.3;1 1" keyTimes="0;.66;.84;1" dur="1.6s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1.08;1 1" dur="2.4s" repeatCount="indefinite"/>
      <path d="M-20 0 L-13 -3 L-7 0 L0 -2 L7 0 L13 -3 L20 0 L17 10 L10 18 L0 21 L-10 18 L-17 10Z" fill="#160804" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
      <ellipse cy="12" rx="10" ry="6" fill="#ff6a00" opacity="0.55"/>
      <ellipse cy="13" rx="5" ry="3" fill="#ffb627"/>
      <g fill="#e8d7b0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round">
        <path d="M-18 0.5 L-16 7 L-14 -1Z"/><path d="M-11 -1.5 L-9 6 L-7 0Z"/><path d="M-5 -0.5 L-3 7 L-1 -1.5Z"/><path d="M1 -1.5 L3 7 L5 -0.5Z"/><path d="M7 0 L9 6 L11 -1.5Z"/><path d="M14 -1 L16 7 L18 0.5Z"/>
        <path d="M-14 13 L-12 7 L-10 15Z"/><path d="M-7 17 L-5 9 L-3 18Z"/><path d="M3 18 L5 9 L7 17Z"/><path d="M10 15 L12 7 L14 13Z"/>
      </g>
      <!-- splinter fangs past the lip -->
      <g fill="#f4e6c8" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round">
        <path d="M-15 -1 L-12 16 L-10 -2Z"/><path d="M10 -2 L12 16 L15 -1Z"/>
      </g>
      <path d="M-14 0 L-12.4 10" stroke="#fff" stroke-width="0.6" opacity="0.7"/><path d="M11 0 L12.2 10" stroke="#fff" stroke-width="0.6" opacity="0.7"/>
