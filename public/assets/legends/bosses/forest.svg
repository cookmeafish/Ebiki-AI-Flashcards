    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 16 78;-5 16 78;0 16 78" dur="3.4s" repeatCount="indefinite"/>
      <path d="M22 84 C10 82 0 74 -6 62 L-12 46 L-3 43 L2 56 C6 64 14 70 24 72Z" fill="#5a3a1e" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
