        <path d="M11 76 L11 83 L14 83 L14 76Z" fill="#f4e6c8"/><path d="M5 77 Q12.5 66 20 77Z" fill="#d8342c"/>
        <path d="M20 72 L20 77 L22 77 L22 72Z" fill="#f4e6c8"/><path d="M17 73 Q21 66 25 73Z" fill="#d8342c"/>
        <path d="M104 74 L104 79 L106 79 L106 74Z" fill="#f4e6c8"/><path d="M100.5 75 Q105 68 109.5 75Z" fill="#d8342c"/>
      </g>
      <g fill="#fff"><circle cx="10" cy="73" r="1"/><circle cx="14" cy="71" r="0.9"/><circle cx="17" cy="74" r="0.7"/><circle cx="21" cy="70" r="0.6"/><circle cx="104" cy="71.5" r="0.7"/><circle cx="107" cy="73" r="0.6"/></g>
    </g>
  </g></g>
  <!-- the head: an angular bark skull -->
  <path d="M42 34 L50 26 L60 28 L70 26 L78 34 L86 48 L84 64 L78 82 L70 96 L60 100 L50 96 L42 82 L36 64 L34 48Z" fill="#5a3a1e" stroke="var(--lg-ink, #1d2230)" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M42 34 L50 26 L60 28 L54 40 L44 50 L38 64 L36 64 L34 48Z" fill="#a8743c" opacity="0.45"/>
  <path d="M78 34 L86 48 L84 64 L78 82 L70 96 L74 76 L78 60 L80 46Z" fill="#000" opacity="0.3"/>
  <g fill="none" stroke="#2e1a0c" stroke-width="1" stroke-linecap="round">
    <path d="M52 32 C54 36 56 38 60 38 C64 38 66 36 68 32"/><path d="M40 52 C40 58 42 62 40 68"/><path d="M80 52 C80 58 78 62 80 68"/>
  </g>
  <!-- broken branch stubs on the cheeks -->
