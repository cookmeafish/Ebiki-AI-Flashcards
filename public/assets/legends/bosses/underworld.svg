<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Cerberus, Gatekeeper of Ash: three snarling heads, fiery manes, spiked collars and chains. -->
  <!-- hellfire behind -->
  <g fill="#ff5a1f" opacity="0.5">
    <path d="M6 70 C2 50 12 40 10 24 C20 34 22 44 24 56 C28 40 36 32 34 16 C46 30 44 46 42 60Z" style="transform-box:fill-box;transform-origin:center bottom"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1.08;1 1" dur="0.8s" repeatCount="indefinite"/></path>
    <path d="M114 70 C118 50 108 40 110 24 C100 34 98 44 96 56 C92 40 84 32 86 16 C74 30 76 46 78 60Z" style="transform-box:fill-box;transform-origin:center bottom"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1.06;1 1;1 1.06" dur="0.9s" repeatCount="indefinite"/></path>
  </g>
  <!-- chains to the ground -->
  <g fill="none" stroke="#8a8f9c" stroke-width="2" stroke-dasharray="3 1.6"><path d="M34 88 C24 100 16 108 8 120"/><path d="M86 88 C96 100 104 108 112 120"/></g>
  <!-- massive chest and forelegs -->
  <path d="M28 120 C26 96 34 78 46 72 H74 C86 78 94 96 92 120Z" fill="#2a2230" stroke="var(--lg-ink, #1d2230)" stroke-width="2"/>
  <path d="M30 120 C30 100 36 84 46 76 C42 90 40 104 40 120Z" fill="var(--lg-deep, #c0392b)" opacity="0.45"/>
  <g fill="none" stroke="#ff7a1a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M50 96 L56 104 L52 112 M70 94 L66 102 L72 110"/></g>
  <g fill="#e8d7b0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round">
    <polygon points="34,118 36,112 38,118"/><polygon points="40,118 42,111 44,118"/><polygon points="76,118 78,111 80,118"/><polygon points="82,118 84,112 86,118"/>
  </g>
  <!-- LEFT head -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="30 32 70;30 32 70;-8 32 70;0 32 70" keyTimes="0;.62;.78;1" dur="1.6s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 32 70;-4 32 70;0 32 70" dur="1.8s" begin="1.6s" repeatCount="indefinite"/>
      <path d="M8 40 C2 32 6 22 14 20 C12 28 16 30 20 32 C20 24 26 18 32 18 C30 26 34 30 40 32Z" fill="#ff7a1a" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
      <path d="M12 44 C12 32 20 26 30 26 C40 26 46 34 44 46 L40 62 L26 70 L14 60Z" fill="#2a2230" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M14 22 L10 12 L20 22Z M36 22 L42 10 L40 24Z" fill="#2a2230" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
      <g transform="translate(22 40) rotate(16)"><circle r="4" fill="#ffd166" opacity="0.4"/><ellipse rx="3" ry="1.8" fill="#ffe066"/><ellipse rx="0.6" ry="1.6" fill="#1a1216"/></g>
      <g transform="translate(36 40) rotate(-16)"><circle r="4" fill="#ffd166" opacity="0.4"/><ellipse rx="3" ry="1.8" fill="#ffe066"/><ellipse rx="0.6" ry="1.6" fill="#1a1216"/></g>
      <path d="M16 34 L26 38 M42 34 L32 38" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M18 52 L40 52 L36 64 L26 68 L20 62Z" fill="#2a0f14" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
      <g fill="#fff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5"><polygon points="20,52 22,58 24,52"/><polygon points="34,52 36,58 38,52"/><polygon points="24,66 26,61 28,66"/></g>
      <path d="M26 46 C28 44 32 44 34 46 L30 50Z" fill="#1a1216"/>
      <!-- spiked collar -->
      <path d="M16 66 L40 64 L42 70 L18 72Z" fill="#3a3340" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
      <g fill="#aeb6c4" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5"><polygon points="20,72 22,78 24,72"/><polygon points="28,71 30,77 32,71"/><polygon points="36,70 38,76 40,70"/></g>
    </g>
  </g>
  <!-- RIGHT head -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="-30 88 70;-30 88 70;8 88 70;0 88 70" keyTimes="0;.7;.86;1" dur="1.6s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 88 70;4 88 70;0 88 70" dur="1.9s" begin="1.6s" repeatCount="indefinite"/>
      <path d="M112 40 C118 32 114 22 106 20 C108 28 104 30 100 32 C100 24 94 18 88 18 C90 26 86 30 80 32Z" fill="#ff7a1a" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
      <path d="M108 44 C108 32 100 26 90 26 C80 26 74 34 76 46 L80 62 L94 70 L106 60Z" fill="#2a2230" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M106 22 L110 12 L100 22Z M84 22 L78 10 L80 24Z" fill="#2a2230" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
      <g transform="translate(98 40) rotate(-16)"><circle r="4" fill="#ffd166" opacity="0.4"/><ellipse rx="3" ry="1.8" fill="#ffe066"/><ellipse rx="0.6" ry="1.6" fill="#1a1216"/></g>
      <g transform="translate(84 40) rotate(16)"><circle r="4" fill="#ffd166" opacity="0.4"/><ellipse rx="3" ry="1.8" fill="#ffe066"/><ellipse rx="0.6" ry="1.6" fill="#1a1216"/></g>
      <path d="M104 34 L94 38 M78 34 L88 38" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M102 52 L80 52 L84 64 L94 68 L100 62Z" fill="#2a0f14" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
      <g fill="#fff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5"><polygon points="100,52 98,58 96,52"/><polygon points="86,52 84,58 82,52"/><polygon points="96,66 94,61 92,66"/></g>
      <path d="M94 46 C92 44 88 44 86 46 L90 50Z" fill="#1a1216"/>
      <path d="M104 66 L80 64 L78 70 L102 72Z" fill="#3a3340" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
      <g fill="#aeb6c4" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5"><polygon points="100,72 98,78 96,72"/><polygon points="92,71 90,77 88,71"/><polygon points="84,70 82,76 80,70"/></g>
    </g>
  </g>
  <!-- CENTER head, biggest, in front -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="translate" values="0 14;0 14;0 -4;0 0" keyTimes="0;.5;.66;1" dur="1.6s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.2s" begin="1.6s" repeatCount="indefinite"/>
      <path d="M36 30 C30 18 38 6 48 6 C46 14 50 16 54 18 C54 8 62 2 70 4 C66 12 70 16 76 18 C80 10 88 8 92 12 C86 18 88 24 86 32Z" fill="#ff7a1a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"/>
      <path d="M44 26 C48 16 56 12 60 12 C66 12 74 16 76 26" fill="#ffd166" opacity="0.7"/>
      <path d="M38 38 C38 24 48 16 60 16 C72 16 82 24 82 38 L78 60 L66 74 H54 L42 60Z" fill="#2a2230" stroke="var(--lg-ink, #1d2230)" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M40 36 C42 26 50 20 58 18 C50 26 46 36 46 54 L42 58Z" fill="var(--lg-deep, #c0392b)" opacity="0.5"/>
      <path d="M40 22 L34 4 L48 18Z M80 22 L86 4 L72 18Z" fill="#2a2230" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M40 18 L36 10 L44 16Z M80 18 L84 10 L76 16Z" fill="var(--lg-deep, #c0392b)"/>
      <!-- eyes: ignite -->
      <g transform="translate(50 36) rotate(14)"><g>
        <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.4 1.4;1 1" keyTimes="0;.5;.66;1" dur="1.5s" fill="freeze"/>
        <circle r="6" fill="#ff5a1f" opacity="0.4"/><ellipse rx="4.4" ry="2.6" fill="#ffe066"/><ellipse rx="0.9" ry="2.4" fill="#1a1216"/></g></g>
      <g transform="translate(70 36) rotate(-14)"><g>
        <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.4 1.4;1 1" keyTimes="0;.5;.66;1" dur="1.5s" fill="freeze"/>
        <circle r="6" fill="#ff5a1f" opacity="0.4"/><ellipse rx="4.4" ry="2.6" fill="#ffe066"/><ellipse rx="0.9" ry="2.4" fill="#1a1216"/></g></g>
      <path d="M42 28 L56 33 M78 28 L64 33" stroke="var(--lg-ink, #1d2230)" stroke-width="2.6" stroke-linecap="round"/>
      <!-- snout and roaring maw -->
      <path d="M52 44 C54 40 66 40 68 44 L64 50 H56Z" fill="#1a1216"/>
      <g>
        <animateTransform class="lg-in" attributeName="transform" type="translate" values="0 -8;0 -8;0 4;0 0" keyTimes="0;.5;.66;1" dur="1.5s" fill="freeze"/>
        <path d="M44 54 H76 L70 70 L60 76 L50 70Z" fill="#2a0f14" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
        <ellipse cx="60" cy="64" rx="8" ry="4" fill="#ff5a1f" opacity="0.7"/>
        <g fill="#fff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round"><polygon points="46,54 49,63 52,54"/><polygon points="68,54 71,63 74,54"/><polygon points="54,54 56,59 58,54"/><polygon points="62,54 64,59 66,54"/><polygon points="52,70 55,64 57,72"/><polygon points="63,72 65,64 68,70"/></g>
        <path style="transform-box:fill-box;transform-origin:center top" d="M50 70 C50 76 52 78 52 74" fill="none" stroke="#e6eef2" stroke-width="1.2" opacity="0.8"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1.4;1 1" dur="1.4s" repeatCount="indefinite"/></path>
      </g>
      <!-- spiked collar with a chain ring -->
      <path d="M40 72 H80 L78 80 H42Z" fill="#3a3340" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"/>
      <g fill="#aeb6c4" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"><polygon points="44,80 46,88 48,80"/><polygon points="52,80 54,88 56,80"/><polygon points="64,80 66,88 68,80"/><polygon points="72,80 74,88 76,80"/></g>
      <circle cx="60" cy="84" r="3.4" fill="none" stroke="#e0c16a" stroke-width="1.8"/>
    </g>
  </g>
  <!-- embers -->
  <g fill="#ffb347">
    <circle style="transform-box:fill-box;transform-origin:center" cx="20" cy="100" r="1.2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;4 -50" dur="2.4s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.4s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="100" cy="96" r="1.1"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-5 -50" dur="2.8s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.8s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="60" cy="110" r="1"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;2 -40" dur="2.2s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.2s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
</svg>
