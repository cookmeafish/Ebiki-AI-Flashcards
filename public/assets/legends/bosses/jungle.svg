<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Vinecoil: a giant temple cobra, hood painted with glyphs, jeweled crown, dripping fangs, coiled around a stone idol. -->
  <!-- jungle leaves behind -->
  <g fill="var(--lg-far, #9fd4ad)" stroke="var(--lg-ink, #1d2230)" stroke-width="1">
    <path d="M0 40 C14 30 30 34 34 46 C22 46 10 48 0 56Z"/><path d="M120 34 C106 24 88 28 84 40 C96 40 110 44 120 52Z"/>
    <path d="M0 80 C10 70 24 72 28 82 C18 82 8 86 0 94Z"/><path d="M120 76 C110 66 96 68 92 78 C102 78 112 82 120 90Z"/>
  </g>
  <!-- the stone idol -->
  <path d="M40 120 V84 H80 V120Z" fill="#8d929e" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8"/>
  <path d="M70 84 H80 V120 H70Z" fill="#000" opacity="0.25"/>
  <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"><rect x="48" y="92" width="24" height="18" rx="2"/></g>
  <g fill="#5c616d"><rect x="51" y="96" width="6" height="4"/><rect x="63" y="96" width="6" height="4"/><rect x="55" y="104" width="10" height="3"/></g>
  <g fill="#d4342c"><circle cx="54" cy="98" r="1.2"/><circle cx="66" cy="98" r="1.2"/></g>
  <!-- coils around the idol -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round">
    <path d="M24 108 C30 98 50 96 60 100 C72 104 92 102 98 110 C92 118 72 116 60 112 C48 108 32 116 24 108Z" fill="var(--lg-deep, #2e8b57)"/>
    <path d="M30 94 C40 86 56 88 64 92 C74 96 88 92 94 96 C90 102 76 104 66 100 C56 96 38 100 30 94Z" fill="var(--lg-deep, #2e8b57)"/>
  </g>
  <g fill="#f2d98c" opacity="0.9"><path d="M34 108 C44 104 54 106 60 108 C54 110 44 110 34 108Z"/><path d="M40 94 C48 92 56 93 62 95 C56 97 48 97 40 94Z"/></g>
  <g fill="#ffd966" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"><polygon points="70,106 74,104 78,106 74,108"/><polygon points="80,96 84,94 88,96 84,98"/></g>
  <!-- neck rising -->
  <path d="M50 96 C46 84 48 72 54 62 H66 C72 72 74 84 70 96Z" fill="var(--lg-deep, #2e8b57)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8"/>
  <path d="M54 94 C52 84 54 74 58 66 H62 C66 74 68 84 66 94Z" fill="#f2d98c"/>
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="0.7" opacity="0.6"><path d="M54 70 H66 M53 76 H67 M53 82 H67 M54 88 H66"/></g>
  <!-- the hood: flares on the entrance, breathes -->
  <g transform="translate(60 44)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="0.25 0.9;0.25 0.9;1.15 1.05;1 1" keyTimes="0;.5;.72;1" dur="1.5s" fill="freeze"/>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1.04 1;1 1" dur="2.4s" begin="1.5s" repeatCount="indefinite"/>
      <path d="M0 -38 C24 -36 42 -16 44 8 C44 26 30 36 14 30 L0 22 L-14 30 C-30 36 -44 26 -44 8 C-42 -16 -24 -36 0 -38Z" fill="var(--lg-deep, #2e8b57)" stroke="var(--lg-ink, #1d2230)" stroke-width="2.2"/>
      <path d="M0 -30 C18 -28 32 -12 34 6 C34 20 24 26 12 22 L0 16 L-12 22 C-24 26 -34 20 -34 6 C-32 -12 -18 -28 0 -30Z" fill="var(--lg-near, #5fb57a)"/>
      <!-- glyphs painted on the hood -->
      <g fill="none" stroke="#1d2230" stroke-width="1.4" stroke-linecap="round">
        <path d="M-24 -6 C-20 -12 -14 -12 -12 -6 C-14 0 -20 0 -24 -6Z M24 -6 C20 -12 14 -12 12 -6 C14 0 20 0 24 -6Z"/>
        <path d="M-28 10 L-20 6 L-24 16 M28 10 L20 6 L24 16"/>
      </g>
      <g fill="#ff3b1f"><circle cx="-18" cy="-6" r="2.4"/><circle cx="18" cy="-6" r="2.4"/></g>
      <g transform="translate(0 -20)"><circle r="3" fill="#ffd966" stroke="#1d2230" stroke-width="1"/><g stroke="#1d2230" stroke-width="1.2" stroke-linecap="round"><path d="M0 -5 V-7 M0 5 V7 M-5 0 H-7 M5 0 H7 M-3.6 -3.6 l-1.4 -1.4 M3.6 3.6 l1.4 1.4 M3.6 -3.6 l1.4 -1.4 M-3.6 3.6 l-1.4 1.4"/></g></g>
      <g fill="#ffd966" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"><circle cx="-36" cy="4" r="2"/><circle cx="36" cy="4" r="2"/><circle cx="-30" cy="-18" r="1.6"/><circle cx="30" cy="-18" r="1.6"/></g>
    </g>
  </g></g>
  <!-- head -->
  <path d="M46 44 C46 34 52 30 60 30 C68 30 74 34 74 44 C74 52 68 60 60 62 C52 60 46 52 46 44Z" fill="var(--lg-deep, #2e8b57)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8"/>
  <path d="M50 38 C52 33 56 32 60 32 C56 36 54 40 54 46Z" fill="#fff" opacity="0.18"/>
  <!-- jeweled crown -->
  <path d="M48 36 L50 24 L55 30 L60 20 L65 30 L70 24 L72 36 C66 33 54 33 48 36Z" fill="#ffd966" stroke="var(--lg-ink, #1d2230)" stroke-width="1.1" stroke-linejoin="round"/>
  <circle cx="60" cy="29" r="2" fill="#2ec4b6" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/>
  <!-- eyes -->
  <path d="M49 42 L57 45 M71 42 L63 45" stroke="var(--lg-ink, #1d2230)" stroke-width="2.2" stroke-linecap="round"/>
  <g transform="translate(53 47) rotate(16)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.3 1.3;1 1" keyTimes="0;.6;.8;1" dur="1.5s" fill="freeze"/>
    <ellipse rx="4.6" ry="3" fill="#ff9f1a" opacity="0.4"/><ellipse rx="3.4" ry="2.2" fill="#ffd966" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7"/><ellipse rx="0.7" ry="2" fill="#1d2230"/>
  </g></g>
  <g transform="translate(67 47) rotate(-16)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.3 1.3;1 1" keyTimes="0;.6;.8;1" dur="1.5s" fill="freeze"/>
    <ellipse rx="4.6" ry="3" fill="#ff9f1a" opacity="0.4"/><ellipse rx="3.4" ry="2.2" fill="#ffd966" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7"/><ellipse rx="0.7" ry="2" fill="#1d2230"/>
  </g></g>
  <!-- open mouth, fangs dripping venom -->
  <g transform="translate(60 54)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.2;1 0.2;1.1 1.3;1 1" keyTimes="0;.66;.84;1" dur="1.6s" fill="freeze"/>
    <path d="M-8 -1 C-4 -2 4 -2 8 -1 C6 6 3 9 0 9 C-3 9 -6 6 -8 -1Z" fill="#2a0f14" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
    <g fill="#fff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"><polygon points="-6,-1 -4,7 -3,-1"/><polygon points="6,-1 4,7 3,-1"/></g>
    <!-- forked tongue flicking -->
    <path d="M0 4 V12 L-2 15 M0 12 L2 15" fill="none" stroke="#d4342c" stroke-width="1.2" stroke-linecap="round">
      <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 0.2;1 1;1 0.2;1 0.2" keyTimes="0;.15;.3;1" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g></g>
  <g fill="#9cff57" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5">
    <path d="M55 61 C55 64 57 64 57 62Z"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 10;0 0" keyTimes="0;.9;1" dur="1.9s" repeatCount="indefinite"/></path>
  </g>
  <!-- hanging vine -->
  <g fill="none" stroke="var(--lg-deep, #2e8b57)" stroke-width="1.6" stroke-linecap="round"><path d="M100 0 C98 14 104 22 100 36"/><path d="M18 0 C20 10 16 18 20 28"/></g>
  <g fill="var(--lg-near, #5fb57a)"><ellipse cx="100" cy="18" rx="3" ry="1.6"/><ellipse cx="102" cy="28" rx="3" ry="1.6"/><ellipse cx="18" cy="14" rx="3" ry="1.6"/></g>
</svg>
