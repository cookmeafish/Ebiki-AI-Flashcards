<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Vinecoil: a giant temple cobra coiled round a stone idol, its hood flared wider than the frame and painted
       with glyph eyes. Behind it the temple's carved sun disc turns. A jeweled headpiece, one scale V brow over slit
       eyes, long fangs dripping venom, a forked tongue.
       Entrance: the sun disc rolls in, the hood flares open, the eyes ignite, the jaws open and the tongue flicks. -->
