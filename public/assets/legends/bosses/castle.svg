<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Dread Knight: hollow black armor, a horned great helm with a burning slit, spiked pauldrons, a raised cleaver. -->
  <!-- torn cape behind -->
  <path d="M26 56 C18 76 16 98 8 120 L20 114 L28 120 L38 112 L48 120 H72 L82 112 L92 120 L100 114 L112 120 C104 98 102 76 94 56Z" fill="#7a0c20" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round">
    <animateTransform class="lg-loop" attributeName="transform" type="skewX" values="0;2;0;-2;0" dur="4s" repeatCount="indefinite"/>
  </path>
  <!-- the cleaver: raised on the entrance -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="80 94 92;80 94 92;-8 94 92;0 94 92" keyTimes="0;.5;.75;1" dur="1.5s" fill="freeze"/>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 94 92;-3 94 92;0 94 92" dur="2.8s" begin="1.5s" repeatCount="indefinite"/>
      <path d="M96 88 L104 6 C112 10 118 24 116 40 L104 88Z" fill="#aeb6c4" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M104 6 C112 10 118 24 116 40 L108 42Z" fill="#fff" opacity="0.4"/>
      <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linecap="round"><path d="M112 24 l3 -2 M110 36 l4 0 M109 50 l3 1"/></g>
      <path d="M100 60 L108 58" stroke="#b3122e" stroke-width="2" stroke-linecap="round"/>
      <rect x="92" y="86" width="16" height="5" rx="1.5" fill="#3a3340" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" transform="rotate(-8 100 88)"/>
      <path d="M97 92 L94 112" stroke="#3a3340" stroke-width="5" stroke-linecap="round"/>
      <path d="M97 92 L94 112" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-dasharray="2 2"/>
    </g>
  </g>
  <!-- breastplate -->
  <path d="M34 60 L60 54 L86 60 L84 98 L60 114 L36 98Z" fill="#2a2835" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M34 60 L60 54 L60 114 L36 98Z" fill="#fff" opacity="0.08"/>
  <path d="M86 60 L84 98 L66 110 L72 64Z" fill="#000" opacity="0.28"/>
  <path d="M60 58 V112" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" opacity="0.7"/>
  <!-- skull emblem -->
  <path d="M52 72 C52 66 56 64 60 64 C64 64 68 66 68 72 C68 76 66 78 64 78 V82 H56 V78 C54 78 52 76 52 72Z" fill="#d6d2c4" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
  <g fill="#1d2230"><circle cx="57" cy="72" r="1.8"/><circle cx="63" cy="72" r="1.8"/><path d="M58 80 V82 M60 80 V82 M62 80 V82" stroke="#1d2230" stroke-width="0.8"/></g>
  <!-- chains across the chest -->
  <g fill="none" stroke="#8a8f9c" stroke-width="1.6">
    <path d="M36 66 C46 80 56 90 70 94 C76 96 80 94 84 90" stroke-dasharray="3 1.5"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 1.5;0 0" dur="2.8s" repeatCount="indefinite"/></path>
  </g>
  <!-- spiked pauldrons -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round">
    <path d="M16 70 C14 56 22 46 36 46 C42 46 46 50 46 58 L40 68 Z" fill="#3a3340"/>
    <path d="M104 70 C106 56 98 46 84 46 C78 46 74 50 74 58 L80 68 Z" fill="#3a3340"/>
    <g fill="#aeb6c4" stroke-width="1"><polygon points="20,52 8,40 24,48"/><polygon points="28,46 22,32 32,44"/><polygon points="100,52 112,40 96,48"/><polygon points="92,46 98,32 88,44"/></g>
  </g>
  <path d="M18 64 C18 54 26 48 34 48" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.3"/>
  <!-- gauntlet on the hilt -->
  <path d="M88 82 C90 78 98 78 100 82 L102 94 C98 98 90 98 88 94Z" fill="#3a3340" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"><path d="M90 86 H100 M90 90 H100"/></g>
  <!-- horned great helm -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round">
    <path d="M42 26 C32 22 26 12 28 2 C34 10 40 14 46 16Z" fill="#e8d7b0"/>
    <path d="M78 26 C88 22 94 12 92 2 C86 10 80 14 74 16Z" fill="#e8d7b0"/>
    <path d="M40 22 C40 12 50 8 60 8 C70 8 80 12 80 22 L80 50 C80 56 70 60 60 60 C50 60 40 56 40 50Z" fill="#2a2835"/>
    <path d="M44 20 C46 14 52 11 60 11 C54 14 50 20 48 28 L46 50 L42 48Z" fill="#fff" opacity="0.14" stroke="none"/>
    <path d="M60 8 V60" stroke-width="1" opacity="0.6"/>
    <g fill="#aeb6c4" stroke-width="0.6"><circle cx="46" cy="44" r="1.2"/><circle cx="74" cy="44" r="1.2"/><circle cx="46" cy="52" r="1.2"/><circle cx="74" cy="52" r="1.2"/></g>
  </g>
  <g fill="#b3122e" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"><path d="M58 8 C54 2 60 -2 66 0 C62 2 62 6 62 8Z"/></g>
  <!-- the burning T-slit: ignites on the entrance -->
  <path d="M44 30 H76 V36 H64 V50 H56 V36 H44Z" fill="#0b0708"/>
  <g transform="translate(60 33)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="0.05 1;0.05 1;1.2 1.3;1 1" keyTimes="0;.6;.8;1" dur="1.5s" fill="freeze"/>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1.06 1.2;1 1" dur="0.9s" begin="1.5s" repeatCount="indefinite"/>
      <path d="M-15 -2 H15 V2 H3 V15 H-3 V2 H-15Z" fill="#ff7a1a" opacity="0.5"/>
      <path d="M-13 -1 H13 V1 H2 V13 H-2 V1 H-13Z" fill="#ffd166"/>
      <g fill="#ffb347"><circle cx="-7" cy="0" r="1.6"/><circle cx="7" cy="0" r="1.6"/></g>
    </g>
  </g></g>
  <!-- flame wisps escaping the slit -->
  <g fill="#ff7a1a" opacity="0.8">
    <path d="M50 30 C48 24 52 22 50 16 C56 20 54 26 54 30Z"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.8s" repeatCount="indefinite"/></path>
    <path d="M70 30 C72 24 68 22 70 16 C64 20 66 26 66 30Z"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 -2;0 1;0 -2" dur="0.9s" repeatCount="indefinite"/></path>
  </g>
  <!-- embers -->
  <g fill="#ffb347">
    <circle style="transform-box:fill-box;transform-origin:center" cx="30" cy="34" r="1.2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-4 -24" dur="2.4s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.4s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="86" cy="36" r="1"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;5 -26" dur="2.8s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.8s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
</svg>
