<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Void Devourer: a living moon with one enormous eye, a ring of teeth, star-dust tentacles and a wreckage ring. -->
  <!-- stars -->
  <g fill="var(--lg-light, #ffffff)" stroke="var(--lg-accent, #f2b441)" stroke-width="0.3">
    <circle cx="8" cy="12" r="1"/><circle cx="24" cy="6" r="0.8"/><circle cx="104" cy="10" r="1.2"/><circle cx="114" cy="30" r="0.8"/><circle cx="6" cy="70" r="0.9"/><circle cx="110" cy="100" r="1"/><circle cx="16" cy="108" r="0.8"/>
  </g>
  <!-- star-dust tentacles -->
  <g fill="none" stroke-linecap="round">
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 60 60;8 60 60;0 60 60" dur="4s" repeatCount="indefinite"/>
      <path d="M30 80 C18 96 10 104 4 118" stroke="var(--lg-deep, #7c4def)" stroke-width="5"/><path d="M30 80 C18 96 10 104 4 118" stroke="#c9a2ff" stroke-width="1.4" stroke-dasharray="1 4"/>
      <path d="M90 80 C104 94 112 100 118 112" stroke="var(--lg-deep, #7c4def)" stroke-width="5"/><path d="M90 80 C104 94 112 100 118 112" stroke="#c9a2ff" stroke-width="1.4" stroke-dasharray="1 4"/>
    </g>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 60 60;-8 60 60;0 60 60" dur="4.6s" repeatCount="indefinite"/>
      <path d="M24 44 C10 36 6 22 10 8" stroke="var(--lg-deep, #7c4def)" stroke-width="4"/><path d="M24 44 C10 36 6 22 10 8" stroke="#c9a2ff" stroke-width="1.2" stroke-dasharray="1 4"/>
      <path d="M96 44 C110 36 114 22 110 8" stroke="var(--lg-deep, #7c4def)" stroke-width="4"/><path d="M96 44 C110 36 114 22 110 8" stroke="#c9a2ff" stroke-width="1.2" stroke-dasharray="1 4"/>
    </g>
  </g>
  <!-- the wreckage ring, back half (behind the moon) -->
  <g transform="translate(60 60) scale(1 0.3)">
    <ellipse rx="54" ry="54" fill="none" stroke="var(--lg-accent, #f2b441)" stroke-width="4" opacity="0.35"/>
  </g>
  <!-- the moon body -->
  <circle cx="60" cy="60" r="38" fill="var(--lg-far, #b4b8c2)" stroke="var(--lg-ink, #1d2230)" stroke-width="2.2"/>
  <path d="M60 22 C40 22 24 38 22 58 C30 40 44 30 62 28Z" fill="#fff" opacity="0.3"/>
  <path d="M98 60 C98 82 80 98 60 98 C76 92 90 78 92 58 C92 44 86 32 76 26 C90 32 98 44 98 60Z" fill="#000" opacity="0.3"/>
  <!-- craters -->
  <g fill="#000" opacity="0.18"><circle cx="36" cy="44" r="5"/><circle cx="84" cy="70" r="6"/><circle cx="44" cy="82" r="4"/><circle cx="80" cy="38" r="3.4"/></g>
  <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" opacity="0.5"><circle cx="36" cy="44" r="5"/><circle cx="84" cy="70" r="6"/></g>
  <!-- veins -->
  <g fill="none" stroke="var(--lg-deep, #7c4def)" stroke-width="1.2" stroke-linecap="round" opacity="0.8"><path d="M28 60 C34 58 38 62 42 58 M92 52 C86 54 84 50 78 52 M60 24 C58 30 62 32 60 36"/></g>
  <!-- the great eye: opens on the entrance, iris dilates, looks around -->
  <ellipse cx="60" cy="52" rx="20" ry="13" fill="#0f0a1c" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6"/>
  <g transform="translate(60 52)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.15 1.3;1 1" keyTimes="0;.55;.75;1" dur="1.5s" fill="freeze"/>
    <ellipse rx="18" ry="11.5" fill="#f4eefc"/>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-5 0;0 0;5 1;0 0" dur="5s" begin="1.5s" repeatCount="indefinite"/>
      <circle r="9" fill="#b44bff"/><circle r="9" fill="none" stroke="#2ef2ff" stroke-width="1.4" stroke-dasharray="2 2"/>
      <g><animateTransform class="lg-in" attributeName="transform" type="scale" values="3 1;3 1;0.6 1;1 1" keyTimes="0;.7;.85;1" dur="1.6s" fill="freeze"/>
        <ellipse rx="2" ry="8" fill="#0f0a1c"/></g>
      <circle cx="-3" cy="-4" r="1.8" fill="#fff"/>
    </g>
  </g></g>
  <path d="M38 44 C46 36 74 36 82 44" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="2.4" stroke-linecap="round"/>
  <!-- the ring of teeth: spirals open on the entrance -->
  <g transform="translate(60 80)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="-120;-120;10;0" keyTimes="0;.6;.85;1" dur="1.6s" fill="freeze"/>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="16s" begin="1.6s" repeatCount="indefinite"/>
      <circle r="11" fill="#1a0d24" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4"/>
      <circle r="6" fill="#b44bff" opacity="0.5"/>
      <g fill="#f4efe0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round">
        <polygon points="0,-11 -2,-5 2,-5"/><polygon points="0,11 -2,5 2,5"/><polygon points="-11,0 -5,-2 -5,2"/><polygon points="11,0 5,-2 5,2"/>
        <polygon points="-7.8,-7.8 -4,-3 -3,-5"/><polygon points="7.8,7.8 4,3 3,5"/><polygon points="7.8,-7.8 3,-5 4,-3"/><polygon points="-7.8,7.8 -3,5 -4,3"/>
      </g>
    </g>
  </g></g>
  <!-- the wreckage ring, front half, with debris orbiting -->
  <g transform="translate(60 60) scale(1 0.3)">
    <path d="M-54 0 A54 54 0 0 0 54 0" fill="none" stroke="var(--lg-accent, #f2b441)" stroke-width="4" opacity="0.7"/>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="9s" repeatCount="indefinite"/>
      <g fill="#8d929e" stroke="var(--lg-ink, #1d2230)" stroke-width="2">
        <rect x="46" y="-6" width="12" height="12" transform="rotate(20 52 0)"/><polygon points="-54,-8 -46,0 -54,8 -60,0"/><rect x="-6" y="46" width="10" height="14"/>
      </g>
    </g>
  </g>
</svg>
