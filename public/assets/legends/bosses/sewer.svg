<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Rat King: a heap of tangled rats under a rusty crown. Dozens of red eyes, a giant central rat with yellow
       teeth, a scepter of bones. -->
  <!-- drain grate glow behind -->
  <g fill="var(--lg-far, #9fd4ad)" opacity="0.35"><rect x="20" y="10" width="80" height="60" rx="6"/></g>
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="2" opacity="0.4"><path d="M36 10 V70 M52 10 V70 M68 10 V70 M84 10 V70"/></g>
  <!-- the tangled heap of rats -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round">
    <path d="M6 120 C4 100 12 86 26 82 C40 78 50 84 60 84 C70 84 80 78 94 82 C108 86 116 100 114 120Z" fill="#6b5a5a"/>
    <path d="M6 120 C6 104 12 92 24 86 C18 98 18 108 20 120Z" fill="#fff" opacity="0.12"/>
    <!-- small rats in the heap -->
    <g fill="#7d6a6a">
      <path d="M14 104 C14 96 22 92 30 94 L36 90 L34 96 C36 102 30 106 22 106Z"/>
      <path d="M106 102 C106 94 98 90 90 92 L84 88 L86 94 C84 100 90 104 98 104Z"/>
      <path d="M40 112 C40 104 48 100 56 102 L62 98 L60 104 C62 110 56 114 48 114Z"/>
      <path d="M68 110 C68 102 76 98 84 100 L90 96 L88 102 C90 108 84 112 76 112Z"/>
    </g>
  </g>
  <!-- tangled tails -->
  <g fill="none" stroke="#e8a0a8" stroke-width="1.8" stroke-linecap="round">
    <path d="M22 106 C14 112 22 118 30 114 C38 110 44 116 40 120"/><path d="M98 104 C106 110 98 116 90 112 C82 108 76 114 80 120"/>
    <path d="M50 114 C54 120 62 120 66 114 C70 108 78 110 76 116">
      <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;1 -1;0 0" dur="0.9s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- swarm of red eyes in the heap: light up on the entrance -->
  <g fill="#ff2e4c">
    <g><animateTransform class="lg-in" attributeName="transform" type="translate" values="0 120;0 120;0 0;0 0" keyTimes="0;.45;.46;1" dur="1.2s" fill="freeze"/>
      <circle cx="24" cy="98" r="1.4"/><circle cx="28" cy="98" r="1.4"/><circle cx="94" cy="96" r="1.4"/><circle cx="98" cy="96" r="1.4"/></g>
    <g><animateTransform class="lg-in" attributeName="transform" type="translate" values="0 120;0 120;0 0;0 0" keyTimes="0;.6;.61;1" dur="1.2s" fill="freeze"/>
      <circle cx="50" cy="106" r="1.4"/><circle cx="54" cy="106" r="1.4"/><circle cx="78" cy="104" r="1.4"/><circle cx="82" cy="104" r="1.4"/></g>
    <g><animateTransform class="lg-in" attributeName="transform" type="translate" values="0 120;0 120;0 0;0 0" keyTimes="0;.75;.76;1" dur="1.2s" fill="freeze"/>
      <circle cx="12" cy="112" r="1.2"/><circle cx="15" cy="112" r="1.2"/><circle cx="104" cy="112" r="1.2"/><circle cx="107" cy="112" r="1.2"/><circle cx="36" cy="92" r="1.2"/><circle cx="39" cy="92" r="1.2"/></g>
  </g>
  <!-- bone scepter -->
  <g>
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 92 80;-5 92 80;0 92 80" dur="2.2s" repeatCount="indefinite"/>
    <path d="M90 84 L104 30" stroke="#e6e0cc" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M90 84 L104 30" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-dasharray="4 4"/>
    <path d="M98 30 C98 22 112 22 112 30 C112 34 110 36 108 36 V40 H102 V36 C100 36 98 34 98 30Z" fill="#e6e0cc" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
    <g fill="#ff2e4c"><circle cx="102" cy="30" r="1.4"/><circle cx="108" cy="30" r="1.4"/></g>
    <path d="M86 80 C84 76 90 72 94 76 L96 84 L88 86Z" fill="#8a7676" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
  </g>
  <!-- the giant central rat -->
  <g>
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="0.8s" repeatCount="indefinite"/>
    <path d="M34 84 C30 64 40 46 60 44 C80 46 90 64 86 84 C76 92 44 92 34 84Z" fill="#6b5a5a" stroke="var(--lg-ink, #1d2230)" stroke-width="2"/>
    <path d="M38 80 C36 64 44 52 56 48 C48 58 44 70 46 86Z" fill="#fff" opacity="0.14"/>
    <!-- mangy fur tufts -->
    <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linecap="round" opacity="0.6"><path d="M40 60 l-4 -2 M42 70 l-5 0 M80 60 l4 -2 M78 70 l5 0"/></g>
    <!-- ears, one torn -->
    <path d="M40 48 C30 40 30 26 40 24 C48 24 52 34 50 44Z" fill="#7d6a6a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6"/>
    <path d="M42 44 C36 38 36 30 41 29 C45 29 47 36 46 42Z" fill="#e8a0a8"/>
    <path d="M80 48 C90 40 90 26 80 24 L82 32 L76 30 C72 34 70 40 70 44Z" fill="#7d6a6a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- rusty crown -->
    <path d="M46 42 L46 30 L52 36 L56 26 L60 34 L64 26 L68 36 L74 30 L74 42 C66 40 54 40 46 42Z" fill="#b87a3a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
    <g fill="#8a5a2b" opacity="0.8"><circle cx="50" cy="38" r="1.2"/><circle cx="66" cy="34" r="1"/></g>
    <circle cx="60" cy="36" r="1.8" fill="#2ec4b6" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5"/>
    <!-- snout, whiskers -->
    <path d="M48 62 C48 54 72 54 72 62 L66 76 C62 80 58 80 54 76Z" fill="#8a7676" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4"/>
    <ellipse cx="60" cy="64" rx="4" ry="3" fill="#e8a0a8" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
    <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7">
      <path d="M52 66 L36 62 M52 68 L36 70 M68 66 L84 62 M68 68 L84 70"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 60 66;2 60 66;0 60 66;-2 60 66;0 60 66" dur="0.6s" repeatCount="indefinite"/></path>
    </g>
    <!-- mad red eyes -->
    <g transform="translate(50 54)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="0.05;0.05;1.6;1" keyTimes="0;.7;.84;1" dur="1.5s" fill="freeze"/>
      <circle r="4.6" fill="#ff2e4c" opacity="0.4"/><circle r="3" fill="#ff2e4c" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/><circle r="1" fill="#1a0508"/></g></g>
    <g transform="translate(70 54)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="0.05;0.05;1.6;1" keyTimes="0;.7;.84;1" dur="1.5s" fill="freeze"/>
      <circle r="4.6" fill="#ff2e4c" opacity="0.4"/><circle r="3" fill="#ff2e4c" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/><circle r="1" fill="#1a0508"/></g></g>
    <path d="M44 48 L54 52 M76 48 L66 52" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linecap="round"/>
    <!-- huge yellow incisors -->
    <path d="M54 76 H66 L64 80 H56Z" fill="#1a0f14"/>
    <g fill="#f2d25a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"><path d="M55 76 H59.5 V86 L55 84Z"/><path d="M60.5 76 H65 V84 L60.5 86Z"/></g>
    <path d="M57 78 V82 M63 78 V82" stroke="#b8952c" stroke-width="0.6"/>
  </g>
  <!-- sewer drips -->
  <g fill="#7cff3f">
    <circle style="transform-box:fill-box;transform-origin:center" cx="30" cy="10" r="1.4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 60" dur="1.6s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1.6s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="90" cy="10" r="1.2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 60" dur="2s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
</svg>
