<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Sand Emperor: a pharaoh scorpion. Gold-banded carapace, six eyes, crushing claws, a venom sun on its tail. -->
  <!-- the sun and its turning rays -->
  <g transform="translate(60 40)">
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="24s" repeatCount="indefinite"/>
      <g fill="var(--lg-accent, #f2b441)" opacity="0.35">
        <polygon points="-4,-50 4,-50 0,-36"/><polygon points="-4,50 4,50 0,36"/><polygon points="-50,-4 -50,4 -36,0"/><polygon points="50,-4 50,4 36,0"/>
        <polygon points="-38,-32 -32,-38 -24,-24"/><polygon points="38,32 32,38 24,24"/><polygon points="38,-32 32,-38 24,-24"/><polygon points="-38,32 -32,38 -24,24"/>
      </g>
    </g>
    <circle r="32" fill="var(--lg-accent, #f2b441)" opacity="0.28"/><circle r="24" fill="var(--lg-accent, #f2b441)" opacity="0.3"/>
  </g>
  <!-- legs splayed in the sand -->
  <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 88 L28 92 L20 104 M46 94 L32 102 L28 114 M74 88 L92 92 L100 104 M74 94 L88 102 L92 114"/>
  </g>
  <g fill="none" stroke="var(--lg-deep, #b0702a)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 88 L28 92 L20 104 M46 94 L32 102 L28 114 M74 88 L92 92 L100 104 M74 94 L88 102 L92 114"/>
  </g>
  <!-- the tail: rises over the head on the entrance, sways, drips venom -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="-120 60 96;-120 60 96;10 60 96;0 60 96" keyTimes="0;.4;.7;1" dur="1.5s" fill="freeze"/>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 60 96;5 60 96;0 60 96;-4 60 96;0 60 96" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <g fill="var(--lg-deep, #b0702a)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6">
        <ellipse cx="76" cy="84" rx="7.5" ry="7"/><ellipse cx="88" cy="70" rx="7" ry="7"/><ellipse cx="93" cy="52" rx="6.8" ry="6.8"/><ellipse cx="90" cy="35" rx="6.4" ry="6.4"/><ellipse cx="81" cy="22" rx="6" ry="6"/><ellipse cx="70" cy="14" rx="5.6" ry="5.6"/>
      </g>
      <g fill="#ffd966" opacity="0.8"><rect x="72" y="81" width="8" height="2"/><rect x="84" y="67" width="8" height="2"/><rect x="89" y="49" width="8" height="2"/><rect x="86.5" y="32" width="7" height="2"/><rect x="77.5" y="19" width="7" height="2"/></g>
      <!-- stinger bulb and barb -->
      <path d="M66 14 C58 14 52 10 50 4 C56 2 64 6 70 12Z" fill="#6b2f8a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
      <circle cx="61" cy="9" r="5" fill="#b44bff" opacity="0.35"/>
      <path d="M50 4 L42 10 L49 8Z" fill="#f4e6c8" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
      <circle cx="42" cy="12" r="1.6" fill="#b44bff"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 14;0 0" keyTimes="0;.9;1" dur="1.6s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <!-- carapace with pharaoh bands -->
  <path d="M40 60 C38 76 44 94 60 100 C76 94 82 76 80 60 C76 52 44 52 40 60Z" fill="var(--lg-deep, #b0702a)" stroke="var(--lg-ink, #1d2230)" stroke-width="2.2"/>
  <path d="M44 60 C44 74 48 88 58 96 C48 92 42 78 42 62Z" fill="#fff" opacity="0.2"/>
  <path d="M80 60 C82 76 76 94 60 100 C70 92 76 78 76 60Z" fill="#000" opacity="0.25"/>
  <g fill="none" stroke="#ffd966" stroke-width="2.2"><path d="M42 72 C52 76 68 76 78 72 M44 82 C52 86 68 86 76 82 M48 91 C54 94 66 94 72 91"/></g>
  <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"><path d="M42 70 C52 74 68 74 78 70 M44 80 C52 84 68 84 76 80"/></g>
  <!-- ankh and eye glyphs -->
  <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="1" opacity="0.8"><path d="M60 77 V83 M57 79 H63"/><ellipse cx="60" cy="75.5" rx="1.6" ry="1.6"/></g>
  <!-- left claw: snaps open on the entrance, then keeps snapping -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="40 42 64;40 42 64;-12 42 64;0 42 64" keyTimes="0;.5;.78;1" dur="1.5s" fill="freeze"/>
    <path d="M42 64 L26 60 L18 48" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 64 L26 60 L18 48" fill="none" stroke="var(--lg-deep, #b0702a)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 50 C6 48 2 36 8 28 C12 32 16 34 22 34 C26 40 24 48 18 50Z" fill="var(--lg-near, #d49a4e)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 20 42;0 20 42;-22 20 42;0 20 42" keyTimes="0;.7;.8;1" dur="2.4s" begin="1.5s" repeatCount="indefinite"/>
      <path d="M22 36 C24 28 22 20 16 14 C14 22 14 28 18 34Z" fill="var(--lg-near, #d49a4e)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <g fill="#fff4dc" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"><polygon points="10,30 12,33 13,29"/><polygon points="15,34 17,37 18,33"/></g>
  </g>
  <!-- right claw -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="-40 78 64;-40 78 64;12 78 64;0 78 64" keyTimes="0;.5;.78;1" dur="1.5s" fill="freeze"/>
    <path d="M78 64 L94 62 L100 70" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M78 64 L94 62 L100 70" fill="none" stroke="var(--lg-deep, #b0702a)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M100 68 C112 70 118 80 114 90 C110 86 106 84 100 84 C96 78 96 72 100 68Z" fill="var(--lg-near, #d49a4e)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 100 78;0 100 78;22 100 78;0 100 78" keyTimes="0;.3;.4;1" dur="2.4s" begin="1.5s" repeatCount="indefinite"/>
      <path d="M98 82 C98 92 102 100 108 104 C110 96 108 90 104 84Z" fill="var(--lg-near, #d49a4e)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- head with a golden nemes crown -->
  <path d="M46 58 C46 48 52 44 60 44 C68 44 74 48 74 58 C70 62 50 62 46 58Z" fill="var(--lg-deep, #b0702a)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8"/>
  <path d="M48 50 L44 44 L52 46 L56 40 L60 44 L64 40 L68 46 L76 44 L72 50 C66 47 54 47 48 50Z" fill="#ffd966" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="60" cy="45" r="1.8" fill="#2ec4b6" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/>
  <!-- six eyes: light up in pairs on the entrance -->
  <g fill="#ff3b1f">
    <g transform="translate(55 53)"><g><animateTransform class="lg-in" attributeName="transform" type="scale" values="0;0;1.6;1" keyTimes="0;.6;.72;1" dur="1.4s" fill="freeze"/><circle r="3.4" opacity="0.35"/><circle r="2"/><circle cx="-0.6" cy="-0.6" r="0.6" fill="#fff"/></g></g>
    <g transform="translate(65 53)"><g><animateTransform class="lg-in" attributeName="transform" type="scale" values="0;0;1.6;1" keyTimes="0;.6;.72;1" dur="1.4s" fill="freeze"/><circle r="3.4" opacity="0.35"/><circle r="2"/><circle cx="-0.6" cy="-0.6" r="0.6" fill="#fff"/></g></g>
    <g transform="translate(50 56)"><g><animateTransform class="lg-in" attributeName="transform" type="scale" values="0;0;1.6;1" keyTimes="0;.7;.8;1" dur="1.4s" fill="freeze"/><circle r="1.4"/></g></g>
    <g transform="translate(70 56)"><g><animateTransform class="lg-in" attributeName="transform" type="scale" values="0;0;1.6;1" keyTimes="0;.7;.8;1" dur="1.4s" fill="freeze"/><circle r="1.4"/></g></g>
    <g transform="translate(47 52)"><g><animateTransform class="lg-in" attributeName="transform" type="scale" values="0;0;1.6;1" keyTimes="0;.78;.88;1" dur="1.4s" fill="freeze"/><circle r="1.1"/></g></g>
    <g transform="translate(73 52)"><g><animateTransform class="lg-in" attributeName="transform" type="scale" values="0;0;1.6;1" keyTimes="0;.78;.88;1" dur="1.4s" fill="freeze"/><circle r="1.1"/></g></g>
  </g>
  <!-- mandibles grinding -->
  <g fill="#f4e6c8" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round">
    <path d="M54 60 L50 68 L56 64Z"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 54 60;14 54 60;0 54 60" dur="0.9s" repeatCount="indefinite"/></path>
    <path d="M66 60 L70 68 L64 64Z"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 66 60;-14 66 60;0 66 60" dur="0.9s" repeatCount="indefinite"/></path>
  </g>
  <!-- blowing sand -->
  <g fill="var(--lg-near, #d49a4e)" opacity="0.8">
    <circle style="transform-box:fill-box;transform-origin:center" cx="6" cy="112" r="1.4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;40 -6" dur="1.6s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1.6s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="14" cy="118" r="1"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;50 -4" dur="2s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="70" cy="116" r="1.2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;44 -5" dur="1.8s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1.8s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
</svg>
