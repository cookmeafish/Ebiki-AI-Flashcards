<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Pyrewyrm: an obsidian dragon rising out of the lava in profile, breathing a torrent of fire. -->
  <!-- smoke plume -->
  <g fill="#3a3340" opacity="0.35">
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-3 -4;0 0" dur="4s" repeatCount="indefinite"/>
    <circle cx="26" cy="22" r="14"/><circle cx="42" cy="10" r="12"/><circle cx="14" cy="38" r="11"/><circle cx="60" cy="6" r="9"/>
  </g>
  <!-- lava pool and splashes -->
  <path d="M0 104 C20 98 40 102 60 99 C80 96 100 102 120 98 V120 H0Z" fill="#ff5a1f" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6"/>
  <path d="M0 110 C24 106 48 110 70 107 C90 104 104 110 120 106 V120 H0Z" fill="#ffb347"/>
  <g fill="#fff1b8"><ellipse cx="30" cy="112" rx="6" ry="1.6"/><ellipse cx="92" cy="114" rx="8" ry="1.8"/></g>
  <g fill="#1a1216" opacity="0.6"><ellipse cx="54" cy="116" rx="9" ry="2"/><ellipse cx="10" cy="116" rx="5" ry="1.5"/></g>
  <!-- neck rising from the lava, breathing -->
  <g transform="translate(34 104)"><g>
    <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1.02 1.03;1 1" dur="2.4s" repeatCount="indefinite"/>
    <g transform="translate(-34 -104)">
      <path d="M14 106 C12 84 18 66 32 54 C40 48 48 46 56 48 L60 62 C50 62 42 68 38 80 C36 90 38 100 44 106Z" fill="#2a2230" stroke="var(--lg-ink, #1d2230)" stroke-width="2"/>
      <path d="M24 104 C22 88 26 76 34 66 L40 70 C36 80 34 92 36 104Z" fill="var(--lg-deep, #c0392b)" opacity="0.85"/>
      <g stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" fill="none" opacity="0.8"><path d="M25 92 H37 M26 84 H38 M29 76 H40"/></g>
      <!-- back spines -->
      <g fill="var(--lg-accent, #f2b441)" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round">
        <polygon points="14,92 4,90 13,84"/><polygon points="16,78 6,74 17,70"/><polygon points="22,64 14,56 26,58"/><polygon points="32,54 28,44 38,50"/>
      </g>
      <!-- molten cracks -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 98 L22 90 L18 84 M28 60 L34 58 L38 52" stroke="#ff7a1a" stroke-width="3.4" opacity="0.45"/>
        <path d="M18 98 L22 90 L18 84 M28 60 L34 58 L38 52" stroke="#ffd166" stroke-width="1.2"/>
      </g>
    </g>
  </g></g>
  <!-- head in profile, facing right -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="30 44 56;30 44 56;-8 44 56;0 44 56" keyTimes="0;.5;.78;1" dur="1.5s" fill="freeze"/>
    <!-- swept horns -->
    <path d="M46 36 C38 26 30 22 18 22 C26 26 32 32 36 42Z" fill="#e8d7b0" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M56 32 C54 20 48 12 38 6 C44 14 46 24 46 34Z" fill="#e8d7b0" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
    <g stroke="var(--lg-ink, #1d2230)" stroke-width="0.7" opacity="0.6"><path d="M28 24 L30 28 M34 26 L35 31 M44 12 L41 16 M48 20 L45 23"/></g>
    <!-- skull -->
    <path d="M40 42 C44 32 56 28 66 30 C76 32 86 36 94 42 L100 46 L94 50 C86 50 76 52 70 56 L60 64 C50 64 42 58 40 50Z" fill="#2a2230" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M44 38 C50 32 58 30 66 30 C76 32 86 36 94 42 C80 38 64 36 50 42Z" fill="var(--lg-deep, #c0392b)" opacity="0.8"/>
    <!-- nostril smoke -->
    <circle cx="95" cy="44" r="1.4" fill="#ffd166"/>
    <g fill="#8a7f94" opacity="0.6">
      <circle style="transform-box:fill-box;transform-origin:center" cx="100" cy="40" r="2.4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;6 -10" dur="1.2s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1.2s" repeatCount="indefinite" additive="sum"/></circle>
    </g>
    <!-- brow ridge and the burning eye -->
    <path d="M54 36 L72 36 L66 40 L56 40Z" fill="#1a1216" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
    <g transform="translate(63 41) rotate(-10)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.4 1.4;1 1" keyTimes="0;.55;.75;1" dur="1.4s" fill="freeze"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.18;1" dur="1s" begin="1.4s" repeatCount="indefinite"/><ellipse rx="7" ry="4" fill="#ff7a1a" opacity="0.4"/><ellipse rx="4.4" ry="2.4" fill="#ffe066"/><ellipse rx="0.9" ry="2.2" fill="#1a1216"/></g>
    </g></g>
    <!-- jaw: gapes open on the entrance -->
    <g>
      <animateTransform class="lg-in" attributeName="transform" type="rotate" values="-16 60 58;-16 60 58;10 60 58;0 60 58" keyTimes="0;.6;.8;1" dur="1.5s" fill="freeze"/>
      <path d="M60 60 C70 58 80 58 92 62 L96 66 L90 68 C80 70 70 70 62 68Z" fill="#2a2230" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
      <g fill="#f4e6c8" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round"><polygon points="70,60 72,56 74,60"/><polygon points="78,60 80,55 82,61"/><polygon points="86,62 88,57 90,63"/></g>
    </g>
    <g fill="#f4e6c8" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round"><polygon points="72,53 74,58 76,53"/><polygon points="80,52 82,58 84,51"/><polygon points="88,50 90,55 92,49"/></g>
    <!-- fin frill -->
    <path d="M42 50 L32 54 L40 58 L34 64 L44 62Z" fill="var(--lg-accent, #f2b441)" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
  </g>
  <!-- the fire torrent: bursts out on the entrance, then roars -->
  <g transform="translate(94 58)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="0.02;0.02;1.25;1" keyTimes="0;.7;.86;1" dur="1.6s" fill="freeze"/>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1.08 0.9;0.95 1.1;1 1" dur="0.5s" repeatCount="indefinite"/>
      <path d="M0 0 C8 -8 18 -6 26 -14 C24 -4 30 2 26 12 C30 16 28 26 20 32 C18 22 10 20 4 14 C8 10 4 4 0 0Z" fill="#ff5a1f" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M2 2 C10 -2 16 0 22 -6 C20 2 24 8 20 14 C22 18 20 22 16 26 C14 18 8 16 4 12Z" fill="#ffb347"/>
      <path d="M4 4 C10 2 14 4 18 2 C16 8 18 12 14 16 C12 12 8 10 6 8Z" fill="#fff1b8"/>
    </g>
  </g></g>
  <!-- embers rising -->
  <g fill="#ffb347">
    <circle style="transform-box:fill-box;transform-origin:center" cx="70" cy="96" r="1.4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-4 -40" dur="2.2s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.2s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="84" cy="100" r="1.1"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;3 -50" dur="2.8s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.8s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="104" cy="96" r="1.3"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-6 -44" dur="2.5s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.5s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="8" cy="96" r="1.2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;4 -36" dur="2.1s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.1s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
</svg>
