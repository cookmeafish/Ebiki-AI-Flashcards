<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Captain Dreadtide: an undead pirate captain. Barnacled tricorn, skull with one burning eye, a coat of rags, a hook,
       a rusted anchor on a chain, a ghost parrot. -->
  <!-- ghostly sea mist -->
  <g fill="#7cffcb" opacity="0.12"><ellipse cx="60" cy="104" rx="60" ry="14"/><ellipse cx="60" cy="40" rx="50" ry="30"/></g>
  <!-- the anchor on its chain: swings up on the entrance -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="70 96 70;70 96 70;-12 96 70;0 96 70" keyTimes="0;.5;.75;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 96 70;6 96 70;0 96 70" dur="2.6s" begin="1.5s" repeatCount="indefinite"/>
      <path d="M96 70 L104 96" stroke="#8a8f9c" stroke-width="2.4" stroke-dasharray="3 1.5"/>
      <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round" fill="#6b5a4a">
        <circle cx="105" cy="99" r="3" fill="none" stroke-width="2"/>
        <path d="M103 102 H107 V116 H103Z"/><path d="M96 110 C98 118 112 118 114 110 L118 112 C116 122 94 122 92 112Z"/>
        <path d="M98 106 H112" stroke-width="2.4"/>
      </g>
      <g fill="#a6b8a0"><circle cx="104" cy="110" r="1.2"/><circle cx="96" cy="113" r="1"/></g>
    </g>
  </g>
  <!-- ragged greatcoat -->
  <path d="M28 120 L32 80 L44 66 H76 L88 80 L92 120 L84 114 L78 120 L70 112 L60 120 L50 112 L42 120 L36 114Z" fill="#3a2230" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M32 80 L44 66 H52 L40 84 L36 114 L28 120Z" fill="#fff" opacity="0.1"/>
  <path d="M88 80 L92 120 L84 114 L82 86 L76 68Z" fill="#000" opacity="0.28"/>
  <path d="M52 66 L60 90 L68 66" fill="none" stroke="#c9a441" stroke-width="2"/>
  <g fill="#c9a441" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"><circle cx="46" cy="90" r="1.8"/><circle cx="46" cy="100" r="1.8"/><circle cx="74" cy="90" r="1.8"/><circle cx="74" cy="100" r="1.8"/></g>
  <!-- ribs behind the torn shirt -->
  <path d="M54 72 H66 L64 94 H56Z" fill="#1a0f14"/>
  <g stroke="#d9d3bf" stroke-width="1.6" stroke-linecap="round"><path d="M56 78 H64 M56 84 H64 M57 90 H63"/></g>
  <!-- hook arm, raised -->
  <g>
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 34 76;-6 34 76;0 34 76" dur="2.2s" repeatCount="indefinite"/>
    <path d="M34 76 L20 62 L16 50" fill="none" stroke="#3a2230" stroke-width="8" stroke-linecap="round"/>
    <path d="M14 52 L18 46" stroke="#c9a441" stroke-width="4"/>
    <path d="M16 46 C10 42 10 32 16 30 C20 28 24 32 22 36" fill="none" stroke="#c9ccd6" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 46 C10 42 10 32 16 30 C20 28 24 32 22 36" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
  </g>
  <!-- ghost parrot on the shoulder -->
  <g opacity="0.85">
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="1.6s" repeatCount="indefinite"/>
    <path d="M80 66 C78 58 82 52 88 52 C94 52 96 58 92 64 L88 70 L84 76Z" fill="#7cffcb" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
    <path d="M92 56 L98 58 L92 60Z" fill="#c9a441"/><circle cx="89" cy="56" r="1.4" fill="#1d2230"/>
  </g>
  <!-- skull head -->
  <path d="M42 44 C42 32 50 26 60 26 C70 26 78 32 78 44 C78 52 74 56 70 58 V64 H50 V58 C46 56 42 52 42 44Z" fill="#e6e0cc" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8"/>
  <path d="M72 30 C76 36 78 42 76 50 C74 54 72 56 70 58 C72 50 74 40 72 30Z" fill="#000" opacity="0.12"/>
  <path d="M54 50 L57 46 L60 50Z" fill="#1d2230"/>
  <g stroke="#1d2230" stroke-width="1"><path d="M52 58 V64 M56 58 V64 M60 58 V64 M64 58 V64 M68 58 V64 M50 60 H70"/></g>
  <!-- gold tooth -->
  <rect x="57" y="58" width="3" height="4" fill="#ffd966" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5"/>
  <!-- eyepatch and the burning eye -->
  <path d="M40 34 L80 42" stroke="#1d2230" stroke-width="1.4"/>
  <ellipse cx="68" cy="42" rx="6" ry="5" fill="#1d2230"/>
  <ellipse cx="52" cy="42" rx="5.4" ry="5" fill="#0f0c16"/>
  <g transform="translate(52 42)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="0.05;0.05;1.8;1" keyTimes="0;.6;.78;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;0.9 1.25;1 1" dur="0.9s" begin="1.5s" repeatCount="indefinite"/>
      <circle r="6" fill="#7cffcb" opacity="0.4"/><path d="M0 3 C-2.6 2 -2.6 -1 0 -5 C2.6 -1 2.6 2 0 3Z" fill="#e9fff6"/></g>
  </g></g>
  <!-- scars and a crack -->
  <path d="M46 34 L50 40 M72 50 L68 54 L70 56" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
  <!-- barnacled tricorn with a skull badge -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round">
    <path d="M26 34 C34 26 46 14 60 14 C74 14 86 26 94 34 C84 30 72 32 60 32 C48 32 36 30 26 34Z" fill="#1d1b28"/>
    <path d="M36 28 C40 16 50 8 60 8 C70 8 80 16 84 28 C76 24 68 22 60 22 C52 22 44 24 36 28Z" fill="#2a2433"/>
    <path d="M26 34 C34 26 46 14 60 14" fill="none" stroke="#c9a441" stroke-width="1.2"/>
  </g>
  <path d="M56 16 C56 12 64 12 64 16 C64 18 63 19 62 19 V20 H58 V19 C57 19 56 18 56 16Z" fill="#e6e0cc" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/>
  <path d="M54 22 L66 18 M54 18 L66 22" stroke="#e6e0cc" stroke-width="1.2"/>
  <g fill="#a6b8a0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5"><circle cx="40" cy="28" r="1.8"/><circle cx="44" cy="30" r="1.2"/><circle cx="80" cy="26" r="1.6"/></g>
  <!-- seaweed hanging from the hat -->
  <path d="M30 34 C28 40 32 44 30 50" fill="none" stroke="var(--lg-deep, #1f6f99)" stroke-width="2" stroke-linecap="round">
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 30 34;8 30 34;0 30 34" dur="2.8s" repeatCount="indefinite"/>
  </path>
</svg>
