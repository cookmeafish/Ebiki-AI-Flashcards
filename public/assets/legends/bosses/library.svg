<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Ink Grimoire: a living spellbook. Pages for teeth, one eye on the cover, ink tentacles, chained clasps,
       quills orbiting like blades. -->
  <!-- arcane circle behind -->
  <g transform="translate(60 56)">
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;-360" dur="20s" repeatCount="indefinite"/>
      <circle r="50" fill="none" stroke="var(--lg-accent, #f2b441)" stroke-width="1.4" stroke-dasharray="6 3" opacity="0.6"/>
      <circle r="44" fill="none" stroke="var(--lg-accent, #f2b441)" stroke-width="0.8" opacity="0.5"/>
      <g fill="var(--lg-accent, #f2b441)" opacity="0.6"><path d="M0 -50 l3 5 h-6Z"/><path d="M0 50 l3 -5 h-6Z"/><path d="M-50 0 l5 3 v-6Z"/><path d="M50 0 l-5 3 v-6Z"/></g>
    </g>
  </g>
  <!-- ink tentacles below -->
  <g fill="#1c1030" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round">
    <path d="M40 90 C34 102 24 108 16 118 C24 118 34 112 42 102Z"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 40 90;-6 40 90;0 40 90" dur="2.4s" repeatCount="indefinite"/></path>
    <path d="M80 90 C86 102 96 108 104 118 C96 118 86 112 78 102Z"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 80 90;6 80 90;0 80 90" dur="2.6s" repeatCount="indefinite"/></path>
    <path d="M56 92 C54 104 50 112 52 120 H60 C58 112 62 104 64 94Z"/>
  </g>
  <g fill="#1c1030"><circle cx="30" cy="114" r="2.4"/><circle cx="92" cy="116" r="2"/></g>
  <!-- the back cover and the open pages -->
  <path d="M14 34 L60 44 L106 34 L106 92 L60 100 L14 92Z" fill="#5a2a1e" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
  <!-- page-teeth mouth: the book gapes open on the entrance -->
  <g transform="translate(60 68)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.1;1 0.1;1.05 1.25;1 1" keyTimes="0;.55;.75;1" dur="1.5s" fill="freeze"/>
    <g transform="translate(-60 -68)">
      <path d="M18 48 L60 56 L102 48 L102 86 L60 92 L18 86Z" fill="#1c0f24" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"/>
      <ellipse cx="60" cy="76" rx="22" ry="8" fill="#b44bff" opacity="0.45"/>
      <!-- upper page teeth -->
      <g fill="#f4e8cc" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7" stroke-linejoin="round">
        <polygon points="20,48 26,62 30,50"/><polygon points="30,50 35,64 40,52"/><polygon points="40,52 45,66 50,54"/><polygon points="50,54 55,68 60,56"/>
        <polygon points="60,56 65,68 70,54"/><polygon points="70,54 75,66 80,52"/><polygon points="80,52 85,64 90,50"/><polygon points="90,50 94,62 100,48"/>
        <polygon points="22,86 28,74 32,87"/><polygon points="34,88 40,76 44,89"/><polygon points="46,90 52,78 56,91"/><polygon points="64,91 68,78 74,90"/><polygon points="76,89 80,76 86,88"/><polygon points="88,87 92,74 98,86"/>
      </g>
      <g stroke="#b8a888" stroke-width="0.5"><path d="M26 56 L28 60 M45 60 L47 64 M65 62 L67 66 M85 58 L87 62"/></g>
    </g>
  </g></g>
  <!-- the front cover lifted as a brow, with the eye -->
  <g>
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M14 34 L60 44 L106 34 L102 14 L60 22 L18 14Z" fill="#7a3a28" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M18 14 L60 22 L60 30 L20 22Z" fill="#fff" opacity="0.15"/>
    <!-- gold corner fittings -->
    <g fill="#c9a441" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"><path d="M18 14 L28 16 L22 22Z"/><path d="M102 14 L92 16 L98 22Z"/></g>
    <!-- chained clasps -->
    <g stroke="#8a8f9c" stroke-width="1.6" stroke-dasharray="2 1.2" fill="none"><path d="M26 30 L26 50 M94 30 L94 50"/></g>
    <g fill="#c9a441" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"><rect x="23" y="28" width="6" height="4"/><rect x="91" y="28" width="6" height="4"/></g>
    <!-- the eye on the cover -->
    <path d="M44 30 C50 22 70 22 76 30 C70 38 50 38 44 30Z" fill="#f4efe0" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4"/>
    <g transform="translate(60 30)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.2 1.3;1 1" keyTimes="0;.65;.82;1" dur="1.5s" fill="freeze"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="-3 0;3 0;-3 0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
        <circle r="5" fill="#b44bff"/><ellipse rx="1.4" ry="4" fill="#1c0f24"/><circle cx="-1.6" cy="-2" r="1" fill="#fff"/></g>
    </g></g>
    <path d="M42 26 L52 28 M78 26 L68 28" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linecap="round"/>
    <!-- runes -->
    <g fill="none" stroke="#c9a441" stroke-width="1"><path d="M32 22 l2 4 l2 -4 M84 22 l2 4 l2 -4 M58 40 h4"/></g>
  </g>
  <!-- quills orbiting like blades -->
  <g transform="translate(60 60)">
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
      <g stroke="var(--lg-ink, #1d2230)" stroke-width="0.8">
        <path d="M0 -58 C4 -54 4 -46 0 -42 C-4 -46 -4 -54 0 -58Z" fill="#f4efe0"/><path d="M0 -42 V-38" stroke="#1d2230" stroke-width="1.4"/>
        <path d="M58 0 C54 4 46 4 42 0 C46 -4 54 -4 58 0Z" fill="#f4efe0"/><path d="M42 0 H38" stroke="#1d2230" stroke-width="1.4"/>
        <path d="M-58 0 C-54 -4 -46 -4 -42 0 C-46 4 -54 4 -58 0Z" fill="#f4efe0"/><path d="M-42 0 H-38" stroke="#1d2230" stroke-width="1.4"/>
      </g>
    </g>
  </g>
  <!-- ink drips -->
  <g fill="#1c1030">
    <circle style="transform-box:fill-box;transform-origin:center" cx="40" cy="94" r="1.8"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 20" dur="1.4s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1.4s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="82" cy="94" r="1.6"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 22" dur="1.7s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1.7s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
</svg>
