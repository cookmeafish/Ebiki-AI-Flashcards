<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Prism Hydra: three serpent heads of living crystal from one faceted body, gem eyes, glass fangs, split light. -->
  <!-- split light beams -->
  <g opacity="0.4">
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="-4 60 60;4 60 60;-4 60 60" dur="5s" repeatCount="indefinite"/>
    <path d="M60 60 L0 0 H10Z" fill="#ff3fd2"/><path d="M60 60 L20 0 H30Z" fill="#ffd23f"/><path d="M60 60 L90 0 H100Z" fill="#2ef2ff"/><path d="M60 60 L110 0 H120Z" fill="#7cff3f"/>
  </g>
  <!-- faceted crystal body -->
  <path d="M26 120 L32 88 L48 76 H72 L88 88 L94 120Z" fill="var(--lg-deep, #7c4def)" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round">
    <path d="M32 88 L48 76 L52 100 L36 120Z" fill="#fff" opacity="0.28"/><path d="M72 76 L88 88 L84 120 L68 100Z" fill="#000" opacity="0.25"/>
    <path d="M48 76 H72 L68 100 H52Z" fill="var(--lg-near, #a585f5)"/>
  </g>
  <!-- crystal spikes on the body -->
  <g fill="#9ff3ff" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"><polygon points="30,96 20,80 34,90"/><polygon points="90,96 100,80 86,90"/><polygon points="58,100 60,86 62,100"/></g>
  <!-- LEFT neck and head: rears up (staggered) -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="-60 40 84;-60 40 84;-60 40 84;8 40 84;0 40 84" keyTimes="0;.3;.45;.7;1" dur="1.6s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 40 84;-5 40 84;0 40 84" dur="2.8s" begin="1.6s" repeatCount="indefinite"/>
      <path d="M40 84 L30 60 L22 44 L30 40 L38 56 L48 80Z" fill="var(--lg-deep, #7c4def)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M14 40 L22 26 L36 28 L40 40 L32 46 L18 46Z" fill="var(--lg-near, #a585f5)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M22 26 L36 28 L28 36Z" fill="#fff" opacity="0.4"/>
      <polygon points="22,26 18,14 26,24" fill="#9ff3ff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
      <circle cx="28" cy="34" r="2.6" fill="#ff3fd2" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/>
      <path d="M14 40 L20 44 L16 46Z" fill="#fff"/>
    </g>
  </g>
  <!-- RIGHT neck and head -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="60 80 84;60 80 84;60 80 84;-8 80 84;0 80 84" keyTimes="0;.4;.55;.8;1" dur="1.6s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 80 84;5 80 84;0 80 84" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
      <path d="M80 84 L90 60 L98 44 L90 40 L82 56 L72 80Z" fill="var(--lg-deep, #7c4def)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M106 40 L98 26 L84 28 L80 40 L88 46 L102 46Z" fill="var(--lg-near, #a585f5)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M98 26 L106 40 L96 36Z" fill="#000" opacity="0.2"/>
      <polygon points="98,26 102,14 94,24" fill="#9ff3ff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
      <circle cx="92" cy="34" r="2.6" fill="#2ef2ff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/>
      <path d="M106 40 L100 44 L104 46Z" fill="#fff"/>
    </g>
  </g>
  <!-- CENTER neck and the great head -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="translate" values="0 40;0 40;0 40;0 -4;0 0" keyTimes="0;.5;.62;.84;1" dur="1.6s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.2s" begin="1.6s" repeatCount="indefinite"/>
      <path d="M52 80 L54 50 H66 L68 80Z" fill="var(--lg-deep, #7c4def)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M54 50 H60 V80 H52Z" fill="#fff" opacity="0.2"/>
      <!-- head: a cut gem -->
      <path d="M40 34 L50 16 H70 L80 34 L72 52 H48Z" fill="var(--lg-near, #a585f5)" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
      <path d="M50 16 H70 L60 30Z" fill="#fff" opacity="0.45"/><path d="M70 16 L80 34 L72 52 L66 36Z" fill="#000" opacity="0.2"/>
      <g stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" fill="none" opacity="0.6"><path d="M40 34 L60 30 L80 34 M60 30 L60 52"/></g>
      <!-- prism horns -->
      <g fill="#9ff3ff" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"><polygon points="50,16 44,0 54,14"/><polygon points="70,16 76,0 66,14"/><polygon points="60,16 60,4 62,16"/></g>
      <!-- gem eyes -->
      <g transform="translate(50 34)"><g><animateTransform class="lg-in" attributeName="transform" type="scale" values="0.05;0.05;1.6;1" keyTimes="0;.66;.82;1" dur="1.5s" fill="freeze"/>
        <circle r="5" fill="#ffd23f" opacity="0.4"/><path d="M-4 0 L0 -3 L4 0 L0 3Z" fill="#ffd23f" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/></g></g>
      <g transform="translate(70 34)"><g><animateTransform class="lg-in" attributeName="transform" type="scale" values="0.05;0.05;1.6;1" keyTimes="0;.66;.82;1" dur="1.5s" fill="freeze"/>
        <circle r="5" fill="#ffd23f" opacity="0.4"/><path d="M-4 0 L0 -3 L4 0 L0 3Z" fill="#ffd23f" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/></g></g>
      <path d="M44 28 L56 32 M76 28 L64 32" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linecap="round"/>
      <!-- glass-fanged maw -->
      <path d="M48 42 H72 L66 52 H54Z" fill="#1c0f24" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
      <g fill="#e6fdff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5"><polygon points="50,42 52,48 54,42"/><polygon points="66,42 68,48 70,42"/><polygon points="57,42 58,46 59,42"/><polygon points="61,42 62,46 63,42"/></g>
      <ellipse cx="60" cy="49" rx="4" ry="1.4" fill="#ff3fd2" opacity="0.8"/>
    </g>
  </g>
  <!-- glints -->
  <g fill="#fff">
    <path style="transform-box:fill-box;transform-origin:center" d="M24 70 l1 3 l3 1 l-3 1 l-1 3 l-1 -3 l-3 -1 l3 -1Z"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.5;1" dur="1.3s" repeatCount="indefinite" additive="sum"/></path>
    <path d="M96 66 l1 3 l3 1 l-3 1 l-1 3 l-1 -3 l-3 -1 l3 -1Z"/>
  </g>
</svg>
