<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Fallen Seraph: a six-winged angelic horror. Rings of eyes turning, a cracked halo, a faceless mask of light,
       wings tipped with feathers of blades. -->
  <!-- a beam of light behind -->
  <path d="M44 0 H76 L96 120 H24Z" fill="#fff6c2" opacity="0.3"/>
  <!-- six wings: lower, middle, upper pairs; they open on the entrance -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round">
    <!-- lower pair -->
    <g><animateTransform class="lg-in" attributeName="transform" type="rotate" values="70 52 70;70 52 70;-6 52 70;0 52 70" keyTimes="0;.5;.75;1" dur="1.6s" fill="freeze"/>
      <path d="M52 70 C36 80 20 96 12 112 L20 108 L18 116 L26 108 L28 116 L34 104 C40 92 48 82 56 76Z" fill="#e8e0f8"/></g>
    <g><animateTransform class="lg-in" attributeName="transform" type="rotate" values="-70 68 70;-70 68 70;6 68 70;0 68 70" keyTimes="0;.5;.75;1" dur="1.6s" fill="freeze"/>
      <path d="M68 70 C84 80 100 96 108 112 L100 108 L102 116 L94 108 L92 116 L86 104 C80 92 72 82 64 76Z" fill="#e8e0f8"/></g>
    <!-- middle pair, spread wide -->
    <g><animateTransform class="lg-in" attributeName="transform" type="rotate" values="80 50 56;80 50 56;-8 50 56;0 50 56" keyTimes="0;.55;.8;1" dur="1.6s" fill="freeze"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 50 56;-6 50 56;0 50 56" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
        <path d="M50 56 C34 44 16 42 2 50 L10 54 L2 58 L12 60 L4 66 L16 66 L10 72 L24 68 C36 66 46 64 52 62Z" fill="#f4f0ff"/>
        <!-- blade feathers -->
        <g fill="#c9ccd6"><path d="M2 50 L-2 50 L6 46Z M2 58 L-3 60 L6 57Z M4 66 L-1 70 L8 65Z"/></g>
      </g></g>
    <g><animateTransform class="lg-in" attributeName="transform" type="rotate" values="-80 70 56;-80 70 56;8 70 56;0 70 56" keyTimes="0;.55;.8;1" dur="1.6s" fill="freeze"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 70 56;6 70 56;0 70 56" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
        <path d="M70 56 C86 44 104 42 118 50 L110 54 L118 58 L108 60 L116 66 L104 66 L110 72 L96 68 C84 66 74 64 68 62Z" fill="#f4f0ff"/>
        <g fill="#c9ccd6"><path d="M118 50 L122 50 L114 46Z M118 58 L123 60 L114 57Z M116 66 L121 70 L112 65Z"/></g>
      </g></g>
    <!-- upper pair, folded over the head -->
    <g><animateTransform class="lg-in" attributeName="transform" type="rotate" values="90 54 40;90 54 40;-6 54 40;0 54 40" keyTimes="0;.6;.85;1" dur="1.6s" fill="freeze"/>
      <path d="M54 40 C44 26 36 12 38 0 L44 6 L46 0 L50 8 L54 2 L56 12 C58 20 58 30 58 38Z" fill="#fff"/></g>
    <g><animateTransform class="lg-in" attributeName="transform" type="rotate" values="-90 66 40;-90 66 40;6 66 40;0 66 40" keyTimes="0;.6;.85;1" dur="1.6s" fill="freeze"/>
      <path d="M66 40 C76 26 84 12 82 0 L76 6 L74 0 L70 8 L66 2 L64 12 C62 20 62 30 62 38Z" fill="#fff"/></g>
  </g>
  <!-- eyes on the middle wings -->
  <g fill="#ffd23f" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"><ellipse cx="24" cy="56" rx="3" ry="1.8"/><ellipse cx="96" cy="56" rx="3" ry="1.8"/><ellipse cx="36" cy="94" rx="2.4" ry="1.4"/><ellipse cx="84" cy="94" rx="2.4" ry="1.4"/></g>
  <g fill="#1a0508"><circle cx="24" cy="56" r="0.9"/><circle cx="96" cy="56" r="0.9"/><circle cx="36" cy="94" r="0.7"/><circle cx="84" cy="94" r="0.7"/></g>
  <!-- the robed body -->
  <path d="M46 56 C42 76 42 100 38 120 H82 C78 100 78 76 74 56 C70 50 50 50 46 56Z" fill="#f4f0ff" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6"/>
  <path d="M52 60 C50 80 50 100 48 120 M68 60 C70 80 70 100 72 120" fill="none" stroke="#c8bce8" stroke-width="1.2"/>
  <path d="M46 56 C42 76 42 100 38 120 H44 C46 96 46 76 50 58Z" fill="#fff" opacity="0.7"/>
  <!-- a crack of corruption down the robe -->
  <path d="M60 70 L58 80 L62 86 L57 98 L61 110 L58 120" fill="none" stroke="#b3122e" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- the rings of eyes: two gyroscope rings, turning -->
  <g transform="translate(60 42)">
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/>
      <ellipse rx="26" ry="8" fill="none" stroke="#c9a441" stroke-width="2.4"/>
      <g fill="#fff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5"><ellipse cx="-26" rx="2.4" ry="1.6"/><ellipse cx="26" rx="2.4" ry="1.6"/><ellipse cx="-13" cy="-7" rx="2" ry="1.3"/><ellipse cx="13" cy="7" rx="2" ry="1.3"/></g>
      <g fill="#ff2e4c"><circle cx="-26" r="0.8"/><circle cx="26" r="0.8"/><circle cx="-13" cy="-7" r="0.7"/><circle cx="13" cy="7" r="0.7"/></g>
    </g>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="90;-270" dur="10s" repeatCount="indefinite"/>
      <ellipse rx="22" ry="7" fill="none" stroke="#e0bf5a" stroke-width="2"/>
      <g fill="#fff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5"><ellipse cx="-22" rx="2" ry="1.4"/><ellipse cx="22" rx="2" ry="1.4"/></g>
      <g fill="#ff2e4c"><circle cx="-22" r="0.7"/><circle cx="22" r="0.7"/></g>
    </g>
  </g>
  <!-- the faceless mask of light -->
  <g transform="translate(60 42)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="0.2;0.2;1.3;1" keyTimes="0;.7;.86;1" dur="1.6s" fill="freeze"/>
    <circle r="16" fill="#fff6c2" opacity="0.5"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.15;1" dur="1.6s" begin="1.6s" repeatCount="indefinite"/></circle>
    <path d="M-10 -4 C-10 -14 10 -14 10 -4 C10 8 4 14 0 14 C-4 14 -10 8 -10 -4Z" fill="#fffdf2" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"/>
    <!-- no face: just a vertical slit of red light and a crack -->
    <path d="M0 -8 V8" stroke="#ff2e4c" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M0 -8 V8" stroke="#fff" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M4 -10 L6 -4 L3 0" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7"/>
  </g></g>
  <!-- the cracked halo, tilted -->
  <g transform="translate(60 14)">
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="-8;8;-8" dur="3s" repeatCount="indefinite"/>
      <ellipse rx="16" ry="4" fill="none" stroke="#ffd23f" stroke-width="3" stroke-dasharray="40 3 20 4"/>
      <ellipse rx="16" ry="4" fill="none" stroke="#fff6c2" stroke-width="1"/>
    </g>
  </g>
  <!-- falling feathers and light motes -->
  <g fill="#f4f0ff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5">
    <path style="transform-box:fill-box;transform-origin:center" d="M18 20 C20 16 24 16 24 20 C22 22 20 22 18 20Z"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;6 40" dur="4s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="4s" repeatCount="indefinite" additive="sum"/></path>
    <path style="transform-box:fill-box;transform-origin:center" d="M100 14 C102 10 106 10 106 14 C104 16 102 16 100 14Z"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-6 40" dur="4.6s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="4.6s" repeatCount="indefinite" additive="sum"/></path>
  </g>
</svg>
