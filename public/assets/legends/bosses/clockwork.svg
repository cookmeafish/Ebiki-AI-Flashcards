<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Brass Juggernaut: a clockwork minotaur. Spinning gears, smokestacks, a furnace chest, gauge eyes, iron horns. -->
  <!-- big gears behind the shoulders -->
  <g transform="translate(18 56)">
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
      <circle r="16" fill="none" stroke="#8a5a2b" stroke-width="8" stroke-dasharray="5 3.4"/>
      <circle r="13" fill="#c28a3b" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4"/><circle r="4" fill="#5a3a1e"/>
      <g stroke="#5a3a1e" stroke-width="2"><path d="M0 -12 V12 M-12 0 H12"/></g>
    </g>
  </g>
  <g transform="translate(102 56)">
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="360;0" dur="6s" repeatCount="indefinite"/>
      <circle r="16" fill="none" stroke="#8a5a2b" stroke-width="8" stroke-dasharray="5 3.4"/>
      <circle r="13" fill="#c28a3b" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4"/><circle r="4" fill="#5a3a1e"/>
      <g stroke="#5a3a1e" stroke-width="2"><path d="M-8 -8 L8 8 M-8 8 L8 -8"/></g>
    </g>
  </g>
  <!-- smokestacks venting -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.4"><rect x="24" y="24" width="8" height="22" fill="#3a3340"/><rect x="88" y="20" width="8" height="26" fill="#3a3340"/>
    <rect x="22" y="22" width="12" height="4" fill="#5c5566"/><rect x="86" y="18" width="12" height="4" fill="#5c5566"/></g>
  <g fill="#8a8f9c" opacity="0.7">
    <circle style="transform-box:fill-box;transform-origin:center" cx="28" cy="16" r="4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 4;-6 -14" dur="1.8s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1.8s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="92" cy="12" r="4.6"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 4;6 -12" dur="2.1s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.1s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
  <!-- brass body -->
  <path d="M22 120 L26 74 L40 58 H80 L94 74 L98 120Z" fill="var(--lg-deep, #b0702a)" stroke="var(--lg-ink, #1d2230)" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M26 74 L40 58 H52 L38 76 L34 120 H22Z" fill="#fff" opacity="0.2"/>
  <path d="M94 74 L98 120 H86 L84 80 L78 62Z" fill="#000" opacity="0.28"/>
  <g fill="#5a3a1e"><circle cx="30" cy="80" r="1.2"/><circle cx="30" cy="96" r="1.2"/><circle cx="90" cy="80" r="1.2"/><circle cx="90" cy="96" r="1.2"/><circle cx="44" cy="62" r="1.2"/><circle cx="76" cy="62" r="1.2"/></g>
  <!-- furnace chest grate -->
  <rect x="44" y="80" width="32" height="24" rx="4" fill="#1a0b04" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6"/>
  <g transform="translate(60 92)"><g>
    <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1.08 1.15;1 1" dur="0.9s" repeatCount="indefinite"/>
    <ellipse rx="12" ry="8" fill="#ff5a1f"/><ellipse rx="7" ry="5" fill="#ffb347"/><ellipse rx="3" ry="2" fill="#fff1b8"/>
  </g></g>
  <g stroke="#3a3340" stroke-width="2.2"><path d="M50 80 V104 M56 80 V104 M64 80 V104 M70 80 V104"/></g>
  <!-- pipes -->
  <g fill="none" stroke-linecap="round"><path d="M40 70 C30 72 30 90 26 104" stroke="var(--lg-ink, #1d2230)" stroke-width="5"/><path d="M40 70 C30 72 30 90 26 104" stroke="#9aa7bd" stroke-width="3"/>
    <path d="M80 70 C90 72 90 90 94 104" stroke="var(--lg-ink, #1d2230)" stroke-width="5"/><path d="M80 70 C90 72 90 90 94 104" stroke="#9aa7bd" stroke-width="3"/></g>
  <!-- iron horns -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round">
    <path d="M40 34 C28 32 16 24 12 10 C22 18 30 22 42 24Z" fill="#6b6f7a"/>
    <path d="M80 34 C92 32 104 24 108 10 C98 18 90 22 78 24Z" fill="#6b6f7a"/>
    <path d="M16 14 C20 20 26 24 34 26" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- bull head -->
  <path d="M38 24 C38 16 48 12 60 12 C72 12 82 16 82 24 L80 46 C78 58 70 64 60 64 C50 64 42 58 40 46Z" fill="var(--lg-near, #d49a4e)" stroke="var(--lg-ink, #1d2230)" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M42 22 C46 16 52 14 58 14 C50 18 46 26 46 40 L42 44Z" fill="#fff" opacity="0.25"/>
  <path d="M82 24 L80 46 C78 58 70 64 62 64 C72 56 76 44 76 28Z" fill="#000" opacity="0.2"/>
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1" opacity="0.6" fill="none"><path d="M60 12 V30 M44 36 H76"/></g>
  <g fill="#5a3a1e"><circle cx="44" cy="20" r="1.1"/><circle cx="76" cy="20" r="1.1"/><circle cx="46" cy="50" r="1.1"/><circle cx="74" cy="50" r="1.1"/></g>
  <!-- gauge eyes: needles swing to red on the entrance -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.4"><circle cx="49" cy="30" r="7" fill="#1a1216"/><circle cx="71" cy="30" r="7" fill="#1a1216"/></g>
  <g fill="#d4342c"><path d="M49 30 L55 26 A7 7 0 0 1 56 30Z"/><path d="M71 30 L77 26 A7 7 0 0 1 78 30Z"/></g>
  <g fill="none" stroke="#ff7a1a" stroke-width="0.9"><path d="M43 30 H45 M49 24 V26 M53 26 l1 -1 M65 30 H67 M71 24 V26 M75 26 l1 -1"/></g>
  <g stroke="#ffd166" stroke-width="1.6" stroke-linecap="round">
    <path d="M49 30 L54 27"><animateTransform class="lg-in" attributeName="transform" type="rotate" values="-150 49 30;-150 49 30;15 49 30;0 49 30" keyTimes="0;.55;.8;1" dur="1.5s" fill="freeze"/>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 49 30;-8 49 30;3 49 30;0 49 30" dur="0.8s" begin="1.5s" repeatCount="indefinite" additive="sum"/></path>
    <path d="M71 30 L76 27"><animateTransform class="lg-in" attributeName="transform" type="rotate" values="-150 71 30;-150 71 30;15 71 30;0 71 30" keyTimes="0;.6;.84;1" dur="1.5s" fill="freeze"/>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 71 30;6 71 30;-3 71 30;0 71 30" dur="0.9s" begin="1.5s" repeatCount="indefinite" additive="sum"/></path>
  </g>
  <g fill="#ff5a1f" opacity="0.3"><circle cx="49" cy="30" r="9"/><circle cx="71" cy="30" r="9"/></g><g fill="#ffd166"><circle cx="49" cy="30" r="1.4"/><circle cx="71" cy="30" r="1.4"/></g>
  <path d="M40 22 L56 26 M80 22 L64 26" stroke="var(--lg-ink, #1d2230)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- muzzle, nose ring, snorting steam -->
  <path d="M46 44 C46 38 74 38 74 44 L72 56 C68 62 52 62 48 56Z" fill="var(--lg-deep, #b0702a)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6"/>
  <g fill="#1a0b04"><ellipse cx="54" cy="47" rx="2.4" ry="3"/><ellipse cx="66" cy="47" rx="2.4" ry="3"/></g>
  <circle cx="60" cy="54" r="5" fill="none" stroke="#e0c16a" stroke-width="2"/>
  <g fill="#f4efe0" opacity="0.8">
    <circle style="transform-box:fill-box;transform-origin:center" cx="50" cy="52" r="3"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-12 8" dur="1.2s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1.2s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="70" cy="52" r="3"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;12 8" dur="1.2s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1.2s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
  <!-- the key in its back, turning -->
  <g transform="translate(60 6)">
    <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;-1 1;1 1" dur="2.4s" repeatCount="indefinite"/>
      <path d="M-10 -4 C-14 -4 -14 4 -10 4 L-2 1 V-1Z M10 -4 C14 -4 14 4 10 4 L2 1 V-1Z" fill="#e0c16a" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
    </g>
  </g>
  <path d="M60 8 V13" stroke="#e0c16a" stroke-width="2.4"/>
</svg>
