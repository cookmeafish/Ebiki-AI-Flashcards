      <g fill="none" stroke-linecap="round">
        <g fill="#9aa0ae" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"><rect x="-1.1" y="0" width="2.2" height="4.4" rx="1"/><rect x="-1.7" y="10" width="2.2" height="4.4" rx="1"/><rect x="-2.7" y="20" width="2.2" height="4.4" rx="1"/><rect x="-4.1" y="30" width="2.2" height="4.4" rx="1"/></g>
        <g fill="#c8ccd6" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"><ellipse cx="-0.3" cy="7" rx="1.8" ry="3"/><ellipse cx="-1.1" cy="17" rx="1.8" ry="3"/><ellipse cx="-2.3" cy="27" rx="1.8" ry="3"/></g><g fill="#2a2d36"><ellipse cx="-0.3" cy="7" rx="0.7" ry="1.8"/><ellipse cx="-1.1" cy="17" rx="0.7" ry="1.8"/><ellipse cx="-2.3" cy="27" rx="0.7" ry="1.8"/></g>
        <path d="M-4.4 36 C-6 38 -2 40 -3 37" stroke="var(--lg-ink, #1d2230)" stroke-width="2"/>
