        <g fill="#ff2e4c"><circle cx="-2.4" cy="-1.4" r="1.4" opacity="0.4"/><circle cx="2.4" cy="-1.4" r="1.4" opacity="0.4"/><circle cx="-2.4" cy="-1.4" r="0.7"/><circle cx="2.4" cy="-1.4" r="0.7"/></g>
        <path d="M-3 3 C-1 2 1 2 3 3 M-2.6 4.4 C-1 3.6 1 3.6 2.6 4.4" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/>
