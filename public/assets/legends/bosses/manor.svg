<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Poltergeist: a furious sheet ghost seen from below, its sheet whipped into a horn-like peak. A screaming
       torn mouth glowing with a vortex throat, burning slit eyes, shackled
       wrists dragging real chains, and its own storm (a turning whirlwind of wind and debris) hurling the manor's
       furniture: a chair, a cursed portrait, a candelabra, a flapping book.
       Entrance: the furniture flies up into the storm, the eyes ignite, the mouth tears open. -->
  <!-- the storm: a whirlwind of wind streaks and debris, turning on its own -->
  <g transform="translate(60 56)">
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="14s" repeatCount="indefinite"/>
      <g fill="none" stroke-linecap="round">
        <path d="M-64 8 A65 65 0 0 1 -30 -58" stroke="#dffbff" stroke-width="1.2" opacity="0.7"/>
        <path d="M64 -8 A65 65 0 0 1 30 58" stroke="#dffbff" stroke-width="1.2" opacity="0.7"/>
        <path d="M-52 -10 A54 54 0 0 1 10 -54" stroke="#8fe9f7" stroke-width="3" opacity="0.55"/>
        <path d="M52 10 A54 54 0 0 1 -10 54" stroke="#8fe9f7" stroke-width="3" opacity="0.55"/>
        <path d="M-44 20 A48 48 0 0 1 -34 -34" stroke="#3fb8d6" stroke-width="2" opacity="0.8"/>
        <path d="M44 -20 A48 48 0 0 1 34 34" stroke="#3fb8d6" stroke-width="2" opacity="0.8"/>
        <path d="M-58 -28 A64 64 0 0 1 -44 -46" stroke="#3fb8d6" stroke-width="1.4" opacity="0.8"/>
        <path d="M58 28 A64 64 0 0 1 44 46" stroke="#3fb8d6" stroke-width="1.4" opacity="0.8"/>
      </g>
      <!-- debris caught in the wind: splinters and torn letters -->
      <g stroke="var(--lg-ink, #1d2230)" stroke-width="0.5" stroke-linejoin="round">
        <path d="M-58 -16 l5 -2 l1 1.6 l-5 2Z" fill="#8a5a2b"/><path d="M50 -38 l4 3 l-1 1.4 l-4 -3Z" fill="#8a5a2b"/>
        <path d="M-20 -60 l4 -1 l1 4 l-4 1Z" fill="#f4ecd6"/><path d="M24 58 l4 1 l-1 4 l-4 -1Z" fill="#f4ecd6"/>
        <path d="M60 14 l2 4 l-1.6 0.8 l-2 -4Z" fill="#8a5a2b"/>
      </g>
    </g>
  </g>
  <!-- the cursed portrait (behind, top right): a stern lord whose eyes glow and follow -->
  <g><animateTransform class="lg-in" attributeName="transform" type="translate" values="0 80;0 80;0 -4;0 0" keyTimes="0;.42;.66;1" dur="1.5s" fill="freeze"/>
    <g transform="translate(97 0) rotate(10)">
