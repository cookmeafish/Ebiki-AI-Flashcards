        <rect x="-13" y="-15" width="26" height="30" rx="1.5" fill="none" stroke="#f6dc84" stroke-width="0.8" transform="translate(0.6 0.6) scale(0.94)"/>
        <g fill="#c9a441" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"><circle cx="-13" cy="-15" r="2.2"/><circle cx="13" cy="-15" r="2.2"/><circle cx="-13" cy="15" r="2.2"/><circle cx="13" cy="15" r="2.2"/></g>
        <rect x="-9.5" y="-11.5" width="19" height="23" fill="#2a1d3a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
        <path d="M-9.5 11.5 C-8 4 -4 2 0 2 C4 2 8 4 9.5 11.5Z" fill="#1d1428"/>
