<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Neon Tyrant: a colossal war mech towering over a burning city. V-fin crest, twin blade eyes, a targeting
       reticle, missile pods, a radar dish, an electric claw, an arm cannon and a plasma throat charging. -->
  <!-- red alert glow and crossing searchlights -->
  <circle cx="60" cy="54" r="54" fill="#ff2e4c" opacity="0.08"/>
  <path d="M14 120 L40 0 H52Z" fill="var(--lg-light, #ffffff)" opacity="0.14">
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="-6 14 120;10 14 120;-6 14 120" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M106 120 L80 0 H68Z" fill="var(--lg-light, #ffffff)" opacity="0.14">
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="6 106 120;-10 106 120;6 106 120" dur="6s" repeatCount="indefinite"/>
  </path>
  <!-- the tiny city at its feet -->
  <g fill="var(--lg-far, #9fb4d4)" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8">
    <rect x="0" y="100" width="10" height="20"/><rect x="10" y="92" width="8" height="28"/><rect x="18" y="104" width="8" height="16"/>
    <rect x="94" y="96" width="9" height="24"/><rect x="103" y="104" width="7" height="16"/><rect x="110" y="90" width="10" height="30"/>
  </g>
  <g fill="#ffe27a"><rect x="3" y="104" width="2" height="2"/><rect x="13" y="96" width="2" height="2"/><rect x="13" y="102" width="2" height="2"/><rect x="97" y="100" width="2" height="2"/><rect x="113" y="94" width="2" height="2"/><rect x="113" y="100" width="2" height="2"/></g>
  <g fill="#ff7a1a"><path d="M20 104 C18 98 22 96 21 92 C25 96 24 100 24 104Z" style="transform-box:fill-box;transform-origin:center bottom"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1.2;1 1" dur="0.6s" repeatCount="indefinite" additive="sum"/></path></g>
  <!-- right arm: the cannon -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round">
    <g>
      <animateTransform class="lg-in" attributeName="transform" type="rotate" values="50 92 74;50 92 74;-6 92 74;0 92 74" keyTimes="0;.45;.72;1" dur="1.5s" fill="freeze"/>
      <path d="M88 72 L100 84 L96 100 L86 96Z" fill="var(--lg-deep, #3d5a8c)"/>
      <rect x="92" y="96" width="10" height="22" rx="2" fill="#2a2d3a"/>
      <g fill="none" stroke-width="0.8"><path d="M92 102 H102 M92 108 H102"/></g>
      <circle style="transform-box:fill-box;transform-origin:center" cx="97" cy="118" r="4" fill="#2ef2ff" opacity="0.6"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.3;1" dur="0.8s" repeatCount="indefinite" additive="sum"/></circle>
    </g>
  </g>
  <!-- left arm: raised claw arcing with electricity -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round">
    <g>
      <animateTransform class="lg-in" attributeName="transform" type="rotate" values="-70 30 72;-70 30 72;8 30 72;0 30 72" keyTimes="0;.45;.72;1" dur="1.5s" fill="freeze"/>
      <g>
        <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 30 72;-4 30 72;0 30 72" dur="2.6s" begin="1.5s" repeatCount="indefinite"/>
        <path d="M32 70 L20 60 L14 44 L22 42 L28 56 L38 64Z" fill="var(--lg-deep, #3d5a8c)"/>
        <path d="M14 44 L6 30 M18 42 L14 26 M22 42 L24 28" stroke="#aeb6c4" stroke-width="3" stroke-linecap="round"/>
        <path d="M14 44 L6 30 M18 42 L14 26 M22 42 L24 28" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linecap="round" fill="none"/>
        <g fill="none" stroke="#2ef2ff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 30 L10 24 L8 20 L13 16 M24 28 L20 22 L24 18">
            <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;1 -1;-1 1;0 0" dur="0.25s" repeatCount="indefinite"/>
          </path>
        </g>
      </g>
    </g>
  </g>
  <!-- torso: layered armor -->
  <path d="M30 120 L32 80 L42 70 H78 L88 80 L90 120Z" fill="var(--lg-deep, #3d5a8c)" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M32 80 L42 70 H52 L40 84 L38 120 H30Z" fill="#fff" opacity="0.14"/>
  <path d="M88 80 L90 120 H80 L80 86 L74 72Z" fill="#000" opacity="0.28"/>
  <path d="M40 86 L60 80 L80 86 L78 106 L60 114 L42 106Z" fill="var(--lg-near, #6f8fc2)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
  <g fill="var(--lg-ink, #1d2230)"><circle cx="36" cy="86" r="1"/><circle cx="84" cy="86" r="1"/><circle cx="36" cy="112" r="1"/><circle cx="84" cy="112" r="1"/></g>
  <!-- exhaust vents -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1"><rect x="44" y="72" width="8" height="5" fill="#2a2d3a"/><rect x="68" y="72" width="8" height="5" fill="#2a2d3a"/></g>
  <!-- reactor with a turning core ring -->
  <g transform="translate(60 96)">
    <circle r="12" fill="#2ef2ff" opacity="0.25"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle r="8" fill="#0b1a24" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="3s" repeatCount="indefinite"/>
      <circle r="6" fill="none" stroke="#2ef2ff" stroke-width="2" stroke-dasharray="4 2.3"/></g>
    <circle r="3" fill="#dffcff"/>
  </g>
  <!-- neon cracks -->
  <g fill="none" stroke="#ff2e88" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M34 92 L40 98 L37 104"/><path d="M86 100 L81 106 L84 112"/></g>
  <!-- right shoulder: missile pod (hatches open on the entrance) -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round">
    <path d="M76 64 L86 52 H108 L112 62 L104 76 H84Z" fill="#2a2d3a"/>
    <g fill="#ffd23f"><polygon points="86,52 90,52 84,60 80,60"/><polygon points="96,52 100,52 94,60 90,60"/><polygon points="106,52 108,52 104,58 100,58"/></g>
    <g>
      <animateTransform class="lg-in" attributeName="transform" type="translate" values="0 8;0 8;0 -2;0 0" keyTimes="0;.62;.82;1" dur="1.5s" fill="freeze"/>
      <g fill="#d9e1ee" stroke-width="0.8"><circle cx="90" cy="66" r="3"/><circle cx="98" cy="66" r="3"/><circle cx="106" cy="66" r="3"/><circle cx="94" cy="72" r="3"/><circle cx="102" cy="72" r="3"/></g>
      <g fill="#ff2e4c"><circle cx="90" cy="66" r="1.3"/><circle cx="98" cy="66" r="1.3"/><circle cx="106" cy="66" r="1.3"/><circle cx="94" cy="72" r="1.3"/><circle cx="102" cy="72" r="1.3"/></g>
    </g>
  </g>
  <!-- left shoulder: armored plate with a spinning radar dish -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round">
    <path d="M44 64 L34 52 H14 L8 62 L16 76 H36Z" fill="var(--lg-near, #6f8fc2)"/>
    <path d="M34 52 H14 L8 62 L16 64 L20 56 H32Z" fill="#fff" opacity="0.25"/>
    <path d="M18 50 V42" stroke-width="2"/>
    <g transform="translate(18 40)">
      <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;-1 1;1 1" dur="2s" repeatCount="indefinite"/>
        <path d="M-8 -6 C-6 2 4 4 8 -2 Z" fill="#aeb6c4"/><path d="M0 -1 L6 -8" stroke-width="1"/>
      </g>
    </g>
  </g>
  <!-- V-fin crest: extends on the entrance -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="translate" values="0 16;0 16;0 -3;0 0" keyTimes="0;.5;.72;1" dur="1.4s" fill="freeze"/>
    <path d="M60 30 L34 4 L40 2 L60 22 L80 2 L86 4Z" fill="var(--lg-accent, #f2b441)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M60 22 L40 2 L37 3 L58 26Z" fill="#fff" opacity="0.4"/>
    <circle cx="60" cy="26" r="3.4" fill="#ff2e4c" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
  </g>
  <!-- helmet -->
  <path d="M38 40 L44 26 L60 22 L76 26 L82 40 L80 58 L72 68 H48 L40 58Z" fill="var(--lg-deep, #3d5a8c)" stroke="var(--lg-ink, #1d2230)" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M44 26 L60 22 L60 30 L48 34 L40 42 L38 40Z" fill="var(--lg-near, #6f8fc2)"/>
  <path d="M76 26 L82 40 L80 58 L74 64 L76 42Z" fill="#000" opacity="0.3"/>
  <!-- cheek guards -->
  <path d="M38 44 L32 50 L38 62 L44 60Z M82 44 L88 50 L82 62 L76 60Z" fill="var(--lg-near, #6f8fc2)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- twin blade eyes: power on -->
  <path d="M42 40 L56 44 L55 48 L43 46Z M78 40 L64 44 L65 48 L77 46Z" fill="#0b0d14"/>
  <g transform="translate(60 44)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="0.02 1;0.02 1;1.2 1.3;1 1" keyTimes="0;.55;.76;1" dur="1.4s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1.25;1 1" dur="1.6s" begin="1.4s" repeatCount="indefinite"/>
      <path d="M-18 -4 L-4 0 L-5 3 L-17 1Z M18 -4 L4 0 L5 3 L17 1Z" fill="#ff2e4c" opacity="0.5"/>
      <path d="M-17 -3 L-5 0.5 L-6 2 L-16 0Z M17 -3 L5 0.5 L6 2 L16 0Z" fill="#ffd6dc"/>
    </g>
  </g></g>
  <!-- targeting reticle spinning in -->
  <g transform="translate(60 36)">
    <g><animateTransform class="lg-in" attributeName="transform" type="scale" values="0;0;1.5;1" keyTimes="0;.65;.82;1" dur="1.5s" fill="freeze"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="4s" repeatCount="indefinite"/>
        <circle r="5" fill="none" stroke="#ff2e4c" stroke-width="1" stroke-dasharray="3 2"/>
        <path d="M0 -7 V-4 M0 7 V4 M-7 0 H-4 M7 0 H4" stroke="#ff2e4c" stroke-width="1"/>
      </g>
    </g>
  </g>
  <!-- shark-toothed jaw over a charging plasma throat -->
  <path d="M46 56 H74 L70 70 H50Z" fill="#0b1a24" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
  <g transform="translate(60 64)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="0;0;1.5;1" keyTimes="0;.7;.86;1" dur="1.6s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.3;1" dur="0.7s" begin="1.6s" repeatCount="indefinite"/>
      <ellipse rx="9" ry="4" fill="#2ef2ff" opacity="0.5"/><ellipse rx="5" ry="2.2" fill="#dffcff"/>
    </g>
  </g></g>
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="translate" values="0 -6;0 -6;0 3;0 0" keyTimes="0;.66;.84;1" dur="1.6s" fill="freeze"/>
    <path d="M48 66 H72 L70 74 H50Z" fill="var(--lg-near, #6f8fc2)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
    <g fill="#d9e1ee" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round"><polygon points="50,66 52,61 54,66"/><polygon points="56,66 58,60 60,66"/><polygon points="60,66 62,60 64,66"/><polygon points="66,66 68,61 70,66"/></g>
  </g>
  <g fill="#d9e1ee" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round"><polygon points="48,56 50,62 52,56"/><polygon points="53,56 55,63 57,56"/><polygon points="63,56 65,63 67,56"/><polygon points="68,56 70,62 72,56"/></g>
  <!-- sparks -->
  <g stroke="#ffe27a" stroke-width="1.2" stroke-linecap="round">
    <path d="M84 40 l5 -3 m-2 4 l6 1"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;3 -3;0 0" dur="0.6s" repeatCount="indefinite"/></path>
  </g>
</svg>
