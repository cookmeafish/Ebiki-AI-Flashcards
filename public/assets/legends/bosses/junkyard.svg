  <ellipse cx="60" cy="79" rx="8" ry="2.6" fill="#ffd23f" opacity="0.7"/>
  <path d="M33 57 H87 V61 H33Z" fill="#c9ccd6" stroke="var(--lg-ink, #1d2230)" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M34 58.2 H86" stroke="#fff" stroke-width="0.8"/>
  <g fill="#e6e8ee" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round">
