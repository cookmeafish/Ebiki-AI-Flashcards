  <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 102 86;5 102 86;0 102 86" dur="2.6s" repeatCount="indefinite"/>
    <path d="M100 84 L112 100 L108 103 L96 88Z" fill="#e0a13a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M101.4 87 L104 85.4 M104 90.6 L106.6 89 M106.6 94.2 L109.2 92.6 M109.2 97.8 L111 96.6" stroke="#1d2230" stroke-width="1.6"/>
    <path d="M110 102 V106" stroke="var(--lg-ink, #1d2230)" stroke-width="2"/>
    <path d="M97 110 C97 106 123 106 123 110 V114 C123 117 97 117 97 114Z" fill="#4a4e58" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4"/>
