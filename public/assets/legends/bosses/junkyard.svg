    <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 3.4;0 0" dur="1.1s" begin="1.5s" repeatCount="indefinite"/>
      <g fill="#e6e8ee" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round">
        <path d="M39 83 L41 75 L44 83Z M46 83 L48.6 72 L51 83Z M53 83 L55 76 L57 83Z M63 83 L65 76 L67 83Z M69 83 L71.4 72 L74 83Z M76 83 L79 75 L81 83Z"/>
