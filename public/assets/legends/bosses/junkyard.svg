  <path d="M27 32.6 C38 36.4 50 41.4 60 48.4 C70 41.4 82 36.4 93 32.6" fill="none" stroke="#fff" stroke-width="1.1"/>
  <path d="M25 38 C37 42 49 47 60 55 C71 47 83 42 95 38 L95 36 C83 40 71 45 60 52.4 C49 45 37 40 25 36Z" fill="#000" opacity="0.28"/>
