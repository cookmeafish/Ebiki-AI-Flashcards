    <path d="M14 98 L12.6 112 H19Z" fill="#000" opacity="0.2"/>
    <path d="M1 97 V112 M9 97 V112" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
    <g fill="#e6e8ee" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7" stroke-linejoin="round"><path d="M-6 113 L-4 121 L-1.6 113Z M0 113 L2.4 122 L4.6 113Z M6 113 L8.4 122 L10.6 113Z M12 113 L14.4 121 L16.6 113Z"/></g>
    <circle cx="6" cy="102" r="2" fill="#6b707c" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
    <path d="M-7 104 L-4 106 L-6 109" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7"/>
  </g>
