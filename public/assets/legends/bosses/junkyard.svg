    <path d="M18 86 L6 104" stroke="var(--lg-ink, #1d2230)" stroke-width="9" stroke-linecap="round"/>
    <path d="M18 86 L6 104" stroke="#6b707c" stroke-width="6.4" stroke-linecap="round"/>
    <path d="M16.6 86.6 L5 104" stroke="#c9ccd6" stroke-width="1.4" stroke-linecap="round"/>
