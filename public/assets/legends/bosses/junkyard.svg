    <path d="M8 66 L2 50 L6 49 L12 64Z M20 62 L22 46 L26 47 L24 62Z" fill="#8a5a3a" stroke-width="0.9"/>
    <path d="M112 66 L118 50 L114 49 L108 64Z M100 62 L98 46 L94 47 L96 62Z" fill="#8a5a3a" stroke-width="0.9"/>
    <circle cx="16" cy="76" r="16" fill="#26272c" stroke-width="1.8"/>
    <circle cx="104" cy="76" r="16" fill="#26272c" stroke-width="1.8"/>
  </g>
  <g fill="none" stroke="#4a4b52" stroke-width="2.2" stroke-dasharray="2.4 2.2"><circle cx="16" cy="76" r="13.4"/><circle cx="104" cy="76" r="13.4"/></g>
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1"><circle cx="16" cy="76" r="8" fill="#b9bdc8"/><circle cx="104" cy="76" r="8" fill="#b9bdc8"/><circle cx="16" cy="76" r="3" fill="#6b707c"/><circle cx="104" cy="76" r="3" fill="#6b707c"/></g>
  <path d="M10.6 71.6 A7 7 0 0 1 17 69 M98.6 71.6 A7 7 0 0 1 105 69" fill="none" stroke="#fff" stroke-width="1.2"/>
  <g fill="#3a3d45"><circle cx="16" cy="70.6" r="0.9"/><circle cx="21.2" cy="78.4" r="0.9"/><circle cx="10.8" cy="78.4" r="0.9"/><circle cx="104" cy="70.6" r="0.9"/><circle cx="109.2" cy="78.4" r="0.9"/><circle cx="98.8" cy="78.4" r="0.9"/></g>
  <!-- the head: a battered car front -->
  <path d="M30 34 C30 22 42 16 60 16 C78 16 90 22 90 34 V66 C90 76 86 82 80 84 L40 84 C34 82 30 76 30 66Z" fill="var(--lg-accent, #e0a13a)" stroke="var(--lg-ink, #1d2230)" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M34 34 C34 26 42 21 56 20 C46 25 40 32 40 62 H34Z" fill="#fff" opacity="0.25"/>
  <path d="M80 22 C86 26 88 30 88 36 V64 C86 70 82 72 78 73 C82 64 82 40 80 22Z" fill="#000" opacity="0.22"/>
