  <path d="M56 13 H65.6 M58.8 6.4 H63.6" stroke="#fff" stroke-width="2.2"/>
  <path d="M51 21 H70" stroke="var(--lg-ink, #1d2230)" stroke-width="2.6" stroke-linecap="round"/>
