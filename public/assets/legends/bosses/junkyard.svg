      <rect x="53" y="85" width="14" height="6" rx="1" fill="#f2e6b8" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
      <path d="M55.6 87 H64.4 M55.6 89 H61" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
