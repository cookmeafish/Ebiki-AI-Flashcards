    <g stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"><rect x="100" y="116" width="4" height="6" fill="#c43a4a"/><path d="M108 116 l4 0 l0 3 l-4 0Z" fill="#c9ccd6"/><path d="M114 116 L118 124 L120 123 L116 115Z" fill="#9aa0ae"/></g>
    <g fill="none" stroke="#6ff3ff" stroke-width="1.1" stroke-linecap="round" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;0.2;1.1;1" keyTimes="0;.3;.6;1" dur="0.45s" repeatCount="indefinite"/>
      <path d="M96 108 l-3 -2 l1 -2 l-3 -1 M124 108 l3 -2 l-1 -2 l3 -1 M110 124 l-1 3 l2 0 l-1 3"/>
    </g>
  </g>
