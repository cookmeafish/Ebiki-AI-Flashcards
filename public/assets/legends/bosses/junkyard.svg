    <g><animateTransform class="lg-in" attributeName="transform" type="translate" values="0 -40;0 -40;0 0;0 0" keyTimes="0;.5;.7;1" dur="1.5s" fill="freeze"/><path d="M86 116 l6 -3 l2 4 l-6 3Z"/></g>
    <g><animateTransform class="lg-in" attributeName="transform" type="translate" values="0 -40;0 -40;0 0;0 0" keyTimes="0;.55;.75;1" dur="1.5s" fill="freeze"/><circle cx="34" cy="118" r="2.4"/><circle cx="34" cy="118" r="0.9" fill="#3a3d45"/></g>
