<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Scrap Titan: a giant welded from wrecks, seen from below. Its own radiator fan spins behind its head like a
       halo, twin exhaust stacks belch smoke, tire shoulders with rebar spikes, a car-front head with a bent chrome
       bumper for a brow over burning headlights, a grille of sharpened chrome fangs and a bumper jaw that chomps, an
       excavator-bucket fist and a crane magnet crackling with junk stuck to it.
       Entrance: scraps fall off as it heaves up, the headlights flicker on, the jaw drops. -->
  <!-- the radiator fan halo behind the head, spinning -->
  <g transform="translate(60 38) scale(1.36)">
    <circle r="33" fill="#2a2c33" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8"/>
    <circle r="33" fill="none" stroke="#9aa0ae" stroke-width="1" transform="scale(0.93)"/>
    <g fill="#c9ccd6"><circle cx="0" cy="-31" r="1.2"/><circle cx="27" cy="-15.5" r="1.2"/><circle cx="27" cy="15.5" r="1.2"/><circle cx="0" cy="31" r="1.2"/><circle cx="-27" cy="15.5" r="1.2"/><circle cx="-27" cy="-15.5" r="1.2"/></g>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="1.4s" repeatCount="indefinite"/>
      <g fill="#aab0bc" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round">
        <path d="M0 -4 C6 -12 8 -22 4 -29 C-2 -26 -6 -16 -4 -4Z"/>
        <path d="M0 -4 C6 -12 8 -22 4 -29 C-2 -26 -6 -16 -4 -4Z" transform="rotate(72)"/>
        <path d="M0 -4 C6 -12 8 -22 4 -29 C-2 -26 -6 -16 -4 -4Z" transform="rotate(144)"/>
        <path d="M0 -4 C6 -12 8 -22 4 -29 C-2 -26 -6 -16 -4 -4Z" transform="rotate(216)"/>
        <path d="M0 -4 C6 -12 8 -22 4 -29 C-2 -26 -6 -16 -4 -4Z" transform="rotate(288)"/>
      </g>
      <g fill="none" stroke="#e6e8ee" stroke-width="0.8" opacity="0.8"><path d="M3 -8 C5 -14 6 -20 4 -26"/><path d="M3 -8 C5 -14 6 -20 4 -26" transform="rotate(72)"/><path d="M3 -8 C5 -14 6 -20 4 -26" transform="rotate(144)"/><path d="M3 -8 C5 -14 6 -20 4 -26" transform="rotate(216)"/><path d="M3 -8 C5 -14 6 -20 4 -26" transform="rotate(288)"/></g>
    </g>
  </g>
  <!-- exhaust stacks behind the shoulders, angled out -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-linejoin="round">
    <path d="M28 46 L14 2 L22 0 L36 44Z" fill="#6b707c" stroke-width="1.5"/>
    <path d="M92 46 L106 2 L98 0 L84 44Z" fill="#6b707c" stroke-width="1.5"/>
    <path d="M27 40 L15.6 4 L18 3.4 L29.6 39Z M93 40 L104.4 4 L102 3.4 L90.4 39Z" fill="#c9ccd6" stroke="none" opacity="0.7"/>
    <path d="M10 -2 L24 -6 L26 2 L12 6Z" fill="#3a3d45" stroke-width="1.2"/>
    <path d="M110 -2 L96 -6 L94 2 L108 6Z" fill="#3a3d45" stroke-width="1.2"/>
    <path d="M19 22 L27 20 M23 34 L31 32 M101 22 L93 20 M97 34 L89 32" fill="none" stroke-width="0.9"/>
    <g fill="#b3452c" stroke="none" opacity="0.8"><ellipse cx="20" cy="14" rx="2" ry="3" transform="rotate(-18 20 14)"/><ellipse cx="97" cy="28" rx="1.6" ry="2.6" transform="rotate(18 97 28)"/></g>
  </g>
  <!-- the smoke: soft puffs rising from the stacks -->
  <g fill="#8c909c" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8">
    <g style="transform-box:fill-box;transform-origin:center"><circle cx="17" cy="-4" r="3.6"/><circle cx="20.4" cy="-6" r="3"/><circle cx="14" cy="-7" r="2.6"/><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 2;-6 -14" dur="1.9s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0.3;1;1.3;0" keyTimes="0;.25;.75;1" dur="1.9s" repeatCount="indefinite" additive="sum"/></g>
    <g style="transform-box:fill-box;transform-origin:center"><circle cx="103" cy="-4" r="3.6"/><circle cx="99.6" cy="-6" r="3"/><circle cx="106" cy="-7" r="2.6"/><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 2;6 -14" dur="2.2s" begin="0.6s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0.3;1;1.3;0" keyTimes="0;.25;.75;1" dur="2.2s" begin="0.6s" repeatCount="indefinite" additive="sum"/></g>
    <g style="transform-box:fill-box;transform-origin:center"><circle cx="18" cy="-5" r="2.6"/><circle cx="20.6" cy="-6.4" r="2"/><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 2;-2 -16" dur="1.7s" begin="1s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0.3;1;1.2;0" keyTimes="0;.25;.75;1" dur="1.7s" begin="1s" repeatCount="indefinite" additive="sum"/></g>
  </g>
  <!-- the body: a crushed car block, wider than the frame below -->
  <path d="M10 126 L18 80 L40 70 H80 L102 80 L110 126Z" fill="var(--lg-deep, #4a5a6a)" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M18 80 L40 70 H52 L34 86 L28 126 H10Z" fill="#fff" opacity="0.16"/>
  <path d="M86 72 L102 80 L110 126 H94 L92 90Z" fill="#000" opacity="0.22"/>
  <!-- crumple lines and rust -->
  <path d="M24 96 L30 92 L28 100 L36 98 M90 100 L96 96 L94 106 M44 116 L50 112 L48 120" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
  <g fill="#b3452c" opacity="0.85"><path d="M30 106 C34 103 38 106 36 110 C33 112 29 110 30 106Z"/><path d="M84 112 C88 110 92 113 89 117 C86 118 83 115 84 112Z"/></g>
  <!-- the chest: a car door with a burning engine vent -->
  <path d="M42 90 H78 V118 H42Z" fill="#7a8696" stroke="var(--lg-ink, #1d2230)" stroke-width="1.3"/>
  <path d="M44 92 H76 V99 H44Z" fill="#6fb8ff" opacity="0.55" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
  <path d="M47 93 L52 98 M58 93 L55 97 L60 98 M66 92 L69 98" fill="none" stroke="#fff" stroke-width="0.7"/>
  <rect x="47" y="102" width="26" height="11" rx="1.5" fill="#1d1b28" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
  <g transform="translate(60 107.5)"><g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1.05 1.2;1 1" dur="0.8s" repeatCount="indefinite"/>
