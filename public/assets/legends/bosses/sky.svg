<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Storm Wyvern: wings like thunderheads, a lightning crest, a raptor's hooked jaws. -->
  <!-- storm cloud behind -->
  <g fill="var(--lg-far, #b9c8e8)" opacity="0.9">
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="4s" repeatCount="indefinite"/>
    <circle cx="30" cy="22" r="14"/><circle cx="52" cy="14" r="16"/><circle cx="76" cy="16" r="15"/><circle cx="96" cy="24" r="12"/><rect x="24" y="20" width="76" height="16" rx="8"/>
  </g>
  <g fill="#000" opacity="0.15"><rect x="24" y="28" width="76" height="8" rx="4"/></g>
  <!-- left wing: snaps open on the entrance, then beats -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="70 46 62;70 46 62;-14 46 62;0 46 62" keyTimes="0;.5;.75;1" dur="1.4s" fill="freeze"/>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 46 62;-9 46 62;0 46 62" dur="1.3s" begin="1.4s" repeatCount="indefinite"/>
      <path d="M46 60 L30 40 L2 34 L10 46 L2 52 L14 58 L6 68 L20 70 L14 82 L30 78 L40 76Z" fill="var(--lg-deep, #4c6fd6)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M46 60 L30 40 L2 34 L30 46Z" fill="var(--lg-near, #7f9ae6)"/>
      <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="1" opacity="0.7"><path d="M40 62 L10 46 M40 66 L14 58 M40 70 L20 70 M40 74 L30 78"/></g>
    </g>
  </g>
  <!-- right wing -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="-70 74 62;-70 74 62;14 74 62;0 74 62" keyTimes="0;.5;.75;1" dur="1.4s" fill="freeze"/>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 74 62;9 74 62;0 74 62" dur="1.3s" begin="1.4s" repeatCount="indefinite"/>
      <path d="M74 60 L90 40 L118 34 L110 46 L118 52 L106 58 L114 68 L100 70 L106 82 L90 78 L80 76Z" fill="var(--lg-deep, #4c6fd6)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M74 60 L90 40 L118 34 L90 46Z" fill="#000" opacity="0.2"/>
      <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="1" opacity="0.7"><path d="M80 62 L110 46 M80 66 L106 58 M80 70 L100 70 M80 74 L90 78"/></g>
    </g>
  </g>
  <!-- lightning: strikes on the entrance, then flickers -->
  <g fill="#fff04a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round">
    <g transform="translate(24 44)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0;1 0;1 1.2;1 1" keyTimes="0;.35;.45;1" dur="1.2s" fill="freeze"/>
      <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1;1 0;1 1" keyTimes="0;.8;.85;1" dur="2.6s" begin="1.2s" repeatCount="indefinite" additive="sum"/>
      <path d="M0 0 L-6 14 L-1 14 L-8 30 L6 10 L1 10 L5 0Z"/>
    </g></g>
    <g transform="translate(96 44)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0;1 0;1 1.2;1 1" keyTimes="0;.42;.52;1" dur="1.2s" fill="freeze"/>
      <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 0;1 1;1 1" keyTimes="0;.3;.35;1" dur="3.1s" begin="1.2s" repeatCount="indefinite" additive="sum"/>
      <path d="M0 0 L6 12 L1 12 L7 28 L-6 9 L-1 9 L-4 0Z"/>
    </g></g>
  </g>
  <!-- wing thumb claws -->
  <g fill="#e8d7b0" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round">
    <g><animateTransform class="lg-in" attributeName="transform" type="rotate" values="70 46 62;70 46 62;-14 46 62;0 46 62" keyTimes="0;.5;.75;1" dur="1.4s" fill="freeze"/><path d="M30 40 L24 30 L33 37Z"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 46 62;-9 46 62;0 46 62" dur="1.3s" begin="1.4s" repeatCount="indefinite"/></path></g>
    <g><animateTransform class="lg-in" attributeName="transform" type="rotate" values="-70 74 62;-70 74 62;14 74 62;0 74 62" keyTimes="0;.5;.75;1" dur="1.4s" fill="freeze"/><path d="M90 40 L96 30 L87 37Z"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 74 62;9 74 62;0 74 62" dur="1.3s" begin="1.4s" repeatCount="indefinite"/></path></g>
  </g>
  <!-- tail curling below, with a barbed tip -->
  <path d="M60 96 C64 108 78 112 88 106 C94 102 94 96 90 96 C88 102 80 106 72 102 C66 98 66 94 66 90Z" fill="var(--lg-near, #7f9ae6)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round">
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 62 92;6 62 92;0 62 92" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <!-- body and armored belly -->
  <path d="M46 58 C44 70 48 88 60 98 C72 88 76 70 74 58 C70 52 50 52 46 58Z" fill="var(--lg-deep, #4c6fd6)" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M54 62 H66 L64 90 L60 94 L56 90Z" fill="#f2d98c" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" opacity="0.7"><path d="M55 68 H65 M55 74 H65 M56 80 H64 M57 86 H63"/></g>
  <!-- talons -->
  <g fill="#e8d7b0" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round">
    <path d="M50 90 L46 100 L50 98 L50 104 L53 98 L56 102 L55 94Z"/><path d="M70 90 L74 100 L70 98 L70 104 L67 98 L64 102 L65 94Z"/>
  </g>
  <!-- neck and head, lunging forward on the entrance -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="translate" values="0 10;0 10;0 -4;0 0" keyTimes="0;.62;.82;1" dur="1.5s" fill="freeze"/>
    <path d="M52 58 C50 48 52 42 56 38 H64 C68 42 70 48 68 58Z" fill="var(--lg-deep, #4c6fd6)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8"/>
    <g fill="#fff04a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round"><polygon points="51,46 45,48 51,50"/><polygon points="51,52 45,55 51,56"/><polygon points="69,46 75,48 69,50"/><polygon points="69,52 75,55 69,56"/></g>
    <g transform="translate(60 36) scale(1.18) translate(-60 -36)">
    <!-- lightning crest -->
    <g fill="#fff04a" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round">
      <path d="M50 30 L40 14 L48 18 L46 6 L54 22Z"/><path d="M70 30 L80 14 L72 18 L74 6 L66 22Z"/><path d="M58 24 L60 8 L62 24Z"/>
    </g>
    <path d="M44 34 C44 26 52 22 60 22 C68 22 76 26 76 34 C76 42 70 48 60 48 C50 48 44 42 44 34Z" fill="var(--lg-deep, #4c6fd6)" stroke="var(--lg-ink, #1d2230)" stroke-width="2"/>
    <path d="M46 30 C48 24 54 22 60 22 C54 26 50 30 48 36Z" fill="#fff" opacity="0.2"/>
    <!-- storm eyes -->
    <g transform="translate(52 32) rotate(18)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.3 1.3;1 1" keyTimes="0;.6;.8;1" dur="1.5s" fill="freeze"/>
      <circle r="5" fill="#fff04a" opacity="0.35"/><ellipse rx="4" ry="2.4" fill="#ff3b3b" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/><ellipse rx="1" ry="2.2" fill="#fff04a"/>
    </g></g>
    <g transform="translate(68 32) rotate(-18)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.3 1.3;1 1" keyTimes="0;.6;.8;1" dur="1.5s" fill="freeze"/>
      <circle r="5" fill="#fff04a" opacity="0.35"/><ellipse rx="4" ry="2.4" fill="#ff3b3b" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/><ellipse rx="1" ry="2.2" fill="#fff04a"/>
    </g></g>
    <path d="M46 28 L56 31 M74 28 L64 31" stroke="var(--lg-ink, #1d2230)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- hooked beak with fangs, screaming open -->
    <g transform="translate(60 40)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.3;1 0.3;1.1 1.3;1 1" keyTimes="0;.68;.86;1" dur="1.6s" fill="freeze"/>
      <path d="M-9 -2 C-6 -4 6 -4 9 -2 L4 10 L0 14 L-4 10Z" fill="#2a0f14" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M-10 -3 C-4 -8 4 -8 10 -3 L2 0 L0 4 L-2 0Z" fill="#f2b441" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
      <g fill="#fff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5"><polygon points="-6,0 -4,5 -3,0"/><polygon points="6,0 4,5 3,0"/></g>
      <ellipse cy="7" rx="2.5" ry="2" fill="#fff04a" opacity="0.6"/>
    </g></g>
    <path d="M71 24 L75 30 M73 23 L77 29" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" opacity="0.7"/>
    </g>
  </g>
  <!-- wind streaks -->
  <g fill="none" stroke="var(--lg-light, #ffffff)" stroke-width="1.4" stroke-linecap="round" opacity="0.8">
    <path d="M4 100 H22"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="-10 0;30 0;-10 0" dur="2.4s" repeatCount="indefinite" keyTimes="0;.5;1"/></path>
    <path d="M92 110 H112"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="10 0;-30 0;10 0" dur="3s" repeatCount="indefinite" keyTimes="0;.5;1"/></path>
  </g>
</svg>
