      <g fill="#000" opacity="0.18"><circle cx="46" cy="38" r="3"/><circle cx="74" cy="40" r="2.6"/><circle cx="40" cy="14" r="2"/><circle cx="68" cy="6" r="1.8"/><circle cx="82" cy="34" r="2"/></g>
      <g fill="#e8ecdf" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"><circle cx="78" cy="22" r="1.6"/><circle cx="81" cy="25" r="1.1"/><circle cx="40" cy="34" r="1.3"/></g>
      <!-- bioluminescent spots -->
