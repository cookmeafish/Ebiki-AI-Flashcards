    <path d="M-16 122 C-12 114 -2 110 6 114 C12 108 22 108 26 114 C32 110 40 112 42 118 C50 114 70 114 78 118 C80 112 88 110 94 114 C98 108 108 108 114 114 C122 110 132 114 136 122 C130 128 -10 128 -16 122Z" fill="var(--lg-far, #8fc7df)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M-8 118 C-4 114 2 114 6 116 M14 112 C18 110 22 112 24 114 M86 114 C90 110 94 112 96 114 M106 112 C112 110 118 114 120 116" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#fff"><circle cx="6" cy="114" r="1.4"/><circle cx="26" cy="114" r="1.2"/><circle cx="94" cy="114" r="1.2"/><circle cx="114" cy="114" r="1.4"/></g>
