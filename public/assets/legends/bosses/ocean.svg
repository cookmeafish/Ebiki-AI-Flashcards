    <circle style="transform-box:fill-box;transform-origin:center" cx="106" cy="60" r="1.8"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 16;-2 0;0 -16" dur="2.9s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.9s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="60" cy="100" r="1.5"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 10;1 0;0 -12" dur="2.5s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.5s" repeatCount="indefinite" additive="sum"/></circle>
