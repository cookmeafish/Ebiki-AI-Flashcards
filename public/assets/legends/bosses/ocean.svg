      <ellipse rx="12" ry="9.4" fill="#0b0f1a" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
      <ellipse cy="3" rx="7" ry="5" fill="#3ff0ff" opacity="0.3"/>
      <g fill="#f3efe4" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5" stroke-linejoin="round">
