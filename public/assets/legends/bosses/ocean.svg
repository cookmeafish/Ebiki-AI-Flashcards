<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Abyssal Kraken: a leviathan of the deep, hooked tentacles, glowing lures and a beaked maw. -->
  <g transform="translate(60 60)"><g>
    <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.08;1" dur="3.2s" repeatCount="indefinite"/>
    <circle r="56" fill="#3ff0ff" opacity="0.08"/><circle r="44" fill="var(--lg-accent, #f2b441)" opacity="0.1"/>
  </g></g>
  <!-- back tentacles -->
  <g fill="var(--lg-near, #4fa3c7)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round">
    <path d="M36 70 C20 76 8 70 4 56 C2 46 10 40 14 46 C10 52 14 62 24 62 C30 62 34 60 38 58Z">
      <animateTransform class="lg-in" attributeName="transform" type="rotate" values="60 36 66;60 36 66;-8 36 66;0 36 66" keyTimes="0;.45;.75;1" dur="1.5s" fill="freeze"/>
    </path>
    <path d="M84 70 C100 76 112 70 116 56 C118 46 110 40 106 46 C110 52 106 62 96 62 C90 62 86 60 82 58Z">
      <animateTransform class="lg-in" attributeName="transform" type="rotate" values="-60 84 66;-60 84 66;8 84 66;0 84 66" keyTimes="0;.45;.75;1" dur="1.5s" fill="freeze"/>
    </path>
  </g>
  <!-- mantle, breathing -->
  <g transform="translate(60 70)"><g>
    <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1.03 1.05;1 1" dur="3.2s" repeatCount="indefinite"/>
    <g transform="translate(-60 -70)">
      <path d="M60 4 C84 6 94 30 92 52 C91 64 86 74 80 80 H40 C34 74 29 64 28 52 C26 30 36 6 60 4Z" fill="var(--lg-deep, #1f6f99)" stroke="var(--lg-ink, #1d2230)" stroke-width="2.2"/>
      <path d="M60 4 C46 6 36 18 33 34 C38 22 48 14 60 12Z" fill="#fff" opacity="0.18"/>
      <path d="M92 52 C91 64 86 74 80 80 H70 C80 70 86 56 86 40 C86 26 80 14 72 8 C86 14 93 32 92 52Z" fill="#000" opacity="0.28"/>
      <!-- ridge spines -->
      <g fill="var(--lg-far, #8fc7df)" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round">
        <polygon points="52,8 56,0 58,7"/><polygon points="62,7 64,-1 68,8"/><polygon points="40,16 40,8 46,12"/><polygon points="74,12 80,8 80,16"/>
      </g>
      <!-- bioluminescent spots -->
      <g fill="#3ff0ff">
        <circle cx="46" cy="22" r="2"/><circle cx="54" cy="16" r="1.6"/><circle cx="68" cy="17" r="1.8"/><circle cx="76" cy="26" r="2"/><circle cx="40" cy="34" r="1.5"/><circle cx="82" cy="38" r="1.5"/><circle cx="60" cy="28" r="1.3"/>
      </g>
      <g fill="#3ff0ff" opacity="0.3"><circle cx="46" cy="22" r="4"/><circle cx="76" cy="26" r="4"/><circle cx="68" cy="17" r="3.5"/></g>
      <!-- scars -->
      <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linecap="round" opacity="0.6"><path d="M34 46 l8 -4 M36 50 l7 -3"/><path d="M84 30 l-5 5"/></g>
    </g>
  </g></g>
  <!-- furious brow plates -->
  <path d="M30 46 C38 40 48 42 56 50 L50 52 C44 48 38 48 32 52Z" fill="var(--lg-far, #8fc7df)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M90 46 C82 40 72 42 64 50 L70 52 C76 48 82 48 88 52Z" fill="var(--lg-far, #8fc7df)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- eyes: slit pupils, open on the entrance -->
  <g transform="translate(42 56) rotate(10)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.25 1.3;1 1" keyTimes="0;.6;.8;1" dur="1.5s" fill="freeze"/>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1;1 0.1;1 1" keyTimes="0;.9;.95;1" dur="5s" begin="2s" repeatCount="indefinite"/>
      <circle r="9" fill="#3ff0ff" opacity="0.3"/><ellipse rx="7" ry="5" fill="#b8fbff" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"/><ellipse rx="1.6" ry="4.4" fill="#0b1a24"/>
    </g>
  </g></g>
  <g transform="translate(78 56) rotate(-10)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.25 1.3;1 1" keyTimes="0;.6;.8;1" dur="1.5s" fill="freeze"/>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1;1 0.1;1 1" keyTimes="0;.9;.95;1" dur="5s" begin="2s" repeatCount="indefinite"/>
      <circle r="9" fill="#3ff0ff" opacity="0.3"/><ellipse rx="7" ry="5" fill="#b8fbff" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"/><ellipse rx="1.6" ry="4.4" fill="#0b1a24"/>
    </g>
  </g></g>
  <!-- front tentacles with sucker rows and hooks -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round">
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 44 78;-7 44 78;0 44 78" dur="2.6s" repeatCount="indefinite"/>
      <path d="M40 76 C30 90 16 94 10 110 C8 118 16 120 18 114 C22 104 34 100 46 84Z" fill="var(--lg-deep, #1f6f99)"/>
      <g fill="var(--lg-far, #8fc7df)" stroke-width="0.7"><circle cx="36" cy="88" r="2"/><circle cx="29" cy="95" r="1.8"/><circle cx="22" cy="102" r="1.6"/><circle cx="16" cy="109" r="1.4"/></g>
      <path d="M12 112 l-6 -2 l4 5" fill="#e8f4f7" stroke-width="1"/>
    </g>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 76 78;7 76 78;0 76 78" dur="2.4s" repeatCount="indefinite"/>
      <path d="M80 76 C90 90 104 94 110 110 C112 118 104 120 102 114 C98 104 86 100 74 84Z" fill="var(--lg-deep, #1f6f99)"/>
      <g fill="var(--lg-far, #8fc7df)" stroke-width="0.7"><circle cx="84" cy="88" r="2"/><circle cx="91" cy="95" r="1.8"/><circle cx="98" cy="102" r="1.6"/><circle cx="104" cy="109" r="1.4"/></g>
      <path d="M108 112 l6 -2 l-4 5" fill="#e8f4f7" stroke-width="1"/>
    </g>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 54 80;5 54 80;0 54 80" dur="3s" repeatCount="indefinite"/>
      <path d="M50 80 C46 94 36 104 36 116 C36 121 44 121 44 116 C44 106 54 98 58 84Z" fill="var(--lg-near, #4fa3c7)"/>
    </g>
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 66 80;-5 66 80;0 66 80" dur="2.8s" repeatCount="indefinite"/>
      <path d="M70 80 C74 94 84 104 84 116 C84 121 76 121 76 116 C76 106 66 98 62 84Z" fill="var(--lg-near, #4fa3c7)"/>
    </g>
  </g>
  <!-- beaked maw: gapes on the entrance -->
  <g transform="translate(60 72)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="0.6 0.2;0.6 0.2;1.1 1.25;1 1" keyTimes="0;.65;.84;1" dur="1.6s" fill="freeze"/>
    <g transform="translate(-60 -72)">
      <path d="M46 66 C52 64 68 64 74 66 C72 78 66 86 60 88 C54 86 48 78 46 66Z" fill="#0b0f1a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6"/>
      <ellipse cx="60" cy="76" rx="6" ry="5" fill="#3ff0ff" opacity="0.3"/>
      <path d="M50 66 L60 76 L70 66Z" fill="#2a2433" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
      <g fill="#f3efe4" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7" stroke-linejoin="round">
        <polygon points="48,67 50,73 52,67"/><polygon points="68,67 70,73 72,67"/><polygon points="52,80 55,76 57,82"/><polygon points="63,82 65,76 68,80"/><polygon points="57,85 60,79 63,85"/>
      </g>
    </g>
  </g></g>
  <!-- bubbles rising -->
  <g fill="none" stroke="var(--lg-light, #ffffff)" stroke-width="1" opacity="0.8">
    <circle style="transform-box:fill-box;transform-origin:center" cx="22" cy="40" r="2.4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 16;2 0;0 -16" dur="3.4s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="3.4s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="100" cy="34" r="1.8"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 16;-2 0;0 -16" dur="2.9s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.9s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="96" cy="70" r="1.4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 12;2 0;0 -12" dur="2.5s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.5s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
</svg>
