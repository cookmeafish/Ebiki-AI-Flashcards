      <g fill="#bffcff"><circle cx="50" cy="18" r="1.6"/><circle cx="70" cy="18" r="1.6"/><circle cx="60" cy="28" r="1.4"/><circle cx="44" cy="26" r="1"/><circle cx="76" cy="30" r="1"/><circle cx="60" cy="8" r="1"/></g>
