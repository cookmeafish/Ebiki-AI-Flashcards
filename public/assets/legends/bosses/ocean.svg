    <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1;1 0.1;1 1" keyTimes="0;.92;.96;1" dur="5s" repeatCount="indefinite"/>
      <ellipse rx="12" ry="6.8" fill="#3ff0ff" opacity="0.45"/><ellipse rx="9" ry="4.6" fill="#e4ff5c" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/><ellipse rx="5" ry="3.6" fill="none" stroke="#ff9a3d" stroke-width="1"/><ellipse rx="1.3" ry="4.3" fill="#0b1a24"/><circle cx="-2.4" cy="-1.6" r="1" fill="#fff"/>
    </g>
  </g></g>
