    <path d="M32 24 L12 12 L18 22 L6 26 L22 30Z" fill="#fff" opacity="0.2" stroke="none"/>
    <path d="M88 24 L108 12 L102 22 L114 26 L102 32 L112 40 L98 40 L102 48 L86 44Z" fill="var(--lg-deep, #1f6f99)"/>
