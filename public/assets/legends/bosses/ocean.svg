  <path d="M28 50 L45 55 L60 64 L75 55 L92 50 L91 58 L75 62 L60 71 L45 62 L29 58Z" fill="#000" opacity="0.4"/>
  <path d="M29 51 L45 56 L60 65 L75 56 L91 51" fill="none" stroke="var(--lg-far, #8fc7df)" stroke-width="1.1" stroke-linejoin="round"/>
  <g fill="var(--lg-far, #8fc7df)" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round"><path d="M30 51 L22 44 L34 50Z"/><path d="M90 51 L98 44 L86 50Z"/></g>
