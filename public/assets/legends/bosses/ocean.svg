  <path d="M22 50 L40 44 L42 52 L30 62 L24 76 L20 66Z" fill="#fff" opacity="0.18"/>
  <path d="M98 50 L100 66 L90 84 L80 90 L90 72 L94 56Z" fill="#000" opacity="0.28"/>
