<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Abyssal Kraken: a leviathan of the deep seen from below. Two great tentacles arc up behind it and frame the
       picture, a spined mantle with finned edges and glowing lures on stalks, slit-pupil eyes under one bony brow,
       a hooked beak in a ring of teeth, hooked front tentacles curling past the frame, a breaking wave at its base.
       Entrance: the tentacles unfurl, the eyes open, the beak gapes. -->
  <!-- the two great back tentacles: rise on the entrance, sway after -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="-80 34 48;-80 34 48;6 34 48;0 34 48" keyTimes="0;.4;.66;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 34 48;-6 34 48;0 34 48" dur="3.6s" repeatCount="indefinite"/>
      <path d="M36 52 C22 48 6 40 -4 26 C-12 12 -10 -6 2 -12 C12 -16 20 -6 14 2 C10 -4 2 0 4 8 C8 22 22 32 40 40Z" fill="var(--lg-near, #4fa3c7)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M36 52 C22 48 6 40 -4 26 C-8 18 -9 10 -7 2 C-4 18 8 32 30 42Z" fill="#000" opacity="0.25"/>
      <path d="M38 44 C22 38 8 28 4 12" fill="none" stroke="#fff" stroke-width="1" opacity="0.45" stroke-linecap="round"/>
      <g fill="var(--lg-far, #8fc7df)" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7"><circle cx="28" cy="40" r="2"/><circle cx="18" cy="34" r="1.8"/><circle cx="10" cy="26" r="1.6"/><circle cx="6" cy="16" r="1.4"/><circle cx="6" cy="7" r="1.2"/></g>
      <path d="M13 -1 C16 -4 18 -1 16 2 C16 0 15 -1 13 -1Z" fill="#f3efe4" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/>
    </g>
  </g>
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="80 86 48;80 86 48;-6 86 48;0 86 48" keyTimes="0;.44;.7;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 86 48;6 86 48;0 86 48" dur="3.9s" repeatCount="indefinite"/>
      <path d="M84 52 C98 48 114 40 124 26 C132 12 130 -6 118 -12 C108 -16 100 -6 106 2 C110 -4 118 0 116 8 C112 22 98 32 80 40Z" fill="var(--lg-near, #4fa3c7)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M84 52 C98 48 114 40 124 26 C128 18 129 10 127 2 C124 18 112 32 90 42Z" fill="#000" opacity="0.3"/>
