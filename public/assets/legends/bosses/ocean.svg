      <g fill="#f3efe4" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round"><path d="M29 90.5 L27 96 L31 91.5Z"/><path d="M18 95.5 L15 100 L19.5 96.5Z"/><path d="M8 101.5 L5 106 L9.5 102.5Z"/></g>
