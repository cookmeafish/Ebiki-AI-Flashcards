      <path d="M60 -6 L48 0 L36 14 L30 32 L28 50 L34 50 L38 28 L48 10 L60 2Z" fill="#fff" opacity="0.2"/>
      <path d="M72 0 L84 14 L90 32 L92 50 L78 55 L84 44 L82 26 L74 10Z" fill="#000" opacity="0.28"/>
