        <circle r="3" fill="#bffcff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/><circle cx="-0.8" cy="-0.8" r="1" fill="#fff"/>
      </g>
    </g>
  </g>
  <g transform="translate(70 6)">
