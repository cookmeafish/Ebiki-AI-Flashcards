      <path d="M107 -1 C104 -4 102 -1 104 2 C104 0 105 -1 107 -1Z" fill="#f3efe4" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/>
    </g>
  </g>
  <!-- the lures: glowing bulbs on stalks from the crown, swaying -->
