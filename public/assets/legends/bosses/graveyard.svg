<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Grave Lich: a robed skeleton king with a cracked crown, soul-fire eyes, a skull-orb staff and orbiting wisps. -->
  <!-- ghostly aura -->
  <path d="M60 4 C84 10 100 30 104 60 C108 90 96 110 88 120 H32 C24 110 12 90 16 60 C20 30 36 10 60 4Z" fill="#7cffcb" opacity="0.08"/>
  <!-- orbiting wisps -->
  <g transform="translate(60 56)">
    <g>
      <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="7s" repeatCount="indefinite"/>
      <g fill="#7cffcb" opacity="0.75">
        <path d="M-50 0 C-46 -6 -40 -6 -38 0 C-40 4 -44 6 -50 0Z"/><path d="M44 -20 C48 -26 54 -24 54 -18 C50 -14 46 -14 44 -20Z"/><path d="M10 48 C14 42 20 44 20 50 C16 54 12 54 10 48Z"/>
      </g>
    </g>
  </g>
  <!-- spectral chains -->
  <g fill="none" stroke="#7cffcb" stroke-width="1.4" stroke-dasharray="3 2" opacity="0.6">
    <path d="M24 84 C14 94 8 104 6 118"/><path d="M96 84 C106 94 112 104 114 118"/>
  </g>
  <!-- robe -->
  <path d="M34 50 C24 66 20 92 14 120 H106 C100 92 96 66 86 50 C78 44 42 44 34 50Z" fill="#221d30" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round">
    <animateTransform class="lg-loop" attributeName="transform" type="skewX" values="0;1.5;0;-1.5;0" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M34 50 C26 66 22 92 18 120 H34 C34 96 36 72 44 52Z" fill="var(--lg-deep, #7c4def)" opacity="0.35"/>
  <path d="M86 50 C94 66 98 92 102 120 H88 C86 96 84 72 78 54Z" fill="#000" opacity="0.3"/>
  <!-- torn robe edge -->
  <path d="M14 120 L20 112 L26 120 L34 110 L42 120 L50 112 L58 120 L66 110 L74 120 L82 112 L90 120 L98 110 L106 120Z" fill="#221d30" stroke="var(--lg-ink, #1d2230)" stroke-width="1"/>
  <!-- ribcage through the torn robe -->
  <path d="M48 62 C48 58 72 58 72 62 L70 88 H50Z" fill="#0f0c16"/>
  <g fill="none" stroke="#d9d3bf" stroke-width="2" stroke-linecap="round">
    <path d="M60 62 V88"/><path d="M52 68 C56 66 64 66 68 68 M51 74 C56 72 64 72 69 74 M52 80 C56 78 64 78 68 80"/>
  </g>
  <g transform="translate(60 76)"><g>
    <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.3;1" dur="1.6s" repeatCount="indefinite"/>
    <circle r="3.4" fill="#7cffcb" opacity="0.7"/>
  </g></g>
  <!-- the staff: raised on the entrance, orb flares -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="-40 24 100;-40 24 100;6 24 100;0 24 100" keyTimes="0;.45;.72;1" dur="1.5s" fill="freeze"/>
    <path d="M22 118 L18 22" stroke="#4a2f1a" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M22 118 L18 22" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-dasharray="4 5"/>
    <path d="M18 24 C10 20 8 12 12 6 M18 24 C26 20 28 12 24 6" fill="none" stroke="#4a2f1a" stroke-width="2" stroke-linecap="round"/>
    <g transform="translate(18 14)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="0.1;0.1;1.6;1" keyTimes="0;.6;.78;1" dur="1.6s" fill="freeze"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.2;1" dur="1.3s" begin="1.6s" repeatCount="indefinite"/>
        <circle r="11" fill="#7cffcb" opacity="0.25"/><circle r="7" fill="#7cffcb" opacity="0.45"/>
      </g>
      <path d="M-5 0 C-5 -5 5 -5 5 0 C5 3 3 4 2 4 V6 H-2 V4 C-3 4 -5 3 -5 0Z" fill="#e9fff6" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
      <g fill="#1d2230"><circle cx="-2" cy="-0.5" r="1"/><circle cx="2" cy="-0.5" r="1"/></g>
    </g></g>
    <!-- bony hand on the staff -->
    <g fill="#d9d3bf" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"><path d="M16 66 C20 62 26 64 26 68 L24 74 L18 74 L14 70Z"/><path d="M15 70 H24.6 M17 72 H23.6" fill="none"/></g>
  </g>
  <!-- clawed hand casting soul-fire -->
  <g>
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 88 70;-6 88 70;0 88 70" dur="2.6s" repeatCount="indefinite"/>
    <path d="M84 70 L96 62 L104 62" fill="none" stroke="#221d30" stroke-width="7" stroke-linecap="round"/>
    <g fill="none" stroke="#d9d3bf" stroke-width="1.6" stroke-linecap="round"><path d="M102 62 L110 54 M103 62 L112 60 M102 63 L109 68 M100 60 L104 52"/></g>
    <g transform="translate(110 52)"><g>
      <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;0.9 1.3;1 1" dur="0.7s" repeatCount="indefinite"/>
      <path d="M0 6 C-6 4 -6 -4 0 -12 C6 -4 6 4 0 6Z" fill="#7cffcb" opacity="0.85"/><path d="M0 4 C-3 2 -3 -2 0 -6 C3 -2 3 2 0 4Z" fill="#e9fff6"/>
    </g></g>
  </g>
  <!-- hood -->
  <path d="M34 50 C30 28 42 10 60 10 C78 10 90 28 86 50 C80 58 40 58 34 50Z" fill="#2c2540" stroke="var(--lg-ink, #1d2230)" stroke-width="2"/>
  <path d="M38 48 C36 32 44 18 56 14 C48 24 44 36 44 52Z" fill="#fff" opacity="0.08"/>
  <!-- skull face -->
  <path d="M46 40 C46 28 52 24 60 24 C68 24 74 28 74 40 C74 46 70 50 68 50 V54 H52 V50 C50 50 46 46 46 40Z" fill="#e6e0cc" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4"/>
  <path d="M66 26 L64 32 L67 35" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
  <path d="M58 44 L60 40 L62 44Z" fill="#1d2230"/>
  <g stroke="#1d2230" stroke-width="1"><path d="M54 50 V54 M57 50 V54 M60 50 V54 M63 50 V54 M66 50 V54"/></g>
  <!-- cracked crown -->
  <path d="M46 26 L48 14 L53 20 L56 10 L60 18 L64 10 L67 20 L72 14 L74 26Z" fill="#c9a441" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M62 18 L60 22 L62 26" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
  <g fill="#7cffcb"><circle cx="56" cy="21" r="1.2"/><circle cx="64" cy="21" r="1.2"/></g>
  <!-- soul-fire eyes: ignite on the entrance -->
  <g fill="#0f0c16"><ellipse cx="54" cy="36" rx="4.4" ry="4"/><ellipse cx="66" cy="36" rx="4.4" ry="4"/></g>
  <g transform="translate(54 36)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="0.05;0.05;1.6;1" keyTimes="0;.62;.8;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;0.9 1.25;1 1" dur="0.9s" begin="1.5s" repeatCount="indefinite"/>
      <circle r="5" fill="#7cffcb" opacity="0.4"/><path d="M0 3 C-2.4 2 -2.4 -1 0 -5 C2.4 -1 2.4 2 0 3Z" fill="#e9fff6"/></g>
  </g></g>
  <g transform="translate(66 36)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="0.05;0.05;1.6;1" keyTimes="0;.66;.84;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;0.9 1.25;1 1" dur="0.9s" begin="1.6s" repeatCount="indefinite"/>
      <circle r="5" fill="#7cffcb" opacity="0.4"/><path d="M0 3 C-2.4 2 -2.4 -1 0 -5 C2.4 -1 2.4 2 0 3Z" fill="#e9fff6"/></g>
  </g></g>
</svg>
