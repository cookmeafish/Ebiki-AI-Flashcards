<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Revenant Rider: a skeletal outlaw on a rearing nightmare horse, seen from below against its blood-red sun.
       A solid sun striped by the dusk, a ring of heat rays turning behind it and a vulture circling; the horse a
       bony black stallion with a horse skull, burning red eyes, fire pouring from its jaw, a flaming mane and tail,
       ribs through the hide and burning hooves; the rider a fanged skull under a holed flat hat, one V bone brow,
       glowing cyan eyes under one bone brow, a tattered duster, a bandolier of brass and twin revolvers.
       Entrance: it rears, the skull ignites and the horse breathes fire. -->
  <!-- the heat-ray ring, turning slowly behind the sun -->
  <g transform="translate(84 42) scale(1.3)">
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/>
      <path d="M0 -44 L5 -33 L15 -41 L15 -29 L27 -33 L23 -22 L36 -22 L28 -12 L41 -8 L31 -1 L42 6 L30 10 L37 20 L25 21 L28 33 L17 29 L16 41 L7 33 L2 44 L-4 33 L-12 42 L-14 30 L-26 35 L-23 23 L-36 24 L-29 14 L-42 9 L-31 1 L-41 -7 L-29 -11 L-36 -22 L-24 -22 L-27 -34 L-15 -29 L-14 -42 L-5 -33Z" fill="#e0233e" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M0 -44 L5 -33 L15 -41 L15 -29 L27 -33 L23 -22 L36 -22 L28 -12 L41 -8 L31 -1 L42 6 L30 10 L37 20 L25 21 L28 33 L17 29 L16 41 L7 33 L2 44 L-4 33 L-12 42 L-14 30 L-26 35 L-23 23 L-36 24 L-29 14 L-42 9 L-31 1 L-41 -7 L-29 -11 L-36 -22 L-24 -22 L-27 -34 L-15 -29 L-14 -42 L-5 -33Z" fill="#ff7a3a" transform="scale(0.86)"/>
    </g>
  </g>
  <!-- the blood-red sun, banded by the dusk -->
  <circle cx="84" cy="42" r="39" fill="#c8202e" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8"/>
  <path d="M50 56 H118 M54 66 H114 M60 74 H108" stroke="#8a1020" stroke-width="3" stroke-linecap="round"/>
  <path d="M58 26 C64 14 74 8 84 7" fill="none" stroke="#ff9a7a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- a vulture circling the sun -->
  <g transform="translate(84 42)">
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;-360" dur="9s" repeatCount="indefinite"/>
      <g transform="translate(0 -50)"><g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 0.5;1 1" dur="0.9s" repeatCount="indefinite"/>
        <path d="M0 0 C-3 -3 -6 -3 -9 -1 C-6 -1 -3 0 0 2 C3 0 6 -1 9 -1 C6 -3 3 -3 0 0Z" fill="#1d1b28" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/>
      </g></g>
    </g>
  </g>
  <!-- the figure, scaled up to fill the frame: hooves, revolver and hat run past the edges -->
  <g transform="translate(70 62) scale(1.22) translate(-70 -62)">
  <!-- the whole rider rears on the entrance, and rocks while it gallops -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="0 74 116;0 74 116;-16 74 116;4 74 116;0 74 116" keyTimes="0;.55;.72;.88;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 74 116;-2 74 116;0 74 116" dur="1.2s" begin="1.5s" repeatCount="indefinite"/>
      <!-- the burning tail, streaming back -->
      <g fill="#ff7a1a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round">
        <path style="transform-box:fill-box;transform-origin:left center" d="M96 80 C106 74 114 80 122 72 C120 84 112 90 102 88 C110 92 118 94 126 90 C120 102 106 100 94 92Z"><animateTransform class="lg-loop" attributeName="transform" type="skewY" values="0;7;0" dur="0.7s" repeatCount="indefinite"/></path>
        <path d="M100 84 C106 82 110 84 114 80 C112 86 106 88 100 87Z" fill="#ffd23f" stroke="none"/>
      </g>
      <!-- hind legs: bone and sinew, burning hooves -->
      <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round">
        <path d="M80 90 L90 104 L86 116 H93 L99 103 L92 88Z" fill="#1d1b28"/>
        <path d="M68 94 L69 108 L62 117 H69 L77 106 L77 94Z" fill="#2a2533"/>
      </g>
      <g fill="#ff7a1a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7"><path d="M85 116 L87 112 L89 115 L91 111 L94 116Z M61 117 L63 113 L65 116 L67 112 L70 117Z"/></g>
      <!-- the barrel, ribs through the hide -->
      <path d="M38 77 C40 64 56 60 72 62 C88 64 99 72 99 84 C99 96 87 101 70 101 C54 101 38 93 38 77Z" fill="#2a2533" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
      <path d="M44 70 C52 63 66 62 78 64 C66 66 54 68 46 76Z" fill="#6a5a7a" opacity="0.6"/>
      <path d="M52 68 C47 76 47 88 52 96 L58 98 C56 92 56 74 60 66Z" fill="#14121c"/>
      <g fill="none" stroke="#e6e0cc" stroke-width="1.8" stroke-linecap="round"><path d="M56 68 C53 76 53 88 56 96"/><path d="M63 66 C60 76 60 88 63 98"/><path d="M70 66 C67 76 67 88 70 98"/></g>
      <path d="M50 70 C64 66 78 66 88 70" fill="none" stroke="#e6e0cc" stroke-width="2.2" stroke-linecap="round"/>
      <!-- front legs, raised, hooves burning -->
      <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round">
        <path d="M44 80 L32 70 L20 74 L22 79 L32 76 L42 88Z" fill="#1d1b28"/>
        <path d="M48 87 L36 92 L28 100 L32 103 L38 97 L50 93Z" fill="#2a2533"/>
      </g>
      <g fill="#e6e0cc" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"><circle cx="32" cy="72.6" r="1.6"/><circle cx="37" cy="94" r="1.6"/></g>
      <g style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.2;1" dur="0.5s" repeatCount="indefinite"/>
        <path d="M21 79 C16 78 14 74 17 70 C17 73 19 73 19 70 C22 72 23 76 21 79Z M31 103 C26 103 24 99 27 95 C27 98 29 98 29 95 C32 97 33 101 31 103Z" fill="#ff7a1a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/>
      </g>
      <!-- the neck and the flaming mane -->
      <path d="M42 81 C35 70 33 58 36 47 L47 45 C51 57 55 68 57 72Z" fill="#2a2533" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M38 50 C38 60 40 70 44 78" fill="none" stroke="#6a5a7a" stroke-width="1.2"/>
      <g fill="#ff7a1a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round">
        <path style="transform-box:fill-box;transform-origin:center bottom" d="M46 48 C47 40 43 36 45 28 C50 34 52 40 51 46 C54 40 56 34 56 27 C61 36 60 46 55 58 C58 52 62 48 62 42 C66 52 62 62 56 66Z"><animateTransform class="lg-loop" attributeName="transform" type="skewX" values="0;-6;0" dur="0.6s" repeatCount="indefinite"/></path>
      </g>
      <path d="M49 44 C49 39 51 36 51 36 C53 40 53 42 49 44Z M55 56 C56 50 58 47 58 47 C59 52 58 54 55 56Z" fill="#ffd23f"/>
      <!-- the horse skull, angled down as it rears, ears laid back -->
      <g transform="rotate(-20 40 52)">
      <g fill="#e6e0cc" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"><path d="M33 43 L35 31 L39 42Z"/><path d="M28 42 L28 30 L33 41Z"/></g>
      <path d="M38 46 C32 39 20 38 9 43 C4 46 2 52 4 56 C6 60 12 61 17 60 L28 59 L41 54Z" fill="#e6e0cc" stroke="var(--lg-ink, #1d2230)" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M36 46 C30 42 22 41 14 43 C22 44 30 46 34 50Z" fill="#fff" opacity="0.6"/>
      <path d="M40 53 L30 57 L18 58 C24 56 32 54 38 50Z" fill="#000" opacity="0.2"/>
      <path d="M22 41 L18 47 M30 41 L27 46" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
      <ellipse cx="7" cy="48" rx="1.6" ry="1" fill="#1a0508"/>
      <!-- its eye: a burning socket under a bone ridge -->
      <path d="M22 44 L32 46 L30 51 L23 50Z" fill="#1a0508" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round"/>
      <ellipse cx="27" cy="48" rx="3.6" ry="2.2" fill="#ff2e4c" opacity="0.45"/><ellipse cx="27" cy="48" rx="2" ry="1.2" fill="#ff2e4c"/><circle cx="26.4" cy="47.6" r="0.5" fill="#fff"/>
      <path d="M20 43 L33 44.6" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linecap="round"/>
      <!-- teeth and the open jaw -->
      <path d="M5 56 L17 58.6 L28 58" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
      <path d="M7 56.4 V59.4 M10 57 V60 M13 57.6 V60.6 M16 58.2 V61" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7"/>
      <path d="M6 60 C10 62 18 63 26 61 L24 66 C18 67 10 65 6 62Z" fill="#cfc6ae" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
      <!-- fire pouring from the jaw -->
      <g transform="translate(6 59)"><g>
        <animateTransform class="lg-in" attributeName="transform" type="scale" values="0;0;1.4;1" keyTimes="0;.7;.86;1" dur="1.5s" fill="freeze"/>
        <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.2;1" dur="0.5s" begin="1.5s" repeatCount="indefinite"/>
          <path d="M0 -1 C-5 0 -9 -3 -13 0 C-9 1 -10 4 -15 6 C-8 7 -5 4 -4 8 C-2 4 0 3 0 1Z" fill="#ff7a1a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round"/>
          <path d="M0 0 C-3 0 -6 0 -8 2 C-6 3 -3 2 0 1.6Z" fill="#ffd23f"/>
        </g>
      </g></g>
      </g>
      <!-- the rider: a tattered duster flapping behind -->
      <path style="transform-box:fill-box;transform-origin:center top" d="M58 64 C54 50 58 36 66 32 H82 C88 38 90 52 86 64 L96 78 L89 75 L91 84 L83 77 L79 86 L74 76 L67 82 L66 71Z" fill="#6b4a2a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.7" stroke-linejoin="round">
        <animateTransform class="lg-loop" attributeName="transform" type="skewX" values="0;-4;0" dur="1s" repeatCount="indefinite"/>
      </path>
      <path d="M62 60 C60 48 62 40 68 36 M82 36 C86 44 86 54 84 62" fill="none" stroke="#9a7048" stroke-width="1.4"/>
      <path d="M78 34 C84 40 86 50 84 62 L88 70 C90 58 88 42 82 33Z" fill="#000" opacity="0.25"/>
      <!-- ribcage under the coat, and the bandolier of brass -->
      <path d="M68 38 H80 L78 54 H70Z" fill="#1a1410" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
      <path d="M69 42 H79 M69.6 46 H78.4 M70 50 H78" stroke="#e6e0cc" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M64 36 L84 58" stroke="#3a2418" stroke-width="4" stroke-linecap="round"/>
      <g fill="#e0b030" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5"><rect x="66.4" y="37.6" width="1.6" height="3.4" transform="rotate(-42 67.2 39.3)"/><rect x="70" y="41.6" width="1.6" height="3.4" transform="rotate(-42 70.8 43.3)"/><rect x="73.6" y="45.6" width="1.6" height="3.4" transform="rotate(-42 74.4 47.3)"/><rect x="77.2" y="49.6" width="1.6" height="3.4" transform="rotate(-42 78 51.3)"/><rect x="80.8" y="53.6" width="1.6" height="3.4" transform="rotate(-42 81.6 55.3)"/></g>
      <!-- bony arms with twin revolvers -->
      <g stroke-linecap="round" fill="none"><path d="M65 40 L53 37 L44 31" stroke="var(--lg-ink, #1d2230)" stroke-width="4"/><path d="M83 40 L95 38 L102 31" stroke="var(--lg-ink, #1d2230)" stroke-width="4"/><path d="M65 40 L53 37 L44 31" stroke="#e6e0cc" stroke-width="2.4"/><path d="M83 40 L95 38 L102 31" stroke="#e6e0cc" stroke-width="2.4"/></g>
      <g fill="#e6e0cc" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7"><circle cx="53" cy="37" r="1.6"/><circle cx="95" cy="38" r="1.6"/></g>
      <g stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round">
        <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 44 31;-8 44 31;0 44 31" dur="1.6s" repeatCount="indefinite"/>
          <path d="M46 30 L32 25 L32.6 22.4 L46.6 27Z" fill="#8a8f9c"/><path d="M33 23 L45 27" stroke="#e6e8ee" stroke-width="0.5"/>
          <ellipse cx="44" cy="28.4" rx="2.6" ry="2" fill="#5a5f6a"/><path d="M42.6 28.4 H45.4" stroke="#c9ccd6" stroke-width="0.5"/>
          <path d="M45 30 L47 36 L44 36.6 L42.6 31Z" fill="#6b4423"/><path d="M47 26 L49 24.4" stroke-width="1.2"/>
        </g>
        <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 102 31;8 102 31;0 102 31" dur="1.6s" repeatCount="indefinite"/>
          <path d="M100 30 L113 23 L114.4 25.4 L101.6 33Z" fill="#8a8f9c"/><path d="M101 31 L113.4 24" stroke="#e6e8ee" stroke-width="0.5"/>
          <ellipse cx="102.4" cy="30.4" rx="2.6" ry="2" fill="#5a5f6a" transform="rotate(-30 102.4 30.4)"/>
          <path d="M101 32 L100 38 L103 38.4 L103.4 33Z" fill="#6b4423"/>
        </g>
      </g>
      <path d="M62 24 C62 13 86 13 86 24 C86 29 84 31 82 32 V35 H66 V32 C64 31 62 29 62 24Z" fill="#e6e0cc" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M64 22 C64 16 70 14 74 14 C69 16 66 20 66 28Z" fill="#fff" opacity="0.6"/>
      <path d="M82 18 C85 21 86 25 84 30 L80 31 C82 26 82 22 82 18Z" fill="#000" opacity="0.2"/>
      <!-- sockets under one V bone brow -->
      <path d="M64 22 C66 21 69 22 72 25 C71 28 67 29 65 27 C64 26 64 24 64 22Z M84 22 C82 21 79 22 76 25 C77 28 81 29 83 27 C84 26 84 24 84 22Z" fill="#06121a"/>
      <g transform="translate(68 25) rotate(25)"><ellipse rx="3.6" ry="2.2" fill="#6ff3ff" opacity="0.45"/><ellipse rx="2" ry="1.1" fill="#6ff3ff"/><circle cx="-0.6" cy="-0.3" r="0.5" fill="#fff"/></g>
      <g transform="translate(80 25) rotate(-25)"><ellipse rx="3.6" ry="2.2" fill="#6ff3ff" opacity="0.45"/><ellipse rx="2" ry="1.1" fill="#6ff3ff"/><circle cx="0.6" cy="-0.3" r="0.5" fill="#fff"/></g>
      <path d="M62.6 19 C67 19.6 71 21 74 24.4 C77 21 81 19.6 85.4 19 L85 21.6 C81 22 77.4 24 74 27.6 C70.6 24 67 22 63 21.6Z" fill="#e6e0cc" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round"/>
      <path d="M72.6 28 L74 30.6 L75.4 28Z" fill="#1a0508"/>
      <!-- the grin: too many teeth, a jaw that chatters -->
      <path d="M66 31 H82" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 1.2;0 0" dur="0.6s" repeatCount="indefinite"/>
        <path d="M65 32 H83 L82 36.6 C78 38 70 38 66 36.6Z" fill="#d8cfb6" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
        <path d="M67.6 32 V36.6 M70.2 32 V37.4 M72.8 32 V37.6 M75.4 32 V37.6 M78 32 V37.4 M80.6 32 V36.6" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/>
      </g>
      <g fill="#f4efe0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5"><path d="M66 31 L67 34 L68 31Z M69 31 L70 33 L71 31Z M72 31 L73 33 L74 31Z M75 31 L76 33 L77 31Z M78 31 L79 33 L80 31Z M81 31 L82 34 L82.6 31Z"/></g>
      <!-- the flat hat, holed by bullets -->
      <path d="M52 17 C58 12 90 12 96 17 C93 20 55 20 52 17Z" fill="#3a2418" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M62 16 C61 6 64 2 74 2 C84 2 87 6 86 16Z" fill="#4a3020" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M64 13 C64 7 67 4 72 3.6 C68 6 66 9 66 13Z" fill="#fff" opacity="0.18"/>
      <path d="M62 13.4 H86" stroke="#8a1a1a" stroke-width="2"/>
      <g fill="#f4efe0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.4"><path d="M66 12.4 L67 14.6 L68 12.4Z M70 12.4 L71 14.6 L72 12.4Z M76 12.4 L77 14.6 L78 12.4Z M80 12.4 L81 14.6 L82 12.4Z"/></g>
      <g fill="#ff9a3d"><circle cx="80" cy="7" r="1.1"/><circle cx="67" cy="9" r="0.8"/></g>
      <g fill="#1a0508"><circle cx="80" cy="7" r="0.6"/><circle cx="67" cy="9" r="0.45"/></g>
    </g>
  </g>
  <!-- dust kicked up by the hooves: soft puffs (three overlapping circles each, pale and see-through) that start
       small behind the hind hooves, drift back and up, swell and shrink away, staggered. Still pose: faint puffs. -->
  <g fill="#e2cfae" opacity="0.5">
    <g style="transform-box:fill-box;transform-origin:center"><circle cx="90" cy="114" r="3.2"/><circle cx="92.9" cy="112.6" r="2.6"/><circle cx="95.4" cy="114.3" r="2.1"/><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;14 -6" dur="1.3s" begin="0s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0.25;0.9;1.25;0" keyTimes="0;.2;.7;1" dur="1.3s" begin="0s" repeatCount="indefinite" additive="sum"/></g>
    <g style="transform-box:fill-box;transform-origin:center"><circle cx="78" cy="117" r="2.6"/><circle cx="80.3" cy="115.8" r="2.1"/><circle cx="82.4" cy="117.3" r="1.7"/><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;12 -5" dur="1.5s" begin="0.45s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0.25;0.9;1.25;0" keyTimes="0;.2;.7;1" dur="1.5s" begin="0.45s" repeatCount="indefinite" additive="sum"/></g>
    <g style="transform-box:fill-box;transform-origin:center"><circle cx="100" cy="111" r="2.2"/><circle cx="102.0" cy="110.0" r="1.8"/><circle cx="103.7" cy="111.2" r="1.4"/><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;10 -6" dur="1.1s" begin="0.8s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0.25;0.9;1.25;0" keyTimes="0;.2;.7;1" dur="1.1s" begin="0.8s" repeatCount="indefinite" additive="sum"/></g>
  </g>
  </g>
</svg>
