<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Revenant Rider: a skeletal outlaw on a nightmare horse. A flat hat, a burning skull, a tattered duster,
       twin revolvers, the horse rearing and breathing fire. -->
  <!-- blood-red sun -->
  <circle cx="84" cy="30" r="22" fill="#e0233e" opacity="0.25"/>
  <!-- the whole rider rears on the entrance -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="0 70 116;0 70 116;-16 70 116;4 70 116;0 70 116" keyTimes="0;.55;.72;.88;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 70 116;-2 70 116;0 70 116" dur="1.2s" begin="1.5s" repeatCount="indefinite"/>
      <!-- the nightmare horse: body -->
      <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round">
        <!-- hind legs -->
        <path d="M76 92 L84 106 L80 118 H86 L92 104 L86 90Z" fill="#1d1b28"/>
        <path d="M66 94 L66 108 L60 118 H66 L74 106 L74 94Z" fill="#26232f"/>
        <!-- barrel -->
        <path d="M40 78 C40 66 56 62 72 64 C86 66 94 74 94 84 C94 94 84 98 70 98 C54 98 40 92 40 78Z" fill="#26232f"/>
        <!-- ribs showing through -->
        <path d="M56 70 C58 78 58 88 56 94 M64 68 C66 78 66 88 64 96 M72 68 C74 78 74 88 72 96" fill="none" stroke="#e6e0cc" stroke-width="1.4"/>
        <!-- front legs, raised -->
        <path d="M44 80 L32 72 L22 76 L24 80 L32 78 L42 88Z" fill="#1d1b28"/>
        <path d="M48 86 L36 90 L28 98 L32 100 L38 94 L50 92Z" fill="#26232f"/>
        <!-- neck and head -->
        <path d="M42 80 C36 70 34 58 36 48 L46 46 C50 58 54 68 56 72Z" fill="#26232f"/>
        <path d="M36 48 C30 44 20 44 12 50 C8 54 10 60 16 60 C22 60 28 58 34 58 L46 52Z" fill="#e6e0cc"/>
        <!-- skull horse head: eye socket and teeth -->
        <path d="M14 56 H26 M16 56 V59 M19 56 V59 M22 56 V59" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" fill="none"/>
      </g>
      <!-- the horse's burning mane and tail -->
      <g fill="#ff7a1a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round">
        <path d="M46 46 C48 38 44 34 46 28 C50 34 52 40 50 46 C54 40 56 36 56 30 C60 38 58 48 52 60Z"><animateTransform class="lg-loop" attributeName="transform" type="skewX" values="0;-6;0" dur="0.6s" repeatCount="indefinite"/></path>
        <path d="M94 80 C104 76 110 82 114 76 C114 86 108 92 98 90 C104 94 110 96 116 94 C110 102 100 100 92 92Z"><animateTransform class="lg-loop" attributeName="transform" type="skewY" values="0;6;0" dur="0.7s" repeatCount="indefinite"/></path>
      </g>
      <g fill="#ffd23f"><path d="M50 44 C50 38 52 36 52 36 C54 40 54 42 50 44Z M100 86 C102 82 106 82 106 82 C104 86 102 88 100 86Z"/></g>
      <!-- the horse's eye -->
      <circle cx="26" cy="51" r="2.4" fill="#1a0508"/>
      <circle cx="26" cy="51" r="1.2" fill="#ff2e4c"/>
      <!-- fire breath -->
      <g transform="translate(10 58)"><g>
        <animateTransform class="lg-in" attributeName="transform" type="scale" values="0;0;1.4;1" keyTimes="0;.7;.86;1" dur="1.5s" fill="freeze"/>
        <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.2;1" dur="0.5s" begin="1.5s" repeatCount="indefinite"/>
          <path d="M0 0 C-4 2 -8 0 -10 4 C-6 4 -6 8 -10 10 C-4 10 -2 6 0 4Z" fill="#ff7a1a"/><path d="M0 1 C-3 2 -5 2 -6 4 C-4 5 -2 4 0 3Z" fill="#ffd23f"/>
        </g>
      </g></g>
      <!-- the rider: tattered duster -->
      <path d="M58 64 C54 50 58 36 66 32 H78 C84 38 86 52 82 64 L90 76 L84 74 L86 82 L78 76 L74 84 L70 74 L64 80 L64 70Z" fill="#6b4a2a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round">
        <animateTransform class="lg-loop" attributeName="transform" type="skewX" values="0;-3;0" dur="1s" repeatCount="indefinite"/>
      </path>
      <path d="M62 60 C60 48 62 40 68 36" fill="none" stroke="#8a6a44" stroke-width="1.4"/>
      <!-- bandolier -->
      <path d="M64 36 L80 56" stroke="#3a2418" stroke-width="3"/>
      <g fill="#c9a441"><circle cx="68" cy="41" r="1"/><circle cx="72" cy="46" r="1"/><circle cx="76" cy="51" r="1"/></g>
      <!-- bony arms with twin revolvers -->
      <g stroke="#e6e0cc" stroke-width="2.4" stroke-linecap="round" fill="none"><path d="M64 40 L52 36 L44 30"/><path d="M80 40 L92 38 L100 32"/></g>
      <g fill="#5a5f6a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round">
        <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 44 30;-8 44 30;0 44 30" dur="1.6s" repeatCount="indefinite"/>
          <path d="M44 30 L34 26 L34 23 L46 26Z"/><path d="M44 28 L46 34 L43 34 L42 29Z" fill="#6b4423"/></g>
        <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 100 32;8 100 32;0 100 32" dur="1.6s" repeatCount="indefinite"/>
          <path d="M100 32 L110 26 L111 29 L101 35Z"/><path d="M100 32 L98 38 L101 38 L102 33Z" fill="#6b4423"/></g>
      </g>
      <!-- the burning skull: ignites on the entrance -->
      <g transform="translate(72 22)"><g>
        <animateTransform class="lg-in" attributeName="transform" type="scale" values="0;0;1.5;1" keyTimes="0;.75;.9;1" dur="1.5s" fill="freeze"/>
        <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;0.9 1.2;1 1" dur="0.5s" begin="1.5s" repeatCount="indefinite"/>
          <path d="M-10 4 C-12 -4 -6 -10 -8 -18 C-2 -14 0 -20 0 -26 C4 -20 8 -18 6 -12 C12 -14 12 -6 10 4Z" fill="#6ff3ff" opacity="0.8"/>
          <path d="M-6 4 C-6 -2 -2 -6 -2 -12 C2 -8 4 -8 4 -4 C6 -6 8 -2 6 4Z" fill="#e8ffff"/>
        </g>
      </g></g>
      <path d="M64 26 C64 16 80 16 80 26 C80 30 78 32 76 32 V35 H68 V32 C66 32 64 30 64 26Z" fill="#e6e0cc" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"/>
      <g fill="#1a0508"><path d="M66 24 C66 21 70 21 70 25 C70 27 66 27 66 24Z"/><path d="M78 24 C78 21 74 21 74 25 C74 27 78 27 78 24Z"/><path d="M71 28 L72 30 L73 28Z"/></g>
      <g fill="#6ff3ff"><circle cx="68" cy="24" r="1"/><circle cx="76" cy="24" r="1"/></g>
      <path d="M68 32 V35 M70 32 V35 M72 32 V35 M74 32 V35" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7"/>
      <!-- the flat hat -->
      <path d="M56 20 C62 16 82 16 88 20 C86 22 58 22 56 20Z" fill="#3a2418" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"/>
      <path d="M62 19 C62 10 82 10 82 19Z" fill="#4a3020" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"/>
      <path d="M62 17 H82" stroke="#8a1a1a" stroke-width="1.6"/>
    </g>
  </g>
  <!-- dust clouds and a tumbleweed -->
  <g fill="#c8a878" opacity="0.8">
    <circle style="transform-box:fill-box;transform-origin:center" cx="86" cy="116" r="5"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;10 -4" dur="1.4s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1.4s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="62" cy="118" r="4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;8 -4" dur="1.6s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1.6s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
  <g fill="none" stroke="#8a6a44" stroke-width="0.9">
    <circle cx="108" cy="112" r="5"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 108 112;360 108 112" dur="2s" repeatCount="indefinite"/></circle>
    <path d="M104 110 L112 114 M106 116 L110 108"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 108 112;360 108 112" dur="2s" repeatCount="indefinite"/></path>
  </g>
</svg>
