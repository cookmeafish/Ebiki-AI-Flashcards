      <path d="M-1.6 -2.4 C-2.6 0 -2.6 2.4 -1.2 4.8 C-0.2 2.4 -0.4 0 -1.6 -2.4Z" fill="#1a0808"/>
      <circle cx="3.6" cy="-2" r="0.9" fill="#fff"/>
    </g></g>
