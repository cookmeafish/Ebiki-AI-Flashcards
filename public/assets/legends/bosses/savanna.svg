      <path d="M1.6 -2.4 C2.6 0 2.6 2.4 1.2 4.8 C0.2 2.4 0.4 0 1.6 -2.4Z" fill="#1a0808"/>
      <circle cx="-3.6" cy="-2" r="0.9" fill="#fff"/>
    </g></g>
    <g transform="translate(73 54) scale(1.15)"><g>
