    <path d="M106 112 C106 100 98 94 86 94 C78 94 74 100 74 106 L74 112 C80 116 98 116 106 112Z" fill="#e0a13a"/>
  </g>
  <path d="M86 94 C98 94 106 100 106 112 C102 114 98 115 94 115 C96 106 92 98 86 96Z" fill="#000" opacity="0.2"/>
  <path d="M24 106 V113 M32 104 V114 M40 106 V113 M80 106 V113 M88 104 V114 M96 106 V113" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9"/>
  <g fill="#f4efe0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7" stroke-linejoin="round">
    <path d="M18 112 L17 120 L22 113Z M26 114 L26 122 L30 114Z M34 114 L35 122 L38 114Z M42 112 L44 119 L46 111Z"/>
    <path d="M102 112 L103 120 L98 113Z M94 114 L94 122 L90 114Z M86 114 L85 122 L82 114Z M78 112 L76 119 L74 111Z"/>
