<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Pride Tyrant: a monstrous lion roaring on Pride Rock in front of a blazing low sun. A mane of burning spikes
       in three layers with flame tips, a crown of five horns, an angular scarred face under one heavy V brow, burning
       slit eyes, saber fangs past the lip, and clawed paws hooked over the rock. Entrance: the mane flares, the eyes
       open, the jaw drops into a roar. -->
  <!-- the blazing low sun, banded by heat -->
  <g transform="translate(60 52)">
    <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.03;1" dur="2.6s" repeatCount="indefinite"/>
      <circle r="64" fill="#ff9a3d" stroke="var(--lg-ink, #1d2230)" stroke-width="2"/>
      <circle r="58" fill="#ffc35a"/>
      <circle r="50" fill="#ffe08a"/>
      <g fill="var(--lg-deep, #c0392b)" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"><path d="M-60 22 H60 L59 26 H-59Z"/><path d="M-55 34 H55 L53 39 H-53Z"/><path d="M-46 46 H46 L42 51 H-42Z"/></g>
    </g>
  </g>
  <!-- Pride Rock under it -->
  <path d="M-14 128 L-12 108 L-2 102 L10 104 L20 98 L34 100 L46 96 L60 98 L74 96 L86 100 L100 98 L110 104 L122 102 L132 108 L134 128 C124 134 112 130 100 134 C86 138 72 132 60 136 C46 132 32 138 18 134 C6 130 -6 134 -14 128Z" fill="var(--lg-deep, #c0392b)" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M60 98 L74 96 L86 100 L100 98 L110 104 L122 102 L132 108 L134 128 C124 134 112 130 100 134 C86 138 72 132 60 136Z" fill="#000" opacity="0.25"/>
  <path d="M-10 108 L-2 104 L10 106 L20 100 L34 102 L46 98 L58 100" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.35"/>
  <path d="M8 112 L14 120 M30 108 L28 118 L34 124 M90 110 L94 120 M108 112 L104 122" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the burning spike mane: flares on the entrance -->
  <g transform="translate(60 56)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="0.5;0.5;1.25;1" keyTimes="0;.55;.78;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;3;0;-3;0" dur="3s" repeatCount="indefinite"/>
      <path d="M0.0 -57.0 L7.8 -37.3 L20.7 -47.4 L22.2 -31.6 L44.1 -41.9 L33.3 -21.1 L51.0 -20.1 L39.2 -7.4 L60.0 -0.0 L39.2 7.4 L49.9 19.6 L33.3 21.1 L44.1 41.9 L22.2 31.6 L21.1 48.4 L7.8 37.3 L0.0 57.0 L-7.8 37.3 L-20.7 47.4 L-22.2 31.6 L-44.1 41.9 L-33.3 21.1 L-51.0 20.1 L-39.2 7.4 L-60.0 0.0 L-39.2 -7.4 L-49.9 -19.6 L-33.3 -21.1 L-44.1 -41.9 L-22.2 -31.6 L-21.1 -48.4 L-7.8 -37.3Z" fill="#8a1c10" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M0 -57 L7.8 -37.3 L20.7 -47.4 L22.2 -31.6 L44.1 -41.9 L33.3 -21.1 L51 -20.1 L39.2 -7.4 L60 0 L39.2 7.4 L49.9 19.6 L33.3 21.1 L44.1 41.9 L22.2 31.6 L21.1 48.4 L7.8 37.3 L0 57 L0 0Z" fill="#000" opacity="0.2"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.05;1" dur="0.7s" repeatCount="indefinite"/>
        <path d="M9.4 -44.7 L12.2 -28.1 L24.5 -34.9 L22.6 -21.5 L41.9 -26.6 L29.6 -11.6 L42.4 -8.0 L32.0 -0.0 L47.1 8.9 L29.6 11.6 L36.7 23.3 L22.6 21.5 L28.0 39.8 L12.2 28.1 L8.4 40.3 L0.0 30.4 L-9.4 44.7 L-12.2 28.1 L-24.5 34.9 L-22.6 21.5 L-41.9 26.6 L-29.6 11.6 L-42.4 8.0 L-32.0 0.0 L-47.1 -8.9 L-29.6 -11.6 L-36.7 -23.3 L-22.6 -21.5 L-28.0 -39.8 L-12.2 -28.1 L-8.4 -40.3 L-0.0 -30.4Z" fill="#e2421a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
