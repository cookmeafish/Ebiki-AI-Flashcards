    <path d="M60 58.6 C66 58.6 70 59.6 70 62 L72 72 C68 74 64 74.6 60 74.8Z" fill="#000" opacity="0.15"/>
    <path d="M53 59 H67 L60 66Z" fill="#3a1a14" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M55.6 60.2 L58.6 60.2" stroke="#fff" stroke-width="0.8" opacity="0.8"/>
    <g fill="var(--lg-ink, #1d2230)"><circle cx="53" cy="68" r="0.6"/><circle cx="55" cy="70" r="0.6"/><circle cx="67" cy="68" r="0.6"/><circle cx="65" cy="70" r="0.6"/></g>
    <!-- the roar: the jaw drops open -->
