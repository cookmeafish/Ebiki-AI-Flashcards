  <path d="M76 32 C84 20 90 6 97 -9 C92 -2 88 4 82 18Z M67 27 C68 18 70 10 72 2 C70 8 68 16 64 26Z" fill="#000" opacity="0.2"/>
  <path d="M40 22 L46 20 M34 12 L41 10 M28 2 L34 1 M80 22 L74 20 M86 12 L79 10 M92 2 L86 1" stroke="#a8946a" stroke-width="1" stroke-linecap="round"/>
