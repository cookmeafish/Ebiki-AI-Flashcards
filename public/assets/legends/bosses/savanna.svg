        <path transform="rotate(0)" d="M-2.4 -46 C-3 -50 -1 -53 0 -55 C1 -53 3 -50 2.4 -46Z"/><path transform="rotate(45)" d="M-2.4 -46 C-3 -50 -1 -53 0 -55 C1 -53 3 -50 2.4 -46Z"/><path transform="rotate(90)" d="M-2.4 -50 C-3 -54 -1 -57 0 -59 C1 -57 3 -54 2.4 -50Z"/><path transform="rotate(135)" d="M-2.4 -46 C-3 -50 -1 -53 0 -55 C1 -53 3 -50 2.4 -46Z"/>
        <path transform="rotate(-45)" d="M-2.4 -46 C-3 -50 -1 -53 0 -55 C1 -53 3 -50 2.4 -46Z"/><path transform="rotate(-90)" d="M-2.4 -50 C-3 -54 -1 -57 0 -59 C1 -57 3 -54 2.4 -50Z"/><path transform="rotate(-135)" d="M-2.4 -46 C-3 -50 -1 -53 0 -55 C1 -53 3 -50 2.4 -46Z"/>
      </g>
    </g>
  </g></g>
  <g transform="translate(60 62) scale(1.14) translate(-60 -62)">
