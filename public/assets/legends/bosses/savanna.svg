<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Pride Tyrant: a proud lion king roaring on Pride Rock in front of a blazing low sun. Everything is soft and
       round: a huge fluffy mane of sunset curls in three layers, round ears, a forelock, a rounded face under two heavy
       fur brows, glowing gold almond eyes, a scar, puffy whisker pads, a round roar with two big round-tipped fangs and
       a rounded tongue, and big soft paws resting on a rounded rock. Entrance: the mane flares, the eyes open, the jaw
       drops into a roar. -->
  <!-- the blazing low sun, soft rings and rounded heat bands -->
  <g transform="translate(60 52)">
    <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.03;1" dur="2.6s" repeatCount="indefinite"/>
      <circle r="64" fill="var(--lg-tint,#ff9a3d)" stroke="var(--lg-ink, #1d2230)" stroke-width="2"/>
      <circle r="58" fill="var(--lg-tint-hi,#ffc35a)"/>
      <circle r="50" fill="#ffe08a"/>
      <circle r="54" fill="none" stroke="#fff" stroke-width="1" opacity="0.35"/>
      <g fill="var(--lg-tint-lo,#c0392b)" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"><rect x="-56" y="22" width="112" height="4.4" rx="2.2"/><rect x="-49" y="34" width="98" height="5" rx="2.5"/><rect x="-39" y="46" width="78" height="5" rx="2.5"/></g>
    </g>
  </g>
