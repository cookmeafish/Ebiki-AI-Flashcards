    <circle style="transform-box:fill-box;transform-origin:center" cx="112" cy="44" r="1.4"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;4 -30" dur="2.1s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.1s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="40" cy="4" r="1.2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 6;-2 -14" dur="1.5s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1.5s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="84" cy="2" r="1.1"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 6;3 -14" dur="1.7s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1.7s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
</svg>
