      <animateTransform class="lg-in" attributeName="transform" type="translate" values="0 -9;0 -9;0 4;0 0" keyTimes="0;.7;.85;1" dur="1.5s" fill="freeze"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 2;0 0" dur="1.8s" repeatCount="indefinite"/>
        <path d="M46 72 C52 70 68 70 74 72 L72 86 C68 94 52 94 48 86Z" fill="#4a0c0c" stroke="var(--lg-ink, #1d2230)" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M53 84 C55 80 65 80 67 84 C65 88 55 88 53 84Z" fill="#c43a4a"/>
        <path d="M60 81 V86" stroke="#7a1a24" stroke-width="0.7"/>
