    <path d="M38 34 L48 26 L60 24 L58 30 L46 34 L36 46 L32 46Z" fill="#fff" opacity="0.3"/>
    <path d="M52 28 L60 36 L68 28 M56 26 L60 31 L64 26" fill="none" stroke="#a8641e" stroke-width="1" stroke-linejoin="round"/>
    <g fill="none" stroke="#a8641e" stroke-width="0.8" stroke-linecap="round"><path d="M28 52 l4 1 M32 66 l4 -1 M92 52 l-4 1 M88 66 l-4 -1"/></g>
