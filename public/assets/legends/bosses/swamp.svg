    <g fill="#5fb57a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round">
      <path d="M8 46 C4 56 8 64 5 74 C10 68 12 60 13 50Z" style="transform-box:fill-box;transform-origin:center top"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;7;0" dur="2.4s" repeatCount="indefinite"/></path>
      <path d="M112 46 C116 56 112 66 115 76 C110 70 108 60 107 50Z" style="transform-box:fill-box;transform-origin:center top"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;-7;0" dur="2.7s" repeatCount="indefinite"/></path>
    </g>
    <!-- eye turrets under one bony V brow -->
    <g fill="#2e8b57" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8"><ellipse cx="38" cy="27" rx="13" ry="10"/><ellipse cx="82" cy="27" rx="13" ry="10"/></g>
    <path d="M27 31 C30 36 46 37 50 31 M70 31 C74 37 90 36 93 31" fill="none" stroke="#000" stroke-width="2" opacity="0.2"/>
    <g transform="translate(38 30.5) rotate(14)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.3 1.4;1 1" keyTimes="0;.14;.32;1" dur="1.6s" fill="freeze"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1;1 0.08;1 1" keyTimes="0;.92;.96;1" dur="5.4s" begin="2s" repeatCount="indefinite"/>
        <ellipse rx="8.6" ry="4.8" fill="#ffcf3a" opacity="0.45"/>
        <path d="M-6.4 0.8 C-3.2 -3.2 3.2 -3.4 6.4 0 C3.2 2.6 -3.2 3 -6.4 0.8Z" fill="#ffd966" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round"/>
        <ellipse rx="1" ry="2.8" fill="#7a0e1e"/>
        <circle cx="-2.4" cy="-0.8" r="0.8" fill="#fff"/>
      </g>
    </g></g>
    <g transform="translate(82 30.5) rotate(-14)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.3 1.4;1 1" keyTimes="0;.14;.32;1" dur="1.6s" fill="freeze"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1;1 0.08;1 1" keyTimes="0;.92;.96;1" dur="5.4s" begin="2s" repeatCount="indefinite"/>
        <ellipse rx="8.6" ry="4.8" fill="#ffcf3a" opacity="0.45"/>
        <path d="M-6.4 0.8 C-3.2 -3.2 3.2 -3.4 6.4 0 C3.2 2.6 -3.2 3 -6.4 0.8Z" fill="#ffd966" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round"/>
        <ellipse rx="1" ry="2.8" fill="#7a0e1e"/>
        <circle cx="-2.4" cy="-0.8" r="0.8" fill="#fff"/>
      </g>
    </g></g>
    <path d="M16 13 L40 17 L60 27 L80 17 L104 13 L106 20 L82 25.5 L60 35 L38 25.5 L14 20Z" fill="#5fb57a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M17 14 L40 18 L60 28 L80 18 L103 14" fill="none" stroke="#fff" stroke-width="1" opacity="0.45" stroke-linejoin="round"/>
    <path d="M15 19.5 L38 25 L60 34.5 L82 25 L105 19.5 L104 18 L82 23.5 L60 32.5 L38 23.5 L16 18Z" fill="#000" opacity="0.3"/>
    <g fill="#2e8b57" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round"><path d="M24 14.5 l2 -5 l3 5.6Z M34 16.2 l2.6 -6 l2.6 7Z M84 17 l2.6 -7 l2.6 6Z M93 15.6 l3 -5.6 l2 5Z"/></g>
    <!-- the anglerfish lure: swings down and lights on the entrance, then sways -->
    <g>
      <animateTransform class="lg-in" attributeName="transform" type="rotate" values="-80 60 24;-80 60 24;12 60 24;0 60 24" keyTimes="0;.36;.62;1" dur="1.6s" fill="freeze"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 60 24;6 60 24;0 60 24;-5 60 24;0 60 24" dur="3s" repeatCount="indefinite"/>
        <path d="M60 26 C58 8 72 -6 88 -2 C98 0 100 12 96 32" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="3.6" stroke-linecap="round"/>
        <path d="M60 26 C58 8 72 -6 88 -2 C98 0 100 12 96 32" fill="none" stroke="#5fb57a" stroke-width="2" stroke-linecap="round"/>
        <path d="M66 6 l-3 -3 M76 -3 l-1 -4 M88 -2 l2 -4" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linecap="round"/>
        <g transform="translate(96 38)">
          <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.3;1" dur="1.4s" repeatCount="indefinite"/>
            <circle r="8" fill="var(--lg-tint,#d4ff3a)" opacity="0.35"/></g>
          <path d="M-5 -2 C-5 -7 5 -7 5 -2 C5 4 2 7 0 7 C-2 7 -5 4 -5 -2Z" fill="var(--lg-tint-hi,#f7ffd1)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.1"/>
          <path d="M-3 -1 C-3 -4 0 -5 1 -4 C-1 -3 -2 -1 -2 2Z" fill="#fff"/>
          <path d="M-5 -2 l-3 -1 M5 -2 l3 -1 M0 7 v2.4" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linecap="round"/>
        </g>
      </g>
    </g>
