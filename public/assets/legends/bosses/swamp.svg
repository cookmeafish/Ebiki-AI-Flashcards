<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Bogmaw: a colossal swamp crocodile lunging head-on out of the mire, jaws agape. Two dead trees arch over it,
       hung with swaying moss and will-o-wisps. Eye turrets under one bony V brow, an anglerfish lure dangling from
       its brow, a maw full of crooked teeth.
       Entrance: only its eyes open first, then the lure swings down and lights, then the jaws yawn open. -->
  <!-- dead trees arching over the mire -->
  <path d="M-18 122 C-8 96 -18 70 -8 46 C0 28 -6 10 6 -8 L14 -4 C8 12 12 30 4 48 C-4 70 6 96 0 122Z" fill="#4a3a2e" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M8 -4 C4 12 8 30 0 48 C-6 64 0 90 -4 118" fill="none" stroke="#2a1f18" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M-12 100 l4 -3 M-9 80 l4 -2 M-6 60 l4 -3 M2 30 l3 -2" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M8 -6 C16 -14 26 -16 38 -12 M18 -12 C20 -18 24 -20 28 -24" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M8 -6 C16 -14 26 -16 38 -12 M18 -12 C20 -18 24 -20 28 -24" fill="none" stroke="#4a3a2e" stroke-width="2.4" stroke-linecap="round"/>
    <g style="transform-box:fill-box;transform-origin:center top"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="-4;5;-4" dur="3s" repeatCount="indefinite"/>
      <path d="M20 -13 C22 -4 18 4 21 14 L18 22 C14 12 17 4 15 -12Z" fill="#5fb57a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round"/>
    </g>
    <g style="transform-box:fill-box;transform-origin:center top"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="4;-4;4" dur="3.7s" repeatCount="indefinite"/>
      <path d="M32 -13 C34 -6 31 0 33 6 L30 12 C27 4 29 -4 28 -13Z" fill="#5fb57a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round"/>
    </g>
  <g transform="translate(120 0) scale(-1 1)"><path d="M-18 122 C-8 96 -18 70 -8 46 C0 28 -6 10 6 -8 L14 -4 C8 12 12 30 4 48 C-4 70 6 96 0 122Z" fill="#4a3a2e" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M8 -4 C4 12 8 30 0 48 C-6 64 0 90 -4 118" fill="none" stroke="#2a1f18" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M-12 100 l4 -3 M-9 80 l4 -2 M-6 60 l4 -3 M2 30 l3 -2" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M8 -6 C16 -14 26 -16 38 -12 M18 -12 C20 -18 24 -20 28 -24" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M8 -6 C16 -14 26 -16 38 -12 M18 -12 C20 -18 24 -20 28 -24" fill="none" stroke="#4a3a2e" stroke-width="2.4" stroke-linecap="round"/>
    <g style="transform-box:fill-box;transform-origin:center top"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="-4;5;-4" dur="3.4s" repeatCount="indefinite"/>
      <path d="M20 -13 C22 -4 18 4 21 14 L18 22 C14 12 17 4 15 -12Z" fill="#5fb57a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round"/>
    </g>
    <g style="transform-box:fill-box;transform-origin:center top"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="4;-4;4" dur="4.1s" repeatCount="indefinite"/>
      <path d="M32 -13 C34 -6 31 0 33 6 L30 12 C27 4 29 -4 28 -13Z" fill="#5fb57a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round"/>
    </g></g>
  <!-- will-o-wisps -->
  <g>
    <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;3 -4;-2 -2;0 0" dur="4s" repeatCount="indefinite"/>
      <circle cx="14" cy="34" r="3.6" fill="var(--lg-tint,#c8ff5a)" opacity="0.4"/><circle cx="14" cy="34" r="1.6" fill="var(--lg-tint-hi,#f2ffd0)"/></g>
    <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-3 -3;2 -5;0 0" dur="4.6s" repeatCount="indefinite"/>
