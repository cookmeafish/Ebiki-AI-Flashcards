      <circle cx="46" cy="-8" r="3" fill="var(--lg-tint,#c8ff5a)" opacity="0.4"/><circle cx="46" cy="-8" r="1.3" fill="var(--lg-tint-hi,#f2ffd0)"/></g>
  </g>
  <!-- the crocodile -->
  <g>
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 -1.6;0 0" dur="3.2s" repeatCount="indefinite"/>
    <!-- the maw interior -->
    <path d="M4 56 C30 68 46 78 60 88 C74 78 90 68 116 56 L114 88 C94 98 76 106 60 108 C44 106 26 98 6 88Z" fill="#1a0c0c" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
    <ellipse cx="60" cy="90" rx="20" ry="9" fill="#000" opacity="0.5"/>
    <path d="M40 100 C48 92 72 92 80 100 C72 106 48 106 40 100Z" fill="#8a2434"/>
    <path d="M60 94 V103" stroke="#5a1220" stroke-width="1" stroke-linecap="round"/>
    <!-- lower jaw: drops open on the entrance, breathes -->
    <g>
      <animateTransform class="lg-in" attributeName="transform" type="translate" values="0 -20;0 -20;0 5;0 0" keyTimes="0;.6;.8;1" dur="1.6s" fill="freeze"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 3;0 0" dur="3.2s" repeatCount="indefinite"/>
        <path d="M9.5 83.7 L13.5 82 L15.3 85.9Z M16.4 86.3 L21.1 82.8 L22.2 88.6Z M23.2 89 L27.4 86.7 L29.1 91.2Z M30.1 91.6 L34.6 88.6 L35.9 93.9Z M36.9 94.3 L40.9 92.8 L42.8 96.5Z M43.8 96.9 L48.7 93 L49.6 99.2Z M50.7 99.6 L54.8 97.5 L56.5 101.8Z M63.5 101.8 L65.1 97.3 L69.3 99.6Z M70.4 99.2 L71.3 92.8 L76.2 96.9Z M77.2 96.5 L79.1 92.8 L83.1 94.3Z M84.1 93.9 L85.3 88.5 L89.9 91.6Z M90.9 91.2 L92.7 87.1 L96.8 89Z M97.8 88.6 L98.9 82.8 L103.6 86.3Z M104.7 85.9 L106.5 82 L110.5 83.7Z" fill="#efe4bf" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7" stroke-linejoin="round"/>
        <path d="M27 92.6 Q25.5 84.3 26 76 Q28.4 85.5 32 95Z M88 95 Q92 85.5 94 76 Q94.1 84.3 93 92.6Z" fill="#fbf4dc" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round"/>
        <path d="M6 82 C26 92 44 100 60 102 C76 100 94 92 114 82 L118 94 C100 110 80 122 60 124 C40 122 20 110 2 94Z" fill="#2e8b57" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
        <path d="M14 98 C30 108 46 114 60 115 C74 114 90 108 106 98 C92 114 76 120 60 121 C44 120 28 114 14 98Z" fill="#9fd4ad" opacity="0.8"/>
        <path d="M24 108 l3 -4 M40 114 l2 -4 M80 114 l-2 -4 M96 108 l-3 -4" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
        <path d="M7 84 C26 94 44 102 60 104 C76 102 94 94 113 84" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
      </g>
    </g>
    <!-- the skull: a broad snout over the maw -->
    <path d="M2 56 C0 44 4 32 12 24 C18 14 28 9 40 11 L60 14 L80 11 C92 9 102 14 108 24 C116 32 120 44 118 56 C104 66 84 76 60 88 C36 76 16 66 2 56Z" fill="#2e8b57" stroke="var(--lg-ink, #1d2230)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M6 54 C4 42 10 28 22 20 C16 32 16 46 22 64Z" fill="#fff" opacity="0.14"/>
    <path d="M114 54 C116 42 110 28 98 20 C104 32 104 48 98 68 C106 64 112 58 114 54Z" fill="#000" opacity="0.26"/>
    <!-- the raised snout ridge and nostril knob -->
    <path d="M46 40 C48 58 54 74 60 87 C66 74 72 58 74 40 C68 36 52 36 46 40Z" fill="#5fb57a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M70 42 C71 56 67 70 60 85 C66 74 72 58 74 40Z" fill="#000" opacity="0.2"/>
    <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round" opacity="0.7">
      <path d="M56 46 l4 -5 l4 5 M56 56 l4 -5 l4 5 M57 65 l3 -4 l3 4 M49 46 l3 -3.6 l3 3.6 M65 46 l3 -3.6 l3 3.6 M51 56 l2.6 -3 l2.6 3 M64.8 56 l2.6 -3 l2.6 3"/>
    </g>
    <path d="M53 76 C54 72 66 72 67 76 C66 79 54 79 53 76Z" fill="#2e8b57" stroke="var(--lg-ink, #1d2230)" stroke-width="1.1"/>
    <g fill="#0c1408"><ellipse cx="57" cy="75.6" rx="1.8" ry="0.8" transform="rotate(-20 57 75.6)"/><ellipse cx="63" cy="75.6" rx="1.8" ry="0.8" transform="rotate(20 63 75.6)"/></g>
    <!-- scutes and warts -->
    <g fill="#5fb57a" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round">
      <ellipse cx="22" cy="46" rx="3.4" ry="2.4"/><ellipse cx="30" cy="54" rx="3" ry="2.2"/><ellipse cx="16" cy="54" rx="2.4" ry="1.8"/><ellipse cx="96" cy="46" rx="3.4" ry="2.4"/><ellipse cx="88" cy="54" rx="3" ry="2.2"/><ellipse cx="102" cy="54" rx="2.4" ry="1.8"/>
    </g>
    <g fill="#5fb57a"><circle cx="34" cy="46" r="1.4"/><circle cx="84" cy="44" r="1.6"/><circle cx="30" cy="58" r="1.1"/><circle cx="92" cy="60" r="1.3"/></g>
    <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linecap="round" opacity="0.55"><path d="M30 40 q3 -2.4 6 0 M98 36 q3 -2.4 6 0 M16 64 q3 -2.4 6 0 M98 64 q3 -2.4 6 0 M102 40 q3 -2.4 6 0"/></g>
    <!-- claw scars -->
    <path d="M8 38 L20 48 M10 34 L22 43 M14 32 L23 38" fill="none" stroke="#1d1410" stroke-width="1.4" stroke-linecap="round"/>
    <!-- upper teeth, crooked, two fangs past the lip -->
    <path d="M6.5 58.8 L8 63.4 L12.6 62.1Z M13.7 62.7 L14.3 68.7 L19.8 66Z M20.8 66.5 L22.5 70.6 L26.9 69.8Z M28 70.4 L28.8 76.1 L34 73.7Z M35.1 74.3 L36.4 79.1 L41.2 77.6Z M42.3 78.1 L42.6 84.7 L48.3 81.4Z M49.4 82 L51 86.3 L55.5 85.3Z M64.5 85.3 L69 86.3 L70.6 82Z M71.7 81.4 L77.3 84.5 L77.8 78.1Z M78.8 77.6 L83.5 78.9 L84.9 74.3Z M86 73.7 L91.1 75.9 L92 70.4Z M93.1 69.8 L97.5 70.6 L99.2 66.5Z M100.3 66 L105.7 68.7 L106.3 62.7Z M107.4 62.1 L112.1 63.6 L113.5 58.8Z" fill="#efe4bf" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7" stroke-linejoin="round"/>
    <path d="M48 81.2 Q46.5 90.1 47 99 Q49.4 91.5 53 84Z M67 84 Q71 91.5 73 99 Q73.1 90.1 72 81.2Z" fill="#fbf4dc" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linejoin="round"/>
