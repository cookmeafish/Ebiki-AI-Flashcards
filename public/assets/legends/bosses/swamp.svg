  <!-- the mire in front, ripples round the jaw -->
  <path d="M-14 112 C4 106 22 112 40 110 C58 108 72 114 90 110 C106 107 120 112 134 108 C138 116 134 124 126 127 C80 130 30 130 -8 127 C-16 122 -18 116 -14 112Z" fill="#5fb57a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M-10 119 C14 115 40 120 64 117 C88 114 110 119 130 116 C128 122 124 125 118 126 C80 128 30 128 -4 126 C-10 124 -12 121 -10 119Z" fill="#000" opacity="0.2"/>
  <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="-2 0;2 0;-2 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M14 113 C22 111 30 111 38 113 M80 113 C88 111 98 111 106 113" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  </g>
  <g fill="#2e8b57" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"><path d="M4 117 a7 3 0 1 0 14 0 l-7 0Z"/><path d="M100 119 a8 3 0 1 0 16 0 l-8 0Z"/></g>
  <circle cx="10" cy="115" r="1.6" fill="#f25c9e" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5"/>
  <g fill="none" stroke="#ffffff" stroke-width="0.9">
    <circle cx="30" cy="114" r="1.8" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 -9" dur="1.6s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1.6s" repeatCount="indefinite" additive="sum"/></circle>
    <circle cx="90" cy="115" r="1.4" style="transform-box:fill-box;transform-origin:center"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 -9" dur="2s" begin="0.7s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2s" begin="0.7s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
