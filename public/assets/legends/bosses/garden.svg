      <path d="M40 12 L34 -6 L46 9Z"/><path d="M52 7 L52 -12 L58 6Z"/><path d="M62 6 L68 -12 L68 7Z"/><path d="M74 9 L86 -6 L80 12Z"/><path d="M30 18 L18 6 L34 15Z"/><path d="M90 18 L102 6 L86 15Z"/>
    </g>
    <path d="M36 -2 L44 8 M53 -8 L54 4 M67 -8 L66 4 M84 -2 L76 8" stroke="#fff" stroke-width="0.6"/>
    <!-- acid eyes: slits split open on the entrance -->
    <g transform="translate(42 36)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.25 1.5;1 1" keyTimes="0;.68;.84;1" dur="1.6s" fill="freeze"/>
      <path d="M-11 -7 L12 2 L9 7 L-9 0Z" fill="#c6ff3f" opacity="0.45" transform="scale(1.35)"/>
      <path d="M-11 -7 L12 2 L9 7 L-9 0Z" fill="#e8ff6b" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
      <path d="M2 -3 C3 0 3 3 1.6 5.6 C0.6 3 0.6 0 2 -3Z" fill="#1a2a05"/>
      <circle cx="-4" cy="-2.6" r="1" fill="#fff"/>
    </g></g>
    <g transform="translate(78 36)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.25 1.5;1 1" keyTimes="0;.7;.86;1" dur="1.6s" fill="freeze"/>
      <path d="M11 -7 L-12 2 L-9 7 L9 0Z" fill="#c6ff3f" opacity="0.45" transform="scale(1.35)"/>
      <path d="M11 -7 L-12 2 L-9 7 L9 0Z" fill="#e8ff6b" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
      <path d="M-2 -3 C-3 0 -3 3 -1.6 5.6 C-0.6 3 -0.6 0 -2 -3Z" fill="#1a2a05"/>
      <circle cx="4" cy="-2.6" r="1" fill="#fff"/>
    </g></g>
    <!-- one thorny bark brow, a solid V -->
    <path d="M26 24 L60 38 L94 24 L94 30 L60 44 L26 30Z" fill="#5a3a1e" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M60 38 L94 24 L94 30 L60 44Z" fill="#000" opacity="0.25"/>
    <path d="M27.6 25.8 L60 39 L92.4 25.8" fill="none" stroke="#a87a4a" stroke-width="0.8"/>
    <g fill="#e8d7b0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round"><path d="M34 27 L32 21 L37 26Z M46 32 L45 26 L49 31Z M74 32 L75 26 L71 31Z M86 27 L88 21 L83 26Z"/></g>
    <!-- rim cilia: long thorns along the hood's edge -->
    <g fill="#e8d7b0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round">
      <path d="M6 52 L-8 50 L6 55Z M7 44 L-6 38 L8 47Z M10 36 L0 28 L11 39Z M114 52 L128 50 L114 55Z M113 44 L126 38 L112 47Z M110 36 L120 28 L109 39Z"/>
