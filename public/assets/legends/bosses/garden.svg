<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Flytrap Queen: a carnivorous plant tyrant grown through the shattered arch of an old greenhouse. A huge trap
       maw with long thorn teeth and glowing digestive glands, two acid eyes under one thorny bark brow, a thorn crown,
       two smaller snapping heads on vines, poison petals and a thorned stem. Entrance: the side heads whip in, the
       great trap snaps open, the eyes split open. -->
  <!-- the shattered greenhouse arch -->
  <path d="M-4 104 V40 C-4 6 26 -12 60 -12 C94 -12 124 6 124 40 V104Z" fill="var(--lg-sky, #e6f4ea)"/>
  <g fill="#fff" opacity="0.5"><path d="M4 70 L18 30 L22 30 L8 70Z M98 64 L110 30 L113 31 L101 64Z M40 10 L50 -4 L52 -3 L42 11Z"/></g>
  <!-- broken panes -->
  <path d="M30 10 L40 18 L36 24 L46 30 L38 36 L30 30 L26 40 L18 32 L20 22Z" fill="var(--lg-deep, #2e8b57)"/>
  <path d="M30 10 L40 18 L36 24 L46 30 L38 36 L30 30 L26 40 L18 32 L20 22Z" fill="#000" opacity="0.5" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M96 76 L104 70 L110 80 L116 76 L114 90 L104 94 L100 86Z" fill="var(--lg-deep, #2e8b57)"/>
  <path d="M96 76 L104 70 L110 80 L116 76 L114 90 L104 94 L100 86Z" fill="#000" opacity="0.5" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M84 6 L88 14 L94 10" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7"/>
  <!-- iron frame and mullions -->
  <g fill="none" stroke-linejoin="round">
    <path d="M-4 112 V40 C-4 6 26 -12 60 -12 C94 -12 124 6 124 40 V112 M28 112 V24 C28 6 42 -6 60 -8 C78 -6 92 6 92 24 V112 M60 -12 V112 M-4 44 H124 M-4 84 H124" stroke="var(--lg-ink, #1d2230)" stroke-width="4"/>
    <path d="M-4 112 V40 C-4 6 26 -12 60 -12 C94 -12 124 6 124 40 V112 M28 112 V24 C28 6 42 -6 60 -8 C78 -6 92 6 92 24 V112 M60 -12 V112 M-4 44 H124 M-4 84 H124" stroke="#6f7d86" stroke-width="2"/>
  </g>
  <!-- vines strangling the frame -->
  <g fill="none" stroke-linecap="round">
    <path d="M2 102 C10 94 0 80 10 66 C20 52 6 40 14 24 C20 12 34 4 46 -4" stroke="var(--lg-ink, #1d2230)" stroke-width="4"/>
    <path d="M2 102 C10 94 0 80 10 66 C20 52 6 40 14 24 C20 12 34 4 46 -4" stroke="var(--lg-deep, #2e8b57)" stroke-width="2.4"/>
    <path d="M122 104 C110 92 120 76 110 62 C100 48 116 36 106 20 C100 10 88 2 74 -6" stroke="var(--lg-ink, #1d2230)" stroke-width="4"/>
    <path d="M122 104 C110 92 120 76 110 62 C100 48 116 36 106 20 C100 10 88 2 74 -6" stroke="var(--lg-deep, #2e8b57)" stroke-width="2.4"/>
  </g>
  <g fill="var(--lg-near, #5fb57a)" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round">
    <path d="M10 66 C4 62 2 56 6 54 C10 56 12 60 10 66Z"/><path d="M14 24 C8 22 6 16 10 14 C14 16 16 20 14 24Z"/><path d="M110 62 C116 58 118 52 114 50 C110 52 108 56 110 62Z"/><path d="M106 20 C112 18 114 12 110 10 C106 12 104 16 106 20Z"/>
  </g>
  <!-- the overgrown bed the greenhouse sinks into -->
  <path d="M-14 126 C-16 114 -8 104 2 106 C6 98 16 96 22 102 C28 96 38 96 42 102 C50 98 70 98 78 102 C82 96 92 96 98 102 C104 96 114 98 118 106 C128 104 136 114 134 126 C128 132 118 128 108 132 C94 136 76 130 60 134 C44 130 26 136 12 132 C2 128 -8 132 -14 126Z" fill="var(--lg-deep, #2e8b57)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M-12 120 C0 112 20 110 40 108 C60 106 80 106 100 108 C116 110 128 116 132 122 C126 130 112 128 100 132 C84 134 70 130 60 134 C44 130 26 136 12 132 C2 128 -8 130 -12 120Z" fill="#000" opacity="0.3"/>
  <g fill="#cfe8f4" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round"><path d="M4 114 L10 106 L12 116Z M22 122 L30 116 L28 124Z M108 116 L116 108 L116 118Z M92 124 L98 118 L100 126Z"/></g>
  <g fill="none" stroke="var(--lg-near, #5fb57a)" stroke-width="1.2" stroke-linecap="round"><path d="M-6 112 C-2 108 2 108 4 110 M14 104 C18 100 22 100 24 104 M100 104 C104 100 108 100 110 104 M116 110 C120 106 124 106 126 110"/></g>
  <!-- LEFT snapping head on its vine: whips in, then snaps -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="-60 30 100;-60 30 100;8 30 100;0 30 100" keyTimes="0;.4;.62;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 30 100;-7 30 100;2 30 100;0 30 100" dur="2.2s" repeatCount="indefinite"/>
      <path d="M30 100 C20 92 18 76 10 62 C6 56 2 50 -2 46" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="5.4" stroke-linecap="round"/>
      <path d="M30 100 C20 92 18 76 10 62 C6 56 2 50 -2 46" fill="none" stroke="var(--lg-deep, #2e8b57)" stroke-width="3.4" stroke-linecap="round"/>
      <g fill="#e8d7b0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round"><path d="M22 88 L17 88 L21 85Z M14 70 L10 72 L12 67Z"/></g>
      <g transform="translate(-4 40) rotate(-30)">
        <path d="M0 6 C-12 4 -18 -6 -14 -14 L0 -4Z" fill="var(--lg-near, #5fb57a)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M0 6 C10 0 12 -10 6 -16 L-2 -4Z" fill="var(--lg-near, #5fb57a)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M-12 -12 C-8 -6 -4 -4 0 -4 C2 -8 4 -12 5 -14 C0 -10 -6 -10 -12 -12Z" fill="#b3122e"/>
        <g fill="#f4efe0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5" stroke-linejoin="round"><path d="M-14 -14 L-16 -19 L-12 -15Z M-10 -11 L-11 -17 L-8 -12Z M-6 -9 L-6 -15 L-4 -10Z M6 -16 L8 -21 L7 -15Z M4 -12 L8 -16 L5 -11Z"/></g>
        <path d="M-6 -2 L-2 -3 L-4 -0.6Z" fill="#d4ff3a"/>
      </g>
    </g>
  </g>
  <!-- RIGHT snapping head on its vine -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="60 90 100;60 90 100;-8 90 100;0 90 100" keyTimes="0;.44;.66;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 90 100;7 90 100;-2 90 100;0 90 100" dur="2.5s" repeatCount="indefinite"/>
      <path d="M90 100 C100 92 102 76 110 62 C114 56 118 50 122 46" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="5.4" stroke-linecap="round"/>
      <path d="M90 100 C100 92 102 76 110 62 C114 56 118 50 122 46" fill="none" stroke="var(--lg-deep, #2e8b57)" stroke-width="3.4" stroke-linecap="round"/>
