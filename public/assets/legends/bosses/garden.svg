  </g>
  <!-- flies caught nearby -->
  <g fill="var(--lg-ink, #1d2230)">
    <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;6 4;-4 8;0 0" dur="1.2s" repeatCount="indefinite"/>
      <circle cx="40" cy="-4" r="1.4"/><ellipse cx="39" cy="-6" rx="1.4" ry="0.8" fill="#dff1ff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.3"/></g>
    <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-6 4;4 8;0 0" dur="1s" repeatCount="indefinite"/>
      <circle cx="84" cy="-2" r="1.2"/><ellipse cx="85" cy="-4" rx="1.4" ry="0.8" fill="#dff1ff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.3"/></g>
  </g>
</svg>
