      <g transform="translate(124 40) rotate(30) scale(-1 1)">
        <path d="M0 6 C-12 4 -18 -6 -14 -14 L0 -4Z" fill="var(--lg-near, #5fb57a)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M0 6 C10 0 12 -10 6 -16 L-2 -4Z" fill="var(--lg-near, #5fb57a)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M-12 -12 C-8 -6 -4 -4 0 -4 C2 -8 4 -12 5 -14 C0 -10 -6 -10 -12 -12Z" fill="#b3122e"/>
        <g fill="#f4efe0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5" stroke-linejoin="round"><path d="M-14 -14 L-16 -19 L-12 -15Z M-10 -11 L-11 -17 L-8 -12Z M-6 -9 L-6 -15 L-4 -10Z M6 -16 L8 -21 L7 -15Z M4 -12 L8 -16 L5 -11Z"/></g>
        <path d="M-6 -2 L-2 -3 L-4 -0.6Z" fill="#d4ff3a"/>
      </g>
    </g>
  </g>
  <!-- poison petals spread at the base -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.5" stroke-linejoin="round">
    <path d="M60 98 C38 90 14 96 2 110 C16 118 40 116 60 104Z" fill="#b3122e"/>
    <path d="M60 98 C82 90 106 96 118 110 C104 118 80 116 60 104Z" fill="#b3122e"/>
    <path d="M60 104 C46 112 30 124 18 128 C30 130 48 126 60 110Z" fill="#7a0c20"/>
    <path d="M60 104 C74 112 90 124 102 128 C90 130 72 126 60 110Z" fill="#7a0c20"/>
  </g>
  <path d="M60 98 C82 90 106 96 118 110 C112 113 104 114 96 114 C92 104 78 100 62 102Z" fill="#000" opacity="0.2"/>
  <path d="M8 108 C20 98 40 96 56 100" fill="none" stroke="#ff8aa0" stroke-width="1"/>
  <g fill="#ffd23f" stroke="var(--lg-ink, #1d2230)" stroke-width="0.4"><circle cx="18" cy="106" r="1.6"/><circle cx="30" cy="102" r="1.2"/><circle cx="102" cy="106" r="1.6"/><circle cx="90" cy="102" r="1.2"/><circle cx="36" cy="118" r="1.3"/><circle cx="84" cy="118" r="1.3"/><circle cx="44" cy="108" r="1"/><circle cx="76" cy="108" r="1"/></g>
  <!-- the thorned stem -->
  <path d="M50 108 C48 98 50 90 52 84 H68 C70 90 72 98 70 108Z" fill="var(--lg-deep, #2e8b57)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M60 84 H68 C70 90 72 98 70 108 H62Z" fill="#000" opacity="0.25"/>
  <g fill="#e8d7b0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round"><path d="M51 94 L45 92 L51 97Z M69 92 L75 90 L69 95Z M50 102 L45 104 L50 105Z M70 100 L75 102 L70 103Z"/></g>
  <!-- the great trap -->
  <g>
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 60 88;-2 60 88;0 60 88;2 60 88;0 60 88" dur="3.6s" repeatCount="indefinite"/>
    <!-- the maw: the jaw drops open on the entrance, then breathes -->
    <g transform="translate(60 50)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.12;1 0.12;1.06 1.22;1 1" keyTimes="0;.55;.76;1" dur="1.6s" fill="freeze"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 0.93;1 1" dur="2.4s" repeatCount="indefinite"/>
      <g transform="translate(-60 -50)">
        <!-- the red throat with glowing glands and veins -->
        <path d="M6 52 C26 44 94 44 114 52 L112 62 C96 92 24 92 8 62Z" fill="#5e0a1a" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M20 58 C40 50 80 50 100 58 C88 82 32 82 20 58Z" fill="#2a040c"/>
        <path d="M24 54 C32 60 38 58 44 64 M96 54 C88 60 82 58 76 64 M60 50 V58 M50 70 C54 66 58 68 60 64 M70 70 C66 66 62 68 60 64" fill="none" stroke="#c43a5a" stroke-width="0.9"/>
        <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="1.2s" repeatCount="indefinite"/>
          <g fill="#c6ff3f" opacity="0.45"><circle cx="34" cy="66" r="3"/><circle cx="48" cy="72" r="2.6"/><circle cx="72" cy="72" r="2.6"/><circle cx="86" cy="66" r="3"/><circle cx="60" cy="74" r="3.2"/></g>
          <g fill="#e8ff6b" stroke="var(--lg-ink, #1d2230)" stroke-width="0.4"><circle cx="34" cy="66" r="1.6"/><circle cx="48" cy="72" r="1.4"/><circle cx="72" cy="72" r="1.4"/><circle cx="86" cy="66" r="1.6"/><circle cx="60" cy="74" r="1.7"/></g>
        </g>
        <!-- lower lobe: the jaw, veined -->
        <path d="M8 62 C10 96 36 114 60 114 C84 114 110 96 112 62 C96 92 24 92 8 62Z" fill="var(--lg-near, #5fb57a)" stroke="var(--lg-ink, #1d2230)" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M60 114 C84 114 110 96 112 62 C106 74 98 82 88 86 C84 100 74 108 60 108Z" fill="#000" opacity="0.22"/>
        <path d="M14 76 C20 92 34 104 50 108" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.35"/>
        <path d="M24 86 L30 96 M38 92 L42 104 M60 96 V108 M82 92 L78 104 M96 86 L90 96" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" opacity="0.45"/>
        <path d="M10 66 C26 90 94 90 110 66" fill="none" stroke="#b3122e" stroke-width="2"/>
        <g fill="#e8d7b0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round"><path d="M9 70 L-4 74 L9 74Z M12 82 L0 90 L13 86Z M20 94 L12 104 L23 97Z M111 70 L124 74 L111 74Z M108 82 L120 90 L107 86Z M100 94 L108 104 L97 97Z"/></g>
        <!-- long thorn teeth, interlocking -->
        <g fill="#f4efe0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round">
          <path d="M7.3 50.1 L10.1 62.7 L12.9 50.1Z"/><path d="M14.9 48.6 L17.7 64.2 L20.5 48.6Z"/><path d="M24.1 47.3 L26.9 69.9 L29.7 47.3Z"/><path d="M34.5 46.5 L37.3 61.1 L40.1 46.5Z"/><path d="M45.6 45.9 L48.4 63.5 L51.2 45.9Z"/><path d="M57.2 45.8 L60.0 62.4 L62.8 45.8Z"/><path d="M68.8 45.9 L71.6 63.5 L74.4 45.9Z"/><path d="M79.9 46.5 L82.7 61.1 L85.5 46.5Z"/><path d="M90.3 47.3 L93.1 69.9 L95.9 47.3Z"/><path d="M99.5 48.6 L102.3 64.2 L105.1 48.6Z"/><path d="M107.1 50.1 L109.9 62.7 L112.7 50.1Z"/>
          <path d="M10.3 69.4 L12.9 58.6 L15.5 69.4Z"/><path d="M18.2 75.7 L20.8 61.9 L23.4 75.7Z"/><path d="M28.0 80.4 L30.6 63.6 L33.2 80.4Z"/><path d="M39.2 83.5 L41.8 70.7 L44.4 83.5Z"/><path d="M51.3 85.1 L53.9 69.3 L56.5 85.1Z"/><path d="M63.5 85.1 L66.1 69.3 L68.7 85.1Z"/><path d="M75.6 83.5 L78.2 70.7 L80.8 83.5Z"/><path d="M86.8 80.4 L89.4 63.6 L92.0 80.4Z"/><path d="M96.6 75.7 L99.2 61.9 L101.8 75.7Z"/><path d="M104.5 69.4 L107.1 58.6 L109.7 69.4Z"/>
        </g>
        <path d="M25.6 49 L27 66 M91.6 49 L93 66" stroke="#fff" stroke-width="0.7"/>
        <!-- acid drool, clinging to the long fangs -->
        <path style="transform-box:fill-box;transform-origin:center top" d="M26 69 C25 75 27 78 28 78 C29.4 78 29.6 74 28.6 69Z" fill="#9cff57" stroke="var(--lg-ink, #1d2230)" stroke-width="0.4"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1.7;1 1" dur="1.6s" repeatCount="indefinite"/></path>
        <path style="transform-box:fill-box;transform-origin:center top" d="M92 69 C91 73 92.4 75 93.4 75 C94.4 75 94.6 72 93.8 69Z" fill="#9cff57" stroke="var(--lg-ink, #1d2230)" stroke-width="0.4"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1.8;1 1" dur="2.1s" repeatCount="indefinite"/></path>
      </g>
      </g>
    </g></g>
    <!-- upper lobe: the hood with the face -->
    <path d="M4 54 C8 24 34 6 60 6 C86 6 112 24 116 54 C96 46 24 46 4 54Z" fill="var(--lg-near, #5fb57a)" stroke="var(--lg-ink, #1d2230)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M60 6 C86 6 112 24 116 54 C108 51 98 49 88 48 C88 30 78 14 60 10Z" fill="#000" opacity="0.22"/>
    <path d="M20 46 C20 28 36 14 54 11 C40 20 30 32 28 46Z" fill="#fff" opacity="0.25"/>
    <path d="M24 40 C30 30 34 24 42 18 M96 40 C90 30 86 24 78 18 M60 10 V18" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" opacity="0.45"/>
