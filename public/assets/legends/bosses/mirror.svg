<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Shattered Doppel: a figure of broken mirror shards. Many reflected faces (one grinning), jagged glass claws,
       a crack of light through its chest. The shards snap together on the entrance. -->
  <!-- an ornate empty frame behind -->
  <path d="M26 8 C26 2 94 2 94 8 L96 70 C96 76 24 76 24 70Z" fill="none" stroke="#c9a441" stroke-width="3" opacity="0.6"/>
  <g fill="#c9a441" opacity="0.6"><circle cx="60" cy="3" r="3"/><circle cx="24" cy="40" r="2.4"/><circle cx="96" cy="40" r="2.4"/></g>
  <!-- torso shards (each snaps into place) -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round">
    <g><animateTransform class="lg-in" attributeName="transform" type="translate" values="-30 20;-30 20;2 -1;0 0" keyTimes="0;.5;.7;1" dur="1.5s" fill="freeze"/>
      <path d="M26 120 L32 82 L52 76 L56 100 L44 120Z" fill="#b8c6d8"/></g>
    <g><animateTransform class="lg-in" attributeName="transform" type="translate" values="30 20;30 20;-2 -1;0 0" keyTimes="0;.55;.75;1" dur="1.5s" fill="freeze"/>
      <path d="M94 120 L88 82 L68 76 L64 100 L76 120Z" fill="#a4b4c8"/></g>
    <g><animateTransform class="lg-in" attributeName="transform" type="translate" values="0 30;0 30;0 -2;0 0" keyTimes="0;.6;.8;1" dur="1.5s" fill="freeze"/>
      <path d="M44 120 L56 100 L52 76 H68 L64 100 L76 120Z" fill="#d6e0ec"/></g>
  </g>
  <!-- the crack of light through the chest -->
  <path d="M60 78 L56 88 L64 94 L58 104 L62 118" fill="none" stroke="#fff6c2" stroke-width="3" stroke-linejoin="round">
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0.8 0;0 0" dur="0.3s" repeatCount="indefinite"/>
  </path>
  <path d="M60 78 L56 88 L64 94 L58 104 L62 118" fill="none" stroke="#fff" stroke-width="1" stroke-linejoin="round"/>
  <!-- small reflected faces in the torso shards -->
  <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linecap="round">
    <path d="M36 96 h2 M42 96 h2 M37 102 C39 100 41 100 43 102"/><path d="M78 96 h2 M84 96 h2 M79 101 C81 103 83 103 85 101"/>
  </g>
  <!-- glass claw arms -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round">
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 30 82;-6 30 82;0 30 82" dur="2.2s" repeatCount="indefinite"/>
      <path d="M32 82 L14 74 L6 58 L14 60 L10 48 L18 56 L20 44 L22 62 L34 72Z" fill="#c8d4e4"/></g>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 90 82;6 90 82;0 90 82" dur="2.4s" repeatCount="indefinite"/>
      <path d="M88 82 L106 74 L114 58 L106 60 L110 48 L102 56 L100 44 L98 62 L86 72Z" fill="#b0bfd2"/></g>
  </g>
  <!-- the head: four shards, each a different face -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round">
    <g><animateTransform class="lg-in" attributeName="transform" type="translate" values="-24 -24;-24 -24;2 2;0 0" keyTimes="0;.55;.75;1" dur="1.5s" fill="freeze"/>
      <path d="M36 20 L58 14 L56 44 L34 46Z" fill="#dce6f2"/>
      <!-- a weeping face -->
      <g fill="none" stroke-width="1"><path d="M40 28 l6 2 M48 30 l6 -2 M44 38 C46 36 50 36 52 38"/><path d="M42 32 v4" stroke="#6fb8ff"/></g>
    </g>
    <g><animateTransform class="lg-in" attributeName="transform" type="translate" values="24 -24;24 -24;-2 2;0 0" keyTimes="0;.6;.8;1" dur="1.5s" fill="freeze"/>
      <path d="M60 14 L86 20 L86 44 L58 44Z" fill="#c4d2e4"/>
      <!-- a screaming face -->
      <g fill="none" stroke-width="1"><path d="M66 26 l4 2 M78 28 l4 -2"/><ellipse cx="74" cy="36" rx="3" ry="4" fill="#1d2230"/></g>
    </g>
    <g><animateTransform class="lg-in" attributeName="transform" type="translate" values="0 40;0 40;0 -2;0 0" keyTimes="0;.65;.85;1" dur="1.5s" fill="freeze"/>
      <!-- the grinning face, biggest shard -->
      <path d="M34 46 L86 44 L80 70 L60 76 L40 70Z" fill="#eef4fb"/>
      <path d="M38 48 L60 47 L44 68Z" fill="#fff" opacity="0.5" stroke="none"/>
      <path d="M42 64 C50 72 70 72 78 62 C70 66 50 66 42 64Z" fill="#1d1b28"/>
      <g fill="#fff" stroke-width="0.5"><polygon points="46,65 48,69 50,66"/><polygon points="52,66 54,70 56,66.5"/><polygon points="58,66.5 60,71 62,66.5"/><polygon points="64,66.5 66,70 68,66"/><polygon points="70,66 72,69 74,65"/></g>
    </g>
  </g>
  <!-- eyes: two cold stars in the grinning shard, glinting -->
  <g transform="translate(50 54)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="0;0;2;1" keyTimes="0;.8;.9;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;45;0" dur="2s" begin="1.5s" repeatCount="indefinite"/>
      <path d="M0 -5 L1.4 -1.4 L5 0 L1.4 1.4 L0 5 L-1.4 1.4 L-5 0 L-1.4 -1.4Z" fill="#6ff3ff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/></g>
  </g></g>
  <g transform="translate(70 54)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="0;0;2;1" keyTimes="0;.82;.92;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;-45;0" dur="2s" begin="1.5s" repeatCount="indefinite"/>
      <path d="M0 -5 L1.4 -1.4 L5 0 L1.4 1.4 L0 5 L-1.4 1.4 L-5 0 L-1.4 -1.4Z" fill="#6ff3ff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/></g>
  </g></g>
  <path d="M40 48 L54 52 M80 48 L66 52" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linecap="round"/>
  <!-- shard glints and loose fragments orbiting -->
  <g fill="#eef4fb" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6">
    <polygon points="10,20 16,16 14,26"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 60 60;360 60 60" dur="12s" repeatCount="indefinite"/></polygon>
    <polygon points="104,96 112,94 106,104"><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 60 60;-360 60 60" dur="14s" repeatCount="indefinite"/></polygon>
  </g>
  <path d="M52 22 l2 -2 M56 20 l-2 -2" stroke="#fff" stroke-width="1.4" stroke-linecap="round">
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;20 20;0 0" dur="3s" repeatCount="indefinite"/>
  </path>
</svg>
