<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Shattered Doppel: a figure of broken mirror shards stepping out of the tall gilded mirror it broke. A head
       of shards (a weeping face and a screaming face above one wide grinning face), cold slit eyes under a single
       obsidian V shard, a grin full of glass fangs, a crack of light splitting its chest, jagged glass claws and loose
       shards orbiting. Entrance: the shards fly in and snap together, the eyes ignite. -->
  <!-- the gilded mirror it stepped out of -->
  <path d="M10 120 V30 C10 4 32 -12 60 -12 C88 -12 110 4 110 30 V120" fill="var(--lg-far, #b9c3d6)" stroke="var(--lg-ink, #1d2230)" stroke-width="2"/>
  <path d="M60 -12 C88 -12 110 4 110 30 V120 H60Z" fill="#000" opacity="0.15"/>
  <!-- the shattered glass: a spiderweb of cracks from the impact, empty holes -->
  <path d="M24 10 L32 18 L28 26 L20 22Z M90 4 L98 12 L94 20 L86 14Z M16 66 L24 70 L20 80 L14 76Z" fill="#141a26" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round"/>
  <g fill="none" stroke="#fff" stroke-width="0.9" opacity="0.85" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 30 L44 10 L36 -4 M60 30 L78 8 L84 -6 M60 30 L22 30 L12 26 M60 30 L98 34 L108 30 M60 30 L28 52 L14 60 M60 30 L92 54 L106 64"/>
    <path d="M42 8 L52 4 M30 30 L34 40 M86 52 L94 44 M80 12 L90 16"/>
  </g>
  <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" opacity="0.6"><path d="M44 10 L36 -4 M78 8 L84 -6 M22 30 L12 26 M98 34 L108 30"/></g>
  <!-- a sweep of light glinting down the glass -->
  <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="-30 0;30 0;30 0" keyTimes="0;.4;1" dur="4s" repeatCount="indefinite"/>
    <path d="M40 -6 L46 -6 L30 40 L24 40Z" fill="#fff" opacity="0.4"/>
  </g>
  <!-- the gilded frame -->
  <path d="M10 120 V30 C10 4 32 -12 60 -12 C88 -12 110 4 110 30 V120" fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="9"/>
  <path d="M10 120 V30 C10 4 32 -12 60 -12 C88 -12 110 4 110 30 V120" fill="none" stroke="#c9a441" stroke-width="6"/>
  <path d="M8.6 118 V30 C8.6 3 31 -13.4 60 -13.4" fill="none" stroke="#fff3c4" stroke-width="1.2"/>
  <path d="M10 120 V30 C10 4 32 -12 60 -12 C88 -12 110 4 110 30 V120" fill="none" stroke="#8a6a1a" stroke-width="1" stroke-dasharray="1.5 3"/>
  <!-- the crest on top and the side gems -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.2" stroke-linejoin="round">
    <path d="M44 -14 C46 -22 54 -24 60 -22 C66 -24 74 -22 76 -14 C70 -18 64 -16 60 -12 C56 -16 50 -18 44 -14Z" fill="#c9a441"/>
    <path d="M56 -14 L60 -23 L64 -14 L60 -10Z" fill="#6ff3ff"/>
    <path d="M6 54 L10 48 L14 54 L10 60Z M106 54 L110 48 L114 54 L110 60Z" fill="#6ff3ff"/>
  </g>
  <path d="M58 -17 L60 -21" stroke="#fff" stroke-width="0.8"/>
  <!-- glass claw arms, reaching -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.5" stroke-linejoin="round">
    <g>
      <animateTransform class="lg-in" attributeName="transform" type="translate" values="-40 20;-40 20;3 -2;0 0" keyTimes="0;.46;.66;1" dur="1.5s" fill="freeze"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 28 84;-7 28 84;0 28 84" dur="2.2s" repeatCount="indefinite"/>
        <path d="M30 86 L14 80 L4 66 L12 62 L24 72 L34 76Z" fill="#c8d4e4"/>
        <path d="M4 66 L-8 50 L-2 50 L8 58 Z" fill="#e6eef8"/>
        <path d="M6 64 L-4 44 L2 46 L10 60Z" fill="#dce6f2"/>
        <path d="M10 62 L8 40 L13 44 L14 60Z" fill="#eef4fb"/>
        <path d="M14 80 L4 66 L12 62Z" fill="#000" opacity="0.2" stroke="none"/>
      </g>
    </g>
    <g>
      <animateTransform class="lg-in" attributeName="transform" type="translate" values="40 20;40 20;-3 -2;0 0" keyTimes="0;.5;.7;1" dur="1.5s" fill="freeze"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 92 84;7 92 84;0 92 84" dur="2.4s" repeatCount="indefinite"/>
        <path d="M90 86 L106 80 L116 66 L108 62 L96 72 L86 76Z" fill="#b0bfd2"/>
        <path d="M116 66 L128 50 L122 50 L112 58 Z" fill="#dce6f2"/>
        <path d="M114 64 L124 44 L118 46 L110 60Z" fill="#c8d4e4"/>
        <path d="M110 62 L112 40 L107 44 L106 60Z" fill="#e6eef8"/>
        <path d="M106 80 L116 66 L108 62Z" fill="#000" opacity="0.2" stroke="none"/>
      </g>
    </g>
  </g>
  <path d="M-6 51 L4 63 M126 51 L116 63" stroke="#fff" stroke-width="0.8"/>
  <!-- torso shards (each snaps into place) -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round">
    <g><animateTransform class="lg-in" attributeName="transform" type="translate" values="-30 24;-30 24;2 -1;0 0" keyTimes="0;.5;.7;1" dur="1.5s" fill="freeze"/>
      <path d="M14 126 L22 84 L14 72 L30 76 L52 72 L56 100 L42 126Z" fill="#b8c6d8"/>
      <path d="M22 84 L14 72 L30 76Z" fill="#fff" opacity="0.4" stroke="none"/>
      <path d="M26 100 L44 82" stroke="var(--lg-accent, #e0a020)" stroke-width="2" opacity="0.7"/></g>
    <g><animateTransform class="lg-in" attributeName="transform" type="translate" values="30 24;30 24;-2 -1;0 0" keyTimes="0;.55;.75;1" dur="1.5s" fill="freeze"/>
      <path d="M106 126 L98 84 L106 72 L90 76 L68 72 L64 100 L78 126Z" fill="#a4b4c8"/>
      <path d="M98 84 L106 72 L90 76 L68 72 L64 100 L78 126 L106 126Z" fill="#000" opacity="0.15" stroke="none"/></g>
    <g><animateTransform class="lg-in" attributeName="transform" type="translate" values="0 34;0 34;0 -2;0 0" keyTimes="0;.6;.8;1" dur="1.5s" fill="freeze"/>
      <path d="M42 126 L56 100 L52 72 H68 L64 100 L78 126Z" fill="#d6e0ec"/></g>
  </g>
  <!-- small reflected faces in the torso shards -->
  <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linecap="round">
    <path d="M30 104 l3 1 M37 105 l3 -1 M31 110 C33 108 37 108 39 110"/><path d="M80 104 l3 1 M87 105 l3 -1 M81 109 C83 111 87 111 89 109"/>
  </g>
  <!-- the crack of light through the chest -->
  <g><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;0.6 0;0 0;-0.6 0;0 0" dur="0.4s" repeatCount="indefinite"/>
    <path d="M60 74 L54 86 L64 94 L56 106 L62 126" fill="none" stroke="#fff6c2" stroke-width="7" stroke-linejoin="round" opacity="0.45"/>
    <path d="M60 74 L54 86 L64 94 L56 106 L62 126" fill="none" stroke="#ffe36b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M60 74 L54 86 L64 94 L56 106 L62 126" fill="none" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M54 86 L48 90 M64 94 L70 96 M56 106 L50 112" stroke="#ffe36b" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- a heap of broken glass at its feet -->
  <path d="M-12 128 L-8 116 L2 112 L8 116 L16 108 L26 114 L34 110 L44 116 L52 112 L60 118 L68 112 L76 116 L86 110 L94 114 L104 108 L112 116 L118 112 L128 116 L132 128 L122 132 L112 128 L100 134 L88 130 L74 134 L60 131 L46 135 L32 130 L20 134 L8 129 L-2 133Z" fill="#9aa8bc" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
  <g fill="#eef4fb" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7" stroke-linejoin="round"><path d="M2 112 L8 116 L4 122Z M16 108 L26 114 L18 118Z M44 116 L52 112 L50 122Z M68 112 L76 116 L70 122Z M104 108 L112 116 L104 118Z M118 112 L128 116 L120 120Z M30 122 L38 120 L34 128Z M84 122 L92 120 L90 128Z"/></g>
  <path d="M60 118 L68 112 L76 116 L86 110 L94 114 L104 108 L112 116 L118 112 L128 116 L132 128 L122 132 L112 128 L100 134 L88 130 L74 134 L60 131Z" fill="#000" opacity="0.15"/>
  <!-- the head: shards, each a different face -->
  <g transform="translate(60 50) scale(1.12) translate(-60 -50)">
  <g>
    <!-- a crown of glass spikes behind the head -->
    <g fill="#dce6f2" stroke="var(--lg-ink, #1d2230)" stroke-width="1.3" stroke-linejoin="round">
      <path d="M38 26 L16 4 L44 18Z"/><path d="M48 14 L38 -14 L56 10Z"/><path d="M57 9 L60 -20 L64 9Z"/><path d="M66 10 L82 -14 L72 14Z"/><path d="M80 18 L104 2 L86 26Z"/>
    </g>
    <path d="M40 24 L20 6 M49 12 L41 -10 M59 8 L60 -14 M69 10 L80 -10 M82 18 L100 5" stroke="#fff" stroke-width="0.8"/>
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 60 70;-2.5 60 70;0 60 70;2.5 60 70;0 60 70" dur="3.4s" repeatCount="indefinite"/>
    <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round">
      <g><animateTransform class="lg-in" attributeName="transform" type="translate" values="-26 -26;-26 -26;2 2;0 0" keyTimes="0;.55;.75;1" dur="1.5s" fill="freeze"/>
        <path d="M34 20 L58 8 L57 34 L32 38Z" fill="#dce6f2"/>
        <path d="M36 22 L56 12 L44 24Z" fill="#fff" opacity="0.5" stroke="none"/>
        <!-- a weeping face -->
        <g fill="none" stroke-width="1"><path d="M40 26 l5 2 M48 28 l5 -2 M43 33 C45 31.4 49 31.4 51 33"/><path d="M42 30 v4" stroke="#6fb8ff" stroke-width="1.2"/></g>
      </g>
      <g><animateTransform class="lg-in" attributeName="transform" type="translate" values="26 -26;26 -26;-2 2;0 0" keyTimes="0;.6;.8;1" dur="1.5s" fill="freeze"/>
        <path d="M62 8 L88 22 L88 38 L63 34Z" fill="#c4d2e4"/>
        <path d="M63 34 L88 38 L88 22Z" fill="#000" opacity="0.15" stroke="none"/>
        <!-- a screaming face -->
        <g fill="none" stroke-width="1"><path d="M68 22 l4 2 M78 24 l4 -2"/><ellipse cx="75" cy="30" rx="2.6" ry="3.4" fill="#1d2230"/></g>
      </g>
      <g><animateTransform class="lg-in" attributeName="transform" type="translate" values="0 40;0 40;0 -2;0 0" keyTimes="0;.65;.85;1" dur="1.5s" fill="freeze"/>
        <!-- the grinning face, the biggest shard -->
        <path d="M30 38 L60 33 L90 38 L86 62 L72 74 L48 74 L34 62Z" fill="#eef4fb"/>
        <path d="M60 33 L90 38 L86 62 L72 74 L60 74Z" fill="#000" opacity="0.12" stroke="none"/>
        <path d="M33 40 L58 35 L40 58Z" fill="#fff" opacity="0.6" stroke="none"/>
        <path d="M36 50 L44 56 M82 46 L78 52 M70 66 L76 64" fill="none" stroke-width="0.7"/>
        <!-- the grin: glass fangs curling up at the corners -->
        <path d="M36 56 C44 62 54 64 60 64 C66 64 76 62 84 56 C80 66 72 72 60 72 C48 72 40 66 36 56Z" fill="#10141c" stroke-width="1.4"/>
        <g fill="#f4fbff" stroke-width="0.6">
          <path d="M37 57 L40 63 L41 59.2Z"/><path d="M42 60 L44.6 66 L46 61.4Z"/><path d="M47 62 L49 69 L51 62.8Z"/><path d="M53 63.4 L55 68 L57 63.8Z"/><path d="M58 64 L60 70 L62 64Z"/><path d="M63 63.8 L65 68 L67 63.4Z"/><path d="M69 62.8 L71 69 L73 62Z"/><path d="M74 61.4 L75.4 66 L78 60Z"/><path d="M79 59.2 L80 63 L83 57Z"/>
          <path d="M44 67 L46 64 L48 68.6Z"/><path d="M54 70.6 L56 67 L58 71.4Z"/><path d="M62 71.4 L64 67 L66 70.6Z"/><path d="M72 68.6 L74 64 L76 67Z"/>
        </g>
      </g>
    </g>
    <!-- cold slit eyes: ignite -->
    <g transform="translate(46 50)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.02;1 0.02;1.4 1.6;1 1" keyTimes="0;.8;.9;1" dur="1.5s" fill="freeze"/>
      <path d="M-10 -6 L9 0 L7 5 L-8 1Z" fill="#00c8ff" opacity="0.45" transform="scale(1.45)"/>
      <path d="M-10 -6 L9 0 L7 5 L-8 1Z" fill="#22d8f0" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
      <path d="M-5 -3 L4 0 L3 2.4 L-4 0.4Z" fill="#fff"/>
      <path d="M1.4 -2.6 C2.4 0 2.4 2.4 1 4.6 C0 2.4 0.2 0 1.4 -2.6Z" fill="#0a2a3a"/>
    </g></g>
    <g transform="translate(74 50)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.02;1 0.02;1.4 1.6;1 1" keyTimes="0;.82;.92;1" dur="1.5s" fill="freeze"/>
      <path d="M10 -6 L-9 0 L-7 5 L8 1Z" fill="#00c8ff" opacity="0.45" transform="scale(1.45)"/>
      <path d="M10 -6 L-9 0 L-7 5 L8 1Z" fill="#22d8f0" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
      <path d="M5 -3 L-4 0 L-3 2.4 L4 0.4Z" fill="#fff"/>
      <path d="M-1.4 -2.6 C-2.4 0 -2.4 2.4 -1 4.6 C0 2.4 -0.2 0 -1.4 -2.6Z" fill="#0a2a3a"/>
    </g></g>
    <!-- one obsidian V shard for a brow -->
    <path d="M30 34 L60 46 L90 34 L90 40 L60 52 L30 40Z" fill="#2a3346" stroke="var(--lg-ink, #1d2230)" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M31.6 35.8 L60 47 L88.4 35.8" fill="none" stroke="#6ff3ff" stroke-width="0.9"/>
    <path d="M60 46 L90 34 L90 40 L60 52Z" fill="#000" opacity="0.3"/>
  </g>
  </g>
  <!-- loose shards orbiting, glinting -->
  <g transform="translate(60 60)">
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0;360" dur="12s" repeatCount="indefinite"/>
      <g fill="#eef4fb" stroke="var(--lg-ink, #1d2230)" stroke-width="0.7" stroke-linejoin="round">
        <path d="M-56 -30 L-50 -36 L-48 -26Z"/><path d="M52 34 L60 32 L54 42Z"/><path d="M30 -58 L36 -60 L33 -52Z"/><path d="M-36 52 L-30 48 L-30 56Z"/>
      </g>
    </g>
  </g>
  <g fill="#fff">
    <path style="transform-box:fill-box;transform-origin:center" d="M22 44 l1 2.4 l2.4 1 l-2.4 1 l-1 2.4 l-1 -2.4 l-2.4 -1 l2.4 -1Z"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;0.1;1" dur="1.7s" repeatCount="indefinite"/></path>
    <path style="transform-box:fill-box;transform-origin:center" d="M98 16 l1 2.4 l2.4 1 l-2.4 1 l-1 2.4 l-1 -2.4 l-2.4 -1 l2.4 -1Z"><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0.1;1;0.1" dur="2.1s" repeatCount="indefinite"/></path>
  </g>
</svg>
