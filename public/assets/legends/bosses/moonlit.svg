<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Moonfang: a werewolf in full rage under a giant moon. Bristling fur, torn shirt, claws spread, snarling muzzle. -->
  <!-- the full moon -->
  <circle cx="60" cy="44" r="42" fill="#f4efd8" opacity="0.9" stroke="#c9bf94" stroke-width="2"/>
  <circle cx="60" cy="44" r="48" fill="#f4efd8" opacity="0.2"/>
  <g fill="#d9d1b0" opacity="0.8"><circle cx="40" cy="30" r="7"/><circle cx="82" cy="50" r="9"/><circle cx="66" cy="20" r="4"/><circle cx="48" cy="62" r="5"/></g>
  <!-- bats crossing the moon -->
  <g fill="#1d2230">
    <path style="transform-box:fill-box;transform-origin:center" d="M14 22 l4 -3 l2 2 l2 -2 l4 3 l-3 0 l-3 2 l-3 -2Z"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="-20 6;130 -6" dur="7s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="7s" repeatCount="indefinite" additive="sum"/></path>
  </g>
  <!-- left arm raised, claws spread -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="60 34 72;60 34 72;-10 34 72;0 34 72" keyTimes="0;.45;.72;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 34 72;-5 34 72;0 34 72" dur="2.4s" begin="1.5s" repeatCount="indefinite"/>
      <path d="M36 74 C24 72 16 60 14 44 L22 40 C24 52 30 60 40 62Z" fill="var(--lg-deep, #5a4a6e)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
      <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" opacity="0.6"><path d="M18 50 l-3 2 M22 58 l-3 3 M28 64 l-2 3"/></g>
      <path d="M8 42 C8 34 14 30 20 30 C26 30 28 36 26 42Z" fill="var(--lg-deep, #5a4a6e)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6"/>
      <g fill="#f4efe0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round"><path d="M9 34 L2 22 L12 32Z"/><path d="M14 31 L10 16 L17 30Z"/><path d="M20 30 L22 15 L23 31Z"/><path d="M25 33 L32 22 L27 35Z"/></g>
    </g>
  </g>
  <!-- right arm raised -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="-60 86 72;-60 86 72;10 86 72;0 86 72" keyTimes="0;.45;.72;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 86 72;5 86 72;0 86 72" dur="2.4s" begin="1.5s" repeatCount="indefinite"/>
      <path d="M84 74 C96 72 104 60 106 44 L98 40 C96 52 90 60 80 62Z" fill="var(--lg-deep, #5a4a6e)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M84 74 C96 72 104 60 106 44 L102 43 C100 56 92 66 82 68Z" fill="#000" opacity="0.2"/>
      <path d="M112 42 C112 34 106 30 100 30 C94 30 92 36 94 42Z" fill="var(--lg-deep, #5a4a6e)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6"/>
      <g fill="#f4efe0" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8" stroke-linejoin="round"><path d="M111 34 L118 22 L108 32Z"/><path d="M106 31 L110 16 L103 30Z"/><path d="M100 30 L98 15 L97 31Z"/><path d="M95 33 L88 22 L93 35Z"/></g>
    </g>
  </g>
  <!-- torso: fur and torn shirt, breathing -->
  <g transform="translate(60 120)"><g>
    <animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1.03 1.04;1 1" dur="2s" repeatCount="indefinite"/>
    <g transform="translate(-60 -120)">
      <path d="M24 120 C24 96 30 78 44 70 H76 C90 78 96 96 96 120Z" fill="var(--lg-deep, #5a4a6e)" stroke="var(--lg-ink, #1d2230)" stroke-width="2"/>
      <path d="M26 120 C26 100 32 84 44 74 C40 90 38 104 38 120Z" fill="#fff" opacity="0.12"/>
      <path d="M94 120 C94 100 88 84 78 76 C82 92 84 106 84 120Z" fill="#000" opacity="0.25"/>
      <!-- torn shirt shreds -->
      <path d="M26 104 L34 96 L38 106 L44 98 L46 120 H26Z" fill="#8a2a2a" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
      <path d="M94 104 L86 98 L82 108 L76 100 L74 120 H94Z" fill="#8a2a2a" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
      <!-- chest fur tufts -->
      <path d="M48 80 L52 88 L56 80 L60 90 L64 80 L68 88 L72 80 L70 96 L60 104 L50 96Z" fill="#c9bfae" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
      <g fill="none" stroke="#e05555" stroke-width="1.4" stroke-linecap="round"><path d="M36 84 l6 8 M34 88 l6 8"/></g>
    </g>
  </g></g>
  <!-- head: ears, bristling mane -->
  <g>
    <animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 60 60;-2 60 60;0 60 60;2 60 60;0 60 60" dur="3s" repeatCount="indefinite"/>
    <path d="M30 40 L34 8 L48 26Z M90 40 L86 8 L72 26Z" fill="var(--lg-deep, #5a4a6e)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M35 16 L38 34 L45 27Z M85 16 L82 34 L75 27Z" fill="#e8a0a8"/>
    <path d="M28 52 L22 44 L30 44 L24 34 L34 38 L34 26 L44 32 L48 20 L56 28 L60 18 L64 28 L72 20 L76 32 L86 26 L86 38 L96 34 L90 44 L98 44 L92 52 L94 64 L84 64 L86 74 L74 70 L72 80 L60 74 L48 80 L46 70 L34 74 L36 64 L26 64Z" fill="var(--lg-deep, #5a4a6e)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M34 38 L44 32 L48 20 L56 28 L60 18 L58 32 L46 38 L40 50 L30 50Z" fill="#fff" opacity="0.14"/>
    <!-- brow and eyes -->
    <path d="M38 44 L56 50 L58 46 L40 40Z M82 44 L64 50 L62 46 L80 40Z" fill="#2a2433"/>
    <g transform="translate(48 50) rotate(18)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.4 1.4;1 1" keyTimes="0;.6;.78;1" dur="1.5s" fill="freeze"/>
      <circle r="6" fill="#ffb627" opacity="0.4"/><ellipse rx="4.6" ry="2.4" fill="#ffd966"/><ellipse rx="0.8" ry="2.2" fill="#1a1216"/></g></g>
    <g transform="translate(72 50) rotate(-18)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.4 1.4;1 1" keyTimes="0;.6;.78;1" dur="1.5s" fill="freeze"/>
      <circle r="6" fill="#ffb627" opacity="0.4"/><ellipse rx="4.6" ry="2.4" fill="#ffd966"/><ellipse rx="0.8" ry="2.2" fill="#1a1216"/></g></g>
    <!-- muzzle with a snarl: wrinkles and bared fangs -->
    <path d="M48 56 C50 52 70 52 72 56 L70 70 C66 76 54 76 50 70Z" fill="var(--lg-near, #8a7a9e)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6"/>
    <path d="M54 56 C56 54 64 54 66 56 L62 60 H58Z" fill="#1a1216"/>
    <g fill="none" stroke="var(--lg-ink, #1d2230)" stroke-width="0.9" stroke-linecap="round"><path d="M52 60 C54 62 56 62 57 61 M68 60 C66 62 64 62 63 61 M50 64 C52 65 54 65 55 64 M70 64 C68 65 66 65 65 64"/></g>
    <g transform="translate(60 70)"><g>
      <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.2;1 0.2;1.1 1.3;1 1" keyTimes="0;.66;.84;1" dur="1.6s" fill="freeze"/>
      <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1 1;1 1.12;1 1" dur="2s" begin="1.6s" repeatCount="indefinite"/>
        <path d="M-11 -2 C-6 -4 6 -4 11 -2 C9 6 4 9 0 9 C-4 9 -9 6 -11 -2Z" fill="#2a0f14" stroke="var(--lg-ink, #1d2230)" stroke-width="1.2"/>
        <ellipse cy="5" rx="4" ry="2" fill="#c0395a"/>
        <g fill="#fff" stroke="var(--lg-ink, #1d2230)" stroke-width="0.5" stroke-linejoin="round"><polygon points="-9,-2 -7,6 -5,-2"/><polygon points="9,-2 7,6 5,-2"/><polygon points="-3,-3 -2,1 -1,-3"/><polygon points="1,-3 2,1 3,-3"/><polygon points="-6,8 -5,3 -3,8"/><polygon points="3,8 5,3 6,8"/></g>
      </g>
    </g></g>
  </g>
  <!-- drifting mist -->
  <g fill="var(--lg-light, #ffffff)" opacity="0.3">
    <animateTransform class="lg-loop" attributeName="transform" type="translate" values="-6 0;6 0;-6 0" dur="5s" repeatCount="indefinite"/>
    <ellipse cx="20" cy="112" rx="30" ry="6"/><ellipse cx="100" cy="114" rx="30" ry="6"/>
  </g>
</svg>
