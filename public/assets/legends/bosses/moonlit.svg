<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Moonfang: a werewolf in full rage, seen from below against a huge full moon (craters, a halo copy of the disk)
       with night clouds and bats crossing it. Moonlight rims the fur. Massive shoulders in a torn plaid shirt, a pale chest
       bib with claw scars, both arms raised with hooked claws running past the frame. Angular wolf skull in a bristling
       mane, twitching ears, ONE solid V brow over amber slit eyes, a long wrinkled muzzle, gums bared over far too many
       teeth, a roaring jaw and cold breath. Entrance: the arms swing up, the eyes snap open, the muzzle snarls open. -->
