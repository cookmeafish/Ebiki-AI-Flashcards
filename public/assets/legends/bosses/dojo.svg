<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The Oni Warlord: a towering red demon in lacquered armor. Great horns, fanged face, wild white mane, iron club. -->
  <!-- a rising sun disk behind -->
  <circle cx="60" cy="46" r="42" fill="var(--lg-accent, #f2b441)" opacity="0.3"/>
  <!-- the spiked iron club: rises on the entrance -->
  <g>
    <animateTransform class="lg-in" attributeName="transform" type="rotate" values="80 96 98;80 96 98;-10 96 98;0 96 98" keyTimes="0;.5;.75;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="rotate" values="0 96 98;-4 96 98;0 96 98" dur="2.4s" begin="1.5s" repeatCount="indefinite"/>
      <path d="M94 100 L100 64 L112 18 C116 16 120 20 118 24 L106 66 L100 102Z" fill="#3a3340" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round"/>
      <g fill="#aeb6c4" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"><polygon points="110,26 116,24 112,30"/><polygon points="106,38 100,38 104,32"/><polygon points="112,44 118,42 114,48"/><polygon points="104,52 98,52 102,46"/><polygon points="108,60 114,58 110,64"/></g>
      <g stroke="#c9a441" stroke-width="2"><path d="M98 76 L104 78 M97 84 L103 86"/></g>
    </g>
  </g>
  <!-- armored body: lacquered plates -->
  <path d="M22 120 L28 78 L42 66 H78 L92 78 L98 120Z" fill="#1d1b28" stroke="var(--lg-ink, #1d2230)" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#b3122e" stroke="var(--lg-ink, #1d2230)" stroke-width="1"><path d="M34 84 H86 V92 H34Z"/><path d="M32 96 H88 V104 H32Z"/><path d="M30 108 H90 V116 H30Z"/></g>
  <g stroke="#c9a441" stroke-width="1"><path d="M40 84 V92 M50 84 V92 M60 84 V92 M70 84 V92 M80 84 V92 M40 96 V104 M50 96 V104 M60 96 V104 M70 96 V104 M80 96 V104"/></g>
  <!-- shoulder guards -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round">
    <path d="M10 88 L16 66 L40 62 L42 80 L24 92Z" fill="#b3122e"/><path d="M110 88 L104 66 L80 62 L78 80 L96 92Z" fill="#b3122e"/>
    <g stroke="#c9a441" stroke-width="1.2" fill="none"><path d="M14 74 L40 70 M12 82 L41 76 M106 74 L80 70 M108 82 L79 76"/></g>
  </g>
  <!-- red muscular arms -->
  <path d="M20 90 C16 100 18 110 24 116 L32 110 C28 104 28 98 30 92Z" fill="var(--lg-deep, #c0392b)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.6"/>
  <path d="M90 92 C94 96 96 100 96 104 L102 100 C102 94 98 88 94 86Z" fill="var(--lg-deep, #c0392b)" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4"/>
  <!-- wild white mane -->
  <g>
    <animateTransform class="lg-loop" attributeName="transform" type="skewX" values="0;2;0;-2;0" dur="3s" repeatCount="indefinite"/>
    <path d="M24 60 C14 50 16 34 24 26 C22 36 28 40 32 40 C28 30 34 18 44 14 C42 24 46 28 50 28 L70 28 C74 28 78 24 76 14 C86 18 92 30 88 40 C92 40 98 36 96 26 C104 34 106 50 96 60Z" fill="#f4efe6" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
  <!-- great horns -->
  <g stroke="var(--lg-ink, #1d2230)" stroke-width="1.6" stroke-linejoin="round">
    <path d="M44 26 C40 16 40 6 46 0 C48 8 52 14 54 22Z" fill="#e8d7b0"/><path d="M76 26 C80 16 80 6 74 0 C72 8 68 14 66 22Z" fill="#e8d7b0"/>
    <path d="M46 8 L50 10 M44 14 L49 16 M74 8 L70 10 M76 14 L71 16" stroke-width="0.8"/>
  </g>
  <!-- the red demon face -->
  <path d="M40 34 C40 24 50 20 60 20 C70 20 80 24 80 34 L78 54 C74 64 66 68 60 68 C54 68 46 64 42 54Z" fill="var(--lg-deep, #c0392b)" stroke="var(--lg-ink, #1d2230)" stroke-width="2"/>
  <path d="M44 32 C46 26 52 22 58 22 C52 28 48 36 48 50 L44 52Z" fill="#fff" opacity="0.18"/>
  <path d="M80 34 L78 54 C74 62 68 66 62 68 C70 60 74 50 74 34Z" fill="#000" opacity="0.22"/>
  <!-- furrowed brow, third-eye gem -->
  <path d="M42 36 L58 40 L60 36 L62 40 L78 36 L76 32 L62 34 L60 32 L58 34 L44 32Z" fill="#7a0c20" stroke="var(--lg-ink, #1d2230)" stroke-width="1" stroke-linejoin="round"/>
  <path d="M58 28 L60 24 L62 28 L60 31Z" fill="#ffd966" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6"/>
  <!-- blazing eyes -->
  <g transform="translate(51 44) rotate(14)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.4 1.5;1 1" keyTimes="0;.6;.78;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.15;1" dur="1.2s" begin="1.5s" repeatCount="indefinite"/>
      <circle r="6.4" fill="#ffd166" opacity="0.45"/><ellipse rx="5" ry="3" fill="#fff4c2" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/><circle r="1.8" fill="#1a0808"/></g>
  </g></g>
  <g transform="translate(69 44) rotate(-14)"><g>
    <animateTransform class="lg-in" attributeName="transform" type="scale" values="1 0.05;1 0.05;1.4 1.5;1 1" keyTimes="0;.6;.78;1" dur="1.5s" fill="freeze"/>
    <g><animateTransform class="lg-loop" attributeName="transform" type="scale" values="1;1.15;1" dur="1.2s" begin="1.5s" repeatCount="indefinite"/>
      <circle r="6.4" fill="#ffd166" opacity="0.45"/><ellipse rx="5" ry="3" fill="#fff4c2" stroke="var(--lg-ink, #1d2230)" stroke-width="0.8"/><circle r="1.8" fill="#1a0808"/></g>
  </g></g>
  <!-- flared nose -->
  <path d="M56 48 C56 46 64 46 64 48 L63 52 H57Z" fill="#7a0c20"/>
  <!-- roaring fanged mouth with tusks -->
  <path d="M46 54 C52 52 68 52 74 54 C72 62 66 66 60 66 C54 66 48 62 46 54Z" fill="#1a0808" stroke="var(--lg-ink, #1d2230)" stroke-width="1.4"/>
  <g fill="#f4efe6" stroke="var(--lg-ink, #1d2230)" stroke-width="0.6" stroke-linejoin="round">
    <polygon points="48,54 50,60 52,54"/><polygon points="68,54 70,60 72,54"/><polygon points="54,53 56,57 58,53"/><polygon points="62,53 64,57 66,53"/>
    <path d="M48 62 C46 56 44 52 44 48 C47 52 50 56 52 62Z"/><path d="M72 62 C74 56 76 52 76 48 C73 52 70 56 68 62Z"/>
  </g>
  <!-- war-paint stripes -->
  <g stroke="#1a0808" stroke-width="1.6" stroke-linecap="round"><path d="M42 42 L46 46 M42 48 L46 50 M78 42 L74 46 M78 48 L74 50"/></g>
  <!-- embers from the sun -->
  <g fill="#ffb347">
    <circle style="transform-box:fill-box;transform-origin:center" cx="16" cy="40" r="1.2"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 0;-4 -30" dur="2.4s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.4s" repeatCount="indefinite" additive="sum"/></circle>
    <circle style="transform-box:fill-box;transform-origin:center" cx="104" cy="12" r="1"><animateTransform class="lg-loop" attributeName="transform" type="translate" values="0 10;4 -12" dur="2.8s" repeatCount="indefinite"/><animateTransform class="lg-loop" attributeName="transform" type="scale" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="2.8s" repeatCount="indefinite" additive="sum"/></circle>
  </g>
</svg>
