<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raid power animations</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Nunito', system-ui, sans-serif; background: #15121c; color: #eee; }
      body.light { background: #f4f1ea; color: #222; }
    </style>
  </head>
  <body>
    <!-- Dev-only sheet of every raid power's animations (impact/PowerFx.jsx), not part of the app build. With the dev
         server up: http://localhost:3000/dev/raid-power-fx/?view=cast  (view: cast | armed | proc; &boss=<motif> the
         boss behind them, default chronos; &light=1 the light theme). freeze(ms) pauses every animation at ms;
         replay() plays them again. -->
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
